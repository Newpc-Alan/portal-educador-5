<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal do Educador TV · Painel</title>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#071621; --escuro-2:#0c2338; --azul:#2671AB; --azul-2:#2E9BD6; --lima:#8DC63F; --verde:#5A9420;
  --bg:#f4f7fa; --ink:#0c2338; --ink-2:#2C3E55; --muted:#6b7c90; --line:#dce4ed; --surface:#fff; --red:#C2362C; --amber:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.app{max-width:1240px;margin:0 auto;padding:0 16px 60px}
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 16px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;
  background:radial-gradient(600px 200px at 0% 0%,rgba(46,155,214,.35),transparent 60%),linear-gradient(135deg,#071621,#123556);
  box-shadow:0 14px 30px -20px rgba(7,22,33,.8);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem;letter-spacing:-.01em}
.marca span{display:block;font-size:.76rem;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo-acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.on{background:#fff;color:var(--escuro-2);border-color:#fff}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}
.sel-escola{padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:.82rem;max-width:260px}
.sel-escola option{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.86rem;white-space:nowrap;line-height:1.2;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--azul);color:#fff}.btn-pri:hover{background:#1f5f91}
.btn-ok{background:var(--verde);color:#fff}.btn-ok:hover{background:#4a7c19}
.btn-gh{background:#fff;color:var(--ink);border-color:var(--line)}.btn-gh:hover{border-color:#b8c6d6}
.btn-red{background:#fff;color:var(--red);border-color:#f0c9c5}
.btn-sm{padding:7px 11px;font-size:.78rem;border-radius:8px}
.btn-ic{padding:6px 9px;font-size:.84rem;border-radius:8px;background:#fff;border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.84rem}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.destaque{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:16px;margin-bottom:16px;color:#fff;
  background:radial-gradient(500px 180px at 0% 0%,rgba(141,198,63,.28),transparent 60%),linear-gradient(135deg,#0c2338,#1b4a74)}
.destaque-ico{font-size:34px}.destaque-txt{flex:1;min-width:220px}.destaque-txt b{font-size:1.06rem;display:block}.destaque-txt span{font-size:.86rem;color:rgba(255,255,255,.82)}

.telas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tela{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tela-tv{background:#071621;color:#fff;display:grid;place-items:center;font-size:40px;position:relative;height:120px}
.tela-tv.v{font-size:34px}
.tela-tv .forma{border:3px solid rgba(255,255,255,.7);border-radius:6px;display:grid;place-items:center;font-size:22px}
.tela-tv .forma.h{width:120px;height:70px}.tela-tv .forma.v{width:50px;height:86px}
.st{position:absolute;top:10px;left:10px;font-size:.68rem;font-weight:800;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.14)}
.st.on{background:#3d8b1f}.st.off{background:#8a2c24}
.tela-corpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tela-corpo b{font-size:.98rem}
.tela-corpo small{display:block;color:var(--muted);font-size:.78rem}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

.pl-grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.pl-lista{display:flex;flex-direction:column;gap:6px}
.pl-item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.pl-item.on{border-color:var(--azul-2);background:#eef6fc}
.pl-item b{display:block;font-size:.88rem}.pl-item small{display:block;font-size:.74rem;color:var(--muted)}
.itens{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.it{display:grid;grid-template-columns:28px 92px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.it.off{opacity:.5}
.it-n{font-weight:800;color:var(--muted);text-align:center}
.it-th{width:92px;height:56px;border-radius:8px;background:#071621 center/cover no-repeat;display:grid;place-items:center;color:#fff;font-size:22px;overflow:hidden}
.it-th video{width:100%;height:100%;object-fit:cover}
.it b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;font-size:.74rem;color:var(--muted)}
.it-ac{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.vazio{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9rem}
.carregando{padding:60px 10px;text-align:center;color:var(--muted)}
.giro{width:34px;height:34px;border:4px solid #dce4ed;border-top-color:var(--azul);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}

.tipos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tipo{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.tipo.on{background:var(--azul);border-color:var(--azul);color:#fff}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.campo.cheio{grid-column:1/-1}
.campo label{font-size:.74rem;font-weight:700;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:.88rem;width:100%}
.campo textarea{min-height:84px;resize:vertical}
.campo small{font-size:.72rem;color:var(--muted)}
.chave{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;margin-bottom:10px}
.chave input{width:18px;height:18px;accent-color:var(--verde)}
.envio{border:2px dashed #b8c6d6;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:.84rem;background:#fbfcfe;cursor:pointer;display:block}
.envio:hover{border-color:var(--azul-2);color:var(--azul)}
.envio input{display:none}
.prog{height:8px;border-radius:99px;background:#e8eef4;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:var(--verde);transition:width .2s}
.aviso-box{font-size:.8rem;background:#eef6fc;border:1px solid #cfe4f4;color:#1f5f91;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.alerta{font-size:.8rem;background:#fff6df;border:1px solid #f0d58a;color:#7a5200;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.agenda{display:grid;grid-template-columns:90px 110px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:.84rem}
.agenda input,.agenda select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfe;width:100%}
.ori{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ori button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:.78rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.ori button.on{border-color:var(--azul-2);background:#eef6fc;color:var(--azul)}
.ori i{display:block;border:2.5px solid currentColor;border-radius:4px}
.ori .h i{width:44px;height:26px}.ori .v i{width:22px;height:36px}.ori .a i{width:34px;height:30px;border-style:dashed}
.cod-in{font-family:ui-monospace,monospace;font-size:1.8rem;letter-spacing:.4em;text-transform:uppercase;text-align:center;font-weight:800}
.avs{display:flex;flex-direction:column;gap:8px}
.av{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.av b{font-size:.9rem}.av small{display:block;font-size:.76rem;color:var(--muted)}
.pill{display:inline-block;font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.pill.on{background:#e6f4d6;color:#3d6b0c}.pill.ag{background:#e8f1fa;color:#1f5f91}.pill.fim{background:#eef0f3;color:#6b7c90}

.modal{position:fixed;inset:0;z-index:90;background:rgba(7,22,33,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:min(620px,100%);box-shadow:0 30px 60px -20px rgba(7,22,33,.6);max-height:calc(100vh - 32px);overflow:auto}
.modal-box h3{font-size:1.05rem;margin-bottom:12px}
.modal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;background:var(--escuro-2);color:#fff;padding:11px 18px;border-radius:12px;font-size:.86rem;font-weight:600;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
@media (max-width:900px){ .pl-grid{grid-template-columns:1fr} }
@media (max-width:600px){ .topo{position:static;padding:10px 14px} .marca span{display:none} .campos{grid-template-columns:1fr} .it{grid-template-columns:70px 1fr} .it-n{display:none} .it-th{width:70px;height:44px} .it-ac{grid-column:1/-1;justify-content:flex-start} .agenda{grid-template-columns:70px 90px 1fr} .sel-escola{max-width:100%;width:100%} }
.tb.voltar{background:var(--lima);border-color:var(--lima);color:#071621;font-weight:800}.tb.voltar:hover{background:#9fd655;border-color:#9fd655}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Aplicativos Úteis</small><b>Portal do Educador TV</b><span id="quem">Carregando...</span></div></div>
    <nav class="topo-acoes" aria-label="Seções">
      <select class="sel-escola" id="selEscola" aria-label="Escola" hidden></select>
      <button class="tb on" data-action="ir" data-arg="telas">📺 Telas</button>
      <button class="tb" data-action="ir" data-arg="playlists">🎞️ Playlists</button>
      <button class="tb" data-action="ir" data-arg="avisos">📢 Comunicados</button>
      <button class="tb" data-action="ir" data-arg="campanhas" id="tbCamp" hidden>🎗️ Campanhas</button>
      <a class="tb voltar" href="/apps/">← Aplicativos</a>
    </nav>
  </header>
  <main id="tela"><div class="carregando"><div class="giro"></div>Carregando...</div></main>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, collection, query, where, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as stRef, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const auth = getAuth(app), db = getFirestore(app), st = getStorage(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 3400); }
const TV_URL = location.origin + "/tv/";
const MAX_ITENS = 80;
const TIPOS = { imagem:["🖼️","Foto"], video:["🎬","Vídeo"], youtube:["▶️","YouTube"], web:["🌐","Página web"], texto:["📝","Só texto"] };
const ORI = { auto:"Automática", h:"Horizontal", v:"Vertical (totem)" };
const TURNOS = [["manha","Manhã","07:00"],["tarde","Tarde","13:00"],["noite","Noite","18:30"]];
const ms = v => v && v.toMillis ? v.toMillis() : (v && v.__ms) || (typeof v === "number" ? v : 0);

const E = { user:null, u:null, perfil:"", admin:false, escolas:[], escolaId:"", escola:null, muni:null, canal:null,
  telas:null, playlists:null, plSel:"", aba:"telas", form:null, salvarT:0 };

/* ===================== dados ===================== */
async function carregarEscolas(){
  const u = E.u; let lista = [];
  if(E.admin){ const s = await getDocs(collection(db, "escolas")); s.forEach(d => lista.push({ id:d.id, ...d.data() })); }
  else if(E.perfil === "secretaria" && u.municipio_id){ const s = await getDocs(query(collection(db, "escolas"), where("municipio_id", "==", u.municipio_id))); s.forEach(d => lista.push({ id:d.id, ...d.data() })); }
  else {
    const ids = (u.escolas_ids && u.escolas_ids.length ? u.escolas_ids : [u.escola_id]).filter(Boolean);
    for(const id of ids){ try{ const s = await getDoc(doc(db, "escolas", id)); if(s.exists()) lista.push({ id, ...s.data() }); }catch(e){} }
  }
  lista.sort((a, b) => String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"));
  E.escolas = lista;
  const salva = (() => { try{ return localStorage.getItem("pde_tv_escola_" + E.user.uid) || ""; }catch(e){ return ""; } })();
  E.escolaId = (lista.find(x => x.id === salva) || lista[0] || {}).id || "";
  $("selEscola").innerHTML = lista.map(x => '<option value="' + esc(x.id) + '"' + (x.id === E.escolaId ? " selected" : "") + ">" + esc(x.nome || x.id) + "</option>").join("");
  $("selEscola").hidden = lista.length < 2;
}
async function trocarEscola(id){
  E.escolaId = id; E.escola = E.escolas.find(x => x.id === id) || null; E.telas = null; E.playlists = null; E.plSel = ""; E.canal = null; E.muni = null;
  try{ localStorage.setItem("pde_tv_escola_" + E.user.uid, id); }catch(e){}
  if(E.escola && E.escola.municipio_id){ try{ const s = await getDoc(doc(db, "municipios", E.escola.municipio_id)); E.muni = s.exists() ? { id:s.id, ...s.data() } : null; }catch(e){} }
  ir(E.aba);
}
const filtroEscola = () => [where("escola_id", "==", E.escolaId), where("municipio_id", "==", E.escola.municipio_id || "")];
async function carregarTelas(){ const s = await getDocs(query(collection(db, "tv_telas"), ...filtroEscola())); E.telas = []; s.forEach(d => E.telas.push({ id:d.id, ...d.data() })); E.telas.sort((a, b) => String(a.nome).localeCompare(String(b.nome), "pt-BR")); }
async function carregarPlaylists(){ const s = await getDocs(query(collection(db, "tv_playlists"), ...filtroEscola())); E.playlists = []; s.forEach(d => E.playlists.push({ id:d.id, ...d.data() })); E.playlists.sort((a, b) => String(a.nome).localeCompare(String(b.nome), "pt-BR")); }
// um canal de comunicados por município (id aleatório: só as TVs da rede sabem qual é)
async function garantirCanal(criar){
  const m = E.escola && E.escola.municipio_id; if(!m) return null;
  if(E.canal && E.canal.municipio_id === m) return E.canal;
  const s = await getDocs(query(collection(db, "tv_canais"), where("municipio_id", "==", m)));
  const lista = []; s.forEach(d => lista.push({ id:d.id, ...d.data() })); lista.sort((a, b) => a.id.localeCompare(b.id));
  if(lista[0]){ E.canal = lista[0]; return E.canal; }
  if(!criar) return null;
  const r = await addDoc(collection(db, "tv_canais"), { municipio_id:m, avisos:[], criado_em:serverTimestamp() });
  E.canal = { id:r.id, municipio_id:m, avisos:[] }; return E.canal;
}
const logoEscola = () => (E.escola && E.escola.logo_url) || (E.muni && E.muni.logo_url) || "";
const podeComunicado = () => E.admin || E.perfil === "secretaria";

/* ===================== navegação ===================== */
async function ir(aba){
  E.aba = aba;
  document.querySelectorAll(".topo-acoes .tb[data-arg]").forEach(b => b.classList.toggle("on", b.dataset.arg === aba));
  try{ history.replaceState(null, "", "#" + aba); }catch(e){}
  if(!E.escola && aba !== "campanhas"){ $("tela").innerHTML = '<div class="card vazio"><b>Seu cadastro ainda não tem escola vinculada.</b><br>As TVs ficam ligadas a uma escola. Peça à secretaria ou ao administrador para vincular a sua.</div>'; return; }
  $("tela").innerHTML = '<div class="carregando"><div class="giro"></div>Carregando...</div>';
  try{
    if(aba === "campanhas" && E.admin) await telaCampanhas();
    else if(aba === "playlists") await telaPlaylists();
    else if(aba === "avisos") await telaAvisos();
    else await telaTelas();
  }catch(e){ console.error(e); $("tela").innerHTML = '<div class="card vazio">Não foi possível carregar agora (' + esc(e.code || "erro") + ").</div>"; }
}

/* ===================== TELAS ===================== */
function statusTela(t){
  const v = ms(t.visto_em); if(!v) return ["off", "Nunca ligou"];
  const min = Math.round((Date.now() - v) / 60000);
  if(min <= 12) return ["on", "No ar"];
  return ["off", min < 60 ? "Desligada há " + min + " min" : min < 1440 ? "Desligada há " + Math.round(min / 60) + " h" : "Desligada há " + Math.round(min / 1440) + " dia(s)"];
}
async function telaTelas(){
  if(!E.telas) await carregarTelas();
  if(!E.playlists) await carregarPlaylists();
  const nomePl = id => (E.playlists.find(p => p.id === id) || {}).nome || "sem playlist";
  $("tela").innerHTML =
    '<div class="destaque"><div class="destaque-ico">📺</div><div class="destaque-txt"><b>As TVs da ' + esc(E.escola.nome) + '</b><span>Na TV (ou no computador ligado a ela), abra <b>' + esc(TV_URL.replace(/^https?:\/\//, "")) + '</b>. Vai aparecer um código: toque em <b>Conectar TV</b> e digite.</span></div>' +
    '<div class="acoes"><button class="btn btn-gh" data-action="ajuda-cheia" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)">⛶ Tela cheia e quiosque</button><button class="btn btn-ok" data-action="conectar">＋ Conectar TV</button></div></div>' +
    (E.telas.length ? '<div class="telas">' + E.telas.map(t => {
      const [c, txt] = statusTela(t), o = t.orientacao || "auto";

async function reduzirImagem(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file); const max = 1920, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if(k === 1 && file.size < 1.5 * 1048576) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85)); return b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type:"image/jpeg" }) : file;
  }catch(e){ return file; }
}

    const path = pasta + "/" + nome, tarefa = uploadBytesResumable(stRef(st, path), file, { contentType:file.type, cacheControl:"public, max-age=31536000" });
    $("prog").hidden = false;
    tarefa.on("state_changed", s => { $("prog").firstChild.style.width = Math.round(s.bytesTransferred / s.totalBytes * 100) + "%"; }, erro,
      async () => { try{ ok({ path, url:await getDownloadURL(tarefa.snapshot.ref) }); }catch(e){ erro(e); } });
  });
}

  const it = { id:f.idx !== null ? pl.itens[f.idx].id : "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo,
    categoria:$("fCat").value.trim(), titulo:$("fTit").value.trim(), texto:$("fTxt") ? $("fTxt").value.trim() : "",
    duracao:Math.max(4, Math.min(600, parseInt($("fDur").value, 10) || 10)), layout:$("fLay") ? $("fLay").value : "cheia",
    ajuste:$("fAj") ? $("fAj").value : "cobre", ativo:f.idx !== null ? pl.itens[f.idx].ativo !== false : true, url:"", path:"" };
  if(tipo === "texto"){ if(!it.titulo && !it.texto){ toast("Escreva o título ou o texto do aviso.", true); return; } }
  else if(tipo === "youtube"){ it.url = idYoutube(url); if(!it.url){ toast("Cole um link válido do YouTube.", true); return; } }
  else if(tipo === "web"){ if(!/^https:\/\/\S+\.\S+/.test(url)){ toast("Cole o endereço completo da página, começando com https://", true); return; } it.url = url; }
  else {
    const arq = $("fArq") && $("fArq").files[0];
    if(!arq && !url && !f.enviado){ toast(tipo === "imagem" ? "Escolha uma foto ou cole um link." : "Escolha um vídeo ou cole um link.", true); return; }
    $("btIt").disabled = true;
    try{
      if(arq){
        if(tipo === "video" && arq.size > 50 * 1048576){ toast("O vídeo passa de 50 MB. Reduza a qualidade ou o tamanho e tente de novo.", true); $("btIt").disabled = false; return; }
        const pronto = tipo === "imagem" ? await reduzirImagem(arq) : arq;
        $("arqNome").textContent = "Enviando " + pronto.name + "...";
        const r = await enviarArquivo(pronto, "tv/escolas/" + E.escolaId); it.url = r.url; it.path = r.path;
        if(f.enviado && f.enviado.path) deleteObject(stRef(st, f.enviado.path)).catch(() => {});
      } else if(url){ if(!/^https:\/\//.test(url)){ toast("O link precisa começar com https://", true); $("btIt").disabled = false; return; } it.url = url; it.path = ""; }
      else { it.url = f.enviado.url; it.path = f.enviado.path; }
    }catch(e){ console.error(e); toast("Falha no envio do arquivo (" + (e.code || "erro") + ").", true); $("btIt").disabled = false; return; }
  }
  const itens = [...(pl.itens || [])];
  if(f.idx !== null) itens[f.idx] = it; else itens.push(it);
  if(await gravarItens(pl, itens)){ toast(f.idx !== null ? "Item atualizado." : "Adicionado à playlist."); E.form = { tipoNovo:tipo }; telaPlaylists(); }
  else if($("btIt")) $("btIt").disabled = false;
}
async function gravarItens(pl, itens){
  try{ await updateDoc(doc(db, "tv_playlists", pl.id), { itens, atualizado_em:serverTimestamp(), atualizado_por:E.user.uid }); pl.itens = itens; return true; }
  catch(e){ console.error(e); toast("Não foi possível salvar (" + (e.code || "erro") + ").", true); return false; }
}
async function moverItem(i, d){ const pl = E.playlists.find(p => p.id === E.plSel); const it = [...pl.itens]; const j = i + d; if(j < 0 || j >= it.length) return; [it[i], it[j]] = [it[j], it[i]]; if(await gravarItens(pl, it)) telaPlaylists(); }
async function pausarItem(i){ const pl = E.playlists.find(p => p.id === E.plSel); const it = pl.itens.map((x, k) => k === i ? { ...x, ativo:x.ativo === false } : x); if(await gravarItens(pl, it)) telaPlaylists(); }
async function apagarItem(i){
  const pl = E.playlists.find(p => p.id === E.plSel), x = pl.itens[i];
  if(!confirm("Apagar este item da playlist?")) return;
  if(await gravarItens(pl, pl.itens.filter((_, k) => k !== i))){ if(x.path && !pl.itens.some(o => o.path === x.path)) deleteObject(stRef(st, x.path)).catch(() => {}); telaPlaylists(); toast("Item apagado."); }
}
function editarItem(i){ const box = $("fItem"); if(!box) return; box.outerHTML = formItem(i); $("fItem").scrollIntoView({ behavior:"smooth", block:"start" }); }
async function novaPl(){
  abrirModal('<h3>Nova playlist</h3><div class="campo"><label for="fNomePl">Nome</label><input id="fNomePl" maxlength="50" placeholder="Ex.: Manhã, Festa Junina, Semana de provas"></div>' +

async function criarPl(){

async function renomearPl(){

async function excluirPl(){

/* ===================== COMUNICADOS (Secretaria) ===================== */
function situacao(a){ const agora = Date.now(); if(ms(a.fim) && ms(a.fim) < agora) return ["fim", "encerrado"]; if(ms(a.inicio) && ms(a.inicio) > agora) return ["ag", "agendado"]; return ["on", "no ar"]; }
const dataHora = v => ms(v) ? new Date(ms(v)).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "";
async function telaAvisos(){
  const canal = await garantirCanal(false).catch(() => null);
  const avisos = canal && Array.isArray(canal.avisos) ? [...canal.avisos].sort((a, b) => ms(b.criado_em) - ms(a.criado_em)) : [];
  const nomeMuni = E.muni ? E.muni.nome : "do município";
  $("tela").innerHTML =
    '<div class="destaque"><div class="destaque-ico">📢</div><div class="destaque-txt"><b>Comunicados da Secretaria de Educação</b><span>Aparecem em <b>todas as TVs das escolas de ' + esc(nomeMuni) + '</b> (ou só nas escolas escolhidas), intercalados com a programação de cada escola.</span></div></div>' +
    (podeComunicado() ? '<section class="card"><h2 class="h2">＋ Novo comunicado</h2><p class="sub" style="margin-bottom:12px">Aparece nas TVs dentro do período escolhido. Não coloque dados pessoais de alunos: as TVs ficam em áreas públicas.</p>' + formAviso() + "</section>"
      : '<div class="aviso-box">Os comunicados são publicados pela Secretaria Municipal de Educação. Aqui você vê o que está passando nas TVs da sua escola.</div>') +
    '<section class="card"><h2 class="h2">Comunicados</h2><div class="avs">' + (avisos.length ? avisos.map(a => {
      const [c, t] = situacao(a);
      const alvo = a.escolas && a.escolas.length ? a.escolas.length + " escola(s)" : "todas as escolas";
      return '<div class="av"><div><b>' + esc(a.titulo) + '</b><span class="pill ' + c + '">' + t + "</span><small>" + esc(alvo) + " · " + (dataHora(a.inicio) || "desde já") + " até " + (dataHora(a.fim) || "sem data de fim") + (a.letreiro ? " · também no letreiro" : "") + "</small></div>" +
        (podeComunicado() ? '<button class="btn btn-red btn-sm" data-action="apagar-aviso" data-arg="' + esc(a.id) + '">Retirar</button>' : "") + "</div>";
    }).join("") : '<div class="vazio">Nenhum comunicado publicado.</div>') + "</div></section>";
  E.form = { arquivoAviso:null };
}
function formAviso(){
  const hoje = new Date(), fim = new Date(Date.now() + 7 * 86400000), dl = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  return '<div class="campos"><div class="campo cheio"><label for="aTit">Título</label><input id="aTit" maxlength="90" placeholder="Ex.: Matrículas abertas até sexta"></div>' +
    '<div class="campo cheio"><label for="aTxt">Texto</label><textarea id="aTxt" maxlength="500" placeholder="Detalhes do comunicado"></textarea></div>' +
    '<div class="campo"><label for="aIni">Começa em</label><input id="aIni" type="datetime-local" value="' + dl(hoje) + '"></div>' +
    '<div class="campo"><label for="aFim">Termina em</label><input id="aFim" type="datetime-local" value="' + dl(fim) + '"></div>' +
    '<div class="campo"><label for="aDur">Tempo na tela (segundos)</label><input id="aDur" type="number" min="5" max="120" value="15"></div>' +
    '<div class="campo"><label for="aEsc">Escolas</label><select id="aEsc" multiple size="4">' + E.escolas.filter(x => x.municipio_id === E.escola.municipio_id).map(x => '<option value="' + esc(x.id) + '">' + esc(x.nome) + "</option>").join("") + '</select><small>Nenhuma marcada = todas as escolas</small></div>' +
    '<div class="campo cheio"><label class="envio"><input type="file" id="aArq" accept="image/jpeg,image/png,image/webp">🖼️ Imagem do comunicado (opcional)<div id="arqNome" class="sub"></div><div class="prog" hidden id="prog"><i></i></div></label></div></div>' +
    '<label class="chave"><input type="checkbox" id="aLet"> Repetir o título no letreiro do rodapé</label>' +
    '<div class="modal-acoes"><button class="btn btn-ok" data-action="publicar-aviso" id="btAv">Publicar nas TVs</button></div>';
}
async function publicarAviso(){
  const titulo = $("aTit").value.trim(), texto = $("aTxt").value.trim();
  if(titulo.length < 3){ toast("Escreva o título do comunicado.", true); return; }
  const ini = $("aIni").value ? new Date($("aIni").value) : new Date(), fim = $("aFim").value ? new Date($("aFim").value) : null;
  if(fim && fim <= ini){ toast("A data de fim precisa ser depois do início.", true); return; }
  $("btAv").disabled = true;
  try{
    const canal = await garantirCanal(true);
    let imagem_url = "", path = "";
    const arq = $("aArq").files[0];
    if(arq){ const r = await enviarArquivo(await reduzirImagem(arq), "tv/municipios/" + E.escola.municipio_id); imagem_url = r.url; path = r.path; }
    const s = await getDoc(doc(db, "tv_canais", canal.id)); const atuais = s.exists() && Array.isArray(s.data().avisos) ? s.data().avisos : [];
    // mantém no máximo 30: sai primeiro o que já encerrou há mais tempo
    const agora = Date.now(); const vivos = atuais.filter(a => !ms(a.fim) || ms(a.fim) > agora - 30 * 86400000).slice(-29);
    const novo = { id:"a" + Date.now().toString(36), titulo, texto, categoria:"Comunicado da Secretaria", imagem_url, path, duracao:Math.max(5, Math.min(120, parseInt($("aDur").value, 10) || 15)),
      inicio:Timestamp.fromDate(ini), fim:fim ? Timestamp.fromDate(fim) : null, escolas:[...$("aEsc").selectedOptions].map(o => o.value),
      letreiro:$("aLet").checked, criado_por:E.user.uid, criado_nome:E.u.nome || E.user.email || "", criado_em:Timestamp.now() };
    await updateDoc(doc(db, "tv_canais", canal.id), { avisos:[...vivos, novo], atualizado_em:serverTimestamp() });
    canal.avisos = [...vivos, novo]; toast("Comunicado publicado. As TVs exibem em segundos."); telaAvisos();
  }catch(e){ console.error(e); toast("Não foi possível publicar (" + (e.code || "erro") + ").", true); $("btAv").disabled = false; }
}
async function apagarAviso(id){
  if(!confirm("Retirar este comunicado das TVs?")) return;
  try{
    const canal = await garantirCanal(false); const s = await getDoc(doc(db, "tv_canais", canal.id));
    const atuais = s.exists() ? s.data().avisos || [] : [], x = atuais.find(a => a.id === id);
    await updateDoc(doc(db, "tv_canais", canal.id), { avisos:atuais.filter(a => a.id !== id), atualizado_em:serverTimestamp() });
    if(x && x.path) deleteObject(stRef(st, x.path)).catch(() => {});
    canal.avisos = atuais.filter(a => a.id !== id); telaAvisos(); toast("Comunicado retirado.");
  }catch(e){ toast("Não foi possível retirar (" + (e.code || "erro") + ").", true); }
}

function formCampanha(i){

/* ===================== modal e eventos ===================== */
function abrirModal(html){ $("modalBox").innerHTML = html; $("modal").hidden = false; }
function fecharModal(){ $("modal").hidden = true; $("modalBox").innerHTML = ""; }
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  if(a === "ir") ir(arg);
  else if(a === "fechar") fecharModal();
  else if(a === "conectar") modalConectar();
  else if(a === "conectar-ok") conectar();
  else if(a === "ori"){ E.form.ori = arg; document.querySelectorAll("#fOri button").forEach(b => b.classList.toggle("on", b.dataset.arg === arg)); }
  else if(a === "editar-tela") modalTela(arg);
  else if(a === "tela-salvar") salvarTela();
  else if(a === "link-tela") linkTela(arg);
  else if(a === "ajuda-cheia") ajudaTelaCheia();
  else if(a === "copiar"){ const i = $("fLink"); i.select(); (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => toast("Link copiado."), () => { document.execCommand("copy"); toast("Link copiado."); }); }
  else if(a === "remover-tela") removerTela(arg);
  else if(a === "geo"){ if(!navigator.geolocation){ toast("Este aparelho não informa a localização.", true); return; }
    navigator.geolocation.getCurrentPosition(p => { E.form.lat = p.coords.latitude.toFixed(4); E.form.lon = p.coords.longitude.toFixed(4); $("geoInfo").textContent = "Localização definida (" + E.form.lat + ", " + E.form.lon + ")"; }, () => toast("Não foi possível obter a localização.", true)); }
  else if(a === "sel-pl"){ E.plSel = arg; E.form = null; telaPlaylists(); }
  else if(a === "nova-pl") novaPl();
  else if(a === "nova-pl-ok") criarPl();
  else if(a === "renomear-pl") renomearPl();
  else if(a === "excluir-pl") excluirPl();
  else if(a === "tipo-it"){ E.form = { tipoNovo:arg }; $("fItem").outerHTML = formItem(null); }
  else if(a === "salvar-it") salvarItem();
  else if(a === "cancelar-it"){ E.form = null; $("fItem").outerHTML = formItem(null); }
  else if(a === "mover") moverItem(+arg, +el.dataset.d);
  else if(a === "pausar-it") pausarItem(+arg);
  else if(a === "editar-it") editarItem(+arg);
  else if(a === "apagar-it") apagarItem(+arg);
  else if(a === "publicar-aviso") publicarAviso();
  else if(a === "camp-salvar") salvarCampanha();
  else if(a === "camp-editar"){ $("campForm").innerHTML = formCampanha(+arg); $("campForm").scrollIntoView({ behavior:"smooth" }); }
  else if(a === "camp-cancelar") $("campForm").innerHTML = formCampanha(null);
  else if(a === "camp-ativo"){ const it = CAMP.itens.map((c, k) => k === +arg ? { ...c, ativo:c.ativo === false } : c); gravarCampanhas(it).then(ok => ok && telaCampanhas()); }
  else if(a === "camp-apagar"){ if(confirm("Apagar esta campanha de todas as TVs?")){ const x = CAMP.itens[+arg]; gravarCampanhas(CAMP.itens.filter((_, k) => k !== +arg)).then(ok => { if(ok){ if(x.path) deleteObject(stRef(st, x.path)).catch(() => {}); telaCampanhas(); } }); } }
  else if(a === "apagar-aviso") apagarAviso(arg);
});
document.addEventListener("change", ev => {
  if(ev.target.id === "selEscola") trocarEscola(ev.target.value);
  else if(ev.target.id === "fArq" || ev.target.id === "aArq"){ const f = ev.target.files[0]; if(f) $("arqNome").textContent = f.name + " · " + (f.size / 1048576).toFixed(1).replace(".", ",") + " MB";
    if(f && E.form && E.form.tipo === "video" && ev.target.id === "fArq"){ const v = document.createElement("video"); v.preload = "metadata"; v.onloadedmetadata = () => { if(isFinite(v.duration) && v.duration > 0) $("fDur").value = Math.min(600, Math.max(4, Math.round(v.duration))); URL.revokeObjectURL(v.src); }; v.src = URL.createObjectURL(f); } }
});
document.addEventListener("input", ev => { if(ev.target.id === "fCod") ev.target.value = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); });
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && !$("modal").hidden) fecharModal(); });

onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/"); return; }
  let u = null;
  try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo" || u.perfil === "aluno"){ location.replace("/entrar/"); return; }
  const sim = u.perfil === "admin" ? (() => { try{ const v = JSON.parse(sessionStorage.getItem("pde_ver_como") || "null"); return v && v.perfil !== "admin" ? v.perfil : ""; }catch(e){ return ""; } })() : "";
  E.user = user; E.u = u; E.admin = u.perfil === "admin" && !sim; E.perfil = sim || u.perfil;
  $("quem").textContent = (u.nome || user.email) + " · " + ({ admin:"Administrador", secretaria:"Secretaria", gestor:"Gestão escolar", professor:"Professor(a)" }[E.perfil] || "");
  try{ await carregarEscolas(); }catch(e){ console.error(e); }
  $("tbCamp").hidden = !E.admin;
  const h = (location.hash || "").slice(1); E.aba = ["telas", "playlists", "avisos", "campanhas"].includes(h) ? h : (E.perfil === "secretaria" ? "avisos" : "telas");
  await trocarEscola(E.escolaId);
});
</script>
