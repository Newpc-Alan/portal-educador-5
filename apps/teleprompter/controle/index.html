<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Controle do Teleprompter · Portal do Educador</title>
<meta name="theme-color" content="#0b1728">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1728;--card:#112238;--line:#294057;--txt:#f1f6fb;--muted:#a4b7ca;--cyan:#57c9ea;--lima:#8DC63F;--red:#e8705f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;min-height:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:14px}
.topo{display:flex;align-items:center;gap:10px}
.topo img{width:40px;height:40px}
.topo small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.topo b{display:block;font-size:1rem}
.estado{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.estado::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.estado.on{color:#72deb1}.estado.on::before{background:#72deb1;box-shadow:0 0 0 4px #43cb9620}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.titulo{font-size:1.02rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.barra{height:8px;border-radius:99px;background:#07121f;margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lima));transition:width .4s}
.play{width:100%;border:0;border-radius:22px;background:var(--cyan);color:#062238;font-size:1.5rem;font-weight:800;padding:34px 10px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 18px 40px -22px #57c9ea}
.play.tocando{background:#f4c981}
.play:active{transform:scale(.98)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px 8px;font-size:1rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.b small{font-size:.7rem;color:var(--muted);font-weight:700}
.b:active{background:var(--line)}
.ajuste{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.ajuste .b{padding:12px 18px;font-size:1.3rem;border-radius:12px}
.ajuste div{text-align:center}
.ajuste div b{display:block;font-size:1.2rem}
.ajuste div small{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.aviso{text-align:center;padding:28px 18px;color:var(--muted);font-size:.92rem;line-height:1.6}
.aviso>b{color:var(--txt);display:block;font-size:1.05rem;margin-bottom:6px}
.aviso span b{color:var(--txt)}
.btn-google{display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.rodape{margin-top:auto;text-align:center;font-size:.72rem;color:var(--muted)}
.rodape a{color:var(--cyan)}
</style>
</head>
<body>
<div class="app">
  <header class="topo"><img src="/assets/pde-logo-128.png" alt=""><div><small>Teleprompter</small><b>Controle remoto</b></div><span class="estado" id="estado">Conectando...</span></header>

  <section id="telaEspera" hidden class="card aviso"><b id="esperaTit">Controle desligado</b><span id="esperaTxt">No computador, abra o Teleprompter no Portal, toque em <b style="display:inline">Celular</b> e escaneie o código que aparecer.</span></section>

  <section id="telaControle" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="card"><div class="titulo" id="titulo">Roteiro</div><div class="sub" id="sub">Bloco 0 de 0</div><div class="barra"><i id="barra"></i></div></div>
    <button class="play" data-acao="alternar" id="btnPlay">▶ Iniciar</button>
    <div class="duas">
      <button class="b" data-acao="anterior">◀<small>Bloco anterior</small></button>
      <button class="b" data-acao="proximo">▶<small>Próximo bloco</small></button>
    </div>
    <div class="card ajuste"><button class="b" data-acao="mais_lento" aria-label="Mais devagar">−</button><div><b id="ppm">130</b><small>Ritmo · ppm</small></div><button class="b" data-acao="mais_rapido" aria-label="Mais rápido">+</button></div>
    <div class="card ajuste"><button class="b" data-acao="menor" aria-label="Letra menor">A−</button><div><b id="fonte">46</b><small>Tamanho da letra</small></div><button class="b" data-acao="maior" aria-label="Letra maior">A+</button></div>
    <button class="b" data-acao="inicio">↺<small>Voltar ao início</small></button>
  </section>

  <p class="rodape">Portal do Educador · <a href="/apps/teleprompter/">abrir o teleprompter aqui</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, addDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fb = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const db = getFirestore(fb);
const $ = id => document.getElementById(id);
// a chave da sessão vem no QR code (depois do #); sem login: o celular só controla a sessão daquela chave
const E = { token:"", veio:"", s:null, existe:false, timer:0 };
function tela(qual){ ["telaEspera","telaControle"].forEach(id => $(id).hidden = id !== qual); }
function estado(on, txt){ $("estado").classList.toggle("on", on); $("estado").textContent = txt; }
// a sessão vale enquanto o computador estiver publicando (ele atualiza pelo menos a cada 20 s)
function viva(s){ if(!s || !s.ativo) return false; const t = s.atualizado_em && s.atualizado_em.toMillis ? s.atualizado_em.toMillis() : Date.now(); return Date.now() - t < 120000; }
function desenhar(){
  const s = E.s;
  if(!viva(s)){
    tela("telaEspera"); estado(false, "Desconectado");
    $("esperaTit").textContent = E.existe ? "Teleprompter sem sinal" : "Controle desligado";
    const fim = E.token ? E.token.slice(-4).toUpperCase() : "";
    $("esperaTxt").innerHTML = E.existe
      ? "O computador parou de responder. Confira se o Teleprompter continua aberto com a janela <b>Controle pelo celular</b>."
      : E.token
        ? "A sessão <b>" + fim + "</b> não está ligada. No computador, recarregue a página do Teleprompter (F5), toque em <b>Celular</b> e escaneie o novo código. Confira se o código da sessão na tela do computador também termina em <b>" + fim + "</b>."
        : E.veio
          ? "O link chegou incompleto. Escaneie o código de novo ou toque no link que aparece embaixo do QR code no computador."
          : "No computador, abra o Teleprompter no Portal, toque em <b>Celular</b> e escaneie o código que aparecer. Cada código vale só enquanto o controle estiver ligado.";
    return;
  }
  tela("telaControle"); estado(true, "Conectado");
  $("titulo").textContent = s.titulo || "Roteiro";
  $("sub").textContent = s.blocos ? "Bloco " + s.bloco + " de " + s.blocos + (s.concluido ? " · concluído" : "") : "Roteiro vazio";
  $("barra").style.width = (s.progresso || 0) + "%";
  $("ppm").textContent = s.ppm || "-"; $("fonte").textContent = s.fonte || "-";
  const b = $("btnPlay");
  b.classList.toggle("tocando", !!(s.tocando || s.contando));
  b.textContent = s.contando ? "⏳ Prepare-se" : s.tocando ? "⏸ Pausar" : s.concluido ? "↺ Repetir" : s.progresso > 0 ? "▶ Continuar" : "▶ Iniciar";
}
async function enviar(acao){
  if(!E.token || !viva(E.s)) return;
  try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
  try{ await addDoc(collection(db, "tele_sessoes", E.token, "cmd"), { acao, em:serverTimestamp() }); }
  catch(e){ estado(false, "Sem conexão"); }
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-acao]"); if(b) enviar(b.dataset.acao); });
const limpa = v => String(v || "").replace(/[^A-Za-z0-9]/g, "");
let doLink = ""; try{ doLink = limpa(new URLSearchParams(location.search).get("k")); }catch(e){}
if(doLink.length !== 24) doLink = limpa((location.hash || "").slice(1));
E.veio = doLink.length ? doLink : "";
E.token = doLink.length === 24 ? doLink : (() => { try{ return sessionStorage.getItem("pde_tele_chave") || ""; }catch(e){ return ""; } })();
if(E.token){
  try{ sessionStorage.setItem("pde_tele_chave", E.token); }catch(e){}
  if(location.search || location.hash) try{ history.replaceState(null, "", location.pathname); }catch(e){}
  onSnapshot(doc(db, "tele_sessoes", E.token), snap => { E.existe = snap.exists(); E.s = E.existe ? snap.data() : null; desenhar(); }, () => { estado(false, "Sem conexão"); tela("telaEspera"); });
  E.timer = setInterval(desenhar, 15000);
} else { desenhar(); }
</script>
</body>
</html>
