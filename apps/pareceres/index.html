<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/js/ambiente.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pareceres da turma · Portal do Educador</title>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{ --escuro:#071621; --escuro-2:#0c2338; --azul:#2671AB; --lima:#8DC63F; --verde:#1a6b2a; --verde-2:#124d1e; --navy:#0f2c4a;
  --bg:#f4f7fa; --ink:#0c2338; --ink-2:#2C3E55; --muted:#5b6b7c; --line:#dce4ed; --red:#C2362C; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.app{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.topo{margin:0 -16px 16px;padding:14px 20px;border-radius:0 0 18px 18px;color:#fff;background:linear-gradient(135deg,#071621,#123556);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:220px;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.12rem}
.marca span{display:block;font-size:.8rem;color:rgba(255,255,255,.75)}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 13px;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex:1 1 220px}
.sel,.inp{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:600;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink);min-height:44px}
.passos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.passo{border:1.5px solid #cfdbe7;background:#fff;color:var(--navy);border-radius:12px;padding:11px 16px;font-weight:700;font-size:.9rem;min-height:44px}
.passo.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:12px;border:1.5px solid transparent;font-weight:800;font-size:.9rem;min-height:46px;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ok{background:var(--verde);color:#fff}.btn-ok:hover{background:var(--verde-2)}
.btn-gh{background:#fff;color:var(--navy);border-color:#cfdbe7}
.btn-cl{background:#eef2f6;color:var(--navy)}
.aviso{border-radius:12px;padding:11px 14px;font-size:.88rem;line-height:1.45;margin-bottom:12px}
.aviso.azul{background:#e8f2fb;color:#1f5f91}.aviso.amarelo{background:#fff3d6;color:#6b4500}.aviso.verde{background:#e9f5dc;color:#2f5a0a}
.topo-dados{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.topo-dados p{flex:1 1 480px;color:#33475b;font-size:.92rem}
.al{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;gap:10px}
.al-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.al-ini{width:40px;height:40px;border-radius:50%;background:#e6eef6;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:.86rem;flex:none}
.al-nome{font-weight:800;font-size:1rem;flex:1 1 200px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dado{border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:700}
.d-freq{background:#eef6f0;color:#1a5a26}.d-freq.baixa{background:#fbe3e0;color:#9c2a20}
.d-med{background:#e8f2fb;color:#1f5f91}.d-med.baixa{background:#fff3d6;color:#6b4500}
.d-bncc{background:#f4f0fb;color:#5a3d8a}.d-apoio{background:#fff3d6;color:#6b4500}.d-cinza{background:#f1f4f8;color:#5b6b7c}
.st{border-radius:99px;padding:4px 10px;font-size:.76rem;font-weight:800;white-space:nowrap}
.st.rasc{background:#fff3d6;color:#6b4500}.st.ok{background:#e9f5dc;color:#2f5a0a}.st.nada{background:#f1f4f8;color:#5b6b7c}
.obs{display:flex;flex-wrap:wrap;gap:6px}
.ob{border:1.5px solid #dfe6ee;background:#fff;color:#33475b;border-radius:99px;padding:8px 13px;font-size:.84rem;font-weight:600;min-height:40px}
.ob[aria-pressed="true"]{border-color:var(--verde);background:#eef7e8;color:var(--verde-2)}
.livre{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;min-height:44px}
.marcar{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;color:var(--ink-2)}
.marcar input{width:20px;height:20px;accent-color:var(--verde)}
.prog{height:10px;background:#e6eef6;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--verde);width:0;transition:width .3s}
.rev{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.rev aside{flex:1 1 260px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;max-height:75vh;overflow:auto}
.rev article{flex:999 1 560px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border-radius:12px;padding:11px 12px;min-height:48px;border:1.5px solid transparent;background:#f6f8fb;text-align:left}
.it.on{border-color:var(--verde);background:#eef7e8}
.it b{font-size:.9rem}
.txt{width:100%;border:1.5px solid #cfdbe7;border-radius:12px;padding:14px;font-size:1rem;line-height:1.6;min-height:300px;resize:vertical}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sub{color:var(--muted);font-size:.84rem}
.vazio{text-align:center;color:var(--muted);padding:40px 10px}
.vazio b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;background:var(--escuro-2);color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;font-weight:600;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
@media (max-width:640px){ .txt{min-height:360px} }
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Portal IA · Parecer descritivo</small><b>Pareceres da turma</b><span id="quem">Carregando...</span></div></div>
    <a class="tb" href="/relatorios/">Central de Relatórios</a>
    <a class="tb" href="/entrar/">← Voltar ao Portal</a>
  </header>

  <section class="card">
    <div class="filtros">
      <label class="campo">Turma<select class="sel" id="selTurma" aria-label="Turma"><option value="">Carregando...</option></select></label>
      <label class="campo" style="flex:0 1 200px">Período<select class="sel" id="selPer" aria-label="Período"></select></label>
    </div>
    <p class="sub" id="infoPer" style="margin-top:8px"></p>
  </section>

  <nav class="passos" aria-label="Etapas" id="passos" hidden>
    <button type="button" class="passo on" data-action="ir" data-arg="dados" id="p-dados">1 · Dados e observações</button>
    <button type="button" class="passo" data-action="ir" data-arg="revisao" id="p-revisao">2 · Revisar e aprovar</button>
    <button type="button" class="passo" data-action="ir" data-arg="pdf" id="p-pdf">3 · PDF da turma</button>
  </nav>

  <main id="tela"><div class="card vazio"><b>Escolha a turma e o período</b>O Portal traz a frequência, as médias e as habilidades da BNCC de cada aluno.</div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const app = initializeApp(window.PDE_AMBIENTE.fb);
const auth = getAuth(app), db = getFirestore(app), fn = httpsCallable(getFunctions(app, "southamerica-east1"), "pareceres", { timeout:180000 });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 4200); }
const num = v => String(v).replace(".", ",");
const iniciais = n => String(n || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const ANO = +new Intl.DateTimeFormat("en-CA", { timeZone:"America/Campo_Grande", year:"numeric" }).format(new Date());
const E = { u:null, uid:"", turmas:[], turma:null, per:0, dados:null, al:[], etapa:"dados", sel:0, gerando:false, parar:false };

/* ---------- turmas e período ---------- */
async function carregarTurmas(){
  const ids = (E.u.escolas_ids && E.u.escolas_ids.length ? E.u.escolas_ids : [E.u.escola_id]).filter(Boolean).slice(0, 10);
  E.turmas = [];
  try{
    if(E.u.perfil === "admin"){ const s = await getDocs(query(collection(db, "turmas"), limit(300))); s.forEach(d => { const t = d.data(); if(t.status !== "inativa") E.turmas.push({ id:d.id, ...t }); }); }
    else if(ids.length){ const s = await getDocs(query(collection(db, "turmas"), where("escola_id", "in", ids))); s.forEach(d => { const t = d.data(); if(t.status !== "inativa") E.turmas.push({ id:d.id, ...t }); }); }
  }catch(e){ console.warn("turmas:", e.code); }
  const minhas = new Set((E.u.turmas_ids || []).map(String)), ehMinha = t => minhas.has(t.id) || t.criado_por === E.uid || (Array.isArray(t.grade) && t.grade.some(g => g.professor_uid === E.uid));
  E.turmas.sort((a, b) => (ehMinha(b) - ehMinha(a)) || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR", { numeric:true }));
  $("selTurma").innerHTML = '<option value="">' + (E.turmas.length ? "Escolha a turma..." : "Nenhuma turma nas suas escolas") + "</option>" +
    E.turmas.map(t => '<option value="' + esc(t.id) + '">' + esc(t.nome || "Turma") + (ids.length > 1 ? " · " + esc(t.escola_nome || "") : "") + (ehMinha(t) ? " ★" : "") + "</option>").join("");
  let ult = null; try{ ult = JSON.parse(localStorage.getItem("pde_par_ult_" + E.uid) || "null"); }catch(e){}
  periodos(4, ult && ult.p ? ult.p : bimestreAtual());
  if(ult && E.turmas.some(t => t.id === ult.t)){ $("selTurma").value = ult.t; abrir(); }
}
function bimestreAtual(){ const m = new Date().getMonth() + 1; return m <= 4 ? 1 : m <= 7 ? 2 : m <= 9 ? 3 : 4; }
function periodos(n, sel){
  const nome = n === 4 ? "bimestre" : n === 3 ? "trimestre" : "semestre";
  $("selPer").innerHTML = Array.from({ length:n }, (_, i) => '<option value="' + (i + 1) + '"' + (i + 1 === +sel ? " selected" : "") + ">" + (i + 1) + "º " + nome + " de " + ANO + "</option>").join("");
  if(!$("selPer").value) $("selPer").value = "1";
}
async function abrir(){
  const tid = $("selTurma").value, p = +$("selPer").value;
  E.turma = E.turmas.find(t => t.id === tid) || null; E.per = p; E.dados = null; E.al = [];
  $("passos").hidden = true; $("infoPer").textContent = "";
  if(!E.turma){ $("tela").innerHTML = '<div class="card vazio"><b>Escolha a turma e o período</b>O Portal traz a frequência, as médias e as habilidades da BNCC de cada aluno.</div>'; return; }
  try{ localStorage.setItem("pde_par_ult_" + E.uid, JSON.stringify({ t:tid, p })); }catch(e){}
  $("tela").innerHTML = '<div class="card vazio"><b>Juntando os dados do período...</b>Frequência, notas, provas e o que já foi salvo.</div>';
  try{
    const r = (await fn({ acao:"dados", turma_id:tid, ano:ANO, periodo:p })).data;
    if(r.periodos && r.periodos !== $("selPer").options.length){ periodos(r.periodos, Math.min(p, r.periodos)); }
    E.dados = r;
    E.al = r.alunos.map(a => ({ ...a, obs:a.salvo ? [...(a.salvo.obs || [])] : [], livre:a.salvo ? a.salvo.livre || "" : "", texto:a.salvo ? a.salvo.texto : "", status:a.salvo ? a.salvo.status : "", marcado:!a.salvo, sujo:false }));
    $("infoPer").textContent = r.periodo.rotulo + ": " + dataBR(r.periodo.inicio) + " a " + dataBR(r.periodo.fim) + (r.periodo.do_calendario ? " (calendário da rede)" : " (sem calendário da rede cadastrado: datas de costume)") + " · " + r.alunos.length + " alunos";
    $("passos").hidden = !E.al.length; E.sel = 0;
    ir(E.al.some(a => a.texto) && E.etapa !== "dados" ? E.etapa : "dados");
  }catch(e){ console.warn(e); $("tela").innerHTML = '<div class="card vazio"><b>Não foi possível abrir</b>' + esc(e.message || "Tente de novo.") + "</div>"; }
}
const dataBR = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) : "";

/* ---------- etapas ---------- */
function ir(et){
  E.etapa = et;
  ["dados", "revisao", "pdf"].forEach(k => $("p-" + k).classList.toggle("on", k === et));
  if(et === "dados") telaDados(); else if(et === "revisao") telaRevisao(); else telaPdf();
}
function chipsDados(a){
  const P = E.dados.periodo, ch = [];
  if(a.freq) ch.push('<span class="dado d-freq' + (a.freq.pct < (P.freq_minima || 75) ? " baixa" : "") + '">Frequência ' + num(a.freq.pct) + "%" + (a.freq.seguidos >= 3 ? " · " + a.freq.seguidos + " dias seguidos fora" : "") + "</span>");
  else ch.push('<span class="dado d-cinza">Sem chamada no período</span>');
  if(a.medias && a.medias.length) a.medias.slice(0, 6).forEach(m => ch.push('<span class="dado d-med' + (m.media < (P.media_minima || 6) ? " baixa" : "") + '">' + esc(m.disciplina) + " " + num(m.media) + "</span>"));
  else ch.push('<span class="dado d-cinza">Sem notas no período</span>');
  if(a.habilidades && a.habilidades.length){ const ok = a.habilidades.filter(h => h.consolidada).length; ch.push('<span class="dado d-bncc" title="' + esc(a.habilidades.map(h => h.codigo + (h.consolidada ? " consolidada" : " em desenvolvimento")).join(" · ")) + '">BNCC ' + ok + " de " + a.habilidades.length + " consolidadas</span>"); }
  else ch.push('<span class="dado d-cinza">Sem prova com BNCC</span>');
  if(a.apoio && a.apoio.length) ch.push('<span class="dado d-apoio">' + (a.apoio.includes("pei") ? "Plano individual (PEI)" : "Apoio pedagógico") + "</span>");
  return ch.join("");
}
const stHtml = a => a.status === "aprovado" ? '<span class="st ok">Aprovado</span>' : a.texto ? '<span class="st rasc">Rascunho</span>' : '<span class="st nada">Sem parecer</span>';
function telaDados(){
  const O = E.dados.obs, marc = E.al.filter(a => a.marcado).length;
  $("tela").innerHTML =
    '<div class="card"><div class="topo-dados"><p>Toque nas observações que combinam com cada aluno: é o seu olhar que deixa o parecer verdadeiro. A IA escreve o rascunho a partir dos dados e das suas observações e <b>não recebe o nome do aluno</b>. Cada parecer gerado usa 1 crédito do Portal IA.</p>' +
    '<button type="button" class="btn btn-ok" data-action="gerar" id="btGerar"' + (marc ? "" : " disabled") + ">Gerar " + marc + (marc === 1 ? " parecer" : " pareceres") + " (" + marc + (marc === 1 ? " crédito)" : " créditos)") + "</button></div>" +
    '<div class="acoes" style="margin-top:10px"><button type="button" class="btn btn-cl" data-action="marcar-todos" data-arg="1">Marcar todos</button><button type="button" class="btn btn-cl" data-action="marcar-todos" data-arg="sem">Só os sem parecer</button><button type="button" class="btn btn-cl" data-action="marcar-todos" data-arg="0">Desmarcar</button></div>' +
    '<div id="progBox" hidden><div class="prog"><i id="progBar"></i></div><div class="acoes"><span class="sub" id="progTxt"></span><button type="button" class="btn btn-gh" data-action="parar">Parar</button></div></div></div>' +
    E.al.map((a, i) => '<article class="al"><div class="al-cab"><span class="al-ini" aria-hidden="true">' + esc(iniciais(a.nome)) + '</span><span class="al-nome">' + esc(a.nome) + "</span>" + stHtml(a) +
      '<label class="marcar"><input type="checkbox" data-marca="' + i + '"' + (a.marcado ? " checked" : "") + "> gerar</label></div>" +
      '<div class="chips">' + chipsDados(a) + "</div>" +
      '<div class="obs" role="group" aria-label="Observações sobre ' + esc(a.nome) + '">' + Object.entries(O).map(([k, t]) => '<button type="button" class="ob" data-action="obs" data-i="' + i + '" data-k="' + k + '" aria-pressed="' + (a.obs.includes(k) ? "true" : "false") + '">' + esc(rotuloObs(t)) + "</button>").join("") + "</div>" +
      '<input class="livre" data-livre="' + i + '" maxlength="400" value="' + esc(a.livre) + '" placeholder="Comentário opcional (o que só você viu). Sem dado de saúde, laudo ou documento." aria-label="Comentário sobre ' + esc(a.nome) + '"></article>').join("") +
    (E.al.length ? "" : '<div class="card vazio"><b>Esta turma ainda não tem alunos</b>Cadastre na Ficha do Aluno.</div>');
}
const rotuloObs = t => t.charAt(0).toUpperCase() + t.slice(1);
async function gerar(){
  if(E.gerando) return;
  const fila = E.al.map((a, i) => ({ a, i })).filter(x => x.a.marcado);
  if(!fila.length) return;
  if(fila.some(x => x.a.status === "aprovado") && !confirm("Alguns alunos marcados já têm parecer aprovado. Gerar de novo substitui o texto e volta para rascunho. Continuar?")) return;
  E.gerando = true; E.parar = false; $("progBox").hidden = false; $("btGerar").disabled = true;
  let ok = 0, falha = 0;
  for(const [k, x] of fila.entries()){
    if(E.parar) break;
    $("progTxt").textContent = "Escrevendo o parecer de " + x.a.nome.split(" ")[0] + " (" + (k + 1) + " de " + fila.length + ")...";
    try{
      const r = (await fn({ acao:"gerar", turma_id:E.turma.id, ano:ANO, periodo:E.per, aluno_id:x.a.id, obs:x.a.obs, livre:x.a.livre })).data;
      Object.assign(x.a, { texto:r.texto, status:"rascunho", marcado:false, sujo:false }); ok++;
    }catch(e){ falha++; console.warn("gerar:", e.code, e.message);
      if(e.code === "functions/resource-exhausted" || e.code === "functions/failed-precondition"){ toast(e.message, true); break; } }
    $("progBar").style.width = Math.round((k + 1) / fila.length * 100) + "%";
  }
  E.gerando = false;
  toast(ok + (ok === 1 ? " parecer escrito" : " pareceres escritos") + (falha ? " · " + falha + " não deu (o crédito voltou; tente de novo)" : "") + ". Agora revise e aprove.", !!falha && !ok);
  if(ok){ E.sel = Math.max(0, E.al.findIndex(a => a.status === "rascunho")); ir("revisao"); } else telaDados();
}

/* ---------- revisão ---------- */
function telaRevisao(){
  const com = E.al.filter(a => a.texto);
  if(!com.length){ $("tela").innerHTML = '<div class="card vazio"><b>Nenhum parecer ainda</b>Volte ao passo 1, toque nas observações e gere os pareceres.</div>'; return; }
  if(!E.al[E.sel] || !E.al[E.sel].texto) E.sel = E.al.findIndex(a => a.texto);
  const a = E.al[E.sel], nOk = E.al.filter(x => x.status === "aprovado").length;
  $("tela").innerHTML = '<div class="rev"><aside aria-label="Alunos"><div class="acoes" style="justify-content:space-between;padding:4px 6px 6px"><b style="font-size:.92rem">Alunos</b><span class="sub" style="color:#1a5a26;font-weight:700">' + nOk + " de " + E.al.length + " aprovados</span></div>" +
    E.al.map((x, i) => '<button type="button" class="it' + (i === E.sel ? " on" : "") + '" data-action="abrir-al" data-i="' + i + '"' + (x.texto ? "" : " disabled") + "><b>" + esc(x.nome) + "</b>" + stHtml(x) + "</button>").join("") + "</aside>" +
    '<article><div class="acoes" style="justify-content:space-between"><div><span style="font-size:.74rem;font-weight:800;letter-spacing:.06em;color:#2671AB">RASCUNHO DA IA · REVISE ANTES DE APROVAR</span><h2 style="font-size:1.3rem;margin-top:2px">' + esc(a.nome) + "</h2></div>" + stHtml(a) + "</div>" +
    '<div class="chips">' + chipsDados(a) + (a.obs.length ? '<span class="dado d-cinza">' + esc(a.obs.map(k => E.dados.obs[k]).join(", ")) + "</span>" : "") + "</div>" +
    (!a.medias.length && !a.habilidades.length ? '<div class="aviso amarelo">Sem nota e sem prova no período: o rascunho fala só da frequência e das suas observações, sem inventar desempenho.</div>' : "") +
    '<label for="txtPar" class="sub" style="font-weight:700">Texto do parecer (edite à vontade)</label><textarea id="txtPar" class="txt">' + esc(a.texto) + "</textarea>" +
    '<div class="acoes"><button type="button" class="btn btn-ok" data-action="aprovar">' + (a.status === "aprovado" ? "Aprovado · salvar mudanças" : "Aprovar parecer") + '</button><button type="button" class="btn btn-gh" data-action="salvar-rasc">Salvar rascunho</button>' +
    '<button type="button" class="btn btn-gh" data-action="regerar">Gerar de novo (1 crédito)</button><button type="button" class="btn btn-cl" data-action="proximo">Próximo aluno</button></div>' +
    '<p class="sub">A IA recebeu só "o aluno" com números, habilidades e as suas observações: nenhum nome, CPF ou dado de saúde. Aprovado, o parecer vai para a Central de Relatórios, onde a coordenação confere.</p></article></div>';
}
async function salvar(aprovar){
  const a = E.al[E.sel], texto = $("txtPar").value.trim();
  if(texto.length < 40){ toast("O parecer está curto demais.", true); return; }
  try{ const r = (await fn({ acao:"salvar", turma_id:E.turma.id, ano:ANO, periodo:E.per, aluno_id:a.id, texto, aprovar, obs:a.obs, livre:a.livre })).data;
    a.texto = texto; a.status = r.status; a.sujo = false;
    toast(aprovar ? "Parecer de " + a.nome.split(" ")[0] + " aprovado." : "Rascunho salvo.");
    if(aprovar){ const prox = E.al.findIndex((x, i) => i > E.sel && x.texto && x.status !== "aprovado"); if(prox >= 0) E.sel = prox; }
    telaRevisao();
  }catch(e){ toast(e.message || "Não foi possível salvar.", true); }
}
async function regerar(){
  const a = E.al[E.sel];
  if(!confirm("Gerar de novo o parecer de " + a.nome.split(" ")[0] + "? O texto atual é substituído (usa 1 crédito).")) return;
  const b = document.querySelector('[data-action="regerar"]'); b.disabled = true; b.textContent = "Escrevendo...";
  try{ const r = (await fn({ acao:"gerar", turma_id:E.turma.id, ano:ANO, periodo:E.per, aluno_id:a.id, obs:a.obs, livre:a.livre })).data; a.texto = r.texto; a.status = "rascunho"; toast("Novo rascunho pronto."); }
  catch(e){ toast(e.message || "Não deu certo; o crédito voltou.", true); }
  telaRevisao();
}

/* ---------- PDF ---------- */
function telaPdf(){
  const ok = E.al.filter(a => a.status === "aprovado"), falta = E.al.filter(a => a.status !== "aprovado");
  $("tela").innerHTML = '<div class="card"><h2 style="font-size:1.25rem;margin-bottom:8px">PDF da turma</h2>' +
    '<p style="color:#33475b;max-width:760px">' + (falta.length ? "Faltam " + falta.length + " parecer(es) para aprovar: " + esc(falta.slice(0, 8).map(a => a.nome.split(" ")[0]).join(", ")) + (falta.length > 8 ? "..." : "") + ". O PDF sai só com os aprovados: o professor assina, não a IA." :
      "Todos os pareceres estão aprovados. O PDF sai com um aluno por página, o brasão do município, o nome da escola e o espaço para as assinaturas.") + "</p>" +
    '<div class="acoes" style="margin-top:12px"><button type="button" class="btn btn-ok" data-action="pdf"' + (ok.length ? "" : " disabled") + ">Baixar PDF (" + ok.length + (ok.length === 1 ? " aluno)" : " alunos)") + '</button><button type="button" class="btn btn-gh" data-action="ir" data-arg="revisao">Voltar à revisão</button></div></div>';
}
const pdfTx = s => String(s == null ? "" : s).replace(/[^\u0000-ÿ–—•\n]/g, "").replace(/[ \t]+/g, " ").trim();
function logoPng(url){
  return new Promise(ok => { if(!url){ ok(null); return; }
    const img = new Image(), t = setTimeout(() => ok(null), 7000); img.crossOrigin = "anonymous";
    img.onload = () => { clearTimeout(t); try{ const k = Math.min(1, 400 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k)); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok({ url:c.toDataURL("image/png"), w:c.width, h:c.height }); }catch(e){ ok(null); } };
    img.onerror = () => { clearTimeout(t); ok(null); }; img.src = url; });
}
async function pdf(){
  if(!window.jspdf){ toast("Carregando o gerador de PDF. Tente de novo em instantes.", true); return; }
  const lista = E.al.filter(a => a.status === "aprovado"); if(!lista.length) return;
  const t = E.turma; let m = {}, escola = t.escola_nome || "";
  try{ const s = await getDoc(doc(db, "municipios", t.municipio_id || "-")); if(s.exists()) m = s.data(); }catch(e){}
  if(!escola){ try{ const s = await getDoc(doc(db, "escolas", t.escola_id)); if(s.exists()) escola = s.data().nome || ""; }catch(e){} }
  const logo = await logoPng(m.logo_url), pdfD = new window.jspdf.jsPDF({ unit:"mm", format:"a4" }), W = 210, H = 297;
  lista.forEach((a, k) => {
    if(k) pdfD.addPage();
    pdfD.setFillColor(15, 44, 74); pdfD.rect(0, 0, W, 27, "F"); pdfD.setFillColor(26, 107, 42); pdfD.rect(0, 27, W, 1.4, "F");
    let x = 12;
    if(logo){ pdfD.setFillColor(255, 255, 255); pdfD.roundedRect(12, 3.5, 20, 20, 2, 2, "F"); const kk = Math.min(17.2 / logo.w, 17.2 / logo.h); pdfD.addImage(logo.url, "PNG", 12 + (20 - logo.w * kk) / 2, 3.5 + (20 - logo.h * kk) / 2, logo.w * kk, logo.h * kk); x = 37; }
    pdfD.setTextColor(255, 255, 255); pdfD.setFont("helvetica", "bold"); pdfD.setFontSize(14); pdfD.text(pdfTx(escola || "Escola").slice(0, 70), x, 12);
    pdfD.setFont("helvetica", "normal"); pdfD.setFontSize(9); pdfD.text(pdfTx((m.nome ? "Secretaria Municipal de Educação de " + m.nome + (m.uf ? "/" + m.uf : "") + " · " : "") + "Ano letivo " + ANO), x, 18.5);
    pdfD.setTextColor(15, 44, 74); pdfD.setFont("helvetica", "bold"); pdfD.setFontSize(15); pdfD.text("Parecer descritivo · " + pdfTx(E.dados.periodo.rotulo), 12, 40);
    pdfD.setFontSize(10); pdfD.setFont("helvetica", "bold"); pdfD.text("Aluno(a): ", 12, 48); pdfD.setFont("helvetica", "normal"); pdfD.text(pdfTx(a.nome), 12 + pdfD.getTextWidth("Aluno(a): "), 48);
    pdfD.setFont("helvetica", "bold"); pdfD.text("Turma: ", 12, 54); pdfD.setFont("helvetica", "normal"); pdfD.text(pdfTx(t.nome || ""), 12 + pdfD.getTextWidth("Turma: "), 54);
    if(a.freq){ pdfD.setFont("helvetica", "bold"); pdfD.text("Frequência no período: ", 110, 54); pdfD.setFont("helvetica", "normal"); pdfD.text(num(a.freq.pct) + "%", 110 + pdfD.getTextWidth("Frequência no período: "), 54); }
    pdfD.setDrawColor(210, 220, 230); pdfD.line(12, 58, W - 12, 58);
    pdfD.setTextColor(30, 45, 60); pdfD.setFontSize(11.5); let y = 67;
    pdfTx(a.texto).split(/\n+/).forEach(par => { pdfD.splitTextToSize(par.trim(), W - 24).forEach(l => { if(y > H - 50){ pdfD.addPage(); y = 25; } pdfD.text(l, 12, y); y += 6; }); y += 3; });
    y = Math.max(y + 18, H - 55); if(y > H - 30){ pdfD.addPage(); y = 40; }
    pdfD.setDrawColor(90, 110, 130); pdfD.setFontSize(9); pdfD.setTextColor(60, 80, 100);
    [["Professor(a)", 12], ["Coordenação pedagógica", 111]].forEach(([n, xx]) => { pdfD.line(xx, y, xx + 87, y); pdfD.text(n, xx + 43.5, y + 5, { align:"center" }); });
    pdfD.setFontSize(9.5); pdfD.text("Responsável: _______________________________________   Data: ____/____/______", 12, y + 18);
  });
  const n = pdfD.getNumberOfPages(), quando = new Date().toLocaleDateString("pt-BR");
  for(let i = 1; i <= n; i++){ pdfD.setPage(i); pdfD.setFont("helvetica", "normal"); pdfD.setFontSize(7.5); pdfD.setTextColor(110, 130, 150);
    pdfD.text(pdfTx("Parecer aprovado pelo(a) professor(a) · gerado em " + quando + " · Portal do Educador"), 12, H - 7.5); pdfD.text("Página " + i + " de " + n, W - 12, H - 7.5, { align:"right" }); }
  pdfD.save(("Pareceres " + (t.nome || "turma") + " " + E.dados.periodo.rotulo).replace(/[^\w\- ºª]+/g, "").trim() + ".pdf");
}

/* ---------- eventos ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action;
  if(a === "ir") ir(el.dataset.arg);
  else if(a === "obs"){ const x = E.al[+el.dataset.i], k = el.dataset.k; x.obs = x.obs.includes(k) ? x.obs.filter(v => v !== k) : x.obs.concat(k).slice(0, 8); el.setAttribute("aria-pressed", x.obs.includes(k) ? "true" : "false"); }
  else if(a === "marcar-todos"){ E.al.forEach(x => { x.marcado = el.dataset.arg === "1" ? true : el.dataset.arg === "sem" ? !x.texto : false; }); telaDados(); }
  else if(a === "gerar") gerar();
  else if(a === "parar"){ E.parar = true; $("progTxt").textContent = "Parando depois deste aluno..."; }
  else if(a === "abrir-al"){ E.sel = +el.dataset.i; telaRevisao(); }
  else if(a === "aprovar") salvar(true);
  else if(a === "salvar-rasc") salvar(false);
  else if(a === "regerar") regerar();
  else if(a === "proximo"){ const n = E.al.length; for(let k = 1; k <= n; k++){ const i = (E.sel + k) % n; if(E.al[i].texto){ E.sel = i; break; } } telaRevisao(); }
  else if(a === "pdf") pdf();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id === "selTurma" || t.id === "selPer") abrir();
  else if(t.dataset && t.dataset.marca !== undefined){ E.al[+t.dataset.marca].marcado = t.checked; const n = E.al.filter(x => x.marcado).length, b = $("btGerar"); if(b){ b.disabled = !n; b.textContent = "Gerar " + n + (n === 1 ? " parecer" : " pareceres") + " (" + n + (n === 1 ? " crédito)" : " créditos)"); } }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset && t.dataset.livre !== undefined) E.al[+t.dataset.livre].livre = t.value;
  else if(t.id === "txtPar" && E.al[E.sel]) E.al[E.sel].sujo = true;
});
window.addEventListener("beforeunload", ev => { if(E.gerando || E.al.some(a => a.sujo)){ ev.preventDefault(); ev.returnValue = ""; } });

onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/?volta=" + encodeURIComponent(location.pathname)); return; }
  let u = null; try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo" || !["professor", "gestor", "admin"].includes(u.perfil)){ location.replace("/entrar/"); return; }
  E.u = u; E.uid = user.uid;
  $("quem").textContent = (u.nome || user.email) + (u.perfil === "gestor" ? " · gestão da escola" : u.perfil === "admin" ? " · administrador" : "");
  carregarTurmas();
});
</script>
