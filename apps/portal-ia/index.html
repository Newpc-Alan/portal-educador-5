<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal IA · Portal do Educador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#071621; --navy:#0F2C4A; --azul:#2671AB; --lima:#8DC63F; --verde:#1A6B2A; --verde-cl:#EAF5EC;
  --bg:#F2F5F8; --ink:#0F2C4A; --texto:#24384F; --muted:#4A5D72; --line:#DCE4EC; --line2:#CBD6E2; --red:#B3261E; --amar:#FFF6DB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a{color:var(--azul)}
.app{max-width:1100px;margin:0 auto;padding:0 16px 70px}
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 20px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;
  background:radial-gradient(600px 200px at 0% 0%,rgba(141,198,63,.28),transparent 60%),linear-gradient(135deg,#071621,#123556);
  box-shadow:0 14px 30px -20px rgba(7,22,33,.8);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:200px;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem}
.marca span{display:block;font-size:.78rem;color:rgba(255,255,255,.72)}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 14px;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}
.caixa{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.olho{font-size:.76rem;font-weight:800;color:var(--verde);letter-spacing:.07em;text-transform:uppercase}
h1{font-size:clamp(1.55rem,3.2vw,2.05rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:1.1rem;font-weight:800}
.sub{color:var(--muted);font-size:.94rem}
.pilha{display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:.9rem;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--azul)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.pri:hover{background:#145522}
.btn.nav{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.peq{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
/* contexto */
.ctx{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.ctx label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:1;min-width:160px}
.ctx select,.ctx input{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font-size:.92rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff;min-height:42px}
/* caixa principal */
.pede{margin-top:18px;border:2px solid var(--line2);border-radius:18px;background:#fff;transition:border-color .15s}
.pede:focus-within{border-color:var(--verde);box-shadow:0 0 0 4px rgba(26,107,42,.1)}
.pede textarea{width:100%;border:0;outline:0;resize:vertical;min-height:96px;padding:16px 18px 6px;font-size:1.02rem;background:transparent;border-radius:18px}
.pede .pe{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 14px;flex-wrap:wrap}
.pede .pe .esp{flex:1}
.fixo{display:inline-flex;align-items:center;gap:6px;background:var(--verde-cl);color:var(--verde);border-radius:99px;padding:5px 6px 5px 12px;font-weight:800;font-size:.82rem}
.fixo button{border:0;background:#fff;border-radius:99px;width:24px;height:24px;font-weight:800;color:var(--verde)}
.exs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex{border:1px dashed var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-size:.84rem;color:var(--texto)}
.ex:hover{border-color:var(--verde);color:var(--verde)}
.cota{font-size:.8rem;color:var(--muted);font-weight:600}
/* atalhos */
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.at{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:.15s}
.at:hover{transform:translateY(-2px);box-shadow:0 14px 26px -18px rgba(15,44,74,.6);border-color:var(--line2)}
.at .foto{height:96px;background:#dfe8ef center/cover no-repeat}
.at .tx{padding:10px 12px 12px}
.at b{display:block;font-size:.95rem}
.at small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
/* recentes */
.rec{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.rc:hover{border-color:var(--azul)}
.rc .tg{font-size:.7rem;font-weight:800;color:var(--verde);background:var(--verde-cl);border-radius:6px;padding:3px 7px;white-space:nowrap}
.rc b{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc small{color:var(--muted);font-size:.78rem;white-space:nowrap}
/* conversa */
.fala{display:flex;gap:12px;align-items:flex-start}
.fala .av{width:38px;height:38px;border-radius:12px;background:var(--navy);color:var(--lima);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex:none}
.fala .bl{flex:1;background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px}
.fala.eu{flex-direction:row-reverse}
.fala.eu .av{background:var(--verde-cl);color:var(--verde)}
.fala.eu .bl{background:#F6FAF6;border-radius:16px 4px 16px 16px}
.perg{margin-top:12px}
.perg b{display:block;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:.86rem}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
.perg textarea,.perg input{width:100%;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.perg textarea{min-height:110px;resize:vertical}
.aviso{background:var(--amar);border:1px solid #f0dca0;border-radius:12px;padding:10px 12px;font-size:.84rem;color:#5b4a14;margin-top:10px}
.carreg{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;padding:18px 0}
.giro{width:22px;height:22px;border-radius:50%;border:3px solid #cfe0ee;border-top-color:var(--verde);animation:g .8s linear infinite;flex:none}
@keyframes g{to{transform:rotate(360deg)}}
.passos{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.passos span.ok{color:var(--verde);font-weight:700}
/* documento */
.docgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.folha{background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px 38px;box-shadow:0 18px 40px -30px rgba(15,44,74,.5);color:#1d2b3a}
.folha .cab{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--verde);padding-bottom:12px;margin-bottom:18px}
.folha .cab img{width:46px;height:46px;object-fit:contain}
.folha .cab b{display:block;font-size:1rem;color:var(--navy)}
.folha .cab small{color:var(--muted);font-size:.8rem}
.folha h1{font-size:1.45rem;color:var(--navy)}
.folha .st{color:var(--muted);font-size:.9rem;margin-top:2px}
.folha .alunol{display:flex;gap:12px;margin-top:14px;font-size:.9rem}
.folha .alunol span{flex:1;border-bottom:1px solid #8aa0b5;padding-bottom:2px}
.folha .alunol span:last-child{flex:0 0 150px}
.folha section{margin-top:20px}
.folha h3{font-size:1.02rem;color:var(--navy);margin-bottom:6px}
.folha p{white-space:pre-wrap;margin-bottom:6px}
.folha ul{padding-left:20px}
.folha li{margin-bottom:3px}
.folha table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:6px}
.folha th,.folha td{border:1px solid #c9d5e1;padding:6px 8px;text-align:left;vertical-align:top}
.folha th{background:#eef3f8}
.q{margin-top:14px}
.q .en{display:flex;gap:6px;font-weight:600}
.q .en .n{flex:none;font-weight:800}
.q .en [data-k]{white-space:pre-wrap}
.q .val{color:var(--muted);font-weight:600;font-size:.82rem;white-space:nowrap}
.q ol{list-style:none;padding-left:22px;margin-top:6px}
.q ol li{display:flex;gap:8px;align-items:flex-start}
.q .cx{display:inline-block;width:14px;height:14px;border:1.5px solid #6a8196;border-radius:3px;margin-top:4px;flex:none}
.q .cx.vf{width:26px}
.q .rel{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding-left:22px;margin-top:6px}
.q .lin{height:26px;border-bottom:1px solid #b6c4d2;margin-left:22px}
.gab{margin-top:26px;border-top:2px dashed var(--line2);padding-top:16px}
.gab .gi{margin-top:6px;font-size:.92rem}
.gab .gi i{color:var(--muted)}
.ilus{margin-top:16px;text-align:center;position:relative}
.q.cimg{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:start}
.qimg{position:relative}
.qimg img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.tira{position:absolute;top:6px;right:6px;border:0;background:rgba(15,44,74,.85);color:#fff;border-radius:8px;font-size:.74rem;font-weight:700;padding:4px 8px}
.maisimg{border:1px dashed var(--line2);background:#fff;color:var(--azul);border-radius:8px;font-size:.76rem;font-weight:700;padding:3px 9px;margin:6px 0 0 22px}
.maisimg:hover{border-color:var(--azul)}
.ilus img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line)}
/* editor em tela cheia */
.editor{position:fixed;inset:0;z-index:100;background:#E4EAF0;display:flex;flex-direction:column}
.ed-barra{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 20px -14px rgba(0,0,0,.6)}
.ed-barra .tit{font-weight:800;font-size:.95rem;margin-right:6px}
.ed-ferr{display:flex;gap:2px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:12px;padding:5px 6px}
.ed-ferr .sep{width:1px;height:22px;background:var(--line2);margin:0 2px}
.fb{border:0;background:transparent;color:var(--ink);min-width:30px;height:32px;border-radius:8px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.fb:hover{background:#EEF3F8}
.fb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fb .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18);display:block}
.ed-barra .esp{flex:1}
.ed-barra .sair{background:transparent;border:0;color:rgba(255,255,255,.75);font-weight:700;font-size:.82rem;text-decoration:underline;padding:6px}
.ed-area{flex:1;overflow:auto;padding:56px 16px 60px;position:relative}
/* imagem dentro do texto: esquerda ou direita com o texto em volta, ou centralizada sozinha */
.fig{margin:4px 0 10px;position:relative;max-width:100%}
.fig img{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.fig-esq{float:left;margin:4px 16px 8px 0}
.fig-dir{float:right;margin:4px 0 8px 16px}
.fig-cen{display:block;margin:12px auto;clear:both}
.folha section,.folha .q,.folha .qc{display:flow-root}
.ed-folha .fig{cursor:grab}
.ed-folha .fig.sel{outline:3px solid var(--verde);outline-offset:3px}
.alca{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:50%;background:var(--verde);border:2px solid #fff;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none}
.fig-dir .alca{right:auto;left:-8px;cursor:nesw-resize}
.figbar{position:absolute;left:50%;transform:translateX(-50%);top:-48px;background:var(--navy);border-radius:10px;padding:4px;display:flex;gap:2px;z-index:5;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.figbar button{border:0;background:transparent;color:#fff;font-weight:700;font-size:.78rem;border-radius:7px;padding:6px 9px;cursor:pointer}
.figbar button:hover,.figbar button.on{background:rgba(255,255,255,.18)}
.figbar .sep{width:1px;background:rgba(255,255,255,.25);margin:4px 2px}
#figMarca{position:absolute;height:4px;background:var(--verde);border-radius:2px;pointer-events:none;z-index:6;box-shadow:0 0 0 2px rgba(26,107,42,.2)}
.ed-folha{max-width:820px;margin:0 auto;outline:none;min-height:70vh}
.ed-folha:focus{box-shadow:0 0 0 3px rgba(26,107,42,.25),0 18px 40px -30px rgba(15,44,74,.5)}
.ed-dica{font-size:.78rem;color:rgba(255,255,255,.75)}
.sem-botoes .nao-imp{display:none !important}
.lado{display:flex;flex-direction:column;gap:12px;position:sticky;top:88px}
.lado .caixa{padding:16px;border-radius:16px}
.lado h4{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lado .btn{width:100%}
.lado .grupo{display:flex;flex-direction:column;gap:8px}
.lado textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-height:64px;font-size:.88rem;resize:vertical}
.lado select{width:100%;margin-top:8px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-height:40px}
.wpp{white-space:pre-wrap;background:#E7F8EE;border-radius:10px;padding:10px;font-size:.88rem}
.nota{background:var(--verde-cl);border-radius:12px;padding:10px 12px;font-size:.86rem;color:#1d4d27}
.abas{display:flex;gap:6px;margin-bottom:12px;border-bottom:2px solid var(--line)}
.aba{border:0;background:transparent;padding:10px 14px;font-weight:800;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.aba.on{color:var(--ink);border-bottom-color:var(--verde)}
.aba small{font-weight:700;color:var(--verde);margin-left:4px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filtros input,.filtros select{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-height:40px;background:#fff;flex:1;min-width:150px}
.rc .quem{display:block;font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .meio{flex:1;min-width:0}
.rc .meio b{display:block}
.selo{display:inline-block;background:#E8F1FB;color:var(--azul);border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:800}
.modal{position:fixed;inset:0;z-index:110;background:rgba(7,22,33,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .cx-m{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.modal h2{margin-bottom:6px}
.modal label.ck{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.92rem;cursor:pointer}
.modal label.ck input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--verde)}
.modal textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px;min-height:90px;margin-top:10px}
.modal .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}
@media (max-width:920px){ .docgrid{grid-template-columns:1fr} .lado{position:static} }
@media (max-width:560px){ .q.cimg{grid-template-columns:1fr} .qimg{max-width:220px} .caixa{padding:18px} .folha{padding:20px 16px} .pede .pe .btn.pri{width:100%} .q .rel{grid-template-columns:1fr} }
@media print{
  @page{size:A4;margin:12mm}
  .topo,.lado,.toast,.nao-imp,.editor{display:none !important}
  body,html{background:#fff} .app{max-width:none;padding:0}
  .folha{border:0;box-shadow:none;padding:0;border-radius:0} .docgrid{display:block}
  .q,.ilus,tr,.gi,li{break-inside:avoid} h3{break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.imp-aluno .gab{display:none !important}
  body.imp-gab #folha > :not(.cab):not(h1):not(.st):not(.gab):not(.bncc){display:none !important}
  #folha::after{content:"portaldoeducador.com.br · Feito com o Portal IA e revisado pelo professor";display:block;margin-top:18px;font-size:8pt;color:#6e8296;border-top:1px solid #d2dce6;padding-top:6px}
}
</style>

<body>
<div class="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Portal do Educador</small><b>Portal IA</b><span id="quem">Carregando...</span></div></div>
    <a class="tb" href="#inicio" data-action="inicio" id="btnInicio" hidden>Novo pedido</a>
    <a class="tb lima" href="/entrar/">Voltar ao Portal</a>
  </header>
  <div class="carreg" id="carregando" style="justify-content:center;padding:70px 0"><span class="giro"></span>Carregando...</div>
  <main id="tela" hidden></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, updateDoc, deleteDoc, collection, query, where, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const auth = getAuth(app), db = getFirestore(app);
const chamar = httpsCallable(getFunctions(app, "southamerica-east1"), "portalIa", { timeout:250000 });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 4800); }
const msgErro = e => (e && e.message && !/^internal$/i.test(e.message) ? e.message : "Não deu certo agora. Tente de novo em instantes.");
let ST = null;
async function storage(){ if(!ST){ const m = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"); ST = { m, st:m.getStorage(app) }; } return ST; }

/* ===================== o que o professor mais procura ===================== */

/* ===================== dados do professor ===================== */
const turmaAtual = () => E.turmas.find(t => t.id === E.turma) || null;
const discDaGrade = t => t && Array.isArray(t.grade) ? [...new Set(t.grade.filter(g => g.professor_uid === E.user.uid && g.disciplina).map(g => g.disciplina))] : [];
function serieDe(t){ if(!t) return ""; if(t.serie) return String(t.serie); const m = String(t.nome || "").match(/(\d+)\s*[ºª°o]?\s*(ano|série|serie)/i); return m ? m[1] + "º ano" : ""; }
async function carregarTurmas(){
  const ids = (E.u.escolas_ids && E.u.escolas_ids.length ? E.u.escolas_ids : [E.u.escola_id]).filter(Boolean).slice(0, 10);
  try{ if(ids.length){ const s = await getDocs(query(collection(db, "turmas"), where("escola_id", "in", ids))); s.forEach(d => { const t = d.data(); if(t.status !== "inativa") E.turmas.push({ id:d.id, ...t }); }); } }catch(e){ console.warn("turmas:", e.code); }
  const minhas = new Set((E.u.turmas_ids || []).map(String));
  const ehMinha = t => minhas.has(t.id) || t.criado_por === E.user.uid || discDaGrade(t).length > 0;
  E.turmas = E.turmas.filter(t => ehMinha(t) || E.turmas.length <= 12);
  E.turmas.sort((a, b) => (ehMinha(b) - ehMinha(a)) || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR", { numeric:true }));
  let ult = ""; try{ ult = localStorage.getItem("pde_pia_turma_" + E.user.uid) || ""; }catch(e){}
  E.turma = E.turmas.some(t => t.id === ult) ? ult : (E.turmas[0] ? E.turmas[0].id : "");
  definirTurma(E.turma);
  E.ident.prof = String(E.u.nome || E.user.displayName || "").slice(0, 80);
  const escId = E.u.escola_id || ids[0] || "";
  try{ if(escId){ const s = await getDoc(doc(db, "escolas", escId)); if(s.exists()) E.ident.escola = s.data().nome || ""; } }catch(e){}
  try{ const mid = E.u.municipio_id || ""; if(mid){ const s = await getDoc(doc(db, "municipios", mid)); if(s.exists()){ const m = s.data(); E.marca = { municipio:m.nome || "", uf:m.uf || "", logo_url:m.logo_url || "" }; } } }catch(e){}
}
function definirTurma(id){
  E.turma = id; const t = turmaAtual();
  const ds = discDaGrade(t); E.disc = ds.includes(E.disc) ? E.disc : (ds[0] || E.disc || "");
  E.serie = serieDe(t) || E.serie;
}
async function carregarRecentes(){
  E.recentes = [];
  try{
    const s = await getDocs(query(collection(db, "portal_ia_docs"), where("uid", "==", E.user.uid), limit(120)));
    s.forEach(d => E.recentes.push({ id:d.id, ...d.data() }));
    const ms = x => x && (x.toMillis ? x.toMillis() : x.__ms || (x.seconds ? x.seconds * 1000 : 0)) || 0;
    E.recentes.sort((a, b) => (!!b.favorito - !!a.favorito) || (ms(b.atualizado_em) - ms(a.atualizado_em)));
  }catch(e){ console.warn("recentes:", e.code); }
}
async function carregarCota(){ try{ const r = await chamar({ acao:"cota" }); E.cota = r.data; }catch(e){ E.cota = null; console.warn("cota:", e.code, e.message); E.bloqueio = msgErro(e); } }
const contexto = () => ({ disciplina:E.disc, serie:E.serie, turma:(turmaAtual() || {}).nome || "" });
function textoCota(){
  const c = E.cota; if(!c) return "";
  if(c.textos == null) return "Uso livre (administrador)";
  return "Restam " + c.textos + " materiais" + (c.imagens > 0 ? " e " + c.imagens + " imagens" : "") + " neste mês";
}

  if(!E.turmas.length) return '<option value="">Sem turma vinculada</option>';
  return E.turmas.map(t => '<option value="' + esc(t.id) + '"' + (t.id === E.turma ? " selected" : "") + ">" + esc(t.nome || "Turma") + "</option>").join("");
}
function opDisc(){
  const ds = [...new Set([...discDaGrade(turmaAtual()), ...(E.disc ? [E.disc] : []), ...DISCIPLINAS])];
  return ds.map(d => '<option' + (d === E.disc ? " selected" : "") + ">" + esc(d) + "</option>").join("");
}

  '<button type="button" role="tab" class="aba' + (E.aba === "rede" ? " on" : "") + '" data-action="aba" data-arg="rede">Da sua rede' + (E.rede ? "<small>" + E.rede.length + "</small>" : "") + "</button></div>" +
  (E.aba === "rede" ? '<div id="redeLista">' + htmlRede() + "</div>" : E.recentes.length ? '<div class="rec">' + E.recentes.slice(0, 30).map(r => '<button type="button" class="rc" data-action="abrir" data-arg="' + esc(r.id) + '"><span class="tg">' + esc(r.tipo_nome || NOME_T[r.tipo] || "Material") + "</span><b>" + (r.favorito ? "★ " : "") + esc(r.titulo || r.tema || "Sem título") + "</b><small>" + esc(dataCurta(r.atualizado_em)) + "</small></button>").join("") + "</div>"

/* ---------- materiais compartilhados pela rede do município ---------- */
async function carregarRede(){
  E.rede = []; const mun = E.u.municipio_id || "";
  if(!mun){ return; }
  try{
    const s = await getDocs(query(collection(db, "portal_ia_rede"), where("municipio_id", "==", mun), where("status", "==", "publicado"), limit(300)));
    s.forEach(d => E.rede.push({ id:d.id, ...d.data() }));
    const ms = x => x && (x.toMillis ? x.toMillis() : x.__ms || (x.seconds ? x.seconds * 1000 : 0)) || 0;
    E.rede.sort((a, b) => ms(b.atualizado_em) - ms(a.atualizado_em));
  }catch(e){ console.warn("rede:", e.code); E.redeErro = true; }
}
const semAcento = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function htmlRede(){
  if(!E.u.municipio_id) return '<div class="caixa" style="text-align:center;color:var(--muted)">Sua conta não está ligada a uma rede municipal.</div>';
  if(!E.rede) return '<div class="carreg"><span class="giro"></span>Carregando os materiais da rede...</div>';
  if(E.redeErro) return '<div class="caixa" style="text-align:center;color:var(--muted)">Não consegui abrir os materiais da rede agora.</div>';
  const F = E.redeF, discs = [...new Set(E.rede.map(r => r.disciplina).filter(Boolean))].sort(), tipos = [...new Set(E.rede.map(r => r.tipo))];
  const q = semAcento(F.q);
  const l = E.rede.filter(r => (!F.disc || r.disciplina === F.disc) && (!F.tipo || r.tipo === F.tipo) &&
    (!q || semAcento([r.titulo, r.tema, r.disciplina, r.serie, r.autor_nome, r.escola_nome, (r.bncc || []).join(" ")].join(" ")).includes(q)));
  return '<div class="filtros"><input id="redeQ" type="search" placeholder="Buscar por tema, série, BNCC, professor..." value="' + esc(F.q) + '" aria-label="Buscar na rede">' +
    '<select id="redeDisc" aria-label="Disciplina"><option value="">Todas as disciplinas</option>' + discs.map(x => "<option" + (x === F.disc ? " selected" : "") + ">" + esc(x) + "</option>").join("") + "</select>" +
    '<select id="redeTipo" aria-label="Tipo"><option value="">Todos os tipos</option>' + tipos.map(x => '<option value="' + esc(x) + '"' + (x === F.tipo ? " selected" : "") + ">" + esc(NOME_T[x] || x) + "</option>").join("") + "</select></div>" +
    (E.rede.length ? (l.length ? '<div class="rec">' + l.slice(0, 80).map(r => '<button type="button" class="rc" data-action="abrir-rede" data-arg="' + esc(r.id) + '"><span class="tg">' + esc(r.tipo_nome || NOME_T[r.tipo] || "Material") + '</span><span class="meio"><b>' + esc(r.titulo || r.tema || "Sem título") + '</b><span class="quem">' +
      esc([r.disciplina, r.serie].filter(Boolean).join(" · ")) + " · " + esc(r.autor_nome || "Professor(a)") + (r.escola_nome ? ", " + esc(r.escola_nome) : "") + "</span></span>" + (r.usos ? '<span class="selo">usado ' + r.usos + "x</span>" : "") + "</button>").join("") + "</div>"
      : '<div class="caixa" style="text-align:center;color:var(--muted)">Nada encontrado com esses filtros.</div>')
    : '<div class="caixa" style="text-align:center;color:var(--muted)"><b style="color:var(--ink)">Ainda não há materiais da rede</b><br>Abra um material seu e toque em Compartilhar com a rede. Os colegas do município vão poder usar.</div>');
}
function abrirRede(id){
  const r = (E.rede || []).find(x => x.id === id); if(!r){ toast("Este material não está mais na rede.", true); return; }
  E.atual = { id:r.id, vistaRede:true, rede:r, tipo:r.tipo, tipo_nome:r.tipo_nome, publico:r.publico || "aluno", doc:r.doc, contexto:{ disciplina:r.disciplina || "", serie:r.serie || "" }, html:typeof r.html === "string" ? r.html : "" };
  E.imgs = {}; ir("doc"); carregarImagens(r.imagens || {}, "", id);
}
async function carregarImagens(mapa, legado, id){
  const caminhos = {}; Object.entries(mapa || {}).forEach(([k, v]) => { if(v && v.caminho) caminhos[k] = v.caminho; });
  if(legado && !caminhos.topo) caminhos.topo = legado;
  for(const [k, cam] of Object.entries(caminhos)){
    try{ const S = await storage(); const b = await S.m.getBlob(S.m.ref(S.st, cam)); const url = await new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); });
      if(E.vista === "doc" && E.atual.id === id){ E.imgs[k] = url; telaDoc(); } }catch(e){ console.warn("imagem:", e.code || e); }
  }
}
function ladoRede(A){
  const r = A.rede;
  return '<div class="caixa"><h4>Da sua rede</h4><p style="font-size:.9rem;margin-bottom:10px">Compartilhado por <b>' + esc(r.autor_nome || "um(a) colega") + "</b>" + (r.escola_nome ? ", " + esc(r.escola_nome) : "") + "." +
    (r.usos ? " Já foi usado " + r.usos + (r.usos === 1 ? " vez." : " vezes.") : "") + '</p><div class="grupo">' +
    '<button type="button" class="btn pri" data-action="usar-rede">Usar este material</button>' +
    '<p class="sub" style="font-size:.8rem">Cria uma cópia sua, com o cabeçalho da sua escola, para editar, ajustar com a IA e imprimir. Não gasta a sua cota.</p>' +
    '<button type="button" class="btn peq" data-action="denunciar">Avisar sobre um erro</button></div></div>';
}
function boxRede(A){
  if(!TIPOS_REDE.includes(A.tipo)) return '<div class="caixa"><h4>Compartilhar</h4><p class="sub" style="font-size:.84rem">Parecer e recado aos pais não vão para a rede: eles têm dados de alunos e famílias.</p></div>';
  if(!E.u.municipio_id) return "";
  return '<div class="caixa"><h4>Compartilhar com a rede</h4>' + (A.redeInfo
    ? '<p style="font-size:.86rem;margin-bottom:8px"><span class="selo">Na rede do município</span> Os colegas já podem usar este material.</p><div class="grupo"><button type="button" class="btn peq" data-action="compartilhar">Atualizar na rede</button><button type="button" class="btn peq" data-action="descompartilhar">Parar de compartilhar</button></div>'
    : '<p class="sub" style="font-size:.84rem;margin-bottom:8px">Os professores do seu município poderão ver e usar uma cópia. Seu nome e sua escola aparecem como autoria.</p><button type="button" class="btn nav peq" style="width:100%" data-action="compartilhar">Compartilhar com a rede</button>') + "</div>";
}
const TIPOS_REDE = ["plano", "sequencia", "atividade", "prova", "explicar", "inclusao"];
function modal(html){ fecharModal(); const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = '<div class="cx-m" role="dialog" aria-modal="true">' + html + "</div>"; document.body.appendChild(m); const f = m.querySelector("input,textarea,button"); if(f) f.focus(); }
function fecharModal(){ const m = $("modal"); if(m) m.remove(); }
function pedirCompartilhar(){
  modal('<h2>Compartilhar com a rede</h2><p class="sub">Os professores do seu município vão ver este material e poderão fazer uma cópia para usar. Seu nome e sua escola aparecem como autoria. Você pode tirar da rede quando quiser.</p>' +
    '<label class="ck"><input type="checkbox" id="ck1"> <span>Este material <b>não tem nome de aluno</b>, nem dado pessoal de aluno ou família.</span></label>' +
    '<label class="ck"><input type="checkbox" id="ck2"> <span>O conteúdo foi feito por mim com o Portal IA ou é de uso livre. <b>Não copiei texto de livro</b> ou de material protegido.</span></label>' +
    '<label class="ck"><input type="checkbox" id="ck3"> <span>Revisei o material e ele está pronto para outros professores usarem.</span></label>' +
    '<div class="acoes"><button type="button" class="btn" data-action="fechar-modal">Cancelar</button><button type="button" class="btn pri" data-action="confirmar-compartilhar">Compartilhar</button></div>');
}
async function compartilhar(){
  if(!["ck1", "ck2", "ck3"].every(k => $(k) && $(k).checked)){ toast("Marque as três confirmações para compartilhar.", true); return; }
  const b = document.querySelector('[data-action="confirmar-compartilhar"]'); b.disabled = true; b.textContent = "Compartilhando...";
  try{ await chamar({ acao:"compartilhar", id:E.atual.id, aceite:true }); E.atual.redeInfo = { em:Date.now() }; E.rede = null; fecharModal(); telaDoc(); toast("Pronto. O material está na rede do município."); }
  catch(e){ b.disabled = false; b.textContent = "Compartilhar"; toast(msgErro(e), true); }
}
async function descompartilhar(){
  if(!confirm("Tirar este material da rede? Quem já fez uma cópia continua com a cópia.")) return;
  try{ await chamar({ acao:"descompartilhar", id:E.atual.id }); E.atual.redeInfo = null; E.rede = null; telaDoc(); toast("O material saiu da rede."); }catch(e){ toast(msgErro(e), true); }
}
async function usarRede(){
  if(E.ocupado) return; E.ocupado = true;
  const b = document.querySelector('[data-action="usar-rede"]'); if(b){ b.disabled = true; b.textContent = "Fazendo a sua cópia..."; }
  try{ const r = (await chamar({ acao:"usar", id:E.atual.id })).data; E.ocupado = false; await carregarRecentes(); const x = E.rede && E.rede.find(z => z.id === E.atual.id); if(x) x.usos = (x.usos || 0) + 1;
    toast("Cópia criada em Seus materiais."); E.aba = "meus"; abrir(r.id); }
  catch(e){ E.ocupado = false; if(b){ b.disabled = false; b.textContent = "Usar este material"; } toast(msgErro(e), true); }
}
function pedirDenuncia(){
  modal('<h2>Avisar sobre um erro</h2><p class="sub">Conte o que está errado (conteúdo incorreto, gabarito errado, algo impróprio). Quando três colegas avisam, o material sai da rede até ser revisado.</p>' +
    '<textarea id="motivo" maxlength="500" placeholder="Ex.: a resposta da questão 3 no gabarito está errada"></textarea>' +
    '<div class="acoes"><button type="button" class="btn" data-action="fechar-modal">Cancelar</button><button type="button" class="btn pri" data-action="confirmar-denuncia">Enviar aviso</button></div>');
}
async function denunciar(){
  const motivo = String(($("motivo") || {}).value || "").trim(); if(motivo.length < 5){ toast("Conte em poucas palavras qual é o problema.", true); return; }
  try{ const r = (await chamar({ acao:"denunciar", id:E.atual.id, motivo })).data; fecharModal(); toast(r.oculto ? "Obrigado. O material saiu da rede para revisão." : "Obrigado. O aviso foi registrado.");
    if(r.oculto){ E.rede = (E.rede || []).filter(x => x.id !== E.atual.id); ir("inicio"); } }
  catch(e){ toast(msgErro(e), true); }

function dataCurta(x){ const ms = x && (x.toMillis ? x.toMillis() : x.__ms || (x.seconds ? x.seconds * 1000 : 0)); return ms ? new Date(ms).toLocaleDateString("pt-BR", { day:"2-digit", month:"short" }) : ""; }

function animarPassos(){
  const P = ["Lendo o pedido e o contexto da turma", "Escrevendo o conteúdo", "Conferindo questões e gabarito", "Montando o documento"];

  pinta(); clearInterval(E._passos); E._passos = setInterval(() => { if(!$("passos")){ clearInterval(E._passos); return; } if(i < P.length - 1){ i++; pinta(); } }, 5500);
}
async function enviar(){
  if(E.ocupado) return;
  const texto = String(($("pedido") || {}).value || "").trim();
  E.texto = texto;
  if(texto.length < 3 && !E.tipo){ toast("Escreva o que você precisa ou escolha um atalho.", true); return; }
  E.conversa = { texto, tipo:E.tipo, etapa:"entendendo", perguntas:[], respostas:{}, nome:"", tema:"", resumo:"" };
  E.ocupado = true; ir("conversa");
  try{
    const r = (await chamar({ acao:"entender", texto, tipo:E.tipo || undefined, contexto:contexto() })).data;
    Object.assign(E.conversa, { tipo:r.tipo, nome:r.nome, tema:r.tema, resumo:r.resumo || texto, perguntas:r.perguntas || [], mensagem:r.mensagem });
    if(r.tipo === "fora"){ E.conversa.etapa = "fora"; E.ocupado = false; desenhar(); return; }
    E.ocupado = false;
    if(!E.conversa.perguntas.length) return gerar();
    E.conversa.etapa = "perguntas"; desenhar();
  }catch(e){ E.ocupado = false; E.conversa.etapa = "erro"; E.conversa.erro = msgErro(e); E.conversa.tipo = E.conversa.tipo || E.tipo || ""; if(!E.conversa.tipo){ E.conversa.etapa = "fora"; E.conversa.mensagem = msgErro(e); } desenhar(); }
}
function lerRespostas(){ document.querySelectorAll("[data-resp]").forEach(el => { const v = el.value.trim(); if(v) E.conversa.respostas[el.dataset.resp] = v; }); }
async function gerar(){

    ir("doc");

// o que pode ficar no HTML editado: só formatação de texto, sem script, sem link, sem imagem de fora
const TAGS_OK = new Set(["P","DIV","SPAN","B","STRONG","I","EM","U","S","MARK","FONT","BR","UL","OL","LI","H1","H2","H3","H4","SECTION","TABLE","THEAD","TBODY","TR","TH","TD","SMALL","SUB","SUP","IMG","BLOCKQUOTE","HR","FIGURE"]);
const CLASSES_OK = new Set(["cab","st","alunol","q","qc","en","n","val","cx","vf","rel","lin","gab","gi","ilus","qimg","cimg","bncc","fig","fig-esq","fig-cen","fig-dir"]);
const ESTILO_OK = /^(color|background-color|font-size|font-weight|font-style|text-decoration(-line)?|text-align|display|vertical-align|margin-right|width)$/;
function limparHtml(html){
  const t = document.createElement("template"); t.innerHTML = String(html || "");
  const passa = no => {
    [...no.childNodes].forEach(f => {
      if(f.nodeType === 3) return;
      if(f.nodeType !== 1){ f.remove(); return; }
      if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|BUTTON|INPUT|TEXTAREA|SELECT|LINK|META|svg|SVG|FORM)$/i.test(f.tagName)){ f.remove(); return; }
      passa(f);
      if(!TAGS_OK.has(f.tagName)){ f.replaceWith(...f.childNodes); return; }
      [...f.attributes].forEach(a => {
        const n = a.name.toLowerCase();
        if(n === "class"){ const c = a.value.split(/\s+/).filter(x => CLASSES_OK.has(x)); c.length ? f.setAttribute("class", c.join(" ")) : f.removeAttribute("class"); }
        else if(n === "style"){ const ok = a.value.split(";").map(x => x.trim()).filter(x => { const [k, v] = x.split(":").map(y => (y || "").trim()); return k && v && ESTILO_OK.test(k.toLowerCase()) && !/url\(|expression|javascript/i.test(v) && (k.toLowerCase() !== "width" || /^\d{1,3}(\.\d+)?%$/.test(v)); }); ok.length ? f.setAttribute("style", ok.join(";")) : f.removeAttribute("style"); }
        else if(n === "data-q" && /^\d{1,2}$/.test(a.value)){}
        else if(n === "data-onde" && /^(logo|topo|q\d{1,2})$/.test(a.value)){}
        else if(f.tagName === "FONT" && (n === "color" || n === "size") && /^[#\w]{1,10}$/.test(a.value)){}
        else if((n === "colspan" || n === "rowspan") && /^\d{1,2}$/.test(a.value)){}
        else f.removeAttribute(a.name);
      });
      if(f.tagName === "IMG" && !f.hasAttribute("data-onde")) f.remove();
    });
  };
  passa(t.content);
  return t.innerHTML;
}

/* imagens no editor: arrastar para outro lugar, redimensionar pelo canto, esquerda, centro ou direita */
function novaFig(im, pos, w){ const fg = document.createElement("figure"); fg.className = "fig fig-" + pos; fg.style.width = w + "%"; fg.appendChild(im); return fg; }
function paraFiguras(f){
  // o modelo antigo (imagem no topo e coluna ao lado da questão) vira figura solta no texto
  f.querySelectorAll(".ilus").forEach(box => { const im = box.querySelector("img[data-onde]"); if(im) box.replaceWith(novaFig(im, "cen", 60)); else box.remove(); });
  f.querySelectorAll(".q.cimg").forEach(q => { const box = q.querySelector(".qimg"), im = box && box.querySelector("img[data-onde]"); if(box) box.remove(); q.classList.remove("cimg");
    if(im){ const qc = q.querySelector(".qc") || q; qc.insertBefore(novaFig(im, "dir", 32), qc.firstChild); } });
  f.querySelectorAll("figure.fig").forEach(fg => { fg.setAttribute("contenteditable", "false"); fg.setAttribute("draggable", "true"); });
}
let FIG = null;
const posDe = fg => fg.classList.contains("fig-esq") ? "esq" : fg.classList.contains("fig-dir") ? "dir" : "cen";
function selFig(fg){
  document.querySelectorAll("#edFolha .fig.sel").forEach(x => x.classList.remove("sel"));
  document.querySelectorAll("#edFolha .figbar,#edFolha .alca").forEach(x => x.remove());
  FIG = fg || null; if(!FIG) return;
  FIG.classList.add("sel");
  const p = posDe(FIG), bt = (a, t, on) => '<button type="button" data-fig="' + a + '"' + (on ? ' class="on"' : "") + ">" + t + "</button>";
  const bar = document.createElement("div"); bar.className = "figbar";
  bar.innerHTML = bt("esq", "◧ Esquerda", p === "esq") + bt("cen", "▣ Centro", p === "cen") + bt("dir", "◨ Direita", p === "dir") + '<span class="sep"></span>' +
    bt("menor", "− Menor") + bt("maior", "+ Maior") + '<span class="sep"></span>' + bt("subir", "↑ Subir") + bt("descer", "↓ Descer");
  const al = document.createElement("span"); al.className = "alca"; al.title = "Arraste para mudar o tamanho";
  FIG.appendChild(bar); FIG.appendChild(al);
}
function mexeu(){ E.edMudou = true; const a = $("edAviso"); if(a) a.textContent = "Não salvo"; }
// blocos onde a imagem pode entrar antes ou depois
const BLOCOS = ".en, ol, ul, p, h1, h3, table, .rel, .lin, .alunol, .st, .gi, .fig, .cab, .q, section > div";
function vizinho(fg, dir){ let x = dir < 0 ? fg.previousElementSibling : fg.nextElementSibling;
  while(x && (x.classList.contains("figbar") || x.classList.contains("alca"))) x = dir < 0 ? x.previousElementSibling : x.nextElementSibling; return x; }
function acaoFig(a){
  if(!FIG) return;
  if(["esq", "cen", "dir"].includes(a)){ FIG.classList.remove("fig-esq", "fig-cen", "fig-dir"); FIG.classList.add("fig-" + a); }
  if(a === "menor" || a === "maior"){ const w = parseFloat(FIG.style.width) || 40; FIG.style.width = Math.max(12, Math.min(100, w + (a === "maior" ? 8 : -8))) + "%"; }
  if(a === "subir" || a === "descer"){
    const viz = vizinho(FIG, a === "subir" ? -1 : 1);
    if(viz){ a === "subir" ? viz.before(FIG) : viz.after(FIG); }
    else { // saiu do bloco: vai para antes ou depois do bloco pai (questão, seção)
      const pai = FIG.parentElement.closest(".qc, .q, section, .gab") ; const alvo = pai && pai.closest(".q") ? pai.closest(".q") : pai;
      if(alvo && alvo.id !== "edFolha"){ a === "subir" ? alvo.before(FIG) : alvo.after(FIG); }
    }
    FIG.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }

}
function alvoSoltar(x, y){
  const f = $("edFolha"); let el = document.elementFromPoint(x, y);
  if(!el || !f.contains(el) || el === f) return null;
  let b = el.closest(BLOCOS);
  if(!b || !f.contains(b)) return null;
  if(b.closest(".cab")) b = b.closest(".cab");
  if(FIG && (b === FIG || FIG.contains(b))) return null;
  const r = b.getBoundingClientRect(); return { ref:b, antes:y < r.top + r.height / 2, r };
}
function marcar(alvo){
  let m = $("figMarca"); const area = document.querySelector(".ed-area");
  if(!alvo){ if(m) m.remove(); return; }
  if(!m){ m = document.createElement("div"); m.id = "figMarca"; area.appendChild(m); }
  const ra = area.getBoundingClientRect();
  m.style.top = ((alvo.antes ? alvo.r.top - 3 : alvo.r.bottom + 1) - ra.top + area.scrollTop) + "px";
  m.style.left = (alvo.r.left - ra.left + area.scrollLeft) + "px"; m.style.width = alvo.r.width + "px";
}

document.addEventListener("dragend", () => marcar(null));
// alça do canto: arrastar muda a largura (em % do espaço, para sair igual no PDF)
document.addEventListener("pointerdown", ev => {
  const al = ev.target.closest && ev.target.closest("#edFolha .alca"); if(!al) return;
  ev.preventDefault(); const fg = al.closest(".fig"), p = posDe(fg), x0 = ev.clientX, w0 = fg.getBoundingClientRect().width, larg = fg.parentElement.getBoundingClientRect().width || 1;
  const mover = e => { const dx = e.clientX - x0, w = w0 + (p === "dir" ? -dx : p === "cen" ? 2 * dx : dx); fg.style.width = Math.max(12, Math.min(100, Math.round(w / larg * 100))) + "%"; };
  const soltar = () => { document.removeEventListener("pointermove", mover); document.removeEventListener("pointerup", soltar); mexeu(); };
  document.addEventListener("pointermove", mover); document.addEventListener("pointerup", soltar);
});
function fecharEditor(){ FIG = null; const ov = $("editor"); if(ov) ov.remove(); document.body.style.overflow = ""; E.editor = false; E.edMudou = false; }

function textoPlano(d, gab){
  const L = [d.titulo, d.subtitulo || ""]; let n = 0;
  (d.secoes || []).forEach(s => { L.push("", String(s.titulo || "").toUpperCase()); if(s.texto) L.push(s.texto); (s.itens || []).forEach(i => L.push("- " + i));
    if(s.tabela && (s.tabela.colunas || []).length){ L.push(s.tabela.colunas.join(" | ")); (s.tabela.linhas || []).forEach(l => L.push((l.celulas || []).join(" | "))); }
    (s.questoes || []).forEach(q => { n++; L.push("", n + ". " + q.enunciado + (q.valor ? " (" + q.valor + " pt)" : ""));
      if(q.tipo === "multipla") (q.alternativas || []).forEach((a, k) => L.push("   " + LETRAS[k] + ") " + a));
      if(q.tipo === "vf") (q.alternativas || []).forEach(a => L.push("   (   ) " + a));
      if(q.tipo === "relacionar"){ (q.coluna_a || []).forEach((a, k) => L.push("   " + (k + 1) + ". " + a)); (q.coluna_b || []).forEach(b => L.push("   (   ) " + b)); }
    }); });
  if(gab && (d.gabarito || []).length){ L.push("", "GABARITO"); d.gabarito.forEach(g => L.push(g.questao + ". " + g.resposta + (g.comentario ? " (" + g.comentario + ")" : ""))); }
  return L.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

const MAPA_PDF = { "π":"pi", "≤":"<=", "≥":">=", "≠":"diferente de", "√":"raiz de ", "−":"-", "–":"-", "—":", ", "…":"...", "“":'"', "”":'"', "‘":"'", "’":"'", "•":"-", "→":"->", "≈":"aprox. ", "★":"", "✓":"" };

function imgPng(url, max){
  return new Promise(ok => {
    if(!url){ ok(null); return; }
    const img = new Image(), tm = setTimeout(() => ok(null), 8000);
    if(!/^data:/.test(url)) img.crossOrigin = "anonymous";
    img.onload = () => { clearTimeout(tm); try{ const k = Math.min(1, (max || 400) / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k)); const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      ok({ url:cv.toDataURL("image/jpeg", 0.9), w:cv.width, h:cv.height }); }catch(e){ ok(null); } };
    img.onerror = () => { clearTimeout(tm); ok(null); };
    img.src = url;
  });
}

  let x = mx;

    const k = Math.min((lado - 2) / logo.w, (lado - 2) / logo.h); pdf.addImage(logo.url, "JPEG", mx + (lado - logo.w * k) / 2, 10 + (lado - logo.h * k) / 2, logo.w * k, logo.h * k); x = mx + lado + 5; }
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(13); pdf.text(pdfTx(E.ident.escola || "Escola").slice(0, 70), x, 17);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5);
  pdf.text(pdfTx(E.marca && E.marca.municipio ? "Secretaria Municipal de Educação de " + E.marca.municipio + (E.marca.uf ? "/" + E.marca.uf : "") : ""), x, 23);
  let y = 42; pdf.setTextColor(15, 44, 74); pdf.setFont("helvetica", "bold"); pdf.setFontSize(15);
  pdf.splitTextToSize(pdfTx(d.titulo + (gab ? " · Gabarito" : "")), aluno ? larg - 28 : larg).forEach(l => { pdf.text(l, mx, y); y += 7; });
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(70, 90, 110);
  pdf.text(pdfTx(d.subtitulo || [cx.disciplina, cx.serie].filter(Boolean).join(" · ")), mx, y); y += 6;
  pdf.setTextColor(20, 30, 40); pdf.setFontSize(10);
  if(aluno){
    pdf.text(pdfTx("Professor(a): " + (E.ident.prof || "")), mx, y); pdf.text(pdfTx("Turma: " + (cx.turma || "________")), mx + 110, y); y += 8;
    pdf.text("Data: ____/____/______", W - mx, y, { align:"right" }); const wData = pdf.getTextWidth("Data: ____/____/______") + 6;
    pdf.text("Aluno(a):", mx, y); const wA = pdf.getTextWidth("Aluno(a): "); pdf.setDrawColor(120, 140, 160); pdf.line(mx + wA, y + 0.8, W - mx - wData, y + 0.8);
    pdf.roundedRect(W - mx - 22, 34, 22, 14, 2, 2); pdf.setFontSize(7.5); pdf.text("Nota", W - mx - 11, 38, { align:"center" }); y += 5;
  } else if(gab){ pdf.setFont("helvetica", "bold"); pdf.text("Para o professor: não entregar ao aluno.", mx, y); pdf.setFont("helvetica", "normal"); y += 6; }
  pdf.setDrawColor(210, 220, 230); pdf.line(mx, y, W - mx, y); y += 7;
  const quebra = need => { if(y + need > H - 20){ pdf.addPage(); y = 20; } };
  const escrever = (t, xx, w, bold, tam) => { pdf.setFont("helvetica", bold ? "bold" : "normal"); pdf.setFontSize(tam || corpo); const l2 = (tam || corpo) * 0.48;
    String(t || "").split(/\n/).forEach(par => { pdf.splitTextToSize(pdfTx(par) || " ", w).forEach(l => { quebra(l2); pdf.text(l, xx, y); y += l2; }); }); };
  if(ilus){ const lmax = Math.min(larg, 120), hmax = 78, k = Math.min(lmax / ilus.w, hmax / ilus.h); quebra(ilus.h * k + 4); pdf.addImage(ilus.url, "JPEG", mx + (larg - ilus.w * k) / 2, y - 2, ilus.w * k, ilus.h * k); y += ilus.h * k + 6; }
  if(gab){
    (d.gabarito || []).forEach(g => { quebra(lh * 2); escrever(g.questao + ". " + g.resposta, mx, larg, true); if(g.comentario){ pdf.setTextColor(70, 90, 110); escrever(g.comentario, mx + 6, larg - 6, false); pdf.setTextColor(20, 30, 40); } y += 2.5; });
    if((d.bncc || []).length){ y += 3; escrever("Habilidades da BNCC", mx, larg, true, 12); y += 1; d.bncc.forEach(b => escrever("- " + [b.codigo, b.descricao].filter(Boolean).join(": "), mx, larg, false)); }
  } else {
    let n = 0;
    (d.secoes || []).forEach(s => {
      quebra(lh * 4); pdf.setTextColor(15, 44, 74); escrever(s.titulo, mx, larg, true, 12.5); pdf.setTextColor(20, 30, 40); y += 1.5;
      if(s.texto){ escrever(s.texto, mx, larg, false); y += 2; }
      (s.itens || []).forEach(it => { quebra(lh); pdf.setFont("helvetica", "normal"); pdf.setFontSize(corpo); pdf.text("-", mx + 2, y); escrever(it, mx + 6, larg - 6, false); y += 0.8; });
      if(s.tabela && (s.tabela.colunas || []).length){
        const cols = s.tabela.colunas, nc = cols.length, cw = larg / nc;
        const linha = (cel, bold) => { pdf.setFont("helvetica", bold ? "bold" : "normal"); pdf.setFontSize(9.5); const ls = cel.map(c => pdf.splitTextToSize(pdfTx(c) || " ", cw - 3)), alt = Math.max(...ls.map(l => l.length)) * 4.4 + 3;
          quebra(alt); if(bold){ pdf.setFillColor(238, 243, 248); pdf.rect(mx, y - 4, larg, alt, "F"); } pdf.setDrawColor(201, 213, 225);
          ls.forEach((l, i) => { pdf.rect(mx + i * cw, y - 4, cw, alt); l.forEach((t, j) => pdf.text(t, mx + i * cw + 1.5, y + j * 4.4)); }); y += alt; };
        y += 2; linha(cols, true); (s.tabela.linhas || []).forEach(l => linha(cols.map((_, i) => (l.celulas || [])[i] || ""), false)); y += 4;
      }
      (s.questoes || []).forEach(q => {
        n++; const qi = imgQ["q" + n], LI = 38, dir = qi ? LI + 6 : 0, lq = larg - dir;   // imagem da questão: coluna da direita
        quebra(qi ? LI + 4 : lh * 3); const yIni = y;
        if(qi){ const k = Math.min(LI / qi.w, LI / qi.h); pdf.addImage(qi.url, "JPEG", W - mx - LI + (LI - qi.w * k) / 2, y - 3.5, qi.w * k, qi.h * k); }
        pdf.setFont("helvetica", "bold"); pdf.setFontSize(corpo); pdf.text(n + ".", mx, y);
        escrever(q.enunciado + (q.valor ? " (" + String(q.valor).replace(".", ",") + " pt)" : ""), mx + 7, lq - 7, false); y += 1;
        const caixa = w => { pdf.setDrawColor(90, 110, 130); pdf.setLineWidth(0.3); pdf.rect(mx + 9, y - lh * 0.72, lh * w, lh * 0.8); };
        if(q.tipo === "multipla") (q.alternativas || []).forEach((a, j) => { quebra(lh); caixa(0.8); escrever(LETRAS[j] + ") " + a, mx + 9 + lh * 1.3, lq - 9 - lh * 1.3, false); });
        if(q.tipo === "vf") (q.alternativas || []).forEach(a => { quebra(lh); caixa(1.4); escrever(a, mx + 9 + lh * 1.9, lq - 9 - lh * 1.9, false); });
        if(q.tipo === "relacionar"){ const ca = q.coluna_a || [], cb = q.coluna_b || [], meia = (lq - 14) / 2; quebra(Math.max(ca.length, cb.length) * lh * 2); const y0 = y;
          pdf.setFont("helvetica", "normal"); ca.forEach((a, j) => pdf.splitTextToSize(pdfTx((j + 1) + ". " + a), meia).forEach(l => { pdf.text(l, mx + 9, y); y += lh; }));
          const yA = y; y = y0; cb.forEach(b => { pdf.setDrawColor(90, 110, 130); pdf.rect(mx + 14 + meia, y - lh * 0.72, lh * 1.4, lh * 0.8);
            pdf.splitTextToSize(pdfTx(b), meia - lh * 1.9).forEach(l => { pdf.text(l, mx + 14 + meia + lh * 1.9, y); y += lh; }); }); y = Math.max(y, yA); }
        const nl = linhasDe(q); for(let k = 0; k < nl; k++){ quebra(9); y += 7; pdf.setDrawColor(170, 185, 200); pdf.line(mx + 7, y, W - mx - (qi && y < yIni + LI ? dir : 0), y); } if(nl) y += 2;
        if(qi && y < yIni + LI) y = yIni + LI;
        y += 4.5;
      });
      y += 3;
    });
    if(!aluno && (d.bncc || []).length && !(d.secoes || []).some(s => /bncc/i.test(s.titulo))){ escrever("Habilidades da BNCC", mx, larg, true, 12); d.bncc.forEach(b => escrever("- " + [b.codigo, b.descricao].filter(Boolean).join(": "), mx, larg, false)); }
    if(A.tipo === "recado" || A.tipo === "parecer"){ y += 10; quebra(20); pdf.setDrawColor(120, 140, 160); pdf.line(W - mx - 70, y, W - mx, y); pdf.setFontSize(9); pdf.text(pdfTx(E.ident.prof || "Professor(a)"), W - mx - 35, y + 5, { align:"center" }); }
  }
  const np = pdf.getNumberOfPages();
  for(let i = 1; i <= np; i++){ pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(7.5); pdf.setTextColor(110, 130, 150);
    pdf.setDrawColor(210, 220, 230); pdf.line(mx, H - 12, W - mx, H - 12);
    pdf.text("portaldoeducador.com.br · Feito com o Portal IA e revisado pelo professor", mx, H - 7.5); pdf.text("Página " + i + " de " + np, W - mx, H - 7.5, { align:"right" }); }
  pdf.save((gab ? "gabarito-" : "") + (slug(d.titulo || A.tipo || "material").slice(0, 50) || "material") + ".pdf");
}

/* ===================== eventos ===================== */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  if(a === "inicio"){ ev.preventDefault(); if(E.ocupado || E.editor) return; ir("inicio"); return; }
  if(a === "atalho"){ E.tipo = arg; E.texto = ""; telaInicio(); const t = $("pedido"); if(t){ t.focus(); t.scrollIntoView({ block:"center", behavior:"smooth" }); } return; }
  if(a === "soltar"){ E.tipo = ""; E.texto = $("pedido").value; telaInicio(); return; }
  if(a === "exemplo"){ $("pedido").value = arg; $("pedido").focus(); return; }
  if(a === "enviar") return enviar();
  if(a === "resp"){ lerRespostas(); E.conversa.respostas[el.dataset.id] = arg; telaConversa(); return; }
  if(a === "gerar") return gerar();
  if(a === "abrir") return abrir(arg);
  if(a === "aba"){ E.aba = arg; telaInicio(); if(arg === "rede" && !E.rede){ await carregarRede(); if(E.vista === "inicio" && E.aba === "rede") telaInicio(); } return; }
  if(a === "abrir-rede") return abrirRede(arg);
  if(a === "usar-rede") return usarRede();
  if(a === "denunciar") return pedirDenuncia();
  if(a === "confirmar-denuncia") return denunciar();
  if(a === "compartilhar") return pedirCompartilhar();
  if(a === "confirmar-compartilhar") return compartilhar();
  if(a === "descompartilhar") return descompartilhar();
  if(a === "fechar-modal") return fecharModal();
  if(a === "pdf") return E.atual.html ? imprimir(arg) : pdfDoc(arg);
  if(a === "copiar"){ if(!E.atual.html) return copiar(textoPlano(E.atual.doc, true)); const f = $("folha"); f.classList.add("sem-botoes"); const t = f.innerText; f.classList.remove("sem-botoes"); return copiar(t.replace(/\n{3,}/g, "\n\n").trim()); }
  if(a === "ed-salvar") return salvarEditor();
  if(a === "ed-sair") return sairEditor();
  if(a === "copiar-wpp") return copiar(E.atual.doc.versao_whatsapp || "");
  if(a === "editar") return abrirEditor();
  if(a === "ajuste") return ajustar(arg);
  if(a === "ajuste-livre") return ajustar(String(($("ajusteLivre") || {}).value || "").trim());
  if(a === "imagem") return gerarImagem();
  if(a === "img-remover") return removerImagem(arg);
  if(a === "img-questao"){ const q = todasQuestoes(E.atual.doc)[+arg - 1]; E.imgOnde = "q" + arg; E.imgDescPre = q ? "Ilustração que ajude o aluno a responder: " + q.enunciado : ""; telaDoc();
    const t = $("imgDesc"); if(t){ t.scrollIntoView({ block:"center", behavior:"smooth" }); t.focus(); t.select(); } toast("Descreva a imagem da questão " + arg + " e toque em Gerar imagem."); return; }
  if(a === "favorito"){ E.atual.favorito = !E.atual.favorito; try{ await updateDoc(doc(db, "portal_ia_docs", E.atual.id), { favorito:E.atual.favorito }); }catch(e){ toast("Não consegui marcar.", true); }
    const r = E.recentes.find(x => x.id === E.atual.id); if(r) r.favorito = E.atual.favorito; telaDoc(); return; }
  if(a === "excluir"){ if(!confirm("Excluir este material? Não dá para desfazer.")) return;
    try{ await deleteDoc(doc(db, "portal_ia_docs", E.atual.id)); E.recentes = E.recentes.filter(x => x.id !== E.atual.id); toast("Material excluído."); ir("inicio"); }catch(e){ toast("Não consegui excluir.", true); } return; }
});
document.addEventListener("change", ev => {
  if(ev.target.id === "selTurma"){ definirTurma(ev.target.value); try{ localStorage.setItem("pde_pia_turma_" + E.user.uid, E.turma); }catch(e){} E.texto = ($("pedido") || {}).value || ""; telaInicio(); return; }
  if(ev.target.id === "selDisc"){ E.disc = ev.target.value; return; }
  if(ev.target.id === "redeDisc" || ev.target.id === "redeTipo"){ E.redeF[ev.target.id === "redeDisc" ? "disc" : "tipo"] = ev.target.value; $("redeLista").innerHTML = htmlRede(); return; }
  if(ev.target.id === "imgOnde"){ E.imgOnde = ev.target.value; const b = document.querySelector('[data-action="imagem"]'); if(b) b.textContent = E.imgs[E.imgOnde] ? "Trocar esta imagem" : "Gerar imagem"; return; }
});
document.addEventListener("input", ev => { if(ev.target.id === "inSerie") E.serie = ev.target.value.trim();
  if(ev.target.id === "redeQ"){ E.redeF.q = ev.target.value; const p = ev.target.selectionStart; $("redeLista").innerHTML = htmlRede(); const i = $("redeQ"); i.focus(); try{ i.setSelectionRange(p, p); }catch(e){} } });
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && $("modal")){ fecharModal(); return; } if(ev.key === "Escape" && E.editor){ sairEditor(); return; } if(ev.target.id === "pedido" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); enviar(); } });

window.addEventListener("beforeunload", ev => { if(E.editor && E.edMudou){ ev.preventDefault(); ev.returnValue = ""; } });
onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/"); return; }
  let u = null; try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo" || u.perfil === "aluno"){ location.replace("/entrar/"); return; }
  E.user = user; E.u = u; E.admin = u.perfil === "admin";
  $("quem").textContent = (u.nome || user.email) + " · sua aula, a IA prepara";
  await Promise.all([carregarTurmas(), carregarRecentes(), carregarCota()]);
  $("carregando").hidden = true; $("tela").hidden = false;
  ir("inicio");
});
