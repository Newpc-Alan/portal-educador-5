<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a{color:var(--azul)}
.app{max-width:1200px;margin:0 auto;padding:0 16px 64px}
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 22px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;

.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem}
.marca span{display:block;font-size:.78rem;color:rgba(255,255,255,.72)}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 14px;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}
.caixa{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.olho{font-size:.78rem;font-weight:800;color:var(--verde);letter-spacing:.07em;text-transform:uppercase}

h2{font-size:1.12rem;font-weight:800}
.sub{color:var(--muted);font-size:.95rem}
.peq{color:var(--muted2);font-size:.82rem}
.campo{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}

.btn-nv{background:var(--navy);color:#fff}
.btn-gh{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-cl{background:var(--verde-cl);color:var(--verde);border-color:#C9E5CF}
.btn-gpt{background:var(--gpt);color:#fff}
.btn-gem{background:var(--gem);color:#fff}

.pilha{display:flex;flex-direction:column;gap:26px}
.linha{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.esp{flex:1}

.chip.on .ext{color:#C9D6E3}
.rot{font-size:.82rem;font-weight:800;color:var(--muted)}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

.tipo b{display:block;font-size:.95rem;font-weight:800}
.tipo small{display:block;font-size:.8rem;color:var(--muted2);margin-top:4px;line-height:1.35}
.tipo.on{background:var(--verde-cl);border:2px solid var(--verde)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

.marcas{display:flex;flex-wrap:wrap;gap:6px}
.marca-op{font-size:.84rem;font-weight:700;padding:8px 13px;min-height:42px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--ink)}
.marca-op.on{border-color:var(--verde);background:var(--verde-cl);color:var(--verde)}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px}
.resumo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}

.gerar{background:var(--navy);color:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.gerar p{font-size:.86rem;color:#C9D6E3}

.giro{width:22px;height:22px;border-radius:50%;border:3px solid #cfe0ee;border-top-color:var(--azul);animation:g .8s linear infinite;flex:none}
@keyframes g{to{transform:rotate(360deg)}}
.aviso{background:#FFF6E0;border:1.5px solid #E8B64A;color:#7A4E00;border-radius:12px;padding:12px 14px;font-size:.9rem;font-weight:600}
.aviso.err{background:#FDECEA;border-color:#E3A29C;color:#8A1F17}
/* pronto */
.pronto{max-width:780px}
.ok-ic{width:52px;height:52px;border-radius:50%;background:var(--verde-cl);display:grid;place-items:center;flex:none}
.passo{display:flex;gap:12px;align-items:flex-start;font-size:1rem;line-height:1.5}
.passo i{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.86rem}
.cmd{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:#F7F9FB;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:360px;overflow:auto;color:#24384F}
/* familia e catalogo */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vazio{text-align:center;color:var(--muted);padding:36px 10px}
.vazio b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.grupo-t{font-size:1rem;font-weight:800;margin:6px 0 10px}
/* palco */
.palco{position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column}
.palco .barra{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff;flex-wrap:wrap}
.palco .barra b{flex:1;font-size:.98rem;min-width:160px}
.palco iframe{flex:1;width:100%;border:0}
.oculto{position:fixed;left:-10000px;top:0;width:1200px;height:900px;border:0;visibility:hidden}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}
@media (max-width:900px){ .aside{position:static} }
@media (max-width:560px){ .tipos{grid-template-columns:1fr 1fr;gap:8px} .tipo{padding:12px} .caixa,.etapa{padding:18px} .btn{width:100%} .mat .acs{width:100%} .mat .acs .btn{flex:1;width:auto} }
</style>
</head>

const E = { user:null, u:null, admin:false, apps:{}, turmas:[], turma:"", ident:{ prof:"", escola:"", municipio:"" }, materiais:[], matOk:true,

/* ===================== motor: conduz a ferramenta original ===================== */
const cacheHtml = {};
async function htmlDe(pasta){
  if(!cacheHtml[pasta]){
    const r = await fetch(IA_BASE + pasta + "/", { cache:"no-cache" });
    if(!r.ok) throw new Error("A ferramenta não respondeu (" + r.status + ").");
    cacheHtml[pasta] = await r.text();
  }
  return cacheHtml[pasta].replace(/<head([^>]*)>/i, '<head$1><base href="' + IA_BASE + pasta + '/">');
}
// identificação compartilhada com a suíte: a ferramenta lê estas chaves ao abrir
function gravarIdentidade(){
  try{ localStorage.setItem("pde_professor", E.ident.prof); localStorage.setItem("pde_escola", E.ident.escola); localStorage.setItem("pde_municipio", E.ident.municipio); }catch(e){}
}
async function abrirQuadro(pasta, visivel, alvo){
  const html = await htmlDe(pasta);
  gravarIdentidade();
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads" + (visivel ? " allow-modals" : ""));
  f.setAttribute("allow", "clipboard-write");
  f.setAttribute("title", visivel ? "Ferramenta do IA Studio" : "Motor do IA Studio");
  if(!visivel){ f.className = "oculto"; f.setAttribute("tabindex", "-1"); }
  const pronto = new Promise((res, rej) => { f.onload = () => setTimeout(() => res(f), 700); setTimeout(() => rej(new Error("A ferramenta demorou para abrir.")), 20000); });
  f.srcdoc = html;
  (alvo || $("quadros")).appendChild(f);
  return pronto;
}
function definir(d, id, valor){
  const el = d.getElementById(id); if(!el) return false;
  if(el.tagName === "SELECT"){
    let alvo = -1;
    for(let i = 0; i < el.options.length; i++){ if(el.options[i].value === valor){ alvo = i; break; } }
    if(alvo < 0) for(let i = 0; i < el.options.length; i++){ if(el.options[i].text === valor){ alvo = i; break; } }
    if(alvo >= 0) el.selectedIndex = alvo;
  } else if(el.type === "checkbox" || el.type === "radio"){
    el.checked = !!valor;
  } else {
    el.value = valor;
  }
  el.dispatchEvent(new Event("input", { bubbles:true }));
  el.dispatchEvent(new Event("change", { bubbles:true }));
  return true;
}
const txt = el => el ? semIcone(el.textContent) : "";
function rotuloDe(d, el){
  let l = el.id ? d.querySelector('label[for="' + CSS.escape(el.id) + '"]') : null;
  if(!l){ const f = el.closest(".pde-f"); l = f ? f.querySelector("label") : null; }
  return l ? semIcone(l.textContent) : "";
}
// lê os controles de um trecho da ferramenta, na ordem da tela
function controles(d, raiz, pular){
  const out = []; if(!raiz) return out;
  raiz.querySelectorAll("select,input,textarea,.pde-chips").forEach(el => {
    if(pular && pular(el)) return;
    if(el.classList.contains("pde-chips")){
      const ops = [...el.querySelectorAll(".pde-chip[data-val]")].map(c => ({ v:c.dataset.val, t:txt(c), on:c.classList.contains("on") }));
      if(!ops.length) return;
      let r = ""; let p = el.previousElementSibling; while(p && !r){ if(p.classList.contains("sec-t") || p.tagName === "LABEL") r = semIcone(p.textContent); p = p.previousElementSibling; }
      out.push({ tipo:"chips", id:el.dataset.group || ("chips" + out.length), rotulo:r.replace(/\(.*?\)/g, "").trim() || "Escolha", ajuda:(r.match(/\((.*?)\)/) || [])[1] || "", ops });
      return;
    }
    if(!el.id || /^pde-/.test(el.id) || el.type === "hidden" || el.type === "file" || el.closest(".pde-chips")) return;
    const rot = rotuloDe(d, el), obrig = /\*\s*$/.test(rot);
    const base = { id:el.id, rotulo:rot.replace(/\*\s*$/, "").trim() || el.id, obrig };
    if(el.tagName === "SELECT") out.push({ ...base, tipo:"select", valor:el.value, ops:[...el.options].map(o => ({ v:o.value, t:semIcone(o.text) || o.value })) });
    else if(el.type === "checkbox") out.push({ ...base, tipo:"check", valor:el.checked });
    else out.push({ ...base, tipo:"texto", valor:el.value || "", ph:el.getAttribute("placeholder") || "", area:el.tagName === "TEXTAREA" });
  });
  return out;
}
// estrutura da ferramenta: modos (fase 1), campos de cada modo (fase 2) e campos comuns (fases seguintes)
async function lerEstrutura(pasta){
  const f = await abrirQuadro(pasta, false);
  try{
    const d = f.contentDocument;
    const modos = [...d.querySelectorAll(".md-card[data-modo]")].map(b => ({ modo:b.dataset.modo, nome:txt(b.querySelector(".md-n")) || txt(b), desc:txt(b.querySelector(".md-t")) }));
    if(!modos.length || !d.querySelector(".mf[data-mf]") || !d.getElementById("p-uni")) throw new Error("estrutura própria");
    // campos comuns (turma, folha, cores) lidos antes de tocar em qualquer modo: é o estado de quem abre a ferramenta
    const comuns = [];
    d.querySelectorAll(".wz-phase").forEach(ph => { const n = +ph.dataset.phase; if(n > 2) comuns.push(...controles(d, ph)); });
    const inicial = {}; comuns.forEach(c => { if(c.tipo !== "chips") inicial[c.id] = c.valor; });
    // alguns modos mudam um campo comum ao serem escolhidos (ex.: "plugado" marca Chromebooks); guardamos esse efeito
    const porModo = {}, efeitos = {};
    for(const m of modos){
      Object.entries(inicial).forEach(([id, v]) => definir(d, id, v));
      const b = d.querySelector('.md-card[data-modo="' + m.modo + '"]'); if(b) b.click(); await espera(120);
      porModo[m.modo] = controles(d, d.querySelector('.mf[data-mf="' + m.modo + '"]'));
      const ef = {};
      Object.keys(inicial).forEach(id => { const el = d.getElementById(id); if(!el) return; const v = el.type === "checkbox" ? el.checked : el.value; if(v !== inicial[id]) ef[id] = v; });
      efeitos[m.modo] = ef;
    }
    const f2 = d.querySelector('.wz-phase[data-phase="2"]');
    const soltos = controles(d, f2, el => !!el.closest(".mf"));
    return { pasta, modos, porModo, soltos, comuns, inicial, efeitos };
  } finally { f.remove(); }
}
// gera o comando: quadro novo a cada vez, para nada sobrar da geração anterior
async function gerarComando(pasta, val){
  const f = await abrirQuadro(pasta, false);
  try{
    const d = f.contentDocument;
    const b = d.querySelector('.md-card[data-modo="' + val.modo + '"]'); if(!b) throw new Error("modo não encontrado na ferramenta");
    b.click(); await espera(220);
    for(const [id, v] of Object.entries(val.campos || {})){ definir(d, id, v); await espera(40); }
    for(const [g, lista] of Object.entries(val.chips || {})){
      const grupo = d.querySelector('.pde-chips[data-group="' + CSS.escape(g) + '"]'); if(!grupo) continue;
      grupo.querySelectorAll(".pde-chip[data-val]").forEach(c => { const quer = lista.includes(c.dataset.val); if(quer !== c.classList.contains("on")) c.click(); });
    }
    definir(d, "pde-id-prof", E.ident.prof); definir(d, "pde-id-escola", E.ident.escola); definir(d, "pde-id-municipio", E.ident.municipio);
    await espera(80);
    const g = d.querySelector('[data-action="gerar"]'); if(!g) throw new Error("botão de gerar não encontrado");
    g.click();
    for(let i = 0; i < 30; i++){
      await espera(120);
      const s = d.getElementById("p-uni"), t = s ? (s.value || s.textContent || "") : "";
      if(t.trim().length > 400) return t;
    }
    throw new Error("a ferramenta não devolveu o comando. Confira os campos obrigatórios.");
  } finally { f.remove(); }
}
function copiar(texto){
  let ok = false;
  try{
    const ta = document.createElement("textarea"); ta.value = texto; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;font-size:16px"; document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, texto.length); ok = document.execCommand("copy"); ta.remove();
  }catch(e){ ok = false; }
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(texto).catch(() => {}); ok = true; }
  return ok;
}

async function carregarTurmas(){
  const ids = (E.u.escolas_ids && E.u.escolas_ids.length ? E.u.escolas_ids : [E.u.escola_id]).filter(Boolean).slice(0, 10);
  try{
    if(ids.length){ const s = await getDocs(query(collection(db, "turmas"), where("escola_id", "in", ids))); s.forEach(d => { const t = d.data(); if(t.status !== "inativa") E.turmas.push({ id:d.id, ...t }); }); }
  }catch(e){ console.warn("turmas:", e.code); }
  const minhas = new Set((E.u.turmas_ids || []).map(String));
  const ehMinha = t => minhas.has(t.id) || t.criado_por === E.user.uid || discDaGrade(t).length > 0;
  E.turmas = E.turmas.filter(t => ehMinha(t) || E.turmas.length <= 12);
  E.turmas.sort((a, b) => (ehMinha(b) - ehMinha(a)) || String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR", { numeric:true }));
  let ult = ""; try{ ult = localStorage.getItem("pde_ia_turma_" + E.user.uid) || ""; }catch(e){}
  E.turma = E.turmas.some(t => t.id === ult) ? ult : (E.turmas[0] ? E.turmas[0].id : "");
  // identificação do material: nome, escola e município do cadastro
  E.ident.prof = String(E.u.nome || E.user.displayName || "").slice(0, 80);
  const escId = E.u.escola_id || ids[0] || "";
  try{ if(escId){ const s = await getDoc(doc(db, "escolas", escId)); if(s.exists()) E.ident.escola = s.data().nome || ""; } }catch(e){}
  try{
    const mid = E.u.municipio_id || "";
    if(mid){ const s = await getDoc(doc(db, "municipios", mid)); if(s.exists()){ const m = s.data(); E.ident.municipio = (m.nome || "") + (m.uf ? "/" + m.uf : ""); E.marca = { municipio:m.nome || "", uf:m.uf || "", logo_url:m.logo_url || "" }; } }
  }catch(e){}
}
async function carregarMateriais(){
  E.materiais = [];
  try{
    const s = await getDocs(query(collection(db, "ia_materiais"), where("uid", "==", E.user.uid), limit(200)));
    s.forEach(d => E.materiais.push({ id:d.id, ...d.data() }));
    const ms = x => x && (x.toMillis ? x.toMillis() : x.__ms || (x.seconds ? x.seconds * 1000 : 0)) || 0;
    E.materiais.sort((a, b) => (!!b.favorito - !!a.favorito) || (ms(b.usado_em) - ms(a.usado_em)));
    E.matOk = true;
  }catch(e){ console.warn("ia_materiais:", e.code); E.matOk = false; }
}

async function gerar(qual, val, mat){
  if(E.gerando) return;
  const ia = IAS[qual]; if(!ia) return;
  E.gerando = true; botoesGerar(true);

    const cmd = await gerarComando(val.pasta, val);
    // copia antes de abrir a aba: a aba nova tira o foco desta página
    const ok = copiar(cmd);
    let aberta = false; try{ aberta = !!window.open(ia.url, "_blank"); }catch(e){}
    E.ultimo = { cmd, ia:qual, val, titulo:mat ? mat.titulo : tituloMaterial(val), copiado:ok, aberta };
    registrarUso(val.pasta);
    await guardarMaterial(mat, val, qual, E.ultimo.titulo);
    ir("pronto");
  }catch(e){
    console.warn("gerar:", e);
    const el = $("gerAviso"); const msg = "Não deu para gerar: " + (e.message || e);
    if(el) el.innerHTML = '<div class="aviso err" style="margin-top:6px">' + esc(msg) + "</div>"; else toast(msg, true);

const MAPA_PDF = { "π":"pi", "≤":"<=", "≥":">=", "≠":"diferente de", "√":"raiz de ", "−":"-", "–":"-", "—":", ", "…":"...", "“":'"', "”":'"', "‘":"'", "’":"'", "•":"-", "→":"->", "≈":"aprox. " };
const pdfTx = s => String(s == null ? "" : s).replace(/[π≤≥≠√−–—…“”‘’•→≈]/g, ch => MAPA_PDF[ch]).replace(/[^\u0000-\u00ff]/g, "").replace(/\t/g, " ").replace(/ +([,.;:])/g, "$1").replace(/_{3,}/g, "_______________").trim();
function logoPng(url){
  return new Promise(ok => {
    if(!url){ ok(null); return; }
    const img = new Image(), tm = setTimeout(() => ok(null), 7000);
    img.crossOrigin = "anonymous";
    img.onload = () => { clearTimeout(tm); try{ const k = Math.min(1, 400 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k)); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      ok({ url:cv.toDataURL("image/png"), w:cv.width, h:cv.height }); }catch(e){ ok(null); } };
    img.onerror = () => { clearTimeout(tm); ok(null); };
    img.src = url;
  });
}

}

function v3paraV2(p){ return { v:2, pedido:{ area:p.area, tipo:"exercicios", campos:{ "g-tema":p.tema || "", "g-qtd":String(p.qtd || 6) }, chips:{ "g-tipos":p.tipos || [] }, serie:p.serie, incl:p.incl || "", orient:"retrato", cor:p.cor || "colorido", roteiro:false, bncc:p.bncc || "", temaLivre:p.temaLivre || "" } }; }
function telaFamilia(k){
  const en = ENTREGAS.find(x => x.k === k); if(!en){ ir("inicio"); return; }
  const l = en.pastas.filter(p => E.apps[p]);
  $("tela").innerHTML = '<div class="pilha" style="gap:18px"><div><span class="olho">' + esc(en.titulo) + "</span><h1>Escolha a ferramenta</h1>" +
    '<p class="sub" style="margin-top:4px">Nesta versão de teste, estes materiais abrem a ferramenta completa, já com seu nome, a escola e o município preenchidos.</p></div>' +
    (l.length ? '<div class="cards">' + l.map(p => cartaoApp(p)).join("") + "</div>" : '<div class="caixa vazio"><b>Nada publicado aqui ainda</b>A NEWPC está organizando estas ferramentas.</div>') + "</div>";
}
function telaCatalogo(){
  const grupos = {};
  Object.entries(E.apps).sort((a, b) => (a[1].ordem || 999) - (b[1].ordem || 999)).forEach(([p, a]) => { (grupos[a.grupo || "Outras"] = grupos[a.grupo || "Outras"] || []).push(p); });
  $("tela").innerHTML = '<div class="pilha" style="gap:18px"><div><span class="olho">IA do Educador</span><h1>Todas as ferramentas</h1><p class="sub" style="margin-top:4px">As mesmas ferramentas de sempre, pelo nome.</p></div>' +
    (Object.keys(grupos).length ? Object.entries(grupos).map(([g, ps]) => '<section><h2 class="grupo-t">' + esc(g) + '</h2><div class="cards">' + ps.map(p => cartaoApp(p)).join("") + "</div></section>").join("")
      : '<div class="caixa vazio"><b>As ferramentas estão sendo organizadas</b>Volte em breve.</div>') + "</div>";
}
async function abrirCompleta(pasta){
  const a = E.apps[pasta];
  const p = document.createElement("div"); p.className = "palco"; p.setAttribute("role", "dialog"); p.setAttribute("aria-modal", "true"); p.setAttribute("aria-label", a ? a.titulo : "Ferramenta");
  p.innerHTML = '<div class="barra"><b>' + esc(a ? a.titulo : "Ferramenta") + '</b><button type="button" class="tb" data-action="fechar-palco">Fechar</button></div><div class="carreg" style="justify-content:center;flex:1" id="palcoCarreg"><span class="giro"></span>Abrindo a ferramenta...</div>';
  document.body.appendChild(p); document.body.style.overflow = "hidden";
  registrarUso(pasta);
  try{
    const f = await abrirQuadro(pasta, true, p);
    const c = $("palcoCarreg"); if(c) c.remove();
    const d = f.contentDocument, s = d && d.getElementById("i-serie"), n = serieDaTurma();
    if(s && n){ const o = [...s.options].find(o => new RegExp("^" + n + "\\s*[ºª°]").test(o.text)); if(o) definir(d, "i-serie", o.value); }
  }catch(e){
    console.warn("palco:", e);
    const c = $("palcoCarreg"); if(c) c.remove();
    // sem a cópia local, abre a ferramenta direto do endereço dela
    const f = document.createElement("iframe"); f.src = IA_BASE + pasta + "/"; f.setAttribute("title", "Ferramenta do IA Studio"); f.setAttribute("allow", "clipboard-write"); p.appendChild(f);
  }
}
function fecharPalco(){ document.querySelectorAll(".palco").forEach(p => p.remove()); document.body.style.overflow = ""; }

/* ===================== eventos ===================== */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-action]"); if(!b) return;
  const a = b.dataset.action, arg = b.dataset.arg;
  if(b.tagName === "A") ev.preventDefault();
  if(a === "ir-inicio"){ ir("inicio"); return; }
  if(a === "catalogo"){ ir("catalogo"); return; }
  if(a === "entrega"){ if(arg === "ficha"){ E.valores = null; E.area = null; ir("ficha"); } else ir("fam:" + arg); return; }
  if(a === "abrir-pasta"){ abrirPasta(arg); return; }
  if(a === "abrir-pasta-completa"){ abrirCompleta(arg); return; }
  if(a === "fechar-palco"){ fecharPalco(); return; }
  if(a === "area"){ const x = [...AREAS, ...TEMAS].find(z => z.k === arg); if(!x || (E.area && E.area.k === x.k)) return; escolherArea(x); telaFicha(); return; }
  if(a === "modo" && E.area && E.area.motor){ if(arg === E.modo) return; E.modo = arg; desenharTiposMotor(null); return; }
  if(a === "modo"){ if(arg === E.modo) return; trocarEfeitos(E.modo, arg); E.modo = arg; E.valores = null; desenharTipos(); return; }
  if(a === "marca"){ const on = !b.classList.contains("on"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); return; }
  if(a === "gerar" && E.area && E.area.motor){
    const r = coletarMotor();
    if(r.faltam.length){ $("gerAviso").innerHTML = '<div class="aviso" style="margin-top:6px">Preencha: ' + esc(r.faltam.join(", ")) + ".</div>"; const e = document.querySelector(".erro"); if(e) e.focus(); return; }
    $("gerAviso").innerHTML = ""; gerarMotor(arg, r.pedido, null); return;
  }
  if(a === "gerar-ia"){ gerarIa(); return; }
  if(a === "pdf-ficha"){ pdfFicha(false); return; }
  if(a === "pdf-gabarito"){ pdfFicha(true); return; }
  if(a === "ver-ficha" || a === "ver-gabarito"){ const g = a === "ver-gabarito"; $("previa").innerHTML = fichaHtml(E.material.conteudo, g);
    document.querySelectorAll('[data-action="ver-ficha"],[data-action="ver-gabarito"]').forEach(x => { const on = x.dataset.action === a; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); }); return; }
  if(a === "ia-outra"){ const m = E.materiais.find(z => z.id === E.material.id); variar(m && m.valores && m.valores.v === 3 ? v3paraV2(m.valores.pedido) : null); return; }
  if(a === "copiar-legado"){ if(E.ultimo && E.ultimo.legado) toast(copiar(E.ultimo.legado) ? "Comando antigo copiado." : "Não deu para copiar.", false); return; }
  if(a === "ver-mudancas"){
    const c = $("mudancas"), u = E.ultimo; if(!c || !u || !u.legado) return;
    if(c.hidden){
      const antes = new Set(u.legado.split("\n")), depois = new Set(u.cmd.split("\n"));
      const novos = u.cmd.split("\n").filter(l => l.trim() && !antes.has(l)), saiu = u.legado.split("\n").filter(l => l.trim() && !depois.has(l));
      c.innerHTML = (novos.length ? '<p class="rot">Entrou no comando novo</p><pre class="cmd" style="max-height:none;border-color:#C9E5CF;background:#F3FAF4"></pre>' : "") +
        (saiu.length ? '<p class="rot" style="margin-top:10px">Saiu do comando antigo</p><pre class="cmd" style="max-height:none;border-color:#E3A29C;background:#FDF3F2"></pre>' : "") +
        (!novos.length && !saiu.length ? '<p class="peq">Os dois comandos são iguais para este pedido.</p>' : "");
      const pres = c.querySelectorAll("pre"); let i = 0;
      if(novos.length) pres[i++].textContent = novos.join("\n\n");
      if(saiu.length) pres[i].textContent = saiu.join("\n\n");
    }
    c.hidden = !c.hidden; b.setAttribute("aria-expanded", !c.hidden); return;
  }
  if(a === "gerar"){
    const val = coletar(); if(!val){ toast("Espere as opções carregarem.", true); return; }
    if(val.faltam.length){ $("gerAviso").innerHTML = '<div class="aviso" style="margin-top:6px">Preencha: ' + esc(val.faltam.join(", ")) + ".</div>"; const e = document.querySelector(".erro"); if(e) e.focus(); return; }
    $("gerAviso").innerHTML = ""; gerar(arg, val, null); return;
  }
  if(a === "copiar-ultimo"){ if(E.ultimo) toast(copiar(E.ultimo.cmd) ? "Comando copiado. Cole na IA com Ctrl+V." : "Não deu para copiar. Abra o comando e copie.", false); return; }
  if(a === "ver-cmd"){ const c = $("cmd"); c.hidden = !c.hidden; b.setAttribute("aria-expanded", !c.hidden); b.textContent = c.hidden ? "Ver o comando" : "Esconder o comando"; return; }
  if(a === "variar-ultimo"){ if(!E.ultimo) return; variar(E.ultimo.val); return; }
  const m = arg && E.materiais.find(x => x.id === arg);
  if(a === "mat-gerar" && m && m.valores && m.valores.v === 2){ const x = AREAS.find(z => z.k === m.valores.pedido.area); if(x) E.area = x; gerarMotor(m.ia || "chatgpt", m.valores.pedido, m); return; }
  if(a === "mat-gerar" && m){ const x = [...AREAS, ...TEMAS].find(z => z.pasta === m.pasta); E.area = x || E.area; gerar(m.ia || "chatgpt", m.valores, m); return; }
  if(a === "mat-abrir" && m && m.conteudo){ abrirMaterial(m); return; }
  if(a === "mat-variar" && m){ variar(m.valores && m.valores.v === 3 ? v3paraV2(m.valores.pedido) : m.valores); return; }
  if(a === "mat-fav" && m){
    m.favorito = !m.favorito; desenharMateriais();
    try{ await updateDoc(doc(db, "ia_materiais", m.id), { favorito:m.favorito }); }catch(e){ m.favorito = !m.favorito; desenharMateriais(); toast("Não deu para marcar agora.", true); }
    return;
  }
  if(a === "mat-del" && m){
    if(!b.dataset.confirma){ b.dataset.confirma = "1"; b.textContent = "Confirmar"; setTimeout(() => { if(b.isConnected){ delete b.dataset.confirma; b.textContent = "Remover"; } }, 4000); return; }
    try{ await deleteDoc(doc(db, "ia_materiais", m.id)); E.materiais = E.materiais.filter(x => x.id !== m.id); desenharMateriais(); toast("Removido da lista."); }
    catch(e){ toast("Não deu para remover agora.", true); }
  }
});
function variar(val){
  if(!val){ ir("ficha"); return; }
  if(val && val.v === 2){ const y = AREAS.find(z => z.k === val.pedido.area); if(!y) return; E.area = y; E.estr = null; E.valores = val; E.modo = val.pedido.tipo; ir("ficha"); return; }
  const x = [...AREAS, ...TEMAS].find(z => z.pasta === val.pasta); if(!x){ toast("Esta ferramenta não está mais disponível.", true); return; }
  E.area = x; E.estr = null; E.valores = { ...val }; E.modo = val.modo; ir("ficha");
}
document.addEventListener("change", ev => {
  if(ev.target.id === "selTurma"){ E.turma = ev.target.value; try{ localStorage.setItem("pde_ia_turma_" + E.user.uid, E.turma); }catch(e){} infoTurma(); return; }
  if(ev.target.closest("#camposModo")){ dependencias(); resumo(); }
});
document.addEventListener("input", ev => {
  if(ev.target.id === "busca"){ E.busca = ev.target.value; desenharBusca(); return; }
  if(ev.target.closest("#camposModo")) resumo();
});
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && document.querySelector(".palco")) fecharPalco(); });

onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/"); return; }
  let u = null; try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo" || u.perfil === "aluno"){ location.replace("/entrar/"); return; }
  E.user = user; E.u = u; E.admin = u.perfil === "admin";
  $("quem").textContent = (u.nome || user.email) + " · você ensina, a IA prepara";
  await Promise.all([carregarApps(), carregarTurmas(), carregarMateriais(), carregarIa()]);
  $("carregando").hidden = true; $("tela").hidden = false;
  const h = location.hash.slice(1);
  ir(h === "catalogo" ? "catalogo" : h === "ficha" ? "ficha" : "inicio");
});
</script>
