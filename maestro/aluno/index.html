<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f2c4a">
<title>Sala de aula gerenciada · Portal do Educador</title>
<link rel="icon" type="image/png" href="https://app.portaldoeducador.com.br/assets/pde-logo-64.png">
<style>
  *{ box-sizing:border-box; margin:0 }
  body{ min-height:100vh; display:grid; place-items:center; padding:20px; font-family:Inter,"Segoe UI",system-ui,sans-serif; color:#fff;
    background:radial-gradient(circle at 50% 40%,#1a6b2a,#071621 65%) }
  main{ display:grid; justify-items:center; gap:14px; text-align:center; max-width:520px }
  img{ width:120px; height:120px; border-radius:50%; box-shadow:0 10px 40px rgba(0,0,0,.45) }
  h1{ font-size:26px } p{ color:#cfe3f5; font-size:16px; line-height:1.5 }
  a{ display:inline-block; margin-top:6px; background:#8DC63F; color:#0f2c4a; font-weight:800; font-size:18px; text-decoration:none; border-radius:14px; padding:14px 26px }
  small{ color:#9fb3c6; font-size:13px }
</style>
</head>
<body>
<main>
  <img src="https://app.portaldoeducador.com.br/assets/pde-logo-256.png" alt="Portal do Educador">
  <h1>A sala de aula gerenciada agora fica dentro do Portal</h1>
  <p>Professor: entre no Portal e toque em <b>Sala de aula gerenciada › Começar a aula</b>.<br>Aluno: entre no Portal com a sua carteirinha ou com a sua conta.</p>
  <a href="https://app.portaldoeducador.com.br/entrar/">Entrar no Portal do Educador</a>
  <small>Você será levado automaticamente em alguns segundos.</small>
</main>
<script>
  // tablets que instalaram a página antiga como aplicativo: tira o service worker e o cache antigos
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(l){ l.forEach(function(r){ r.unregister(); }); }); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); }); }catch(e){}
  setTimeout(function(){ location.replace("https://app.portaldoeducador.com.br/entrar/"); }, 6000);
</script>
</body>
</html>
