<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal do Educador · Endereço atualizado</title>
<link rel="icon" type="image/png" href="/assets/pde-logo-64.png">
<script>
// Endereços do site antigo (Webnode) levados para o lugar novo no Portal do Educador.
// Exatos primeiro; depois por prefixo; o que não for conhecido mostra o aviso abaixo e vai para o início.
(function(){
  var p = location.pathname.toLowerCase().replace(/\/+$/, "") + "/";
  var EXATO = {
    "/newpc/": "/entrar/", "/user-login/": "/entrar/", "/user-registration/": "/entrar/",
    "/user-recovery/": "/entrar/", "/bem-vindo-a-ao-portal-do-educador-new-pc/": "/entrar/",
    "/videos-educativos/": "/entrar/", "/jogos-educacionais/": "/entrar/#jogos", "/dicas-de-ia/": "/entrar/",
    "/gerador-de-provas/": "/entrar/", "/dicas-do-professor/": "/entrar/",
    "/central-de-relatorios/": "/relatorios/", "/museus-virtuais/": "/entrar/",
    "/diversao-para-colorir/": "/entrar/", "/diversao-para-colorir-2/": "/entrar/", "/diversao-para-colorir2/": "/entrar/",
    "/balanca-da-equacao/": "/entrar/", "/pensamento-computacional-ia/": "/entrar/",
    "/portal-maestro/": "/#maestro", "/conformidade-com-a-bncc/": "/#recursos",
    "/contate-nos/": "/#contato", "/solicite-um-orcamento/": "/#contato", "/sobre-nos/": "/#instituicao",
    "/servicos/": "/#recursos", "/reservas-online/": "/#contato",
    "/politica-de-privacidade/": "/privacidade/", "/termos-e-condicoes/": "/privacidade/",
    "/certificados/": "/validar/", "/podcast/": "/", "/restrito/": "https://restrito.portaldoeducador.com.br/",
    "/site-em-manutencao/": "/", "/pagina-em-branco2/": "/"
  };
  var PREFIXO = [
    ["/l/", "/"], ["/blog/", "/"],
    ["/p/", "https://www.newpc.com.br/"], ["/loja-online/", "https://www.newpc.com.br/"],
    ["/cart/", "https://www.newpc.com.br/"], ["/checkout/", "https://www.newpc.com.br/"]
  ];
  var destino = EXATO[p];
  if(!destino) for(var i = 0; i < PREFIXO.length; i++) if(p.indexOf(PREFIXO[i][0]) === 0){ destino = PREFIXO[i][1]; break; }
  if(destino){ location.replace(destino); return; }
  window.__destino = "/";
})();
</script>
<style>
  :root{ --azul:#0f2c4a; --verde:#1a6b2a; --fundo:#f4f7fa; --texto:#1d2b3a; --suave:#5b6b7c; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
        background:var(--fundo); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .caixa{ max-width:440px; width:100%; background:#fff; border-radius:18px; padding:32px 24px; text-align:center;
          box-shadow:0 10px 30px rgba(15,44,74,.12); }
  img{ width:84px; height:84px; }
  h1{ font-size:1.35rem; margin:14px 0 8px; color:var(--azul); }
  p{ margin:0 0 20px; color:var(--suave); line-height:1.5; }
  .bts{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  a{ display:inline-block; padding:12px 18px; border-radius:10px; font-weight:600; text-decoration:none; }
  .pri{ background:var(--verde); color:#fff; } .sec{ background:#e8eef4; color:var(--azul); }
  small{ display:block; margin-top:18px; color:var(--suave); }
</style>
</head>
<body>
  <main class="caixa">
    <img src="/assets/pde-logo-256.png" alt="Portal do Educador">
    <h1>O Portal do Educador ficou de cara nova</h1>
    <p>Esta página mudou de lugar. Tudo o que você usava agora está dentro do novo Portal, com o mesmo endereço de sempre.</p>
    <div class="bts">
      <a class="pri" href="/entrar/">Entrar no Portal</a>
      <a class="sec" href="/">Conhecer o novo Portal</a>
    </div>
    <small id="aviso">Levando você para a página inicial em 8 segundos.</small>
  </main>
  <script>setTimeout(function(){ location.replace(window.__destino || "/"); }, 8000);</script>
</body>
</html>
