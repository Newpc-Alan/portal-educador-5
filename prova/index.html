<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prova online · Portal do Educador</title>
<meta name="theme-color" content="#0c2338">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--escuro:#0c2338;--navy:#0f2c4a;--azul:#2671AB;--azul-2:#2E9BD6;--lima:#8DC63F;--verde:#1a6b2a;--bg:#f2f6fa;--ink:#0c2338;--muted:#62758a;--line:#d9e3ed;--red:#C2362C;--amarelo:#F9A825}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.topo{background:linear-gradient(135deg,#071621,#1b4a74);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.topo img{width:34px;height:34px}
.topo .t{flex:1;min-width:0} .topo small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)} .topo b{font-size:.98rem}
.topo a{color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;line-height:1.25;margin-bottom:6px} h2{font-size:1.1rem;margin-bottom:6px}
.sub{color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-pri{background:var(--azul);color:#fff} .btn-ok{background:var(--lima);color:#071621} .btn-gh{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.55;cursor:default} .btn-sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
.regras{display:grid;gap:10px;margin:16px 0} .regras div{display:flex;gap:10px;align-items:flex-start;font-size:.95rem} .regras span{font-size:1.2rem;flex:none} .regras p{flex:1}
.vazio{padding:26px;text-align:center;color:var(--muted)}
.carregando{padding:60px 20px;text-align:center;color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em}
.c-nao{background:#eef2f6;color:#62758a} .c-and{background:#e3f1fb;color:#1b5f93} .c-blo{background:#fde8e6;color:var(--red)} .c-ent{background:#e8f5e9;color:var(--verde)} .c-age{background:#fff4dc;color:#8a5a00}
.lista{display:grid;gap:12px}
.item{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit}
.item .ic{font-size:1.8rem} .item .tx{flex:1;min-width:0} .item b{display:block} .item small{color:var(--muted);font-size:.84rem}
/* ---------- execução ---------- */
#exec{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;user-select:none;-webkit-user-select:none}
#exec textarea,#exec input[type=text]{user-select:text;-webkit-user-select:text}
.ex-top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0c2338;color:#fff}
.ex-top .tt{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-tempo{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;background:rgba(255,255,255,.12);border-radius:10px;padding:4px 12px}
.ex-tempo.fim{background:var(--amarelo);color:#071621}
.ex-paleta{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.ex-paleta button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.85rem}
.ex-paleta button.r{background:#e3f1fb;border-color:#9cc9ea} .ex-paleta button.on{border-color:var(--azul);box-shadow:0 0 0 3px rgba(38,113,171,.2)}
.ex-corpo{flex:1;overflow:auto;padding:22px 18px}
.ex-q{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.ex-q .num{font-size:.78rem;font-weight:800;color:var(--azul);text-transform:uppercase;letter-spacing:.06em}
.ex-q .en{font-size:1.12rem;margin:8px 0 16px;white-space:pre-wrap}
.ex-q img{max-width:100%;max-height:340px;border-radius:12px;margin:0 0 14px;display:block}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fbfcfe;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:1rem}
.alt i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;border:2px solid #b8c6d6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.alt.on{border-color:var(--azul);background:#eaf4fc} .alt.on i{background:var(--azul);border-color:var(--azul);color:#fff}
.vf{display:flex;gap:12px} .vf .alt{justify-content:center;font-weight:800}
.ex-q textarea{width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:1rem;resize:vertical}
.ex-q input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:1rem}
.grade{width:100%;border-collapse:collapse;font-size:.92rem} .grade th,.grade td{border:1px solid var(--line);padding:8px;text-align:center} .grade td:first-child{text-align:left}
.grade input{width:20px;height:20px}
.ex-pe{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;background:#fff;border-top:1px solid var(--line)}
.salvo{font-size:.8rem;color:var(--muted)}
.capa{position:fixed;inset:0;z-index:30;background:rgba(7,22,33,.86);display:flex;align-items:center;justify-content:center;padding:20px}
.capa .box{background:#fff;border-radius:20px;max-width:480px;width:100%;padding:26px;text-align:center}
.capa .ico{font-size:3rem;margin-bottom:8px} .capa h2{font-size:1.3rem} .capa p{color:var(--muted);margin:8px 0 18px}
/* ---------- painel do professor ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center} .kpi b{display:block;font-size:1.6rem} .kpi span{font-size:.75rem;color:var(--muted);text-transform:uppercase;font-weight:800}
.tabela{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.9rem}
.tabela th{background:#f5f8fb;text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px}
.tabela td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tabela td small{display:block;color:var(--muted);font-size:.76rem}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c2338;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1} .toast.err{background:var(--red)}
@media (max-width:720px){ .kpis{grid-template-columns:repeat(3,1fr)} .tabela{font-size:.82rem} .ex-q{padding:16px} }
/* sala de espera e contagem */
.espera{text-align:center;border:2px dashed #b9dcc1;background:#f6fbf7;border-radius:16px;padding:18px;margin-top:6px}
.espera .pulso{font-size:2.6rem;animation:pulso 1.6s ease-in-out infinite}
.espera b{display:block;font-size:1.15rem;color:#0f2c4a;margin:6px 0}
@keyframes pulso{50%{transform:scale(1.12);opacity:.7}}
@media (prefers-reduced-motion:reduce){.espera .pulso{animation:none}}
.contagem{position:fixed;inset:0;background:rgba(15,44,74,.94);display:grid;place-items:center;z-index:90;color:#fff;text-align:center}
.contagem b{display:block;font-size:min(42vw,13rem);line-height:1;font-weight:800;color:#8DC63F}
.contagem p{font-size:1.2rem;margin-top:10px}
.chip.c-sala{background:#e7f5ea;color:#1a6b2a}
/* correção das abertas */
.obs{border:1px solid #dde5ee;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.9rem}
.obs p{margin:4px 0 0}
.corr{max-width:980px;width:100%;max-height:92vh;display:flex;flex-direction:column;text-align:left}
.corr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.corr-qs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.corr-crit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.88rem;margin-bottom:8px}
.corr-crit select{padding:6px 8px;border-radius:8px;border:1px solid #cfd8e3;max-width:100%}
.corr-q{background:#f5f8fb;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.corr-q .exp{margin-top:6px;color:#1a6b2a}
.corr-lista{overflow:auto;flex:1;display:grid;gap:10px;padding-right:4px}
.corr-al{border:1px solid #dde5ee;border-radius:12px;padding:10px 12px}
.corr-al-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.corr-pts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.corr-pts .on{background:#1a6b2a;color:#fff;border-color:#1a6b2a}
.corr-n{width:80px;padding:6px 8px;border-radius:8px;border:1px solid #cfd8e3}
.corr-c,.corr-l{width:100%;border:1px solid #cfd8e3;border-radius:8px;padding:6px 8px;font:inherit;font-size:.88rem;margin-top:4px}
.corr-l{background:#fffaf0}
.corr-rod{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
/* foto de confirmação */
.foto-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1.5px solid #cfe0d3;background:#f6fbf7;border-radius:14px;padding:12px;margin:12px 0}
.foto-box .cam{width:160px;height:120px;border-radius:10px;background:#0f2c4a;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:2rem;flex-shrink:0}
.foto-box video,.foto-box img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.foto-box .tx{flex:1;min-width:200px}
.foto-box .tx p{margin:4px 0 8px;font-size:.9rem}
.fotos-bg{position:fixed;inset:0;background:rgba(7,22,33,.55);display:grid;place-items:center;z-index:60;padding:16px}
.fotos-bg .card{max-width:1000px;width:100%}
.fotos-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-height:62vh;overflow:auto;text-align:left}
.fotos-grade .fa{border:1px solid #dde5ee;border-radius:10px;padding:8px}
.fotos-grade .fa b{display:block;font-size:.9rem;margin-bottom:6px}
.fotos-grade .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.fotos-grade figure{margin:0;text-align:center;font-size:.7rem;color:#62758a}
.fotos-grade .im{aspect-ratio:4/3;border-radius:6px;background:#eef2f6;display:grid;place-items:center;overflow:hidden;font-size:.7rem;color:#8a97a6}
.fotos-grade .im img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header class="topo" id="topo"><img src="/assets/pde-logo-64.png" alt=""><div class="t"><small>Portal do Educador</small><b id="topoT">Prova online</b></div><a href="/entrar/" id="lnkVoltar">← Portal</a></header>
<main id="tela"><div class="carregando">Carregando...</div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, onSnapshot, collection, query, where, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import { getStorage, ref as stRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app, "southamerica-east1"), st = getStorage(app);
const chamar = (n, d) => httpsCallable(fns, n, { timeout:120000 })(d).then(r => r.data);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// classificação vinda de Provas e Avaliações: "2º bimestre · Avaliação" ou "Diagnóstica (não vale nota)"
const FIN_NOME = { avaliacao:"Avaliação", trabalho:"Trabalho", recuperacao:"Recuperação", diagnostica:"Diagnóstica", exercicio:"Exercício", simulado:"Simulado" };
const classif = p => !FIN_NOME[p.finalidade] ? "" : (p.periodo ? p.periodo + "º " + ({ 4:"bimestre", 3:"trimestre", 2:"semestre" }[p.periodos] || "bimestre") + " · " : "") + FIN_NOME[p.finalidade] + (p.vale_nota === false ? " (não vale nota)" : "");
const ms = t => t && t.toMillis ? t.toMillis() : (t && t.seconds ? t.seconds * 1000 : 0);
const hora = m => new Date(m).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
const dia = m => new Date(m).toLocaleDateString("pt-BR", { weekday:"short", day:"2-digit", month:"2-digit" });
const mmss = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function toast(m, erro){ const t = $("toast"); t.textContent = m; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 3600); }
const LETRAS = "ABCDEFGH";
const params = new URLSearchParams(location.search);
const E = { user:null, u:null, prova:null, tent:null, i:0, offset:0, timer:null, salvarT:null, pend:{}, ativo:false, ultDesvio:0, unsub:[] };
const agora = () => Date.now() + E.offset;
// um aparelho por vez: cada página aberta é uma sessão; o aparelho guarda um id próprio para contar as trocas
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 36);
E.sessao = novoId();
E.disp = (() => { try{ let d = localStorage.getItem("pe5_disp"); if(!d){ d = novoId(); localStorage.setItem("pe5_disp", d); } return d; }catch(e){ return "s-" + E.sessao; } })();
const TOQUE = (navigator.maxTouchPoints || 0) > 0 && matchMedia("(pointer: coarse)").matches;
function aparelho(){
  const ua = navigator.userAgent;
  if(/CrOS/.test(ua)) return "Chromebook";
  if(/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if(/iPhone|iPod/.test(ua)) return "iPhone";
  if(/Android/.test(ua)) return /Mobile/.test(ua) ? "Celular Android" : "Tablet Android";
  if(/Windows/.test(ua)) return "Windows";
  if(/Macintosh/.test(ua)) return "Mac";
  if(/Linux/.test(ua)) return "Linux";
  return "Outro aparelho";
}
const ICO_AP = { "Chromebook":"💻", "Windows":"🖥️", "Mac":"🖥️", "Linux":"🖥️", "iPad":"📱", "Tablet Android":"📱", "iPhone":"📱", "Celular Android":"📱" };
const tref = () => doc(db, "provas_online", E.prova.id, "po_tentativas", E.chave);

/* =================== LISTAS =================== */
async function lista(){
  const prof = ["professor", "gestor", "admin"].includes(E.u.perfil);
  $("topoT").textContent = prof ? "Minhas provas online" : "Minhas provas";
  const q = prof ? query(collection(db, "provas_online"), where("professor_uid", "==", E.user.uid)) : (E.alunoId ? query(collection(db, "provas_online"), where("alunos_ids", "array-contains", E.alunoId)) : query(collection(db, "provas_online"), where("alunos_uids", "array-contains", E.user.uid)));
  // ao vivo: prova aplicada agora aparece sem recarregar
  E.unsub.push(onSnapshot(q, s => { const l = []; s.forEach(d => l.push({ id:d.id, ...d.data() })); desenharLista(prof, l); },
    e => { $("tela").innerHTML = '<div class="card vazio">Não foi possível carregar ('+esc(e.code || "erro")+').</div>'; }));
}
function desenharLista(prof, l){
  l = l.filter(p => p.status !== "cancelada").sort((a, b) => ms(b.abre_em) - ms(a.abre_em));
  $("tela").innerHTML = '<h1>'+(prof ? "📡 Provas online" : "📝 Minhas provas")+'</h1><p class="sub" style="margin-bottom:16px">'+(prof ? "Para aplicar uma prova nova, abra Provas e Avaliações e use o botão “Aplicar online”." : "As provas que seus professores marcaram para você.")+'</p>'+
    (prof ? '<p style="margin-bottom:16px"><a class="btn btn-pri" href="/provas/">📝 Abrir Provas e Avaliações</a></p>' : '')+
    '<div class="lista">'+(l.map(p => { const st = situacaoProva(p);
      return '<a class="item" href="?'+(prof ? "painel" : "id")+'='+encodeURIComponent(p.id)+'"><span class="ic">📝</span><span class="tx"><b>'+esc(p.titulo)+'</b><small>'+esc([p.disciplina, p.turma_nome, classif(p)].filter(Boolean).join(" · "))+' · '+dia(ms(p.abre_em))+' '+hora(ms(p.abre_em))+' às '+hora(ms(p.fecha_em))+'</small></span><span class="chip '+st[1]+'">'+st[0]+'</span></a>'; }).join("") || '<div class="card vazio">Nenhuma prova por aqui ainda.</div>')+'</div>';
}
function situacaoProva(p){
  const t = agora();
  if(p.status === "agendada" && p.aguardando) return ["Sala de espera", "c-age"];
  if(p.status === "encerrada" || ms(p.fecha_em) < t) return ["Encerrada", "c-ent"];
  if(ms(p.abre_em) > t) return ["Agendada", "c-age"];
  return ["Aberta agora", "c-and"];
}

/* =================== ALUNO =================== */
async function telaAluno(id){
  try{ const s = await getDoc(doc(db, "provas_online", id)); if(!s.exists()) throw { code:"not-found" }; E.prova = { id:s.id, ...s.data() }; }
  catch(e){ $("tela").innerHTML = '<div class="card vazio">Prova não encontrada para você.</div>'; return; }
  $("topoT").textContent = E.prova.titulo;
  E.unsub.push(onSnapshot(doc(db, "provas_online", id), s => { if(!s.exists()) return; E.prova = { id:s.id, ...s.data() }; if(!E.ativo && !E.tent) introAluno(); }, () => {}));
  clearInterval(E.relogio); E.relogio = setInterval(() => { if(!E.ativo && !E.tent && E.prova) introAluno(); }, 20000);
  const tref = doc(db, "provas_online", id, "po_tentativas", E.chave);
  E.unsub.push(onSnapshot(tref, s => { E.tent = s.exists() ? s.data() : null; reagirTentativa(); }, () => { E.tent = null; reagirTentativa(); }));
}
function reagirTentativa(){
  const t = E.tent;
  if(!t){ if(!E.ativo) introAluno(); return; }
  if(t.sessao === E.sessao) E.minhaVista = true;
  if(t.status === "em_andamento"){
    if(E.ativo){
      if(E.minhaVista && t.sessao && t.sessao !== E.sessao){ outroAparelho(); return; }
      if($("capaBloq")) liberadaPeloProfessor(); return;
    }
    if(E.fora) return; // este aparelho perdeu a vez: espera o aluno tocar em "Fazer neste aparelho"
    retomar(); return;
  }
  if(t.status === "bloqueada"){ telaBloqueada(); return; }
  if(t.status === "entregue"){ sairExec(); telaEntregue(); }
}
function introAluno(){
  fecharCamera();   // a tela é redesenhada (ex.: a prova abriu): a câmera ligada sem foto tirada é desligada
  const SAIDAS = TOQUE ? "trocar de aplicativo, de aba ou ir para a tela inicial" : "trocar de aba, minimizar ou sair da tela cheia";
  const p = E.prova, ab = ms(p.abre_em), fe = ms(p.fecha_em), t = agora();
  const aberta = p.status === "agendada" && t >= ab && t <= fe;

// guarda em provas_online/{prova}/fotos/{aluno}/{inicio|entrega}.jpg; regra do Storage: só o próprio aluno envia
async function abrirCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("sem câmera");
  return navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:640 }, height:{ ideal:480 } }, audio:false });
}
function fotografar(video){
  const c = document.createElement("canvas"), w = 480, h = Math.round(w * (video.videoHeight || 480) / (video.videoWidth || 640));
  c.width = w; c.height = h; c.getContext("2d").drawImage(video, 0, 0, w, h);
  return new Promise(ok => c.toBlob(b => ok(b), "image/jpeg", 0.7));
}
const fecharCamera = () => { if(E.cam){ E.cam.getTracks().forEach(t => t.stop()); E.cam = null; } };
const caminhoFoto = (chave, momento) => "provas_online/" + E.prova.id + "/fotos/" + chave + "/" + momento + ".jpg";
async function enviarFoto(blob, momento){ await uploadBytes(stRef(st, caminhoFoto(E.chave, momento)), blob, { contentType:"image/jpeg" }); }
async function fotoLigar(){

    E.cam = await abrirCamera();
    const v = document.createElement("video"); v.playsInline = true; v.muted = true; v.srcObject = E.cam; $("fotoCam").innerHTML = ""; $("fotoCam").appendChild(v); await v.play();
    b.textContent = "📸 Tirar a foto"; b.dataset.action = "foto-tirar"; b.disabled = false;

}
async function fotoTirar(){

// sem câmera (negada ou aparelho sem câmera): o aluno começa mesmo assim e o professor vê que ficou sem foto
function fotoSemCamera(){

// foto da entrega: depois que o servidor registrou a entrega (não conta como saída); nunca atrapalha a entrega
async function fotoEntrega(){
  if(!E.prova || !E.prova.fotos) return;
  try{
    const cam = await Promise.race([abrirCamera(), new Promise((_, n) => setTimeout(() => n(new Error("tempo")), 6000))]);
    const v = document.createElement("video"); v.playsInline = true; v.muted = true; v.srcObject = cam; await v.play();

    await enviarFoto(blob, "entrega");
  }catch(e){ console.warn("foto entrega:", e.code || e.message || e); }

async function telaCheia(){ try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI:"hide" }); }catch(e){} }

const temTelaCheia = () => !!document.documentElement.requestFullscreen;

function retomar(){

function reivindicar(){

  // auditoria: cada entrada na prova fica registrada (hora do servidor e aparelho)
  const evs = [{ t:agora(), e:"entrou", m:upd.aparelho }];
  if(t.disp && t.disp !== E.disp){ upd.trocas = (t.trocas || 0) + 1; evs.push({ t:agora(), e:"troca", m:"passou para " + upd.aparelho }); }
  if(((t.eventos || []).length) < 70) upd.eventos = arrayUnion(...evs);
  updateDoc(tref(), upd).catch(e => console.warn("sessao:", e.code));
}

/* ---------- proteção: avisos e bloqueio ---------- */
function desvio(motivo){
  if(!E.ativo || E.desarmar || E.entregando || !E.tent || E.tent.status !== "em_andamento") return;
  const t = Date.now(); if(t - E.ultDesvio < 2500) return; E.ultDesvio = t;
  const n = (E.tent.desvios || 0) + 1, max = E.tent.avisos_max ?? 1;
  const tref = doc(db, "provas_online", E.prova.id, "po_tentativas", E.chave);
  const ev = { t:agora(), e:"desvio", m:motivo };
  if(n > max){
    clearTimeout(E.salvarT); salvar();
    updateDoc(tref, { desvios:n, status:"bloqueada", bloqueado_em:serverTimestamp(), eventos:arrayUnion(ev) }).catch(e => console.warn("bloqueio:", e.code));
    E.tent = { ...E.tent, desvios:n, status:"bloqueada" }; telaBloqueada();
  } else {
    updateDoc(tref, { desvios:n, eventos:arrayUnion(ev) }).catch(e => console.warn("desvio:", e.code));
    E.tent = { ...E.tent, desvios:n };
    capa("⚠️", "Atenção: você saiu da prova", "Aviso "+n+" de "+max+". Se sair de novo, a prova será bloqueada e só o professor poderá liberar.", '<button class="btn btn-ok" data-action="voltar-prova">Voltar à prova</button>');
  }
}
function telaBloqueada(){
  E.ativo = true;

}

  try{ const r = await chamar("aplicarRecuperacao", { id:E.prova.id, uids, modo:"agora", duracao_min:+$("recDur").value, tolerancia_min:+$("recTol").value });
    fecharCapa(); toast("Recuperação aplicada para " + r.alunos + " aluno(s). Abrindo o painel..."); setTimeout(() => { location.href = "?painel=" + encodeURIComponent(r.id); }, 900); }
  catch(e){ toast(e.message || "Não foi possível aplicar.", true); btn.disabled = false; btn.textContent = "Aplicar a recuperação agora (abre em 10 s)"; }
}
async function acao(dados, btn){
  if(btn) btn.disabled = true;
  try{ await chamar("acaoProvaOnline", { id:E.prova.id, ...dados }); fecharCapa(); toast("Feito."); }
  catch(e){ toast(e.message || "Não foi possível.", true); }
  finally{ if(btn) btn.disabled = false; }
}

/* =================== AÇÕES =================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  if(a === "comecar") comecar(el);
  else if(a === "pronto") ficarPronto();
  else if(a === "foto-ligar") fotoLigar();
  else if(a === "foto-tirar") fotoTirar();
  else if(a === "pn-fotos") painelFotos();
  else if(a === "pn-corrigir"){ if(CORRECAO_NO_AR) abrirCorrecao(); }
  else if(a === "corr-q"){ if(Object.keys(CO.sujo).length && !confirmarSaida()) return; abrirCorrecao(arg); }
  else if(a === "corr-pt") marcarPontos(arg);
  else if(a === "corr-salvar") salvarCorrecao(el);
  else if(a === "corr-fechar"){ if(Object.keys(CO.sujo).length && !confirmarSaida()) return; const b = $("corrBg"); if(b) b.remove(); }
  else if(a === "fotos-fechar"){ const b = $("fotosBg"); if(b) b.remove(); }
  else if(a === "pn-copiar"){ const url = location.origin + "/prova/?id=" + encodeURIComponent(E.prova.id || params.get("painel"));
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copiado. No Portal Maestro, use Enviar conteúdo e cole o link."), () => { prompt("Copie o link da prova:", url); }); }
  else if(a === "continuar" || a === "usar-aqui"){ telaCheia().then(iniciarExec); }
  else if(a === "voltar-prova"){ fecharCapa(); telaCheia(); if(!$("exec")) iniciarExec(); }
  else if(a === "fechar-capa") fecharCapa();
  else if(a === "ir"){ salvar(); E.i = +arg; desenharQuestao(); desenharPaleta(); }
  else if(a === "ant"){ if(E.i > 0){ E.i--; desenharQuestao(); desenharPaleta(); } }
  else if(a === "prox"){ const n = questoesOrd().length; if(E.i < n - 1){ E.i++; desenharQuestao(); desenharPaleta(); } else revisar(); }
  else if(a === "entregar") revisar();
  else if(a === "confirmar-entrega"){ el.disabled = true; entregar(false); }
  else if(a === "alt"){
    const q = questoesOrd()[E.i], oi = +arg;
    if(q.tipo === "multipla") marcar(q.id, oi);
    else { const s = new Set(Array.isArray(resp(q.id)) ? resp(q.id) : []); s.has(oi) ? s.delete(oi) : s.add(oi); marcar(q.id, [...s].sort((x, y) => x - y)); }
    desenharQuestao();
  }
  else if(a === "vf"){ const q = questoesOrd()[E.i]; marcar(q.id, arg); desenharQuestao(); }
  else if(a === "pn-liberar") modalLiberar(arg);
  else if(a === "pn-lib-ok") acao({ acao:"liberar", uid:arg, modo:el.dataset.modo }, el);
  else if(a === "pn-tempo") acao({ acao:"tempo", uid:arg, min:10 }, el);
  else if(a === "pn-encerrar"){
    capa("⏹️", "Encerrar a prova agora?", "Quem ainda está fazendo terá a prova entregue com o que respondeu até agora. E a nota para os alunos?",
      '<div style="display:grid;gap:8px"><button class="btn btn-ok" data-action="pn-enc-ok" data-notas="agora">Encerrar e mostrar a nota aos alunos agora</button>'+
      '<button class="btn btn-gh" data-action="pn-enc-ok" data-notas="reter">Encerrar e guardar as notas até o fechamento do bimestre</button>'+
      '<button class="btn btn-gh" data-action="fechar-capa">Cancelar (a prova continua)</button></div>');
  }
  else if(a === "pn-notas") acao({ acao:"liberar_notas" }, el);
  else if(a === "pn-enc-ok") acao({ acao:"encerrar", notas:el.dataset.notas }, el);
  else if(a === "pn-reter") acao({ acao:"reter_notas" }, el);
  else if(a === "pn-recup") modalRecuperacao();
  else if(a === "pn-rec-ok") aplicarRecup(el);
  else if(a === "pn-abrir") acao({ acao:"abrir_agora" }, el);
  else if(a === "pn-rel") relatorios([arg], el);
  else if(a === "pn-rel-turma") relatorios((E.prova.alunos || []).map(x => x.uid).filter(u => PN.tent[u]), el);
  else if(a === "pn-auditoria") auditoriaCsv();
});

/* =================== ENTRADA =================== */
onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/?como=aluno&volta=" + encodeURIComponent(location.pathname + location.search)); return; }
  let u = null; try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo"){ location.replace("/entrar/"); return; }
  E.user = user; E.u = u;
  // hora certa: o relógio do tablet/computador pode estar errado; usa a hora do servidor (cabeçalho Date)
  try{ const r = await fetch("/prova/?t=" + Date.now(), { method:"HEAD", cache:"no-store" }), h = r.headers.get("date"); if(h){ const sv = new Date(h).getTime(); if(sv > 0) E.offset = sv + 500 - Date.now(); } }catch(e){}
  // aluno da matrícula (código + PIN ou Google da escola): a tentativa é da matrícula, não da conta
  try{ const tk = await user.getIdTokenResult(); E.alunoId = tk.claims.aluno_id || ""; }catch(e){ E.alunoId = ""; }
  E.chave = E.alunoId ? "m-" + E.alunoId : user.uid;
  if(params.get("painel")) painel(params.get("painel"));
  else if(params.get("id")) telaAluno(params.get("id"));
  else lista();
});
