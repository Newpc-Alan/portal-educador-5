<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dicas do Professor · Portal do Educador</title>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#071621; --escuro-2:#0c2338; --azul:#2671AB; --azul-2:#2E9BD6; --lima:#8DC63F; --verde:#5A9420;
  --bg:#f4f7fa; --ink:#0c2338; --ink-2:#2C3E55; --muted:#6b7c90; --line:#dce4ed; --surface:#fff;
  --red:#C2362C; --amber:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a{color:var(--azul)}
.app{max-width:1100px;margin:0 auto;padding:0 16px 60px}

/* topo */
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 16px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;
  background:radial-gradient(600px 200px at 0% 0%,rgba(46,155,214,.35),transparent 60%),linear-gradient(135deg,#071621,#123556);
  box-shadow:0 14px 30px -20px rgba(7,22,33,.8);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem;letter-spacing:-.01em}
.marca span{display:block;font-size:.76rem;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo-acoes{display:flex;gap:6px;flex-wrap:wrap}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.on{background:#fff;color:var(--escuro-2);border-color:#fff}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}
.tb .n{background:var(--red);color:#fff;border-radius:99px;font-size:.66rem;padding:1px 7px}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.86rem;white-space:nowrap;line-height:1.2;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--azul);color:#fff}.btn-pri:hover{background:#1f5f91}
.btn-ok{background:var(--verde);color:#fff}.btn-ok:hover{background:#4a7c19}
.btn-gh{background:#fff;color:var(--ink);border-color:var(--line)}.btn-gh:hover{border-color:#b8c6d6}
.btn-red{background:#fff;color:var(--red);border-color:#efc9c5}.btn-red:hover{background:#fbedeb}
.btn-sm{padding:7px 11px;font-size:.78rem;border-radius:8px}

.destaque{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:16px;margin-bottom:16px;color:#fff;
  background:radial-gradient(500px 180px at 0% 0%,rgba(141,198,63,.28),transparent 60%),linear-gradient(135deg,#0c2338,#1b4a74)}
.destaque-ico{font-size:36px}
.destaque-txt{flex:1;min-width:220px}
.destaque-txt b{font-size:1.1rem;display:block}
.destaque-txt span{font-size:.88rem;color:rgba(255,255,255,.8)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,44,74,.05)}
.h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--muted);font-size:.86rem}

/* filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.filtros input,.filtros select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:.86rem}
.filtros input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}

/* dicas publicadas */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dica{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(15,44,74,.05)}
.dica-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tipo{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#E8F3FB;color:#1f5f91}
.tipo.t-app{background:#eef7e2;color:#3d6b0c}.tipo.t-material{background:#fdf0e1;color:#9a5b00}.tipo.t-atividade{background:#f1ecfb;color:#5b3fa0}
.meta{font-size:.74rem;color:var(--muted)}
.dica h3{font-size:1rem;line-height:1.3;letter-spacing:-.01em}
.dica p.txt{font-size:.88rem;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.dica.curta p.txt{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mais{align-self:flex-start;background:none;border:0;color:var(--azul);font-weight:700;font-size:.8rem;padding:0}
.anexos{display:flex;flex-direction:column;gap:6px}
.anexo{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:.82rem;background:#f6f9fc;border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-decoration:none;color:var(--ink);overflow:hidden}
.anexo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.anexo small{color:var(--muted);flex:none}
.credito{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--muted)}
.credito b{color:var(--ink)}

/* formulario */
.form{display:flex;flex-direction:column;gap:14px}
.tipos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tipo-op{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px}
.tipo-op b{font-size:.88rem}
.tipo-op small{font-size:.74rem;color:var(--muted);line-height:1.35}
.tipo-op .e{font-size:22px}
.tipo-op.on{border-color:var(--azul-2);background:#eef6fc;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo.l2{grid-column:1/-1}
.campo label{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:.9rem}
.campo textarea{min-height:130px;resize:vertical;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul-2);box-shadow:0 0 0 3px rgba(46,155,214,.18);background:#fff}
.campo .ajuda{font-size:.72rem;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:6px}
.link-l{display:flex;gap:6px}
.link-l input{flex:1}
.drop{border:2px dashed #c5d6e6;border-radius:12px;padding:18px;text-align:center;background:#fbfcfe;color:var(--muted);font-size:.86rem}
.drop.sobre{border-color:var(--azul-2);background:#eef6fc}
.drop b{color:var(--azul)}
.arqs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.arq{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.82rem}
.arq span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq small{color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--verde)}
.form-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progresso{font-size:.84rem;color:var(--muted)}

/* listas */
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item-ico{width:42px;height:42px;border-radius:10px;background:#E8F3FB;display:grid;place-items:center;font-size:20px}
.item b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;font-size:.76rem;color:var(--muted)}
.item-acoes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.st.novo{background:#e6f1fb;color:#1f5f91}.st.publicado{background:#eef7e2;color:#3d6b0c}.st.recusado{background:#fdecea;color:#a3322d}
.st.email-ok{background:#eef7e2;color:#3d6b0c}.st.email-falhou{background:#fdf0e1;color:#9a5b00}
.vazio{text-align:center;color:var(--muted);padding:34px 10px;font-size:.9rem}
.carregando{padding:60px 10px;text-align:center;color:var(--muted)}

/* modal */
.mb{position:fixed;inset:0;z-index:90;background:rgba(7,22,33,.55);display:none;align-items:center;justify-content:center;padding:16px}
.mb.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(7,22,33,.6)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h b{font-size:1rem}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.fechar{border:0;background:#f1f4f8;border-radius:8px;width:32px;height:32px;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.86rem}
.kv dt{color:var(--muted);font-weight:700;font-size:.76rem}
.kv dd{overflow-wrap:anywhere;white-space:pre-line}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;background:var(--escuro-2);color:#fff;padding:11px 18px;border-radius:12px;font-size:.86rem;font-weight:600;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}

@media (max-width:760px){ .tipos{grid-template-columns:1fr 1fr} .campos{grid-template-columns:1fr} }
@media (max-width:600px){
  .topo{padding:10px 14px;position:static}
  .marca span{display:none}
  .item{grid-template-columns:36px 1fr} .item-acoes{grid-column:1/-1;justify-content:flex-start}
  .grade{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
.aviso{background:#fff7e6;border:1px solid #f3d9a4;color:#7a5200;border-radius:12px;padding:10px 14px;font-size:.88rem}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Portal do Educador</small><b>Dicas do Professor</b><span id="quem">Carregando...</span></div></div>
    <nav class="topo-acoes" aria-label="Seções">
      <button class="tb" data-action="ir" data-arg="dicas">💡 Dicas da rede</button>
      <button class="tb" data-action="ir" data-arg="enviar">✉️ Enviar minha dica</button>
      <button class="tb" data-action="ir" data-arg="meus">📁 Meus envios</button>
      <button class="tb" data-action="ir" data-arg="recebidas" id="tbRecebidas" hidden>📥 Recebidas <span class="n" id="nNovas" hidden></span></button>
      <a class="tb lima" href="/entrar/">← Portal</a>
    </nav>
  </header>
  <main id="tela"><div class="carregando">Carregando...</div></main>
</div>

<div class="mb" id="mb"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTit">
  <div class="modal-h"><b id="mTit"></b><button class="fechar" data-action="fechar" aria-label="Fechar">×</button></div>
  <div class="modal-b" id="mCorpo"></div>
  <div class="modal-f" id="mPe"></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as stRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const auth = getAuth(app), db = getFirestore(app), st = getStorage(app);

const TIPOS = [
  { id:"dica",      e:"💡", nome:"Dica de aula",       d:"Uma estratégia, dinâmica ou ideia que funcionou na sua turma" },
  { id:"app",       e:"📱", nome:"Aplicativo ou site", d:"Ferramenta digital que você usa e recomenda" },
  { id:"material",  e:"📎", nome:"Material",           d:"Arquivo pronto: slides, ficha, plano, jogo impresso" },
  { id:"atividade", e:"✏️", nome:"Atividade",          d:"Proposta de atividade para os alunos com passo a passo" }
];
// Dica do Aluno: mesmo app, outro modo (coleções, tipos e regras próprias; sem arquivo, máx. 2 links)
const TIPOS_ALUNO = [
  { id:"estudo",      e:"📚", nome:"Dica de estudo", d:"Um jeito de estudar ou lembrar a matéria que funciona" },
  { id:"app",         e:"📱", nome:"Site ou app",    d:"Algo que te ajuda a aprender" },
  { id:"curiosidade", e:"🔎", nome:"Curiosidade",    d:"Uma descoberta legal sobre ciência, história, o mundo" },
  { id:"desafio",     e:"🧩", nome:"Desafio",        d:"Uma charada, enigma ou desafio para a galera" }
];
const MODO_ALUNO = { col:"dicas_alunos", pub:"dicas_alunos_pub", maxLinks:2, maxTexto:1500, maxTitulo:100 };
const primeiroNome = n => String(n || "").trim().split(/\s+/)[0] || "Aluno(a)";
const DISCIPLINAS = ["Língua Portuguesa","Matemática","Ciências","História","Geografia","Arte","Educação Física","Língua Inglesa","Ensino Religioso","Computação","Educação Infantil","Educação Especial","Interdisciplinar"];
const ETAPAS = ["Educação Infantil","Anos iniciais (1º ao 5º)","Anos finais (6º ao 9º)","Ensino Médio","EJA","Todas as etapas"];
const MAX_ARQ = 5, MAX_MB = 10, MAX_TOTAL_MB = 20, MAX_LINKS = 5;
const ACEITOS = /^(application\/pdf|image\/.*|application\/vnd\.openxmlformats-officedocument\..*|application\/msword|application\/vnd\.ms-excel|application\/vnd\.ms-powerpoint)$/;

const E = { user:null, u:null, admin:false, aluno:false, muniId:"", escola:"", muni:"", tela:"dicas", publicadas:null, meus:null, recebidas:null,
  filtroTipo:"todos", filtroDisc:"", busca:"", filtroSt:"novo", form:null, enviando:false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const tiposAtivos = () => E.aluno ? TIPOS_ALUNO : TIPOS;
const tipoDe = id => tiposAtivos().find(t => t.id === id) || tiposAtivos()[0];
const tam = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const quando = ts => { const ms = ts && ts.toMillis ? ts.toMillis() : (ts && ts.__ms) || 0; return ms ? new Date(ms).toLocaleDateString("pt-BR") : "agora"; };
const ms = ts => ts && ts.toMillis ? ts.toMillis() : (ts && ts.__ms) || 0;
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 3600); }
function linkOk(u){ try{ const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:"; }catch(e){ return false; } }
function nomeSeguro(n){ return String(n).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.\-]+/g, "_").slice(-80) || "arquivo"; }

/* ---------- navegacao ---------- */
function ir(t){
  E.tela = t;
  document.querySelectorAll(".topo-acoes .tb[data-arg]").forEach(b => b.classList.toggle("on", b.dataset.arg === t));
  try{ history.replaceState(null, "", "#" + t); }catch(e){}
  if(t === "dicas") telaDicas();
  else if(t === "enviar") telaEnviar();
  else if(t === "meus") telaMeus();
  else if(t === "recebidas" && E.admin) telaRecebidas();
  else telaDicas();
  window.scrollTo({ top:0 });
}

/* ---------- dicas publicadas ---------- */
async function carregarPublicadas(forcar){
  if(E.publicadas && !forcar) return;
  const s = await getDocs(E.aluno ? collection(db, MODO_ALUNO.pub) : query(collection(db, "dicas_envios"), where("status", "==", "publicado")));
  E.publicadas = []; s.forEach(d => E.publicadas.push({ id:d.id, ...d.data() }));
  E.publicadas.sort((a, b) => ms(b.publicado_em || b.criado_em) - ms(a.publicado_em || a.criado_em));
}
async function telaDicas(){
  const tela = $("tela");
  tela.innerHTML = '<div class="carregando">Carregando as dicas...</div>';
  try{ await carregarPublicadas(); }catch(e){ tela.innerHTML = '<div class="vazio">Não foi possível carregar as dicas agora.</div>'; return; }
  const n = E.publicadas.length;
  tela.innerHTML =
    (E.aluno
      ? '<div class="destaque"><div class="destaque-ico">💬</div><div class="destaque-txt"><b>Dicas de aluno para aluno</b>' +
        '<span>Jeitos de estudar, sites, curiosidades e desafios enviados pela galera e revisados pela equipe do Portal.</span></div>'
      : '<div class="destaque"><div class="destaque-ico">💡</div><div class="destaque-txt"><b>Ideias que funcionam, de professor para professor</b>' +
        '<span>Dicas de aula, aplicativos, materiais e atividades enviados por educadores da rede e revisados pela equipe do Portal.</span></div>') +
    '<button class="btn btn-ok" data-action="ir" data-arg="enviar">✉️ Compartilhar uma dica</button></div>' +
    '<div class="filtros"><input id="fBusca" type="search" placeholder="Buscar por título, assunto ou autor" value="' + esc(E.busca) + '">' +
    '<select id="fDisc"><option value="">Todas as disciplinas</option>' + DISCIPLINAS.map(d => '<option' + (d === E.filtroDisc ? " selected" : "") + '>' + esc(d) + '</option>').join("") + '</select></div>' +
    '<div class="chips" style="margin-bottom:14px">' + [{ id:"todos", e:"", nome:"Todas" }].concat(tiposAtivos()).map(t => '<button class="chip' + (E.filtroTipo === t.id ? " on" : "") + '" data-action="filtro-tipo" data-arg="' + t.id + '">' + (t.e ? t.e + " " : "") + esc(t.nome) + '</button>').join("") + '</div>' +
    '<div class="grade" id="grade"></div>';
  $("fBusca").addEventListener("input", e => { E.busca = e.target.value; desenharGrade(); });
  $("fDisc").addEventListener("change", e => { E.filtroDisc = e.target.value; desenharGrade(); });
  desenharGrade();
  if(!n) $("grade").outerHTML = '<div class="card vazio">Ainda não há dicas publicadas. Que tal ser o primeiro a compartilhar?<br><br><button class="btn btn-ok" data-action="ir" data-arg="enviar">Enviar minha dica</button></div>';
}
function desenharGrade(){
  const g = $("grade"); if(!g) return;
  const b = E.busca.trim().toLowerCase();
  const lista = E.publicadas.filter(d => (E.filtroTipo === "todos" || d.tipo === E.filtroTipo) && (!E.filtroDisc || d.disciplina === E.filtroDisc) &&
    (!b || [d.titulo, d.texto, d.autor_nome, d.disciplina].join(" ").toLowerCase().includes(b)));

function lerForm(){ const f = E.form; if(!$("fTit")) return; f.titulo = $("fTit").value; f.texto = $("fTxt").value; f.disciplina = $("fDis").value; if($("fEta")) f.etapa = $("fEta").value; if($("fCred")) f.credito = $("fCred").checked; f.links = [...document.querySelectorAll("[data-link]")].map(x => x.value); }
function addArquivos(lista){
  const f = E.form;
  for(const a of lista){
    if(f.arquivos.length >= MAX_ARQ){ toast("No máximo " + MAX_ARQ + " arquivos por envio.", true); break; }
    if(!ACEITOS.test(a.type)){ toast("\"" + a.name + "\" não é um tipo aceito.", true); continue; }
    if(a.size > MAX_MB * 1048576){ toast("\"" + a.name + "\" passa de " + MAX_MB + " MB.", true); continue; }
    const total = f.arquivos.reduce((s, x) => s + x.size, 0) + a.size;
    if(total > MAX_TOTAL_MB * 1048576){ toast("O total dos arquivos passa de " + MAX_TOTAL_MB + " MB.", true); break; }
    f.arquivos.push(a);
  }
  lerForm(); telaEnviar();
}
async function enviar(){
  if(E.enviando) return;
  const f = E.form;
  const titulo = f.titulo.trim(), texto = f.texto.trim();
  const links = f.links.map(l => l.trim()).filter(Boolean);
  if(titulo.length < 4){ toast("Dê um título para a sua dica.", true); $("fTit").focus(); return; }
  if(texto.length < 20){ toast("Conte um pouco mais sobre a dica (pelo menos 20 caracteres).", true); $("fTxt").focus(); return; }
  const ruim = links.find(l => !linkOk(l)); if(ruim){ toast("Confira o link: " + ruim, true); return; }
  E.enviando = true; $("fEnviar").disabled = true;
  const ref = doc(collection(db, "dicas_envios"));
  try{
    const arquivos = [];
    for(let i = 0; i < f.arquivos.length; i++){
      const a = f.arquivos[i];
      $("fProg").textContent = "Enviando arquivo " + (i + 1) + " de " + f.arquivos.length + "...";
      const path = "dicas/" + E.user.uid + "/" + ref.id + "/" + (i + 1) + "-" + nomeSeguro(a.name);
      await uploadBytes(stRef(st, path), a, { contentType:a.type });
      arquivos.push({ nome:a.name.slice(0, 120), path, tamanho:a.size, tipo:a.type });
    }
    $("fProg").textContent = "Registrando...";
    await setDoc(ref, {
      tipo:f.tipo, titulo:titulo.slice(0, 120), texto:texto.slice(0, 4000), disciplina:f.disciplina, etapa:f.etapa,
      links:links.slice(0, MAX_LINKS), arquivos, credito:!!f.credito,
      autor_uid:E.user.uid, autor_nome:(E.u.nome || E.user.displayName || "").slice(0, 120), autor_email:E.user.email || "",
      escola_nome:E.escola.slice(0, 160), municipio_nome:E.muni.slice(0, 160),
      status:"novo", criado_em:serverTimestamp()
    });
    E.form = null; E.meus = null;
    toast("Dica enviada! A equipe do Portal recebeu por e-mail.");
    ir("meus");
  }catch(e){
    console.error(e);
    toast("Não foi possível enviar agora. Confira sua conexão e tente de novo.", true);
    $("fProg").textContent = "";
  }finally{ E.enviando = false; const b = $("fEnviar"); if(b) b.disabled = false; }
}

    '<dt>Descrição</dt><dd>' + esc(d.texto) + '</dd></dl>' +
    ((d.links || []).length || (d.arquivos || []).length ? '<div class="anexos">' +
      (d.links || []).map(u => '<a class="anexo" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">🔗 <span>' + esc(u) + '</span></a>').join("") +
      (d.arquivos || []).map((a, i) => '<button class="anexo" data-action="baixar" data-arg="' + esc(d.id) + '" data-i="' + i + '">📄 <span>' + esc(a.nome) + '</span><small>' + tam(a.tamanho || 0) + '</small></button>').join("") + '</div>' : "") +
    (E.admin ? '<div class="campo"><label for="mRet">Retorno para ' + (E.aluno ? "o aluno" : "o professor") + ' (aparece em Meus envios)</label><input id="mRet" maxlength="300" value="' + esc(d.retorno || "") + '"></div>' : "");
  $("mPe").innerHTML = E.admin
    ? '<button class="btn btn-red btn-sm" data-action="excluir" data-arg="' + esc(d.id) + '">Excluir</button>' +
      (d.status !== "recusado" ? '<button class="btn btn-gh btn-sm" data-action="recusar" data-arg="' + esc(d.id) + '">Não publicar</button>' : "") +
      (d.status !== "publicado" ? '<button class="btn btn-ok btn-sm" data-action="publicar" data-arg="' + esc(d.id) + '">Publicar</button>' : '<button class="btn btn-gh btn-sm" data-action="despublicar" data-arg="' + esc(d.id) + '">Despublicar</button>')
    : '<button class="btn btn-gh btn-sm" data-action="fechar">Fechar</button>';
  $("mb").classList.add("show");
}
function fechar(){ $("mb").classList.remove("show"); }

async function mudarStatus(id, status){
  const d = acharEnvio(id); if(!d) return;
  const ret = $("mRet") ? $("mRet").value.trim().slice(0, 300) : (d.retorno || "");
  const dados = { status, retorno:ret, revisado_em:serverTimestamp(), revisado_por:E.user.uid };
  if(status === "publicado") dados.publicado_em = serverTimestamp();
  try{
    if(E.aluno){
      // so o que pode ficar publico vai para dicas_alunos_pub (sem nome completo nem e-mail do aluno)
      const lote = writeBatch(db);
      lote.update(doc(db, MODO_ALUNO.col, id), dados);
      if(status === "publicado") lote.set(doc(db, MODO_ALUNO.pub, id), { tipo:d.tipo, titulo:d.titulo, texto:d.texto, disciplina:d.disciplina || "", links:d.links || [],
        autor_primeiro:primeiroNome(d.autor_nome), escola_nome:d.escola_nome || "", municipio_nome:d.municipio_nome || "", publicado_em:serverTimestamp() });
      else lote.delete(doc(db, MODO_ALUNO.pub, id));
      await lote.commit();
    }else await updateDoc(doc(db, "dicas_envios", id), dados);
    Object.assign(d, { status, retorno:ret });
    E.publicadas = null; fechar();
    toast(status === "publicado" ? (E.aluno ? "Dica publicada em Dicas da galera." : "Dica publicada em Dicas da rede.") : status === "recusado" ? "Marcada como não publicada." : "Dica despublicada.");
    if(E.tela === "recebidas") telaRecebidas(); else contarNovas();
  }catch(e){ toast("Não foi possível salvar.", true); }
}
async function excluir(id, meu){
  if(!confirm(meu ? "Excluir este envio? A equipe não vai mais vê-lo no Portal." : "Excluir este envio de vez?")) return;
  try{
    if(E.aluno){ const lote = writeBatch(db); lote.delete(doc(db, MODO_ALUNO.col, id)); if(!meu) lote.delete(doc(db, MODO_ALUNO.pub, id)); await lote.commit(); }
    else await deleteDoc(doc(db, "dicas_envios", id));
    if(E.meus) E.meus = E.meus.filter(x => x.id !== id);
    if(E.recebidas) E.recebidas = E.recebidas.filter(x => x.id !== id);
    E.publicadas = null; fechar(); toast("Envio excluído.");
    if(E.tela === "meus") telaMeus(); else if(E.tela === "recebidas") telaRecebidas();
  }catch(e){ toast("Não foi possível excluir.", true); }
}

/* ---------- acoes (delegacao) ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  if(a === "ir"){ fechar(); ir(arg); }
  else if(a === "filtro-tipo"){ E.filtroTipo = arg; document.querySelectorAll('[data-action="filtro-tipo"]').forEach(b => b.classList.toggle("on", b.dataset.arg === arg)); desenharGrade(); }
  else if(a === "filtro-st"){ E.filtroSt = arg; telaRecebidas(); }
  else if(a === "mais"){ const c = $("d-" + arg); if(c){ c.classList.remove("curta"); el.remove(); } }
  else if(a === "tipo"){ lerForm(); E.form.tipo = arg; telaEnviar(); }
  else if(a === "link-add"){ lerForm(); if(E.form.links.length < (E.aluno ? MODO_ALUNO.maxLinks : MAX_LINKS)) E.form.links.push(""); telaEnviar(); }
  else if(a === "link-rem"){ lerForm(); E.form.links.splice(+arg, 1); telaEnviar(); }
  else if(a === "arq-rem"){ lerForm(); E.form.arquivos.splice(+arg, 1); telaEnviar(); }
  else if(a === "baixar"){ e.preventDefault(); baixar(arg, +el.dataset.i); }
  else if(a === "ver"){ ver(arg); }
  else if(a === "fechar"){ fechar(); }
  else if(a === "publicar"){ mudarStatus(arg, "publicado"); }
  else if(a === "despublicar"){ mudarStatus(arg, "novo"); }
  else if(a === "recusar"){ mudarStatus(arg, "recusado"); }
  else if(a === "excluir"){ excluir(arg, false); }
  else if(a === "excluir-meu"){ excluir(arg, true); }
});
$("mb").addEventListener("click", e => { if(e.target === $("mb")) fechar(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") fechar(); });

function aplicarModoAluno(){
  document.title = "Dica do Aluno · Portal do Educador";
  const b = document.querySelector(".marca b"); if(b) b.textContent = "Dica do Aluno";
  const rot = { dicas:"💬 Dicas da galera", enviar:"✉️ Enviar minha dica", meus:"📁 Meus envios" };
  document.querySelectorAll(".topo-acoes .tb[data-arg]").forEach(x => { if(rot[x.dataset.arg]) x.textContent = rot[x.dataset.arg]; });
}

/* ---------- entrada ---------- */
onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/"); return; }
  let u = null;
  try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo"){ location.replace("/entrar/"); return; }
  E.user = user; E.u = u; E.admin = u.perfil === "admin";
  // aluno sempre no modo aluno; o administrador alterna com ?aluno=1
  E.aluno = u.perfil === "aluno" || (E.admin && new URLSearchParams(location.search).has("aluno"));
  E.muniId = u.municipio_id || "";
  if(E.aluno) aplicarModoAluno();
  try{
    if(!u.escola_id && u.escola_nome) E.escola = u.escola_nome;
    if(u.escola_id){ const s = await getDoc(doc(db, "escolas", u.escola_id)); if(s.exists()) E.escola = s.data().nome || ""; }
    if(u.municipio_id){ const s = await getDoc(doc(db, "municipios", u.municipio_id)); if(s.exists()){ const m = s.data(); E.muni = [m.nome, m.uf].filter(Boolean).join("/"); } }
  }catch(e){}
  $("quem").textContent = (u.nome || user.email) + (E.escola ? " · " + E.escola : "");
  if(E.admin){ $("tbRecebidas").hidden = false; carregarRecebidas().catch(() => {}); }
  const h = (location.hash || "").slice(1);
  ir(["dicas","enviar","meus","recebidas"].includes(h) ? h : "dicas");
});
</script>
