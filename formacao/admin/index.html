  --azul:#0f2c4a; --azul-900:#0a1f36; --azul-700:#16406b; --azul-100:#e7eef6;
  --verde:#1a6b2a; --verde-700:#155a23; --verde-300:#4da45f; --verde-100:#e6f2e9;
  --tinta:#12202e; --suave:#4b5b6b; --linha:#dde5ee; --fundo:#f5f8fb; --papel:#fff;
  --alerta:#a15c00; --alerta-bg:#fff6e5; --erro:#a01b1b; --erro-bg:#fdecec;
  --r:12px; --r-sm:8px;
  --sombra:0 1px 2px rgba(15,44,74,.06),0 6px 20px rgba(15,44,74,.07);
  --lateral:250px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.55;font-size:15px}
h1,h2,h3,h4{color:var(--azul);line-height:1.25;margin:0 0 .5em}
h1{font-size:1.65rem;letter-spacing:-.02em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0 0 .9em}
a{color:var(--azul-700)}
:focus-visible{outline:3px solid var(--verde-300);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.oculto{display:none !important}

/* ---------- LAYOUT ---------- */
#app{display:none}
#app.pronto{display:block}
.moldura{display:grid;grid-template-columns:var(--lateral) 1fr;min-height:100vh}

aside.lateral{background:var(--azul-900);color:#cfe0ef;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.marca b{color:#fff;font-size:.97rem;display:block;line-height:1.15}
.marca span{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;opacity:.65}
nav.menu{padding:12px 10px;flex:1;overflow-y:auto}
nav.menu a{
  display:flex;align-items:center;gap:10px;padding:.62rem .8rem;border-radius:var(--r-sm);
  color:#b9cddd;text-decoration:none;font-size:.93rem;font-weight:500;margin-bottom:2px;
}
nav.menu a:hover{background:rgba(255,255,255,.08);color:#fff}
nav.menu a[aria-current="page"]{background:var(--verde);color:#fff;font-weight:600}
nav.menu .grupo{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.5;padding:14px 12px 6px}
.rodape-lateral{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem}
.rodape-lateral b{color:#fff;display:block;font-size:.88rem}
.rodape-lateral .papel{display:inline-block;background:rgba(77,164,95,.25);border:1px solid rgba(77,164,95,.45);color:#bfe6c9;padding:.1rem .5rem;border-radius:99px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:.3rem}
.rodape-lateral button{background:none;border:none;color:#8fb4d4;font-size:.82rem;cursor:pointer;padding:.4rem 0 0;font-family:inherit;text-decoration:underline}

main.conteudo{padding:26px 30px 60px;max-width:1100px}

/* ---------- COMPONENTES ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.6rem 1.05rem;border-radius:var(--r-sm);border:1px solid transparent;
  font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;line-height:1.3;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.b-primario{background:var(--verde);color:#fff}
.b-primario:hover:not(:disabled){background:var(--verde-700)}
.b-neutro{background:var(--papel);color:var(--azul);border-color:var(--linha)}
.b-neutro:hover:not(:disabled){background:var(--azul-100);border-color:var(--azul-700)}
.b-perigo{background:#fff;color:var(--erro);border-color:#f2c4c4}
.b-perigo:hover:not(:disabled){background:var(--erro-bg)}
.b-pequeno{padding:.35rem .7rem;font-size:.82rem}
.b-bloco{width:100%}

.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:1.3rem;box-shadow:var(--sombra)}
.cartao + .cartao{margin-top:16px}
.cartao > h2:first-child,.cartao > h3:first-child{margin-top:0}

.campo{
  width:100%;padding:.6rem .8rem;border:1px solid var(--linha);border-radius:var(--r-sm);
  font-family:inherit;font-size:.92rem;background:#fff;color:var(--tinta);
}
textarea.campo{resize:vertical;min-height:90px;line-height:1.55}
.campo:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--verde-100)}
label.rot{display:block;font-size:.83rem;font-weight:600;margin:0 0 .3rem;color:var(--azul)}
.ajuda{font-size:.79rem;color:var(--suave);margin:.3rem 0 0}

/* ==========================================================================
   EDITOR DE TEXTO
   Sem seletor de fonte e sem seletor de tamanho, de propósito: a tipografia
   é da Academia, não de quem digita. Assim os dez cursos saem com a mesma
   cara e ninguém publica aula em fonte diferente das outras.
   ========================================================================== */
.editor{border:1px solid var(--linha);border-radius:var(--r-sm);background:#fff;overflow:hidden}
.editor:focus-within{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-100)}

.editor .barra{
  display:flex;flex-wrap:wrap;gap:3px;padding:6px 7px;
  background:#f6f9fb;border-bottom:1px solid var(--linha);
}
.editor .barra button{
  min-width:30px;height:29px;padding:0 7px;border:1px solid transparent;border-radius:5px;
  background:none;font-family:inherit;font-size:.83rem;font-weight:600;color:var(--azul);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.editor .barra button:hover{background:#e6eef5;border-color:#d3dfe9}
.editor .barra button:active{background:#d8e4ee}
.editor .barra .sep{width:1px;background:var(--linha);margin:2px 4px}

.editor .area{
  min-height:170px;max-height:460px;overflow-y:auto;padding:.85rem 1rem;
  font-size:.94rem;line-height:1.7;color:var(--tinta);outline:none;
}
.editor.curto .area{min-height:64px}
.editor .area:empty::before{content:attr(data-vazio);color:var(--suave)}
.editor .area > *:first-child{margin-top:0}
.editor .area > *:last-child{margin-bottom:0}
.editor .area p{margin:0 0 .9rem}
.editor .area h2{font-size:1.16rem;margin:1.3rem 0 .5rem;color:var(--azul)}
.editor .area h3{font-size:1.02rem;margin:1.1rem 0 .4rem;color:var(--azul)}
.editor .area ul,.editor .area ol{margin:0 0 .9rem;padding-left:1.4rem}
.editor .area li{margin-bottom:.35rem}
.editor .area blockquote{
  margin:0 0 .9rem;padding:.3rem 0 .3rem 1rem;border-left:3px solid var(--verde);
  color:var(--suave);font-style:italic;
}
.editor .area a{color:var(--azul);text-decoration:underline}

/* As mesmas classes que a Academia usa para exibir, para o editor mostrar
   exatamente o que o professor vai ver. */
.al-e{text-align:left}
.al-c{text-align:center}
.al-d{text-align:right}
.al-j{text-align:justify}
.esp-l{line-height:2.1}
.esp-c{line-height:1.45}

/* Imagens dentro do editor: mesma aparência que o professor vai ver */
.editor .area figure{margin:1.1rem 0;text-align:center}
.editor .area figure img{
  display:block;width:100%;height:auto;margin:0 auto;
  border-radius:var(--r-sm);border:1px solid var(--linha);background:#fff;
}
.editor .area figcaption{

   Portal do Educador · NEWPC Tecnologia

   - Sem FIREBASE_CONFIG preenchido, o painel roda em MODO DEMONSTRAÇÃO com

const NIVEIS = { iniciante:"Iniciante", intermediario:"Intermediário", avancado:"Avançado" };
const STATUS = { rascunho:"Rascunho", revisao:"Em revisão", publicado:"Publicado", arquivado:"Arquivado" };
const TIPOS_ARQUIVO = {
  pdf:"PDF", doc:"Word", docx:"Word", ppt:"PowerPoint", pptx:"PowerPoint",
  xls:"Planilha", xlsx:"Planilha", txt:"Texto", jpg:"Imagem", jpeg:"Imagem", png:"Imagem"
};

/* ---------------------------------------------------------------------------
   UTILIDADES
--------------------------------------------------------------------------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* ===========================================================================
   EDITOR DE TEXTO FORMATADO

   O texto das aulas e a descrição do curso passaram a aceitar negrito,
   títulos, listas, citação, link, alinhamento e espaçamento. O que NÃO existe
   aqui, de propósito, é seletor de fonte e de tamanho: a tipografia pertence
   à identidade da Academia. Sem essa amarra, em três meses cada curso estaria
   com uma cara diferente e arrumar depois custaria mais do que fazer certo.

   Tudo que sai daqui passa pelo mesmo filtro que a Academia usa para exibir:
   HTML guardado em banco nunca vai para a tela sem ser conferido.
   =========================================================================== */
const TAGS_BLOCO = ["P","BR","STRONG","B","EM","I","U","S","H2","H3","UL","OL","LI",
                    "BLOCKQUOTE","A","IMG","FIGURE","FIGCAPTION"];
const TAGS_LINHA = ["BR","STRONG","B","EM","I","U","S","A"];
const CLASSES_OK = ["al-e","al-c","al-d","al-j","esp-l","esp-c","img-p","img-m","img-g"];

function limparHtml(bruto, apenasLinha = false){
  const permitidas = apenasLinha ? TAGS_LINHA : TAGS_BLOCO;
  const molde = document.createElement("div");
  molde.innerHTML = String(bruto ?? "");
  molde.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button,svg")
       .forEach(e => e.remove());

  const visitar = pai => {
    [...pai.children].forEach(el => {
      visitar(el);
      if (!permitidas.includes(el.tagName)){
        const conteudo = document.createDocumentFragment();
        while (el.firstChild) conteudo.appendChild(el.firstChild);
        el.replaceWith(conteudo);
        return;
      }
      [...el.attributes].forEach(at => {
        const nome = at.name.toLowerCase();
        if (nome === "class"){
          const validas = at.value.split(/\s+/).filter(c => CLASSES_OK.includes(c));
          validas.length ? el.setAttribute("class", validas.join(" ")) : el.removeAttribute("class");
          return;
        }
        if (el.tagName === "A"   && nome === "href") return;
        if (el.tagName === "IMG" && (nome === "src" || nome === "alt")) return;
        el.removeAttribute(at.name);
      });

      // Imagem só pode apontar para o Storage do projeto (https) ou para um
      // arquivo ainda em memória no navegador. Endereço de outro tipo é sinal
      // de conteúdo colado de fora, e sai.
      if (el.tagName === "IMG"){
        const origem = el.getAttribute("src") || "";
        if (!/^(https:|blob:)/i.test(origem)) { el.remove(); return; }
        el.setAttribute("loading", "lazy");
        el.setAttribute("decoding", "async");
      }
      if (el.tagName === "A"){
        const destino = el.getAttribute("href") || "";
        if (!/^(https?:|mailto:)/i.test(destino)) el.removeAttribute("href");
      }
    });
  };
  visitar(molde);

  // Conserta estrutura impossível antes de devolver.
  // Uma <figure> só existe para carregar imagem. Sem <img> dentro, ela é resto
  // de uma inserção desfeita, e o <figcaption> que sobra acaba engolindo o
  // conteúdo inteiro da aula: tudo passa a sair centralizado e em itálico por
  // causa do CSS da legenda, e nenhum botão da barra desfaz isso, porque não
  // é negrito nem itálico, é o lugar errado na árvore.
  const desmontar = el => {
    const conteudo = document.createDocumentFragment();
    while (el.firstChild) conteudo.appendChild(el.firstChild);
    el.replaceWith(conteudo);
  };
  const BLOCOS_DENTRO = "p,h2,h3,ul,ol,li,blockquote,figure,figcaption";
  for (let volta = 0; volta < 5; volta++){
    const figuras = [...molde.querySelectorAll("figure")].filter(f => !f.querySelector("img"));
    const legendas = [...molde.querySelectorAll("figcaption")]
      .filter(c => c.querySelector(BLOCOS_DENTRO) || !c.closest("figure"));
    if (!figuras.length && !legendas.length) break;
    figuras.forEach(desmontar);
    legendas.forEach(desmontar);
  }

  return molde.innerHTML.trim();
}

// Conteúdo salvo antes do editor existir veio como texto puro.
function textoRico(valor, apenasLinha = false){
  const s = String(valor ?? "").trim();
  if (!s) return "";
  if (!/<[a-z][\s\S]*>/i.test(s)){
    if (apenasLinha) return esc(s);
    return s.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
  }
  return limparHtml(s, apenasLinha);
}

const soTexto = valor => {
  const s = String(valor ?? "");
  if (!/<[a-z][\s\S]*>/i.test(s)) return s;
  const d = document.createElement("div"); d.innerHTML = s;
  return (d.textContent || "").replace(/\s+/g," ").trim();
};

const BOTOES_LINHA = [
  { cmd:"bold",      rotulo:"<b>N</b>", dica:"Negrito" },
  { cmd:"italic",    rotulo:"<i>I</i>", dica:"Itálico" },
  { cmd:"underline", rotulo:"<u>S</u>", dica:"Sublinhado" },

/* Monta o HTML do editor. `id` é o mesmo que o campo tinha antes, para o resto
   do painel não precisar mudar de nome. */
function montarEditor(id, valor, o = {}){
  const botoes = (o.linha ? BOTOES_LINHA : BOTOES_BLOCO).map(b =>
    b.sep ? '<span class="sep"></span>'
          : `<button type="button" title="${esc(b.dica)}" tabindex="-1"
               data-ed="${id}" data-cmd="${esc(b.cmd||"")}" data-bloco="${esc(b.bloco||"")}"
               data-classe="${esc(b.classe||"")}" data-grupo="${esc(b.grupo||"")}"
               data-link="${b.link?1:""}" data-limpar="${b.limpar?1:""}"
               data-imagem="${b.imagem?1:""}" data-tamimg="${b.tamImg?1:""}">${b.rotulo}</button>`
  ).join("");

  return `<div class="editor ${o.linha?"curto":""}">
    <div class="barra">${botoes}</div>
    <div class="area" id="${id}" contenteditable="true" role="textbox" aria-multiline="${o.linha?"false":"true"}"
         data-inline="${o.linha?1:""}" data-curso="${esc(o.curso||"")}" data-vazio="${esc(o.vazio||"Escreva aqui…")}"
         ${o.limite?`data-limite="${o.limite}"`:""}>${textoRico(valor, o.linha)}</div>
  </div>${o.limite?`<p class="ajuda" id="${id}-conta"></p>`:""}`;
}

/* Reduz a imagem antes de subir. Sem isso uma foto de celular de 6 MB entra
   inteira na aula, e quem paga a conta é o professor na escola com internet
   ruim. Mantém a proporção original, diferente da capa, que é recortada. */
async function prepararImagem(file, larguraMax = 1200){
  const bitmap = await createImageBitmap(file);
  const escala = Math.min(1, larguraMax / bitmap.width);
  const L = Math.round(bitmap.width * escala);
  const A = Math.round(bitmap.height * escala);

  const c = document.createElement("canvas");
  c.width = L; c.height = A;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bitmap, 0, 0, L, A);
  bitmap.close?.();

  const blob = await new Promise(r => c.toBlob(r, "image/webp", 0.85))
            || await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
  const ext = blob.type.includes("webp") ? "webp" : "jpg";
  return new File([blob], `imagem-${Date.now()}.${ext}`, { type: blob.type });
}

// Bloco onde o cursor está, para aplicar alinhamento e espaçamento por classe.
function blocoDoCursor(area){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  let no = sel.getRangeAt(0).startContainer;
  if (no.nodeType === 3) no = no.parentNode;
  while (no && no !== area && !["P","H2","H3","LI","BLOCKQUOTE","DIV"].includes(no.tagName))
    no = no.parentNode;
  return (no && no !== area) ? no : null;
}

// Alinhamento e espaçamento valem para tudo que está selecionado. Antes isto
// pegava só o bloco onde o cursor começava: quem selecionava dez parágrafos e
// clicava em Justificar via um parágrafo mudar e nove continuarem como estavam.
function blocosDaSelecao(area){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return [];
  const faixa = sel.getRangeAt(0);
  const tocados = [...area.querySelectorAll("p,h2,h3,li,blockquote")]
    .filter(b => { try { return faixa.intersectsNode(b); } catch { return false; } });
  if (tocados.length) return tocados;
  const um = blocoDoCursor(area);
  return um ? [um] : [];
}

function ligarEditor(id){
  const area = document.getElementById(id);
  if (!area) return;
  // Sem isto o navegador formata com estilo embutido (span style=...) em vez de
  // usar as tags. O filtro descartaria de qualquer jeito, mas assim o que está
  // na tela do editor já é o que vai ser gravado.
  try {
    document.execCommand("defaultParagraphSeparator", false, "p");
    document.execCommand("styleWithCSS", false, false);
  } catch {}

  const contador = () => {
    const alvo = document.getElementById(id + "-conta");
    if (!alvo) return;
    const n = soTexto(area.innerHTML).length;
    const limite = Number(area.dataset.limite);
    alvo.textContent = `${n} de ${limite} caracteres`;
    alvo.style.color = n > limite ? "var(--erro)" : "var(--suave)";
  };
  contador();
  area.addEventListener("input", contador);

  // Colar sempre como texto limpo. Colar direto do Word traz uma montanha de
  // marcação que quebra o layout e é exatamente o que o filtro descartaria.
  area.addEventListener("paste", e => {
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
    if (area.dataset.inline){
      document.execCommand("insertText", false, txt.replace(/\s+/g, " "));
    } else {
      const html = txt.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
      document.execCommand("insertHTML", false, html);
    }
    contador();
  });

  // No campo de uma linha, Enter não cria parágrafo novo.
  if (area.dataset.inline)
    area.addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });

  // Clicar numa imagem dentro do editor guarda qual é, porque a seleção do
  // navegador em cima de imagem é imprevisível de um navegador para outro.
  let figuraAtiva = null;
  area.addEventListener("click", e => {
    const f = e.target.closest?.("figure");
    figuraAtiva = (f && area.contains(f)) ? f : null;
  });

  /* Sobe a imagem e insere no ponto onde o cursor estava. A seleção precisa
     ser guardada antes de abrir o seletor de arquivo: escolher um arquivo tira
     o foco do texto e o cursor se perde. */
  async function inserirImagem(){
    const curso = area.dataset.curso;
    if (!curso) return avisar("Abra o curso pelo painel para poder inserir imagens.","erro");

    const sel = window.getSelection();
    const marca = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;

    const entrada = document.createElement("input");
    entrada.type = "file";
    entrada.accept = "image/png,image/jpeg,image/webp,image/gif";
    entrada.addEventListener("change", async () => {
      const arquivo = entrada.files?.[0];
      if (!arquivo) return;
      if (arquivo.size > 20 * 1024 * 1024)
        return avisar("Imagem acima de 20 MB. Reduza antes de subir.","erro");

      try {
        avisar("Preparando e enviando a imagem…","atencao");
        const otimizada = await prepararImagem(arquivo);
        const r = await Api.enviarArquivo(curso, otimizada);

        const legenda = (prompt(
          "Legenda da imagem.\n\nAparece embaixo dela e também serve de descrição para quem usa leitor de tela. Deixe em branco se a imagem for apenas decorativa.",
          "") || "").trim();

        const bloco = `<figure class="img-g"><img src="${esc(r.url)}" alt="${esc(legenda)}">`
                    + (legenda ? `<figcaption>${esc(legenda)}</figcaption>` : "")
                    + `</figure><p><br></p>`;

        area.focus();
        if (marca){
          const s2 = window.getSelection();
          s2.removeAllRanges();
          s2.addRange(marca);
        }
        document.execCommand("insertHTML", false, bloco);
        avisar(`Imagem inserida (${tamanho(otimizada.size)}). Não esqueça de salvar.`,"ok");
        contador();
      } catch(err){
        avisar("Falha ao enviar a imagem: " + (err.message || ""),"erro");
      }
    });
    entrada.click();
  }

  // Alterna grande, média e pequena na imagem em que o editor está.
  function ciclarTamanho(){
    let fig = figuraAtiva;
    if (!fig){
      const sel = window.getSelection();
      let no = (sel && sel.rangeCount) ? sel.getRangeAt(0).startContainer : null;
      if (no && no.nodeType === 3) no = no.parentNode;
      while (no && no !== area && no.tagName !== "FIGURE") no = no.parentNode;
      if (no && no !== area) fig = no;
    }
    if (!fig) return avisar("Clique na imagem antes de mudar o tamanho.","atencao");
    const ordem = ["img-g","img-m","img-p"];
    const nomes = { "img-g":"grande", "img-m":"média", "img-p":"pequena" };
    const atual = ordem.findIndex(c => fig.classList.contains(c));
    ordem.forEach(c => fig.classList.remove(c));
    const escolhido = ordem[(atual + 1) % ordem.length];
    fig.classList.add(escolhido);
    avisar(`Imagem ${nomes[escolhido]}.`,"ok");
  }

  $$(`[data-ed="${id}"]`).forEach(b => {
    // mousedown em vez de click: o clique tiraria o cursor de dentro do texto
    b.addEventListener("mousedown", e => {
      e.preventDefault();
      area.focus();
      const d = b.dataset;

      if (d.cmd)   document.execCommand(d.cmd, false, null);
      if (d.bloco) document.execCommand("formatBlock", false, d.bloco);

      if (d.classe){
        const blocos = blocosDaSelecao(area);
        const grupo = CLASSES_OK.filter(c => c.startsWith(d.grupo + "-"));
        // Só desliga quando TODOS já estavam com a classe. Numa seleção mista,
        // o clique uniformiza, que é o que a pessoa espera ao clicar uma vez.
        const todosTinham = blocos.length && blocos.every(b => b.classList.contains(d.classe));
        blocos.forEach(b => {
          grupo.forEach(c => b.classList.remove(c));
          if (!todosTinham) b.classList.add(d.classe);
        });
      }

      if (d.link){
        const atual = window.getSelection().toString();
        if (!atual) return avisar("Selecione o texto que vai virar link antes de clicar aqui.","atencao");
        const url = prompt("Endereço do link:", "https://");
        if (url && /^(https?:|mailto:)/i.test(url)) document.execCommand("createLink", false, url);
        else if (url) avisar("Endereço inválido. Use um que comece com https:// ou mailto:","erro");
      }

      if (d.imagem) inserirImagem();
      if (d.tamimg) ciclarTamanho();

      if (d.limpar){
        document.execCommand("removeFormat", false, null);
        blocosDaSelecao(area).forEach(b => CLASSES_OK.forEach(c => b.classList.remove(c)));
      }
      contador();
    });
  });
}

// Devolve o conteúdo já filtrado, pronto para gravar.
function lerEditor(id){
  const area = document.getElementById(id);
  if (!area) return "";
  return limparHtml(area.innerHTML, Boolean(area.dataset.inline));
}
const slug = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50);
const tamanho = b => !b ? "" : b < 1024*1024 ? `${Math.round(b/1024)} KB` : `${(b/1024/1024).toFixed(1)} MB`;
const extensao = n => (n.split(".").pop()||"").toLowerCase();

/* Redimensiona a imagem ANTES de subir. A equipe pedagógica vai arrastar foto
   de celular de 4 MB sem pensar — e seis dessas na página inicial derrubam a
   Academia no Chromebook da escola. Aqui tudo sai padronizado em 1200x675
   WebP, uns 60 KB, sem ninguém precisar saber redimensionar imagem. */
async function prepararCapa(file, L = 1200, A = 675){
  const bitmap = await createImageBitmap(file);
  const c = document.createElement("canvas");
  c.width = L; c.height = A;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";

  // Recorte "cover": preenche o quadro inteiro e corta o excedente pelo centro
  const escala = Math.max(L / bitmap.width, A / bitmap.height);
  const w = bitmap.width * escala, h = bitmap.height * escala;
  ctx.drawImage(bitmap, (L - w) / 2, (A - h) / 2, w, h);
  bitmap.close?.();

  const blob = await new Promise(r => c.toBlob(r, "image/webp", 0.82))
            || await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  const ext = blob.type.includes("webp") ? "webp" : "jpg";
  return new File([blob], `capa.${ext}`, { type: blob.type });
}

// Aceita URL completa, link curto, embed ou o próprio ID de 11 caracteres.
function idDoYoutube(entrada){
  const t = String(entrada||"").trim();
  if (/^[\w-]{11}$/.test(t)) return t;
  const m = t.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function avisar(msg, tipo="info", alvo="#msg"){
  const el = $(alvo); if (!el) return;
  el.innerHTML = `<div class="aviso a-${tipo}"><span>${esc(msg)}</span></div>`;
  if (tipo === "ok") setTimeout(()=>{ if(el) el.innerHTML=""; }, 4000);
}

let fb = null;

const ApiFirebase = {
  modo:"firebase",

  async iniciar(){
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [app, auth, fs, st, fn] = await Promise.all([
      import(base+"firebase-app.js"), import(base+"firebase-auth.js"),
      import(base+"firebase-firestore.js"), import(base+"firebase-storage.js"),
      import(base+"firebase-functions.js")
    ]);
    const a = app.initializeApp(FIREBASE_CONFIG);
    fb = { auth, fs, st, fn,
           _auth:auth.getAuth(a), db:fs.getFirestore(a),
           bucket:st.getStorage(a), funcs:fn.getFunctions(a, REGIAO) };

    return new Promise(resolve=>{
      auth.onAuthStateChanged(fb._auth, async u=>{
        if (!u){ location.replace("/entrar/"); return; }
        S.usuario = u;
        if (u){
          // force:true garante que o token traga o papel recém-atribuído
          const token = await u.getIdTokenResult(true);
          S.papel = token.claims.papel || null;
        } else S.papel = null;
        resolve();
        aoMudarAutenticacao();
      });
    });
  },

  chamar(nome, dados){ return fb.fn.httpsCallable(fb.funcs, nome)(dados).then(r=>r.data); },

  async listarCursos(){
    const { collection, getDocs, query, orderBy } = fb.fs;
    const snap = await getDocs(query(collection(fb.db,"cursos"), orderBy("ordem")));
    return snap.docs.map(d=>({ id:d.id, ...d.data() }));
  },

  async lerCurso(id){
    const { doc, getDoc, collection, getDocs } = fb.fs;
    const c = await getDoc(doc(fb.db,"cursos",id));
    if (!c.exists()) return null;
    const [mod, aul, que] = await Promise.all([
      getDocs(collection(fb.db,"cursos",id,"modulos")),
      getDocs(collection(fb.db,"cursos",id,"aulas")),
      getDocs(collection(fb.db,"cursos",id,"questoes"))
    ]);
    const obj = (s)=>{ const o={}; s.forEach(d=>o[d.id]=d.data()); return o; };
    return { id, ...c.data(), modulos:obj(mod), aulas:obj(aul), questoes:obj(que) };
  },

  async salvarCurso(id, dados){
    const { doc, setDoc, serverTimestamp } = fb.fs;
    await setDoc(doc(fb.db,"cursos",id), { ...dados, atualizadoEm:serverTimestamp() }, { merge:true });
  },
  async excluirCurso(id){ return this.chamar("excluirCurso",{cursoId:id}); },
  async publicarCurso(id,status){ return this.chamar("publicarCurso",{cursoId:id,status}); },
  async duplicarCurso(id){ return this.chamar("duplicarCurso",{cursoId:id}); },
  async salvarModulo(cid, mid, d){ const {doc,setDoc}=fb.fs; await setDoc(doc(fb.db,"cursos",cid,"modulos",mid), d, {merge:true}); },
  async excluirModulo(cid, mid){
    const { doc, deleteDoc, collection, getDocs, query, where } = fb.fs;
    const s = await getDocs(query(collection(fb.db,"cursos",cid,"aulas"), where("moduloId","==",mid)));
    await Promise.all(s.docs.map(d=>deleteDoc(d.ref)));
    await deleteDoc(doc(fb.db,"cursos",cid,"modulos",mid));
  },
  async salvarAula(cid, aid, d){ const {doc,setDoc}=fb.fs; await setDoc(doc(fb.db,"cursos",cid,"aulas",aid), d, {merge:true}); },

  async salvarQuestao(cid, qid, q, g){
    const {doc,writeBatch}=fb.fs;const batch=writeBatch(fb.db);
    batch.set(doc(fb.db,"cursos",cid,"questoes",qid),q,{merge:true});
    batch.set(doc(fb.db,"cursos",cid,"gabarito",qid),g,{merge:true});await batch.commit();

    const {doc,writeBatch}=fb.fs;const batch=writeBatch(fb.db);

  async enviarArquivo(cid, file, aoProgredir){
    const { ref, uploadBytesResumable, getDownloadURL } = fb.st;
    const nome = `${Date.now()}-${slug(file.name.replace(/\.[^.]+$/,""))}.${extensao(file.name)}`;
    const caminho = `materiais/${cid}/${nome}`;
    const tarefa = uploadBytesResumable(ref(fb.bucket, caminho), file, { contentType:file.type });
    await new Promise((ok, erro)=>{
      tarefa.on("state_changed",
        s => aoProgredir?.(Math.round(s.bytesTransferred / s.totalBytes * 100)),

    });
    return { url: await getDownloadURL(tarefa.snapshot.ref), path:caminho, bytes:file.size };

    // então trocar a capa grava outra e a anterior fica guardada.
    const caminho = `capas/${cid}-${Date.now()}.${file.name.split(".").pop()}`;
    const r = ref(fb.bucket, caminho);
    await uploadBytes(r, file, { contentType:file.type, cacheControl:"public,max-age=604800" });
    return { url: await getDownloadURL(r), path: caminho };
  },

  async buscarCertificados(termo){
    const { collection, getDocs, query, where, limit, doc, getDoc } = fb.fs;
    const t = (termo||"").trim();
    if (/^AE-\d{4}-(?:[A-Z0-9]{6}|[A-F0-9]{12})$/i.test(t)){
      const d = await getDoc(doc(fb.db,"certificados",t.toUpperCase()));
      return d.exists() ? [{ codigo:d.id, ...d.data() }] : [];

    return s.docs.map(d=>({ codigo:d.id, ...d.data() }));
  },
  async revogarCertificado(codigo, motivo){ return this.chamar("revogarCertificado",{ codigo, motivo }); },
  async relatorioAdesao(municipio,cursor){ return this.chamar("relatorioAdesao",{ municipio,...(cursor?{cursor}:{}) }); },

  async entrar(){
    const p = new fb.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt:"select_account" });
    await fb.auth.signInWithPopup(fb._auth, p);
  },
  async sair(){ await fb.auth.signOut(fb._auth); location.reload(); }
};

T.curso_conteudo = async id => {

  if (!c) return T.naoEncontrado();

  const modulos = Object.entries(c.modulos||{}).sort((a,b)=>(a[1].ordem||0)-(b[1].ordem||0));
  const aulasDo = mid => Object.entries(c.aulas||{})
    .filter(([,a])=>a.moduloId===mid).sort((a,b)=>(a[1].ordem||0)-(b[1].ordem||0));

  const corpo = modulos.length ? modulos.map(([mid,m])=>`
    <div class="modulo" data-modulo="${mid}">
      <div class="modulo-topo">
        <input value="${esc(m.titulo)}" data-titulo-modulo="${mid}" aria-label="Título do módulo">

  return `
  <p style="font-size:.86rem;color:var(--suave);margin-bottom:.3rem"><a href="#/cursos" style="text-decoration:none">← Cursos</a></p>
  <h1>${esc(c.titulo)}</h1>

T.curso_publicar = async id => {
  const c = await carregarCurso(id);
  if (!c) return T.naoEncontrado();

  const nAulas   = Object.keys(c.aulas||{}).length;
  const nModulos = Object.keys(c.modulos||{}).length;
  const nQuest   = Object.keys(c.questoes||{}).length;
  const comVideo = Object.values(c.aulas||{}).filter(a=>a.videos?.length).length;

  const itens = [
    ["Título e resumo preenchidos", Boolean(c.titulo && soTexto(c.resumo).trim())],
    ["Carga horária definida",      Number(c.horas) > 0],
    ["Pelo menos 1 módulo",         nModulos > 0],
    ["Pelo menos 1 aula",           nAulas > 0],
    ["Todas as aulas com vídeo ou texto", nAulas > 0 && Object.values(c.aulas||{}).every(a=>a.videos?.length || (a.texto||"").trim())],
    ["Duração definida em todas as aulas", Object.values(c.aulas||{}).every(a=>Number(a.duracaoMin)>0)],
    ...(c.quizAtivo ? [["Banco suficiente para o tamanho da prova", nQuest >= Math.max(3,Number(c.quizPorProva ?? 10))]] : [])
  ];
  const tudoOk = itens.every(([,ok])=>ok);

  return `
  <p style="font-size:.86rem;color:var(--suave);margin-bottom:.3rem"><a href="#/cursos" style="text-decoration:none">← Cursos</a></p>
  <h1>${esc(c.titulo)}</h1>
  ${abasCurso(id,"publicar")}
  <div class="cartao"><h2>Nova versão do curso</h2><p>Crie uma cópia editável. A versão atual, o progresso dos alunos e os certificados permanecem vinculados ao curso original.</p><button class="btn b-primario" id="duplicarCurso">Criar nova versão</button></div>
  <div id="msg"></div>

  <div class="cartao">
    <h2>Situação atual</h2>
    <p><span class="selo s-${c.status}">${STATUS[c.status]||c.status}</span></p>
    <p style="color:var(--suave);font-size:.9rem">
      ${nModulos} módulos · ${nAulas} aulas · ${comVideo} aulas com vídeo${c.quizAtivo?` · ${nQuest} questões`:""}
    </p>
  </div>

  <div class="cartao">
    <h2>Antes de publicar</h2>
    <table>
      <tbody>${itens.map(([txt,ok])=>`
        <tr><td style="width:34px;font-size:1.1rem;color:${ok?"var(--verde)":"var(--suave)"}">${ok?"✓":"○"}</td><td>${txt}</td></tr>`).join("")}
      </tbody>
    </table>
    ${tudoOk ? '' : '<div class="aviso a-atencao" style="margin-top:14px"><span>Corrija as pendências antes de publicar. O servidor também confere módulos, vídeos, alternativas e gabaritos.</span></div>'}
  </div>

  <div class="cartao">
    <h2>Alterar situação</h2>
    ${podePublicar() ? `
      <div class="l-auto">
        <button class="btn b-neutro" data-status="rascunho"  ${c.status==="rascunho"?"disabled":""}>Voltar para rascunho</button>
        <button class="btn b-neutro" data-status="revisao"   ${c.status==="revisao"?"disabled":""}>Enviar para revisão</button>
        <button class="btn b-primario" data-status="publicado" ${c.status==="publicado"||!tudoOk?"disabled":""}>Publicar curso</button>
        <button class="btn b-neutro" data-status="arquivado" ${c.status==="arquivado"?"disabled":""}>Arquivar</button>
      </div>
      <p class="ajuda" style="margin-top:.7rem">Publicar torna o curso visível para todos os professores imediatamente. Arquivar tira o curso do catálogo e da lista principal, sem apagar nada: os certificados já emitidos continuam válidos e o código segue sendo aceito na validação.</p>
    ` : `
      <div class="aviso a-atencao"><span><b>Publicação restrita a administradores</b>Como editor, você pode enviar o curso para revisão. Um administrador faz a publicação.</span></div>
      <button class="btn b-neutro" data-status="revisao" ${c.status==="revisao"?"disabled":""}>Enviar para revisão</button>
    `}
  </div>

  ${podePublicar() ? `
  <div class="cartao" style="border-color:#f2c4c4">
    <h2 style="color:var(--erro)">Excluir curso</h2>
    <p style="color:var(--suave);font-size:.9rem">Remove o curso, seus módulos, aulas e questões, sem volta. Só funciona em curso fora do ar e que nunca emitiu certificado. Se algum professor já se certificou nele, o servidor recusa e o caminho é <b>Arquivar</b>.</p>
    <button class="btn b-perigo" id="excluirCurso">Excluir este curso</button>
  </div>`:''}`;
};

/* ---------------------------------------------------------------------------
   ROTEADOR
--------------------------------------------------------------------------- */
async function renderizar(){
  const partes = (location.hash || "#/cursos").replace(/^#\/?/,"").split("/");
  const [r, p1, p2] = partes;
  const tela = $("#tela");
  tela.innerHTML = '<div class="vazio">Carregando…</div>';

  let html, depois = null;
  try {
    if (r === "curso" && p1){
      if (p2 === "conteudo")       { html = await T.curso_conteudo(p1);  depois = ()=>ligarConteudo(p1); }
      else if (p2 === "avaliacao") { html = await T.curso_avaliacao(p1); depois = ()=>ligarAvaliacao(p1); }
      else if (p2 === "publicar")  { html = await T.curso_publicar(p1);  depois = ()=>ligarPublicar(p1); }
      else                         { html = await T.curso_dados(p1);     depois = ()=>ligarDados(p1); }
    }
    else if (r === "aula" && p1 && p2) { html = await T.aula(p1,p2); depois = ()=>ligarAula(p1,p2); }
    else if (r === "trilhas")      { html = await T.trilhas();      depois = ligarTrilhas; }
    else if (r === "certificados") { html = await T.certificados(); depois = ligarCertificados; }
    else if (r === "equipe")       { html = await T.equipe();       depois = ligarEquipe; }
    else if (r === "relatorio")    { html = await T.relatorio();    depois = ligarRelatorio; }
    else if (r === "processo")     { html = await T.processo(); }
    else                           { html = await T.cursos();       depois = ligarListaCursos; }
  } catch(e){
    console.error(e);
    html = `<div class="aviso a-erro"><span><b>Erro ao carregar</b>${esc(e.message)}</span></div>`;
  }

  tela.innerHTML = html;
  $$("nav.menu a").forEach(a=>{
    const base = a.getAttribute("href").replace("#/","");
    a.setAttribute("aria-current", (base===r || (base==="cursos" && (r==="curso"||r==="aula"))) ? "page" : "false");
  });
  await depois?.();
  if(["curso","aula"].includes(r) && cursoAberto && (cursoAberto.status==="publicado" || cursoAberto.publicadoEm || cursoAberto.historicoPublicado)){
    const aviso=document.createElement("div");aviso.className="aviso a-info";
    aviso.innerHTML='<span>Esta versão tem histórico de publicação e está protegida contra alterações. Para editar, abra a aba Publicação e use <b>Criar nova versão</b>.</span>';
    tela.prepend(aviso);
    // As regras do servidor são a proteção efetiva; aqui apenas explicamos o estado.
    if(!location.hash.endsWith("/publicar"))tela.querySelectorAll("input,textarea,select,button,[contenteditable]").forEach(el=>{el.disabled=true;if(el.hasAttribute("contenteditable"))el.contentEditable="false";});
  }
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ---------------------------------------------------------------------------
   LIGAÇÕES DE EVENTOS POR TELA

function ligarListaCursos(){
  $$("[data-ir]").forEach(tr => tr.addEventListener("click", ()=> location.hash = tr.dataset.ir));
  $("#filtroSituacao")?.addEventListener("change", async e=>{ filtroCursos = e.target.value; await renderizar(); });
  $("#novoCurso")?.addEventListener("click", async ()=>{
    const titulo = prompt("Título do novo curso:");
    if (!titulo) return;
    const id = slug(titulo);
    if (!id) return avisar("Título inválido.","erro");
    if (S.cursos.some(c=>c.id===id)) return avisar("Já existe um curso com esse título.","erro");
    await Api.salvarCurso(id, {
      titulo, resumo:"", descricao:"", nivel:"iniciante", horas:1,
      ordem:S.cursos.length+1, status:"rascunho", trilhas:[], totalAulas:0,
      quizAtivo:false, quizNotaCorte:70, quizTentativasMax:3
    });
    cursoAberto = null;
    location.hash = `#/curso/${id}/dados`;
  });
}

function ligarDados(id){
  ligarEditor("fResumo");
  ligarEditor("fDescricao");

  // ---------- capa do curso ----------
  const entradaCapa = $("#capaInput");
  const abrirSeletor = () => entradaCapa.click();

  $("#soltaCapa")?.addEventListener("click", abrirSeletor);
  $("#soltaCapa")?.addEventListener("keydown", e=>{ if (e.key==="Enter"||e.key===" ") { e.preventDefault(); abrirSeletor(); } });
  $("#trocarCapa")?.addEventListener("click", abrirSeletor);

  const solta = $("#soltaCapa");
  if (solta){
    ["dragenter","dragover"].forEach(ev=>solta.addEventListener(ev, e=>{ e.preventDefault(); solta.classList.add("sobre"); }));
    ["dragleave","drop"].forEach(ev=>solta.addEventListener(ev, e=>{ e.preventDefault(); solta.classList.remove("sobre"); }));
    solta.addEventListener("drop", e=>{ const f = e.dataTransfer.files[0]; if (f) enviarCapa(f); });
  }

  entradaCapa?.addEventListener("change", ()=>{ if (entradaCapa.files[0]) enviarCapa(entradaCapa.files[0]); });

  async function enviarCapa(file){
    if (!file.type.startsWith("image/")) return avisar("Escolha um arquivo de imagem.","erro","#msgCapa");
    avisar("Preparando a imagem…","info","#msgCapa");
    try {
      const otimizada = await prepararCapa(file);
      const r = await Api.enviarCapa(id, otimizada);
      await Api.salvarCurso(id, { capaURL:r.url, capaPath:r.path });
      cursoAberto = null;
      await renderizar();
      avisar(`Capa enviada — ${tamanho(otimizada.size)} depois da compressão.`,"ok","#msgCapa");
    } catch(err){
      avisar(err.message || "Falha ao enviar a capa.","erro","#msgCapa");
    }
  }

  $("#removerCapa")?.addEventListener("click", async ()=>{
    if (!confirm("Remover a capa deste curso?")) return;
    const c = await carregarCurso(id);
    await Api.excluirArquivo(c.capaPath);
    await Api.salvarCurso(id, { capaURL:"", capaPath:"" });
    cursoAberto = null;
    await renderizar();
  });

  // ---------- demais campos ----------
  $("#salvarDados")?.addEventListener("click", async e=>{
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="girando"></span> Salvando…';
    await Api.salvarCurso(id, {
      titulo:      $("#fTitulo").value.trim(),
      resumo:      lerEditor("fResumo"),
      descricao:   lerEditor("fDescricao"),
      nivel:       $("#fNivel").value,
      horas:       Number($("#fHoras").value) || 1,
      ordem:       Number($("#fOrdem").value) || 1,
      trilhas:     $$("#fTrilhas input:checked").map(i=>i.value)
    });
    cursoAberto = null;
    b.disabled = false; b.textContent = "Salvar alterações";
    avisar("Alterações salvas.","ok");
  });
}

function ligarConteudo(id){
  const recarregar = async ()=>{ cursoAberto = null; await renderizar(); };

  $("#novoModulo")?.addEventListener("click", async ()=>{
    const titulo = prompt("Nome do módulo:");
    if (!titulo) return;
    const c = await carregarCurso(id);
    const n = Object.keys(c.modulos||{}).length + 1;
    await Api.salvarModulo(id, `m${n}`, { titulo, ordem:n });
    recarregar();
  });

  $$("[data-titulo-modulo]").forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const mid = inp.dataset.tituloModulo;
      const c = await carregarCurso(id);
      await Api.salvarModulo(id, mid, { ...c.modulos[mid], titulo:inp.value.trim() });
      avisar("Módulo renomeado.","ok");
    });
  });

  $$("[data-excluir-modulo]").forEach(b=>b.addEventListener("click", async ()=>{
    if (!confirm("Excluir o módulo e TODAS as suas aulas? Esta ação não pode ser desfeita.")) return;
    await Api.excluirModulo(id, b.dataset.excluirModulo);
    recarregar();
  }));

  $$("[data-nova-aula]").forEach(b=>b.addEventListener("click", async ()=>{
    const titulo = prompt("Título da aula:");
    if (!titulo) return;
    const mid = b.dataset.novaAula;
    const c = await carregarCurso(id);
    const nesse = Object.values(c.aulas||{}).filter(a=>a.moduloId===mid).length + 1;
    const total = Object.keys(c.aulas||{}).length + 1;
    await Api.salvarAula(id, `${mid}a${nesse}`, {
      moduloId:mid, titulo, ordem:total, duracaoMin:0, texto:"", videos:[], materiais:[]
    });
    await Api.salvarCurso(id, { totalAulas: total });
    recarregar();
  }));

  $$("[data-editar-aula]").forEach(b=>b.addEventListener("click", ()=>
    location.hash = `#/aula/${id}/${b.dataset.editarAula}`));

  $$("[data-excluir-aula]").forEach(b=>b.addEventListener("click", async ()=>{
    if (!confirm("Excluir esta aula? O percentual de quem já a concluiu será recalculado.")) return;
    await Api.excluirAula(id, b.dataset.excluirAula);
    const c = await Api.lerCurso(id);
    await Api.salvarCurso(id, { totalAulas: Object.keys(c.aulas||{}).length });
    recarregar();
  }));
}

/* ---------- EDITOR DE AULA ---------- */
function ligarAula(cursoId, aulaId){
  ligarEditor("aTexto");
  const c = cursoAberto;
  const aula = c.aulas[aulaId];
  let videos    = [...(aula.videos||[])];
  let materiais = [...(aula.materiais||[])];

  const pintarVideos = ()=>{
    $("#listaVideos").innerHTML = videos.length ? videos.map((v,i)=>`
      <div class="item">
        <div class="corpo">
          <b>${esc(v.titulo||"Vídeo "+(i+1))}</b>
          <span>youtube.com/watch?v=${esc(v.youtubeId)}</span>
          <div class="previa-video">
            <iframe src="https://www.youtube-nocookie.com/embed/${esc(v.youtubeId)}"
                    title="${esc(v.titulo||"Vídeo")}" loading="lazy"
                    allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"
                    allowfullscreen></iframe>
          </div>
        </div>
        <button class="btn b-perigo b-pequeno" data-rmv="${i}">Remover</button>
      </div>`).join("")
    : '<p style="color:var(--suave);font-size:.88rem;margin:0">Nenhum vídeo nesta aula.</p>';
    $$("[data-rmv]").forEach(b=>b.addEventListener("click", ()=>{ videos.splice(Number(b.dataset.rmv),1); pintarVideos(); }));
  };

  const pintarMateriais = ()=>{
    $("#listaMateriais").innerHTML = materiais.length ? materiais.map((m,i)=>`
      <div class="item">
        <div class="corpo">
          <b>${esc(m.titulo)}</b>
          <span>${TIPOS_ARQUIVO[m.tipo]||m.tipo?.toUpperCase()||"Arquivo"}${m.bytes?` · ${tamanho(m.bytes)}`:""}</span>
        </div>
        ${m.url&&m.url!=="#"?`<a class="btn b-neutro b-pequeno" href="${esc(m.url)}" target="_blank" rel="noopener">Abrir</a>`:""}
        <button class="btn b-perigo b-pequeno" data-rmm="${i}">Remover</button>
      </div>`).join("")
    : '<p style="color:var(--suave);font-size:.88rem;margin:0">Nenhum material nesta aula.</p>';
    $$("[data-rmm]").forEach(b=>b.addEventListener("click", async ()=>{
      const i = Number(b.dataset.rmm);
      if (!confirm(`Remover "${materiais[i].titulo}" desta aula?\n\nO vínculo sai da aula agora. O arquivo continua guardado no servidor, porque certificados já emitidos podem apontar para ele.`)) return;
      await Api.excluirArquivo(materiais[i].path);
      materiais.splice(i,1); pintarMateriais();
    }));
  };

  pintarVideos(); pintarMateriais();

  $("#addVideo")?.addEventListener("click", ()=>{
    const bruto = $("#vUrl").value.trim();
    const yid = idDoYoutube(bruto);
    if (!yid) return avisar("Não reconheci esse link do YouTube. Cole a URL completa, o link curto (youtu.be) ou o ID de 11 caracteres.","erro");
    if (videos.some(v=>v.youtubeId===yid)) return avisar("Este vídeo já está na aula.","atencao");
    videos.push({ titulo: $("#vTitulo").value.trim() || `Vídeo ${videos.length+1}`, youtubeId:yid });
    $("#vTitulo").value = ""; $("#vUrl").value = "";
    pintarVideos();
    avisar("Vídeo adicionado. Não esqueça de salvar a aula.","ok");
  });

  // Upload de materiais
  const entrada = $("#arquivoInput");
  const area = $("#areaSolta");
  area.addEventListener("click", ()=> entrada.click());
  area.addEventListener("keydown", e=>{ if (e.key==="Enter"||e.key===" ") { e.preventDefault(); entrada.click(); } });
  ["dragenter","dragover"].forEach(ev=>area.addEventListener(ev, e=>{ e.preventDefault(); area.classList.add("sobre"); }));
  ["dragleave","drop"].forEach(ev=>area.addEventListener(ev, e=>{ e.preventDefault(); area.classList.remove("sobre"); }));
  area.addEventListener("drop", e=> enviar([...e.dataTransfer.files]));
  entrada.addEventListener("change", ()=> enviar([...entrada.files]));

  async function enviar(arquivos){
    if (!arquivos.length) return;
    const painel = $("#progressoUpload");
    for (const f of arquivos){
      if (f.size > 40*1024*1024){
        painel.innerHTML = `<div class="aviso a-erro"><span>${esc(f.name)} tem ${tamanho(f.size)} e ultrapassa o limite de 40 MB.</span></div>`;
        continue;
      }
      painel.innerHTML = `<div class="aviso a-info"><span>Enviando ${esc(f.name)}… <b id="pct">0%</b></span></div>`;
      try {
        const r = await Api.enviarArquivo(cursoId, f, p=>{ const e2=$("#pct"); if(e2) e2.textContent = p+"%"; });
        materiais.push({ titulo:f.name.replace(/\.[^.]+$/,""), tipo:extensao(f.name), url:r.url, path:r.path, bytes:r.bytes });
        pintarMateriais();
        painel.innerHTML = `<div class="aviso a-ok"><span>${esc(f.name)} enviado. Salve a aula para confirmar.</span></div>`;
      } catch(err){
        painel.innerHTML = `<div class="aviso a-erro"><span><b>Falha no envio</b>${esc(err.message)}</span></div>`;
      }
    }
    entrada.value = "";
  }

  $("#salvarAula")?.addEventListener("click", async e=>{
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="girando"></span> Salvando…';
    await Api.salvarAula(cursoId, aulaId, {
      ...aula,
      titulo: $("#aTitulo").value.trim(),
      duracaoMin: Number($("#aDuracao").value) || 0,
      texto: lerEditor("aTexto"),
      videos, materiais
    });
    cursoAberto = null;
    b.disabled = false; b.textContent = "Salvar aula";
    avisar("Aula salva.","ok");
  });
}

/* ---------- AVALIAÇÃO ---------- */
async function ligarAvaliacao(id){
  const c = cursoAberto;
  let questoes = Object.entries(c.questoes||{}).sort((a,b)=>(a[1].ordem||0)-(b[1].ordem||0));
  let gabarito = {};

  try { gabarito = await Api.obterGabarito(id); }
  catch(e){ avisar("Não foi possível carregar o gabarito. Reabra a avaliação antes de editar.","erro");return; }
  pintar();

  /* Sorteio com banco pequeno é sorteio de mentira: se o curso pede 10 questões
     e o banco tem 11, todo mundo faz praticamente a mesma prova. Este aviso
     existe para a equipe não publicar achando que está protegida. */
  function avisarBanco(){
    const alvo = $("#avisoBanco"); if (!alvo) return;
    const ativo = $("#qAtivo")?.value === "1";
    const porProva = Math.max(1, Number($("#qPorProva")?.value) || 10);
    const banco = questoes.length;
    if (!ativo) { alvo.innerHTML = ""; return; }

    if (banco === 0){
      alvo.innerHTML = `<div class="aviso a-erro"><span><b>Banco vazio</b>
        A avaliação está marcada como obrigatória, mas não há nenhuma questão cadastrada.
        Nesta situação o professor não consegue concluir o curso nem emitir certificado.</span></div>`;
    } else if (banco < porProva){
      alvo.innerHTML = `<div class="aviso a-erro"><span><b>Banco menor que a prova</b>
        O curso pede ${porProva} questões por prova e o banco tem ${banco}. Todas as
        questões vão cair em todas as provas, e o sorteio deixa de proteger.</span></div>`;
    } else if (banco < porProva * 3){
      alvo.innerHTML = `<div class="aviso a-atencao"><span><b>Banco apertado</b>
        ${banco} questões para provas de ${porProva}. Recomendado: ${porProva * 3} ou mais,
        para que duas pessoas dificilmente recebam a mesma prova.</span></div>`;
    } else {
      alvo.innerHTML = `<div class="aviso a-ok"><span><b>Banco em tamanho adequado</b>
        ${banco} questões para provas de ${porProva}.</span></div>`;
    }
  }
  $("#qPorProva")?.addEventListener("input", avisarBanco);
  $("#qAtivo")?.addEventListener("change", avisarBanco);

  function pintar(){
    avisarBanco();
    const alvo = $("#listaQuestoes"); if (!alvo) return;
    alvo.innerHTML = questoes.length ? questoes.map(([qid,q],i)=>{
      const g = gabarito[qid] || {};
      return `
      <div class="cartao" style="box-shadow:none;margin-top:0;margin-bottom:12px">
        <div class="l-auto" style="justify-content:space-between">
          <b style="color:var(--azul)">Questão ${i+1}</b>
          <button class="btn b-perigo b-pequeno" data-rmq="${qid}">Excluir</button>
        </div>
        <div class="linha" style="margin-top:10px"><div>
          <label class="rot" for="en-${qid}">Enunciado</label>
          <textarea class="campo" id="en-${qid}" rows="2">${esc(q.enunciado||"")}</textarea>
        </div></div>
        ${[0,1,2,3].map(k=>`
          <div class="l-auto" style="margin-bottom:7px">
            <input type="radio" name="ok-${qid}" value="${k}" ${Number(g.correta)===k?"checked":""} aria-label="Marcar alternativa ${"ABCD"[k]} como correta">
            <b style="width:16px;color:var(--suave)">${"ABCD"[k]}</b>
            <input class="campo" id="alt-${qid}-${k}" style="flex:1" value="${esc(q.alternativas?.[k]||"")}" placeholder="Alternativa ${"ABCD"[k]}">
          </div>`).join("")}
        <div class="linha" style="margin-top:10px"><div>
          <label class="rot" for="ex-${qid}">Explicação (mostrada depois da correção)</label>
          <textarea class="campo" id="ex-${qid}" rows="2">${esc(g.explicacao||"")}</textarea>
        </div></div>
        <button class="btn b-primario b-pequeno" data-sq="${qid}">Salvar questão</button>
      </div>`;
    }).join("")
    : '<div class="vazio"><p>Nenhuma questão cadastrada.</p><p style="font-size:.86rem">Recomendação: no mínimo 3 questões, com ao menos uma por módulo.</p></div>';

    $$("[data-sq]").forEach(b=>b.addEventListener("click", async ()=>{
      const qid = b.dataset.sq;
      const alternativas = [0,1,2,3].map(k=>$(`#alt-${qid}-${k}`).value.trim());
      const marcada = document.querySelector(`input[name="ok-${qid}"]:checked`);
      if (!$(`#en-${qid}`).value.trim()) return avisar("Preencha o enunciado.","erro");
      if (alternativas.some(a=>!a))     return avisar("Preencha as quatro alternativas.","erro");
      if (!marcada)                     return avisar("Marque qual alternativa é a correta.","erro");
      const ordem = questoes.findIndex(([x])=>x===qid) + 1;
      await Api.salvarQuestao(id, qid,
        { enunciado:$(`#en-${qid}`).value.trim(), alternativas, ordem },
        { correta:Number(marcada.value), explicacao:$(`#ex-${qid}`).value.trim() });
      gabarito[qid] = { correta:Number(marcada.value), explicacao:$(`#ex-${qid}`).value.trim() };
      avisar("Questão salva.","ok");
    }));

    $$("[data-rmq]").forEach(b=>b.addEventListener("click", async ()=>{
      if (!confirm("Excluir esta questão?")) return;
      await Api.excluirQuestao(id, b.dataset.rmq);
      questoes = questoes.filter(([x])=>x!==b.dataset.rmq);
      pintar();
    }));
  }

  $("#novaQuestao")?.addEventListener("click", ()=>{
    const qid = "q" + (Date.now().toString(36));
    questoes.push([qid, { enunciado:"", alternativas:["","","",""], ordem:questoes.length+1 }]);
    gabarito[qid] = { correta:0, explicacao:"" };
    pintar();
  });

  $("#salvarRegras")?.addEventListener("click", async ()=>{
    await Api.salvarCurso(id, {
      quizAtivo:        $("#qAtivo").value === "1",
      quizPorProva:     Math.max(1, Number($("#qPorProva").value) || 10),
      quizNotaCorte:    Number($("#qNota").value) || 70,
      quizTentativasMax:Number($("#qTent").value) || 0
    });
    cursoAberto = null;
    avisar("Regras da avaliação salvas.","ok");
  });
}

/* ---------- PUBLICAÇÃO ---------- */
function ligarPublicar(id){
  $("#duplicarCurso")?.addEventListener("click",async e=>{
    e.target.disabled=true;
    try{const r=await Api.duplicarCurso(id);cursoAberto=null;location.hash="#/curso/"+r.id+"/dados";}
    catch(err){avisar(err.message||"Não foi possível criar a cópia.","erro");e.target.disabled=false;}
  });
  $$("[data-status]").forEach(b=>b.addEventListener("click",async()=>{
    const novo=b.dataset.status;
    const perguntas={
      publicado:"Publicar este curso após validar o conteúdo?",
      arquivado:"Arquivar tira o curso do catálogo e da lista principal. Quem estiver cursando perde o acesso ao conteúdo, mas certificados já emitidos continuam válidos. Confirma?",
      rascunho:"Voltar para rascunho retira o curso do acesso dos professores. Para revisar conteúdo, prefira criar uma nova versão. Continuar?",
      revisao:"Enviar para revisão retira o curso do acesso dos professores. Continuar?"};
    if(!confirm(perguntas[novo]||"Alterar a situação deste curso?"))return;
    b.disabled=true;
    try{await Api.publicarCurso(id,novo);cursoAberto=null;await renderizar();avisar("Situação atualizada.","ok");}
    catch(e){avisar(e.message||"Não foi possível alterar a situação.","erro");b.disabled=false;}
  }));
  $("#excluirCurso")?.addEventListener("click",async()=>{
    if(prompt('Isto apaga o curso e todo o conteúdo dele, sem volta.\n\nDigite EXCLUIR para confirmar:')!=="EXCLUIR")return;
    try{await Api.excluirCurso(id);cursoAberto=null;location.hash="#/cursos";}
    catch(e){avisar(e.message||"Não foi possível excluir.","erro");}
  });
}

/* ---------- TRILHAS ---------- */
function ligarTrilhas(){
  const editor = async (t)=>{
    const nome = prompt("Nome da trilha:", t?.nome || "");
    if (!nome) return;
    const resumo = prompt("Resumo curto:", t?.resumo || "") || "";
    const id = t?.id || slug(nome);
    const escolha = prompt(
      "Cursos da trilha, separados por vírgula (use os identificadores):\n\n" +
      S.cursos.map(c=>`${c.id} — ${c.titulo}`).join("\n"),
      (t?.cursos||[]).join(", ")
    );
    if (escolha === null) return;
    const cursos = escolha.split(",").map(s=>s.trim()).filter(x=>S.cursos.some(c=>c.id===x));
    const horas = cursos.reduce((s,cid)=> s + (S.cursos.find(c=>c.id===cid)?.horas||0), 0);
    await Api.salvarTrilha(id, {
      nome, resumo, cursos, horas,
      ordem: t?.ordem || S.trilhas.length+1,
      status: t?.status || (podePublicar()?"publicado":"rascunho")
    });
    await renderizar();
    avisar("Trilha salva.","ok");
  };

  $("#novaTrilha")?.addEventListener("click", ()=> editor(null));
  $$("[data-editar-trilha]").forEach(b=>b.addEventListener("click", ()=>
    editor(S.trilhas.find(t=>t.id===b.dataset.editarTrilha))));
  $$("[data-excluir-trilha]").forEach(b=>b.addEventListener("click", async ()=>{
    if (!confirm("Excluir esta trilha? Os cursos continuam existindo.")) return;
    await Api.excluirTrilha(b.dataset.excluirTrilha);
    await renderizar();
  }));
}

/* ---------- CERTIFICADOS ---------- */
function ligarCertificados(){
  const buscar = async ()=>{
    const termo = $("#buscaCert").value.trim();
    if (!termo) return;
    const alvo = $("#resCert");
    alvo.innerHTML = '<p style="color:var(--suave)">Consultando…</p>';
    try {
      const lista = await Api.buscarCertificados(termo);
      alvo.innerHTML = lista.length ? `<table>
        <thead><tr><th>Código</th><th>Professor</th><th>Curso</th><th>Carga</th><th>Situação</th><th></th></tr></thead>
        <tbody>${lista.map(c=>`<tr>
          <td style="font-family:ui-monospace,monospace">${esc(c.codigo)}</td>
          <td>${esc(c.nome)}<br><span style="font-size:.78rem;color:var(--suave)">${esc(c.municipio||"")}</span></td>
          <td>${esc(c.cursoTitulo)}</td>
          <td>${c.cargaHoraria}h</td>
          <td><span class="selo ${c.ativo===false?"s-rascunho":"s-publicado"}">${c.ativo===false?"Revogado":"Válido"}</span></td>
          <td>${podePublicar()&&c.ativo!==false?`<button class="btn b-perigo b-pequeno" data-rev="${esc(c.codigo)}">Revogar</button>`:""}</td>
        </tr>`).join("")}</tbody></table>`
      : '<div class="vazio"><p>Nenhum certificado encontrado.</p></div>';

      $$("[data-rev]").forEach(b=>b.addEventListener("click", async ()=>{
        const motivo = prompt("Motivo da revogação (fica registrado):");
        if (motivo === null) return;
        await Api.revogarCertificado(b.dataset.rev, motivo);
        avisar("Certificado revogado.","ok");
        buscar();
      }));
    } catch(e){ alvo.innerHTML = `<div class="aviso a-erro"><span>${esc(e.message)}</span></div>`; }
  };
  $("#btnBuscaCert")?.addEventListener("click", buscar);
  $("#buscaCert")?.addEventListener("keydown", e=>{ if (e.key==="Enter") buscar(); });
}

/* ---------- EQUIPE ---------- */
function ligarEquipe(){
  $("#eqSalvar")?.addEventListener("click", async ()=>{
    const email = $("#eqEmail").value.trim();
    if (!email) return avisar("Informe o e-mail.","erro");
    try {
      await Api.definirPapel(email, $("#eqPapel").value);
      await renderizar();
      avisar("Papel atualizado. A pessoa precisa sair e entrar de novo.","ok");
    } catch(e){ avisar(e.message,"erro"); }
  });
}

/* ---------- RELATÓRIO ---------- */
function ligarRelatorio(){
  let acumuladas=[],cursor=null,filtro="";
  $("#btnRel")?.addEventListener("click", async ()=>{
    acumuladas=[];cursor=null;filtro=$("#relMunicipio").value.trim();await carregarPagina();
  });
  async function carregarPagina(){
    $("#btnRel").disabled=true;
    const alvo = $("#resRel");
    alvo.innerHTML = '<p style="color:var(--suave)">Gerando…</p>';
    try {
      const pagina=await Api.relatorioAdesao(filtro,cursor);
      acumuladas.push(...pagina.linhas);cursor=pagina.proximoCursor;
      const r={linhas:acumuladas,totalProfessores:acumuladas.length,totalCertificados:acumuladas.reduce((n,l)=>n+l.certificados,0),totalHoras:acumuladas.reduce((n,l)=>n+l.horasCertificadas,0)};
      alvo.innerHTML = `
        <div class="linha l3">
          <div class="cartao" style="box-shadow:none"><b style="font-size:1.8rem;color:var(--azul)">${r.totalProfessores}</b><br><span style="color:var(--suave);font-size:.86rem">professores</span></div>
          <div class="cartao" style="box-shadow:none;margin:0"><b style="font-size:1.8rem;color:var(--verde)">${r.totalCertificados}</b><br><span style="color:var(--suave);font-size:.86rem">certificados</span></div>
          <div class="cartao" style="box-shadow:none;margin:0"><b style="font-size:1.8rem;color:var(--azul)">${r.totalHoras}h</b><br><span style="color:var(--suave);font-size:.86rem">horas certificadas</span></div>
        </div>
        <p>${cursor?"Resultado parcial. Carregue as próximas páginas para completar o relatório.":"Todas as páginas deste filtro foram carregadas."} Certificados revogados não entram nos totais. Conclusões anteriores à atualização só entram após revalidação; certificados antigos válidos continuam contados.</p>
        ${cursor?'<button class="btn b-primario" id="maisRel">Carregar mais 100 professores</button>':''}
        <button class="btn b-neutro" id="csv">Exportar CSV ${cursor?"parcial":"completo"}</button>
        ${r.linhas.length ? `<div style="overflow-x:auto;margin-top:14px"><table>
          <thead><tr><th>Nome</th><th>Escola</th><th>Função</th><th>Iniciados</th><th>Concluídos</th><th>Certificados</th><th>Horas</th></tr></thead>
          <tbody>${r.linhas.map(l=>`<tr><td>${esc(l.nome)}</td><td>${esc(l.escola)}</td><td>${esc(l.cargo)}</td><td>${l.cursosIniciados}</td><td>${l.cursosConcluidos}</td><td>${l.certificados}</td><td>${l.horasCertificadas}</td></tr>`).join("")}</tbody>
        </table></div>` : '<p style="color:var(--suave);margin-top:14px">Nenhum professor encontrado para esse filtro.</p>'}`;

      $("#maisRel")?.addEventListener("click",carregarPagina);
      $("#csv")?.addEventListener("click", ()=>{
        const cab = ["Nome","E-mail","Municipio","Escola","Funcao","Cursos iniciados","Cursos concluidos","Certificados","Horas certificadas"];
        const linhas = r.linhas.map(l=>[l.nome,l.email,l.municipio,l.escola,l.cargo,l.cursosIniciados,l.cursosConcluidos,l.certificados,l.horasCertificadas]);
        const csv = [cab, ...linhas].map(l=>l.map(v=>`"${String(v??"").replace(/^[=+@\-\t\r]/,"' $&").replace(/"/g,'""')}"`).join(";")).join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(["﻿"+csv], { type:"text/csv;charset=utf-8" }));
        a.download = `adesao-${($("#relMunicipio").value.trim()||"geral").replace(/\W+/g,"-")}.csv`;
        a.click();
      });
    } catch(e){ alvo.innerHTML = `<div class="aviso a-erro"><span>${esc(e.message)}</span></div>`; }
    finally{$("#btnRel").disabled=false;}
  }
}

/* ---------------------------------------------------------------------------
   AUTENTICAÇÃO E ARRANQUE
--------------------------------------------------------------------------- */
function aoMudarAutenticacao(){
  const acesso = $("#telaAcesso"), app = $("#app");

  if (!S.usuario){
    acesso.style.display = "grid"; app.classList.remove("pronto");
    $("#acessoConteudo").innerHTML = '<button class="btn b-primario b-bloco" id="btnEntrar">Entrar com Google</button>';
    $("#btnEntrar").addEventListener("click", entrar);
    return;
  }

  if (!podeEditar()){
    acesso.style.display = "grid"; app.classList.remove("pronto");
    $("#acessoConteudo").innerHTML = `
      <div class="aviso a-atencao" style="text-align:left"><span><b>Sem permissão de acesso</b>
      A conta ${esc(S.usuario.email)} não tem papel de editor nem de administrador na Formação Continuada.</span></div>
      <p style="font-size:.84rem;color:var(--suave);text-align:left">
      Se um administrador acabou de conceder seu acesso, saia e entre de novo — o papel viaja no token e só é atualizado no login.</p>
      <button class="btn b-neutro b-bloco" id="btnSairAcesso">Sair</button>`;
    $("#btnSairAcesso").addEventListener("click", ()=>Api.sair());
    return;
  }

  acesso.style.display = "none"; app.classList.add("pronto");
  $("#euNome").textContent  = S.usuario.displayName || "Equipe";
  $("#euEmail").textContent = S.usuario.email || "";
  $("#euPapel").textContent = S.papel === "admin" ? "Administrador" : "Editor";
  renderizar();
}

async function entrar(){
  try { await Api.entrar(); }
  catch(e){ $("#acessoMsg").innerHTML = `<div class="aviso a-erro"><span>${esc(e.message)}</span></div>`; }
}

$("#btnSair")?.addEventListener("click", ()=>Api.sair());
window.addEventListener("hashchange", ()=>{ if (podeEditar()) renderizar(); });

window.addEventListener("unhandledrejection",ev=>{console.error(ev.reason);avisar(ev.reason?.message||"Não foi possível salvar. Confira a conexão e tente novamente.","erro");});

(async function arrancar(){
  try {
    await Api.iniciar();
    if (MODO_DEMO){
      $("#telaAcesso").style.display = "none";
      $("#app").classList.add("pronto");
      $("#euNome").textContent  = "Modo demonstração";
      $("#euEmail").textContent = "nada é salvo";
      $("#euPapel").textContent = "Administrador";
      renderizar();
    }
  } catch(e){
    console.error(e);
    $("#acessoMsg").innerHTML = `<div class="aviso a-erro"><span><b>Falha ao conectar</b>${esc(e.message)}</span></div>`;
  }
})();
</script>
