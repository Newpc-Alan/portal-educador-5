<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atenção ao professor</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background:#dbeaf7; font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif; user-select:none; cursor:default; }
  /* duas camadas para a troca suave entre mensagens */
  .camada { position:fixed; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.2s ease; }
  .camada.visivel { opacity:1; }
  .nome { position:fixed; top:18px; left:18px; z-index:2; display:none; align-items:center; gap:8px;
          background:rgba(255,255,255,.88); color:#0F2C4A; font-size:15px; font-weight:700;
          padding:8px 14px; border-radius:30px; box-shadow:0 4px 14px rgba(15,44,74,.18); }
  .nome::before { content:""; width:9px; height:9px; border-radius:50%; background:#3ea8ce; }
</style>
</head>
<body>
  <div class="camada" id="camadaA"></div>
  <div class="camada" id="camadaB"></div>
  <div class="nome" id="nome"></div>
<script src="bloqueio.js"></script>
</body>
</html>
