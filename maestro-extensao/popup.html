<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Portal Maestro</title>
<style>
  :root { --azul:#0F2C4A; --ciano:#3ea8ce; --lima:#a6c544; --lima-esc:#557a1f; --cinza:#5b6b7a; --borda:#d9e1e8; --grad:linear-gradient(135deg,#184489 0%,#3ea8ce 100%); }
  * { box-sizing:border-box; }
  body { margin:0; width:300px; font:14px/1.4 Inter,"Segoe UI",Roboto,Arial,sans-serif; color:var(--azul); background:#f6f8fa; }
  header { background:linear-gradient(120deg,#05091a,#16406b); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:4px solid; border-image:linear-gradient(90deg,var(--ciano),var(--lima)) 1; }
  header img { width:34px; height:34px; }
  header b { font-size:15px; letter-spacing:.3px; }
  header span { display:block; font-size:12px; opacity:.8; }
  main { padding:16px; }
  label { display:block; font-size:12px; font-weight:600; margin:10px 0 4px; color:var(--cinza); }
  input { width:100%; padding:10px; border:1px solid var(--borda); border-radius:8px; font-size:15px; }
  #codigo { font-size:22px; letter-spacing:6px; text-align:center; font-weight:700; }
  button { width:100%; margin-top:14px; padding:11px; border:0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; background:var(--grad); color:#fff; }
  button.sec { background:#e6ebf0; color:var(--azul); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:10px; font-size:13px; min-height:18px; }
  .erro { color:#b3261e; }
  .ok { color:var(--lima-esc); }
  .card { background:#fff; border:1px solid var(--borda); border-radius:10px; padding:14px; text-align:center; }
  .card .num { font-size:26px; font-weight:800; letter-spacing:4px; }
  .pill { display:inline-block; margin-top:8px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; background:#eef5dc; color:var(--lima-esc); }
  .pill.bloq { background:#fde7e5; color:#b3261e; }
  .rodape { margin-top:12px; font-size:11px; color:var(--cinza); text-align:center; word-break:break-all; }
  .mao { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; padding:14px; font-size:17px; font-weight:800;
         background:linear-gradient(135deg,#e0a321,#f3c34d); color:#3d2a00; border-radius:12px; }
  .mao .ico { font-size:26px; }
  .mao.erguida { background:#fff3d6; color:#6b4b00; box-shadow:inset 0 0 0 2px #e0a321; }
  .mao.erguida .ico { animation:aceno 1s ease-in-out infinite; transform-origin:70% 90%; }
  @keyframes aceno { 0%,100% { transform:rotate(-12deg); } 50% { transform:rotate(14deg); } }
  .dica { font-size:12px; color:var(--cinza); text-align:center; margin-top:6px; min-height:16px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><b>Portal Maestro</b><span>Conexão com a aula do professor</span></div></header>
<main>
  <section id="telaEntrar" hidden>
    <label for="codigo">Número da aula</label>
    <input id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <label for="nome">Seu nome</label>
    <input id="nome" maxlength="60" placeholder="Como o professor vai te ver">
    <button data-action="entrar" id="btnEntrar">Entrar na aula</button>
    <div class="msg" id="msgEntrar"></div>
  </section>

  <section id="telaNaAula" hidden>
    <div class="card">
      <div>Você está na aula</div>
      <div class="num" id="numAula">------</div>
      <div id="nomeAluno"></div>
      <span class="pill" id="pillStatus">Conectado</span>
    </div>
    <button class="mao" data-action="mao" id="btnMao"><span class="ico">✋</span><span id="txtMao">Levantar a mão</span></button>
    <div class="dica" id="dicaMao">O professor vê no painel que você quer falar.</div>
    <button class="sec" data-action="sair" id="btnSair">Sair da aula</button>
    <div class="msg" id="msgAula"></div>
  </section>

  <div class="rodape" id="rodape"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
