// App do aluno do Portal Maestro (WebView próprio). Gerado pelo GitHub Actions (.github/workflows/maestro-apk.yml).
// A chave de assinatura vem dos segredos MAESTRO_KEYSTORE_B64 e MAESTRO_SENHA (nunca fica no repositório).
plugins { id 'com.android.application' }
android {
    namespace "br.com.portaldoeducador.maestro"
    compileSdk 35
    defaultConfig {
        applicationId "br.com.portaldoeducador.maestro"
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("MAESTRO_CODIGO") ?: "1")
        versionName System.getenv("MAESTRO_VERSAO") ?: "0.0.0"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("MAESTRO_KEYSTORE") ?: "nao-configurado.keystore")
            storePassword System.getenv("MAESTRO_SENHA")
            keyAlias "maestro"
            keyPassword System.getenv("MAESTRO_SENHA")
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
