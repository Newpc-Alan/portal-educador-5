<style>
:root{
 --navy:#0F2C4A;--cyan:#37B1DA;--lime:#B6D752;--blue:#2F80ED;--green:#27AE60;--yellow:#F2C94C;--orange:#F2994A;--red:#EB5757;--purple:#9B51E0;
 --ink:#153047;--muted:#5E7789;--paper:#FFFDF7;--sky:#E6F5FF;--line:#D8E7EF;--shadow:0 14px 34px rgba(15,44,74,.16)

*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Nunito","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--sky);color:var(--ink)}
body{overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit;user-select:none}
.hidden{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#CFEBFF 0%,#E9F6FF 45%,#DDF3D2 100%)}
header{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(90deg,#1E324A,#0F2C4A);color:#fff;z-index:30}
header img.logo{width:46px;height:46px;border-radius:50%;object-fit:contain;flex:none}
header h1{margin:0;font-size:21px;line-height:1}
header small{display:block;margin-top:3px;font-size:12px;color:#BFDDE7}
.sp{flex:1}
.hbtn{height:46px;min-width:46px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,#1b5470,#0d3a52);color:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.35);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.hbtn.icon{padding:0;font-size:20px}
.hbtn.off{opacity:.5}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto;padding:12px}

/* MAPA DO CASTELO */
.mapWrap{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.castleCard{border-radius:28px;background:linear-gradient(180deg,#BFE7FF,#E8F7FF 60%,#CDEBB8);box-shadow:var(--shadow);position:relative;overflow:hidden;display:grid;place-items:center;padding:14px;min-height:280px}
.castleCard svg{width:100%;height:100%;max-height:100%}
.castleCard .lbl{position:absolute;left:16px;top:14px;background:#ffffffd9;border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px;color:var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.room{min-height:104px;border-radius:22px;border:3px solid #fff;background:#fff;box-shadow:0 8px 20px rgba(15,44,74,.12);display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;position:relative;transition:.12s}
.room:active{transform:scale(.98)}
.room .ri{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;flex:none;color:#fff}
.room b{display:block;font-size:19px;line-height:1.1}
.room .stars{display:block;font-size:20px;letter-spacing:1px;margin-top:4px;color:#F2C94C}
.room .stars i{font-style:normal;opacity:.25}
.room.next{border-color:var(--yellow);animation:glow 1.4s ease-in-out infinite}
.room.done{border-color:#7ED596}
@keyframes glow{0%,100%{box-shadow:0 8px 20px rgba(15,44,74,.12)}50%{box-shadow:0 0 0 8px rgba(242,201,76,.35),0 8px 20px rgba(15,44,74,.12)}}
.r1{background:linear-gradient(145deg,#4FB7E8,#2385B8)}.r2{background:linear-gradient(145deg,#F5B94A,#D98A16)}.r3{background:linear-gradient(145deg,#3ED17F,#1E9A57)}.r4{background:linear-gradient(145deg,#B07CF0,#7A4AD0)}.r5{background:linear-gradient(145deg,#FF8A65,#E0552F)}.r6{background:linear-gradient(145deg,#8C6E4A,#5E4529)}.r7{background:linear-gradient(145deg,#2CB9B5,#158C89)}

/* SALA (jogo) */
.play{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.playTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.roomBadge{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 16px 6px 6px;box-shadow:0 4px 12px rgba(0,0,0,.08);font-weight:900;font-size:17px}
.roomBadge i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;font-style:normal}
.dots{display:flex;gap:6px}
.dots span{width:18px;height:18px;border-radius:50%;background:#ffffffaa;border:2px solid #ffffff}
.dots span.ok{background:#3ED17F;border-color:#1E9A57}.dots span.bad{background:#FF8A65;border-color:#E0552F}.dots span.cur{background:var(--yellow);border-color:#D98A16;transform:scale(1.2)}
.prompt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(15,44,74,.1);min-height:74px}
.prompt .say{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,#4FB7E8,#2385B8);color:#fff;font-size:26px;flex:none;box-shadow:0 3px 0 #17628a}
.prompt .say.talking{animation:pulse .5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.prompt .txt{font-size:clamp(20px,2.4vw,30px);font-weight:900;line-height:1.15;flex:1}
.prompt .txt em{font-style:normal;color:#D98A16;text-transform:uppercase}
.prompt .pic{width:64px;height:64px;flex:none}
.prompt .pic svg{width:100%;height:100%}
.board{border-radius:26px;background:#ffffffb8;border:3px solid #fff;box-shadow:var(--shadow);padding:14px;display:grid;place-items:center;min-height:0;position:relative;overflow:auto}
.opts{display:grid;gap:14px;width:100%;max-width:980px}
.opts.n3{grid-template-columns:repeat(3,1fr)}.opts.n4{grid-template-columns:repeat(4,1fr)}.opts.n2{grid-template-columns:repeat(2,1fr)}
.opt{min-height:180px;border-radius:24px;border:4px solid #E4EEF3;background:#fff;display:grid;place-items:center;padding:12px;box-shadow:0 8px 18px rgba(15,44,74,.08);transition:.12s;position:relative}
.opt:active{transform:scale(.96)}
.opt svg{width:min(150px,80%);height:auto;max-height:150px}
.opt .emo{font-size:clamp(56px,7vw,96px);line-height:1}
.opt .cap{font-size:18px;font-weight:900;margin-top:6px;color:var(--ink)}
.opt.right{border-color:#3ED17F;background:#EAF9EF;box-shadow:0 0 0 8px rgba(62,209,127,.25)}
.opt.wrong{border-color:#FF8A65;background:#FFF1EC;animation:shake .4s}
.opt.dim{opacity:.45}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.numBtn{min-height:110px;font-size:56px;font-weight:900;color:var(--navy)}
.fb{position:absolute;inset:0;z-index:5;display:none;place-items:center;pointer-events:none}
.fb.show{display:grid}
.fb .icon{font-size:clamp(90px,14vw,180px);line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.fb .msg{background:#ffffffee;border-radius:999px;padding:10px 22px;font-size:22px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.15);margin-top:6px;color:var(--ink)}

/* Cantos */
.cornerStage{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;width:100%;max-width:980px;align-items:center}
.cornerBox{position:relative;display:grid;place-items:center}
.cornerBox svg{width:min(360px,100%);height:auto}
.hot{cursor:pointer}
.hot circle.ring{fill:#fff;stroke:#F2994A;stroke-width:3;opacity:.9}
.hot.found circle.ring{fill:#3ED17F;stroke:#1E9A57}
.hot text{font-size:14px;font-weight:900;fill:#0F2C4A;pointer-events:none}
.counter{text-align:center}
.counter .big{font-size:96px;font-weight:900;line-height:1;color:var(--navy)}
.counter small{display:block;font-size:18px;font-weight:800;color:var(--muted)}
.numRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}

/* Rola ou empilha */
.rampWrap{width:100%;max-width:980px}
.rampWrap .opts .opt{overflow:hidden}
.rolling{animation:roll 1.2s ease-in forwards}
@keyframes roll{to{transform:translateX(140px) rotate(360deg)}}
.stacking{animation:stack .7s ease-out forwards}
@keyframes stack{to{transform:translateY(-26px)}}
.wobble{animation:wob .8s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* Mapa espacial */
.scene{width:min(900px,100%);aspect-ratio:16/9;max-height:100%;position:relative}
.scene svg{width:100%;height:100%}
.zone{cursor:pointer}
.zone circle{fill:#ffffff88;stroke:#F2994A;stroke-width:4;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.zone.right circle{fill:#3ED17F88;stroke:#1E9A57;stroke-dasharray:0}
.zone.wrong circle{fill:#FF8A6588;stroke:#E0552F;stroke-dasharray:0}

/* Construção */
.buildWrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:minmax(0,1fr);gap:12px;width:100%;height:100%;min-height:0}
.buildCol{min-width:0;min-height:0;display:grid;place-items:center}
.buildArea{position:relative;border-radius:22px;background:linear-gradient(#DDF3FF 0 62%,#BFE3A6 62% 100%);border:3px solid #fff;overflow:hidden;touch-action:none;width:100%;height:100%}
.buildArea svg.bg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;display:block;border-radius:6px;z-index:4}
.slot.filled{pointer-events:none}
.slot svg{display:block;width:100%;height:100%;overflow:visible}
.slot .ghost{fill:#ffffff66;stroke:#5E7789;stroke-width:3;stroke-dasharray:8 6}
.slot.target .ghost{stroke:#F2994A;stroke-width:4;fill:#ffffffaa}
.slot.filled .ghost{display:none}
.piece{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));z-index:3}
.piece svg{display:block;width:100%;height:100%;overflow:visible}
.piece.dragging{z-index:9;cursor:grabbing;filter:drop-shadow(0 12px 16px rgba(0,0,0,.3));transform:scale(1.06)}
.piece.placed{cursor:default;filter:none;z-index:2}
.piece.sel{outline:4px solid var(--yellow);outline-offset:3px;border-radius:8px}
.tray{border-radius:22px;background:#fff;border:3px solid #fff;box-shadow:0 8px 18px rgba(15,44,74,.08);padding:10px;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:8px;overflow:auto;position:relative;min-height:0}
.tray .trayNote,.tray .freeTools{grid-column:1/-1}
.tray .trayPiece{width:100%;height:72px;display:grid;place-items:center;border-radius:14px;background:#F3F8FB;border:3px solid #E4EEF3;cursor:grab;touch-action:none;position:relative}
.tray .trayPiece svg{width:78%;height:78%;overflow:visible}
.tray .trayPiece.sel{border-color:var(--yellow);background:#FFF6DA}
.tray .trayPiece.used{opacity:.25;pointer-events:none}
.trayNote{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.freeTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Fim de sala / final */
.endCard{width:min(720px,100%);background:#fff;border-radius:30px;padding:26px;text-align:center;box-shadow:var(--shadow)}
.endCard h2{margin:0;font-size:clamp(28px,4vw,44px);color:var(--navy)}
.endCard .bigStars{font-size:clamp(56px,9vw,96px);line-height:1.1;margin:8px 0;color:#F2C94C}
.endCard .bigStars i{font-style:normal;opacity:.2}
.endCard p{font-size:20px;font-weight:800;color:var(--muted);margin:6px 0 16px}
.endBtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:64px;border:0;border-radius:20px;font-size:20px;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18),0 12px 22px rgba(0,0,0,.14);display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.g{background:linear-gradient(180deg,#3ED17F,#1E9A57)}.btn.b{background:linear-gradient(180deg,#4FB7E8,#2385B8)}.btn.y{background:linear-gradient(180deg,#F5B94A,#D98A16)}.btn.w{background:#fff;color:var(--navy);border:3px solid #E4EEF3;box-shadow:none}
.btn.sm{min-height:46px;font-size:15px;border-radius:14px;padding:0 14px}
.pieceGain{font-size:18px;font-weight:900;color:#1E9A57;background:#EAF9EF;border-radius:999px;display:inline-block;padding:8px 16px;margin-bottom:12px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* Painel do professor */
.modalBack{position:fixed;inset:0;z-index:90;background:#0B2236aa;display:none;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modalBack.show{display:grid}
.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:22px;color:var(--ink);box-shadow:var(--shadow)}
.modal h2{margin:0 0 4px;font-size:26px;color:var(--navy)}.modal h3{margin:16px 0 8px;font-size:17px;color:var(--navy)}
.modal p{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.modal .close{float:right;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px}
.segs{display:flex;gap:6px;flex-wrap:wrap}.seg{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--ink)}.seg.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-top:10px}.field label{display:block;font-size:11px;letter-spacing:.06em;font-weight:900;color:var(--muted);margin-bottom:5px}
.field input[type=text]{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font:inherit;font-size:16px}
.repGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.repCard{border:2px solid var(--line);border-radius:14px;padding:10px}
.repCard b{display:block;font-size:14px}.repCard small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.repCard .st{font-size:18px;color:#F2C94C}.repCard .st i{font-style:normal;opacity:.2}
.modal table{width:100%;border-collapse:collapse;font-size:13px}.modal th,.modal td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.modal th{background:#F3F8FB;font-size:11px;letter-spacing:.05em}
.modalBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.printArea{display:none}
@media print{body{overflow:visible;background:#fff}.app,.modalBack,canvas.confetti{display:none!important}.printArea{display:block!important}}

/* responsive */
@media(max-width:900px){.mapWrap{grid-template-columns:1fr;grid-template-rows:minmax(220px,42%) minmax(0,1fr)}.opts.n4{grid-template-columns:repeat(2,1fr)}.cornerStage{grid-template-columns:1fr}.buildWrap{grid-template-columns:minmax(0,1fr) 150px}.tray .trayPiece{height:60px}}
@media(max-width:600px){header{height:56px}header h1{font-size:16px}header small{display:none}.homeBtns{grid-template-columns:1fr}.bigBtn{min-height:76px}.opts.n3{grid-template-columns:repeat(3,1fr)}.opt{min-height:120px}.opt svg{max-height:90px}.numBtn{font-size:40px;min-height:80px}.rooms{grid-template-columns:1fr}.room{min-height:80px}.prompt .txt{font-size:18px}.endBtns{grid-template-columns:1fr}.buildWrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.tray{grid-template-columns:repeat(5,1fr);max-height:150px}.tray .trayPiece{height:56px}}
</style>
</head>

<script>
/* =====================================================================

   ===================================================================== */
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- CORES ---------- */
const COLORS={azul:"#2F80ED",vermelho:"#EB5757",verde:"#27AE60",amarelo:"#F2C94C",roxo:"#9B51E0",laranja:"#F2994A",rosa:"#F06292",ciano:"#37B1DA"};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const t=f<0?0:255;const p=Math.abs(f);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

/* ---------- FORMAS PLANAS (viewBox 0 0 100 100) ---------- */
function regular(n,cx=50,cy=52,r=44,rot=-90){const pts=[];for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;pts.push([+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)])}return pts}
const SHAPES={
 circulo:{nome:"círculo",art:"o",lados:0,cantos:0,pts:null,nivel:0},
 quadrado:{nome:"quadrado",art:"o",lados:4,cantos:4,pts:[[12,12],[88,12],[88,88],[12,88]],nivel:0},
 triangulo:{nome:"triângulo",art:"o",lados:3,cantos:3,pts:[[50,8],[92,88],[8,88]],nivel:0},
 retangulo:{nome:"retângulo",art:"o",lados:4,cantos:4,pts:[[6,26],[94,26],[94,74],[6,74]],nivel:0},
 losango:{nome:"losango",art:"o",lados:4,cantos:4,pts:[[50,4],[88,50],[50,96],[12,50]],nivel:1},
 pentagono:{nome:"pentágono",art:"o",lados:5,cantos:5,pts:regular(5),nivel:1},
 hexagono:{nome:"hexágono",art:"o",lados:6,cantos:6,pts:regular(6,50,50,44,0),nivel:1}
};
function shapeSVG(id,color="#2F80ED",rot=0,extra=""){const s=SHAPES[id];const body=s.pts?`<polygon points="${s.pts.map(p=>p.join(",")).join(" ")}" fill="${color}" stroke="${shade(color,-.3)}" stroke-width="3" stroke-linejoin="round"/>`:`<circle cx="50" cy="50" r="44" fill="${color}" stroke="${shade(color,-.3)}" stroke-width="3"/>`;return `<svg viewBox="0 0 100 100" ${extra}><g transform="rotate(${rot} 50 50)">${body}</g></svg>`}

/* ---------- SÓLIDOS (viewBox 0 0 100 100) ---------- */
const SOLIDS={
 esfera:{nome:"esfera",art:"a",rola:true,empilha:false,faces:["circulo"],cor:COLORS.verde,nivel:0,obj:"bola"},
 cubo:{nome:"cubo",art:"o",rola:false,empilha:true,faces:["quadrado"],cor:COLORS.azul,nivel:0,obj:"dado"},
 cilindro:{nome:"cilindro",art:"o",rola:true,empilha:true,faces:["circulo","retangulo"],cor:COLORS.amarelo,nivel:0,obj:"lata"},
 cone:{nome:"cone",art:"o",rola:true,empilha:false,faces:["circulo","triangulo"],cor:COLORS.laranja,nivel:0,obj:"casquinha"},
 piramide:{nome:"pirâmide",art:"a",rola:false,empilha:false,faces:["quadrado","triangulo"],cor:COLORS.vermelho,nivel:1,obj:"barraca"},
 bloco:{nome:"bloco retangular",art:"o",rola:false,empilha:true,faces:["retangulo"],cor:COLORS.roxo,nivel:1,obj:"caixa"}
};
function solidSVG(id,extra=""){
 const s=SOLIDS[id];const c=s.cor,l=shade(c,.35),d=shade(c,-.28),dd=shade(c,-.45);
 let g="";
 if(id==="esfera")g=`<defs><radialGradient id="rg_${id}" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="${shade(c,.6)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${dd}"/></radialGradient></defs><ellipse cx="50" cy="90" rx="34" ry="6" fill="#0002"/><circle cx="50" cy="50" r="40" fill="url(#rg_${id})"/>`;
 if(id==="cubo")g=`<ellipse cx="50" cy="92" rx="36" ry="5" fill="#0002"/><polygon points="20,32 60,32 60,84 20,84" fill="${c}"/><polygon points="60,32 84,16 84,68 60,84" fill="${d}"/><polygon points="20,32 44,16 84,16 60,32" fill="${l}"/><g fill="none" stroke="${dd}" stroke-width="2" stroke-linejoin="round"><polygon points="20,32 60,32 60,84 20,84"/><polygon points="60,32 84,16 84,68 60,84"/><polygon points="20,32 44,16 84,16 60,32"/></g>`;
 if(id==="bloco")g=`<ellipse cx="50" cy="92" rx="42" ry="5" fill="#0002"/><polygon points="8,44 62,44 62,84 8,84" fill="${c}"/><polygon points="62,44 90,26 90,66 62,84" fill="${d}"/><polygon points="8,44 36,26 90,26 62,44" fill="${l}"/><g fill="none" stroke="${dd}" stroke-width="2" stroke-linejoin="round"><polygon points="8,44 62,44 62,84 8,84"/><polygon points="62,44 90,26 90,66 62,84"/><polygon points="8,44 36,26 90,26 62,44"/></g>`;
 if(id==="cilindro")g=`<ellipse cx="50" cy="92" rx="36" ry="5" fill="#0002"/><path d="M20 24 V76 A30 10 0 0 0 80 76 V24 Z" fill="${c}"/><path d="M20 24 V76 A30 10 0 0 0 50 86 V34 Z" fill="${shade(c,.15)}"/><path d="M62 30 V82 A30 10 0 0 0 80 76 V24 Z" fill="${d}"/><ellipse cx="50" cy="24" rx="30" ry="10" fill="${l}" stroke="${dd}" stroke-width="2"/><path d="M20 24 V76 A30 10 0 0 0 80 76 V24" fill="none" stroke="${dd}" stroke-width="2"/>`;
 if(id==="cone")g=`<ellipse cx="50" cy="92" rx="34" ry="5" fill="#0002"/><path d="M50 8 L20 80 A30 10 0 0 0 80 80 Z" fill="${c}"/><path d="M50 8 L20 80 A30 10 0 0 0 50 90 Z" fill="${shade(c,.18)}"/><path d="M50 8 L64 78 A30 10 0 0 0 80 80 Z" fill="${d}"/><path d="M20 80 A30 10 0 0 0 80 80" fill="none" stroke="${dd}" stroke-width="2"/><path d="M50 8 L20 80 M50 8 L80 80" fill="none" stroke="${dd}" stroke-width="2"/>`;
 if(id==="piramide")g=`<ellipse cx="50" cy="92" rx="40" ry="5" fill="#0002"/><polygon points="50,10 12,74 62,86" fill="${c}"/><polygon points="50,10 62,86 92,62" fill="${d}"/><g fill="none" stroke="${dd}" stroke-width="2" stroke-linejoin="round"><polygon points="50,10 12,74 62,86"/><polygon points="50,10 62,86 92,62"/></g>`;
 return `<svg viewBox="0 0 100 100" ${extra}>${g}</svg>`;
}

/* ---------- OBJETOS DO MUNDO ---------- */
const OBJETOS=[
 {emo:"🍕",nome:"pizza",forma:"circulo"},{emo:"🪙",nome:"moeda",forma:"circulo"},{emo:"🍪",nome:"biscoito",forma:"circulo"},{emo:"🕐",nome:"relógio",forma:"circulo"},
 {emo:"🪟",nome:"janela",forma:"quadrado"},{emo:"🔲",nome:"azulejo",forma:"quadrado"},
 {emo:"🚪",nome:"porta",forma:"retangulo"},{emo:"📱",nome:"celular",forma:"retangulo"},{emo:"📏",nome:"régua",forma:"retangulo"},
 {emo:"⚠️",nome:"placa",forma:"triangulo"},{emo:"🧀",nome:"pedaço de queijo",forma:"triangulo"},{emo:"⛵",nome:"vela do barco",forma:"triangulo"},
 {emo:"🪁",nome:"pipa",forma:"losango"},{emo:"🛑",nome:"placa de pare",forma:"hexagono"},
 {emo:"⚽",nome:"bola",forma:"esfera"},{emo:"🍊",nome:"laranja",forma:"esfera"},{emo:"🌍",nome:"planeta",forma:"esfera"},{emo:"🎈",nome:"balão",forma:"esfera"},
 {emo:"🎲",nome:"dado",forma:"cubo"},{emo:"🎁",nome:"presente",forma:"cubo"},{emo:"🧊",nome:"gelo",forma:"cubo"},
 {emo:"🥫",nome:"lata",forma:"cilindro"},{emo:"🕯️",nome:"vela",forma:"cilindro"},{emo:"🥁",nome:"tambor",forma:"cilindro"},{emo:"🧻",nome:"rolo de papel",forma:"cilindro"},
 {emo:"🍦",nome:"casquinha",forma:"cone"},{emo:"🎉",nome:"chapéu de festa",forma:"cone"},{emo:"🎄",nome:"pinheiro",forma:"cone"},
 {emo:"⛺",nome:"barraca",forma:"piramide"},{emo:"📦",nome:"caixa",forma:"bloco"},{emo:"📕",nome:"livro",forma:"bloco"},{emo:"🧱",nome:"tijolo",forma:"bloco"},{emo:"🍫",nome:"chocolate",forma:"bloco"}
];
const nomeForma=id=>SHAPES[id]?SHAPES[id].nome:SOLIDS[id].nome;
const artForma=id=>SHAPES[id]?SHAPES[id].art:SOLIDS[id].art;
const picForma=(id,color)=>SHAPES[id]?shapeSVG(id,color||COLORS.azul):solidSVG(id);

/* ---------- SALAS E NÍVEIS ---------- */
const LEVELS=[{id:0,label:"Educação Infantil · 4 a 5 anos"},{id:1,label:"1º e 2º ano · 6 a 7 anos"}];
const ROOMS=[
 {id:"formas",nome:"Sala das Formas",icon:"🔷",cls:"r1",peca:"a muralha",bncc:"EI03ET01 · EF02MA15"},
 {id:"cantos",nome:"Sala dos Cantos",icon:"📐",cls:"r2",peca:"a torre da esquerda",bncc:"EF01MA14 · EF02MA15"},
 {id:"rola",nome:"Rola ou Empilha",icon:"⚽",cls:"r3",peca:"a torre da direita",bncc:"EI03ET01 · EF02MA14"},
 {id:"sombras",nome:"Sala das Sombras",icon:"🔦",cls:"r4",peca:"o portão",bncc:"EF01MA14"},
 {id:"mapa",nome:"Sala do Mapa",icon:"🧭",cls:"r5",peca:"os telhados",bncc:"EF01MA11 · EF02MA12"},
 {id:"construcao",nome:"Torre da Construção",icon:"🏰",cls:"r6",peca:"as janelas",bncc:"EF01MA14 · EF02MA15"},
 {id:"mundo",nome:"Formas no Mundo",icon:"🌎",cls:"r7",peca:"a bandeira",bncc:"EF01MA13 · EF02MA14"}
];
const ROOM=Object.fromEntries(ROOMS.map(r=>[r.id,r]));
function shapesFor(){return Object.keys(SHAPES).filter(k=>SHAPES[k].nivel<=st.level)}
function solidsFor(){return Object.keys(SOLIDS).filter(k=>SOLIDS[k].nivel<=st.level)}

/* ---------- ESTADO ---------- */
const st={level:store.get("pde_castelo_nivel",0),voice:store.get("pde_castelo_voz",true),rounds:store.get("pde_castelo_rodadas",5),name:store.get("pde_castelo_nome",""),
 rooms:store.get("pde_castelo_salas",{}),screen:"home"};
function saveProgress(){store.set("pde_castelo_salas",st.rooms)}
function piecesEarned(){return ROOMS.filter(r=>st.rooms[r.id]&&st.rooms[r.id].done).length}

/* ---------- SOM ---------- */
let ac=null;function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}
function tone(f,dur,type="sine",g=.18,at=0){const c=audio();if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.01);gn.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(gn);gn.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={
 ok(){tone(659,.12,"sine",.16);tone(784,.12,"sine",.16,.1);tone(1047,.3,"sine",.16,.2)},
 bad(){tone(220,.25,"triangle",.12);tone(196,.35,"triangle",.1,.18)},
 pop(){tone(520,.08,"sine",.12);tone(880,.1,"sine",.08,.05)},
 tap(){tone(700,.06,"sine",.08)},
 tada(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,"sine",.14,i*.09));tone(1568,.7,"sine",.12,.5)},
 roll(){for(let i=0;i<8;i++)tone(180+i*20,.08,"triangle",.06,i*.12)}
};

/* ---------- VOZ ---------- */
let sayTimer=null;
function speak(text,onEnd){
 const btn=$("#sayBtn");
 if(!st.voice||!("speechSynthesis"in window)){if(onEnd)onEnd();return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));u.lang="pt-BR";u.rate=.92;u.pitch=1.08;
  const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;
  u.onstart=()=>btn&&btn.classList.add("talking");u.onend=()=>{btn&&btn.classList.remove("talking");if(onEnd)onEnd()};u.onerror=()=>{btn&&btn.classList.remove("talking");if(onEnd)onEnd()};
  speechSynthesis.speak(u)}catch(e){if(onEnd)onEnd()}
}
if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=()=>{};

/* ---------- CONFETE ---------- */
function confetti(ms=2500){
 const cv=$("#confetti");const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
 const cols=["#F2C94C","#2F80ED","#EB5757","#27AE60","#9B51E0","#37B1DA","#F2994A"];
 const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:8+Math.random()*8,h:6+Math.random()*8,c:rand(cols),v:2+Math.random()*4,a:Math.random()*6,s:(Math.random()-.5)*.2}));
 const t0=performance.now();
 (function frame(t){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.v;p.a+=p.s;p.x+=Math.sin(p.a)*1.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(t-t0<ms)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height)})(t0);
}

/* ---------- CASTELO QUE CRESCE (SVG) ---------- */
function castleSVG(n,big=false){
 const has=i=>i<n;const ghost='fill="#ffffff55" stroke="#5E7789" stroke-width="2" stroke-dasharray="7 6"';
 const stone="#D9C8A8",stoneD="#B39B72",roof="#EB5757",roofD="#B33A3A",door="#7A4B22",win="#37B1DA";
 const p=[];
 p.push(`<rect x="0" y="210" width="400" height="50" fill="#9CD673"/><ellipse cx="200" cy="214" rx="230" ry="16" fill="#86C45D"/>`);
 p.push(has(0)?`<rect x="90" y="120" width="220" height="92" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>${[0,1,2,3,4,5].map(i=>`<rect x="${92+i*38}" y="106" width="22" height="18" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>`).join("")}<g stroke="${stoneD}" stroke-width="1.5" opacity=".6">${[140,160,180,200].map(y=>`<line x1="92" y1="${y}" x2="308" y2="${y}"/>`).join("")}</g>`:`<rect x="90" y="120" width="220" height="92" ${ghost}/>`);
 p.push(has(1)?`<rect x="48" y="70" width="60" height="142" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>${[0,1,2].map(i=>`<rect x="${50+i*21}" y="56" width="14" height="16" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>`).join("")}`:`<rect x="48" y="70" width="60" height="142" ${ghost}/>`);
 p.push(has(2)?`<rect x="292" y="70" width="60" height="142" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>${[0,1,2].map(i=>`<rect x="${294+i*21}" y="56" width="14" height="16" fill="${stone}" stroke="${stoneD}" stroke-width="3"/>`).join("")}`:`<rect x="292" y="70" width="60" height="142" ${ghost}/>`);
 p.push(has(3)?`<path d="M172 212 V162 A28 28 0 0 1 228 162 V212 Z" fill="${door}" stroke="#4E2E12" stroke-width="3"/><circle cx="218" cy="190" r="3" fill="#F2C94C"/>`:`<path d="M172 212 V162 A28 28 0 0 1 228 162 V212 Z" ${ghost}/>`);
 p.push(has(4)?`<polygon points="40,58 78,8 116,58" fill="${roof}" stroke="${roofD}" stroke-width="3"/><polygon points="284,58 322,8 360,58" fill="${roof}" stroke="${roofD}" stroke-width="3"/>`:`<polygon points="40,58 78,8 116,58" ${ghost}/><polygon points="284,58 322,8 360,58" ${ghost}/>`);
 p.push(has(5)?`<rect x="68" y="100" width="20" height="28" rx="10" fill="${win}" stroke="#1b6f8f" stroke-width="2"/><rect x="312" y="100" width="20" height="28" rx="10" fill="${win}" stroke="#1b6f8f" stroke-width="2"/><rect x="135" y="150" width="24" height="24" fill="${win}" stroke="#1b6f8f" stroke-width="2"/><rect x="241" y="150" width="24" height="24" fill="${win}" stroke="#1b6f8f" stroke-width="2"/>`:`<rect x="68" y="100" width="20" height="28" rx="10" ${ghost}/><rect x="312" y="100" width="20" height="28" rx="10" ${ghost}/><rect x="135" y="150" width="24" height="24" ${ghost}/><rect x="241" y="150" width="24" height="24" ${ghost}/>`);
 p.push(has(6)?`<line x1="200" y1="106" x2="200" y2="40" stroke="#555" stroke-width="3"/><polygon points="200,40 246,52 200,64" fill="#F2C94C" stroke="#D98A16" stroke-width="2"/>`:`<line x1="200" y1="106" x2="200" y2="40" stroke="#5E7789" stroke-width="2" stroke-dasharray="6 5"/><polygon points="200,40 246,52 200,64" ${ghost}/>`);
 p.push(`<circle cx="340" cy="30" r="16" fill="#F2C94C" opacity=".9"/>`);
 return `<svg viewBox="0 0 400 260" ${big?'style="max-height:60vh"':""}>${p.join("")}</svg>`;
}
</script>
<script>
"use strict";
/* =========================== NAVEGAÇÃO =========================== */
function show(name){st.screen=name;["home","map","play","end"].forEach(s=>$("#"+s+"Screen").classList.toggle("hidden",s!==name));if("speechSynthesis"in window&&name!=="play")speechSynthesis.cancel()}
function renderHome(){
 const n=piecesEarned();
 $("#homeBtns").innerHTML=n>0?`<button class="bigBtn cont" data-action="map"><span class="in"><span class="em">🏰</span> CONTINUAR · ${n} de 7</span></button><button class="bigBtn jogar" data-action="play-first"><span class="in"><span class="em">▶</span> JOGAR</span></button>`:`<button class="bigBtn jogar" data-action="play-first"><span class="in"><span class="em">▶</span> JOGAR</span></button><button class="bigBtn mapa" data-action="map"><span class="in"><span class="em">🗺️</span> VER O MAPA</span></button>`;
 show("home");
}
function nextRoomId(){const r=ROOMS.find(r=>!(st.rooms[r.id]&&st.rooms[r.id].done));return r?r.id:null}
function starsHTML(n){return "★".repeat(n)+(n<3?`<i>${"★".repeat(3-n)}</i>`:"")}
function renderMap(){
 const n=piecesEarned();const next=nextRoomId();
 $("#castleLbl").textContent=n>=7?"Castelo completo!":`Castelo · ${n} de 7 peças`;
 $("#castleSvg").innerHTML=castleSVG(n);
 $("#rooms").innerHTML=ROOMS.map(r=>{const d=st.rooms[r.id];return `<button class="room ${d&&d.done?"done":""} ${r.id===next?"next":""}" data-action="room" data-id="${r.id}"><span class="ri ${r.cls}">${r.icon}</span><span><b>${r.nome}</b><span class="stars">${starsHTML(d?d.stars:0)}</span></span></button>`}).join("");
 show("map");
 speak(n>=7?"O castelo está completo! Você pode jogar qualquer sala de novo.":n===0?"Bem-vindo ao Castelo das Formas! Toque na sala que está brilhando.":"Escolha uma sala para ganhar mais uma peça do castelo.");
}

/* =========================== MOTOR DAS SALAS =========================== */
const sess={room:null,i:0,total:0,hits:0,extra:0,results:[],busy:false,speech:"",mist:0,cleanup:null};
function startRoom(id){
 const r=ROOM[id];sess.room=id;sess.i=0;sess.total=id==="construcao"?2:st.rounds;sess.hits=0;sess.extra=0;sess.results=[];sess.busy=false;sess.mist=0;sess.cleanup=null;
 $("#roomBadge").innerHTML=`<i class="${r.cls}">${r.icon}</i>${r.nome}`;show("play");renderDots();
 speak(INTRO[id],()=>{});setTimeout(nextRound,st.voice?1400:200);
}
const INTRO={formas:"Sala das Formas! Ouça o nome e toque na forma certa.",cantos:"Sala dos Cantos! Toque em cada canto para contar.",rola:"Rola ou empilha? Toque no sólido e veja o que acontece.",sombras:"Sala das Sombras! Descubra a marca que cada sólido deixa.",mapa:"Sala do Mapa! Coloque a estrela no lugar certo.",construcao:"Torre da Construção! Arraste cada peça para o lugar dela.",mundo:"Formas no Mundo! Que forma se parece com cada objeto?"};
function renderDots(){$("#dots").innerHTML=Array.from({length:sess.total},(_,i)=>`<span class="${sess.results[i]===true?"ok":sess.results[i]===false?"bad":i===sess.i?"cur":""}"></span>`).join("")}
function nextRound(){if(sess.cleanup){sess.cleanup();sess.cleanup=null}if(sess.i>=sess.total){endRoom();return}sess.busy=false;hideFb();renderDots();GEN[sess.room]()}
function setPrompt(html,speech,pic){$("#promptTxt").innerHTML=html;$("#promptPic").innerHTML=pic||"";sess.speech=speech;speak(speech)}
function board(html){$("#board").innerHTML=`<div class="fb" id="fb"><div><div class="icon" id="fbIcon"></div><div class="msg" id="fbMsg"></div></div></div>`+html}
function showFb(ok,msg){$("#fbIcon").textContent=ok?"⭐":"💡";$("#fbMsg").textContent=msg;$("#fb").classList.add("show")}
function hideFb(){const f=$("#fb");if(f)f.classList.remove("show")}
function result(ok,msg,speech,delay){
 if(sess.busy)return;sess.busy=true;sess.results[sess.i]=ok;if(ok)sess.hits++;else if(sess.extra<2){sess.extra++;sess.total++}
 renderDots();showFb(ok,msg);ok?SFX.ok():SFX.bad();speak(speech);
 setTimeout(()=>{sess.i++;nextRound()},delay||(ok?1400:2600));
}
function endRoom(){
 const id=sess.room;const r=ROOM[id];const ratio=sess.room==="construcao"?(sess.mist<=2?1:sess.mist<=5?.7:.4):sess.hits/Math.max(1,sess.total);
 const stars=ratio>=.9?3:ratio>=.6?2:1;const prev=st.rooms[id]||{stars:0,done:false};const first=!prev.done;
 st.rooms[id]={stars:Math.max(prev.stars,stars),done:true,hits:sess.hits,total:sess.total,data:new Date().toISOString()};saveProgress();
 const n=piecesEarned();const all=n>=7;const next=nextRoomId();
 $("#endBody").innerHTML=`<div class="endCard">${first?`<div class="pieceGain">🧱 Você ganhou ${r.peca} do castelo!</div>`:""}<h2>${stars===3?"Sala vencida!":stars===2?"Muito bem!":"Você conseguiu!"}</h2><div class="bigStars">${starsHTML(stars)}</div>
  <div style="max-width:420px;margin:0 auto">${castleSVG(n)}</div><p>${all?"O castelo está completo!":`${n} de 7 peças do castelo`}</p>
  <div class="endBtns">${all&&first?`<button class="btn y" data-action="finale">🎉 Ver o castelo pronto</button>`:next?`<button class="btn g" data-action="room" data-id="${next}">▶ Próxima sala</button>`:`<button class="btn g" data-action="room" data-id="${id}">🔁 Jogar de novo</button>`}<button class="btn b" data-action="map">🏰 Mapa do castelo</button></div></div>`;
 show("end");if(stars===3)SFX.tada();else SFX.ok();if(stars>=2)confetti(1800);
 speak(first?`Parabéns! Você ganhou ${r.peca} do castelo.`:`Muito bem! ${stars} estrelas.`);
}
function finale(){
 $("#endBody").innerHTML=`<div class="endCard"><h2>🏰 O Castelo das Formas está pronto!</h2><div style="max-width:560px;margin:8px auto">${castleSVG(7,true)}</div><p>Você reconheceu formas, contou cantos, descobriu o que rola e o que empilha, achou as sombras, leu o mapa e construiu o castelo.</p>
  <div class="endBtns"><button class="btn y" data-action="diploma">📜 Diploma do construtor</button><button class="btn b" data-action="map">🏰 Jogar de novo</button></div></div>`;
 show("end");SFX.tada();confetti(4000);speak("Parabéns! O castelo das formas está pronto. Você é um construtor de verdade!");
}

const GEN={};
const COLORLIST=Object.values(COLORS);
function optMark(el,ok){el.classList.add(ok?"right":"wrong")}
function lockOpts(){$$(".opt").forEach(o=>o.disabled=true)}

/* 1 · SALA DAS FORMAS */
GEN.formas=function(){
 const pool=shapesFor();const target=rand(pool);const n=st.level?4:3;const opts=shuffle([target,...shuffle(pool.filter(x=>x!==target)).slice(0,n-1)]);
 setPrompt(`Toque n${artForma(target)} <em>${nomeForma(target)}</em>`,`Toque no ${nomeForma(target)}.`);
 board(`<div class="opts n${n}">${opts.map(id=>{const rot=id==="circulo"?0:id==="retangulo"?rand([0,90]):st.level?rand([0,30,-30,90,180,45]):rand([0,0,20,-20]);const w=rand([70,80,90,100]);return `<button class="opt" data-action="ans-forma" data-id="${id}">${shapeSVG(id,rand(COLORLIST),rot,`style="width:${w}%"`)}</button>`}).join("")}</div>`);
 sess.answer=target;
};
function ansForma(btn){
 if(sess.busy)return;const id=btn.dataset.id;const ok=id===sess.answer;lockOpts();
 if(ok){optMark(btn,true);result(true,"Isso!",`Muito bem! É ${artForma(id)} ${nomeForma(id)}.`)}
 else{optMark(btn,false);const r=$(`.opt[data-id="${sess.answer}"]`);if(r)optMark(r,true);result(false,`Esse é ${artForma(id)} ${nomeForma(id)}`,`Esse é ${artForma(id)} ${nomeForma(id)}. ${artForma(sess.answer).toUpperCase()} ${nomeForma(sess.answer)} é este aqui, o verde. Vamos de novo!`)}
}

/* 2 · SALA DOS CANTOS */
GEN.cantos=function(){
 const pool=shapesFor();const target=rand(pool.filter(x=>x!=="circulo").concat(Math.random()<.2?["circulo"]:[]));const s=SHAPES[target];sess.answer=String(s.cantos);sess.found=0;
 const color=rand(COLORLIST);
 if(target==="circulo"){setPrompt(`O <em>círculo</em> tem quantos cantos?`,"O círculo tem quantos cantos? Passe o dedo na volta dele e pense.");
  board(`<div class="cornerStage"><div class="cornerBox">${shapeSVG("circulo",color)}</div><div class="counter"><div class="big">?</div><small>cantos</small><div class="numRow">${shuffle(["0","3","4"]).map(v=>`<button class="opt numBtn" data-action="ans-num" data-v="${v}">${v}</button>`).join("")}</div></div></div>`);return}
 setPrompt(`Toque em cada <em>canto</em> d${s.art} ${s.nome}`,`Toque em cada canto do ${s.nome}. Vamos contar juntos!`);
 const hots=s.pts.map((p,i)=>`<g class="hot" data-action="hot" data-i="${i}"><circle class="ring" cx="${p[0]}" cy="${p[1]}" r="7"/><text x="${p[0]}" y="${p[1]+1}" text-anchor="middle" dominant-baseline="middle"></text></g>`).join("");
 board(`<div class="cornerStage"><div class="cornerBox"><svg viewBox="-6 -6 112 112"><polygon points="${s.pts.map(p=>p.join(",")).join(" ")}" fill="${color}" stroke="${shade(color,-.3)}" stroke-width="3" stroke-linejoin="round"/>${hots}</svg></div><div class="counter"><div class="big" id="cnt">0</div><small>cantos encontrados</small><div class="numRow hidden" id="numRow"></div></div></div>`);
};
function hot(g){
 if(sess.busy||g.classList.contains("found"))return;g.classList.add("found");sess.found++;g.querySelector("text").textContent=sess.found;$("#cnt").textContent=sess.found;SFX.tap();speak(String(sess.found));
 const n=Number(sess.answer);
 if(sess.found>=n){setTimeout(()=>{speak(`${n} cantos! Agora toque no número certo.`);$("#promptTxt").innerHTML=`Quantos <em>cantos</em> tem?`;const opts=shuffle([...new Set([n,n-1,n+1,n+2].filter(x=>x>=0))]).slice(0,3);if(!opts.includes(n))opts[0]=n;const row=$("#numRow");row.classList.remove("hidden");row.innerHTML=shuffle(opts).map(v=>`<button class="opt numBtn" data-action="ans-num" data-v="${v}">${v}</button>`).join("")},700)}
}
function ansNum(btn){
 if(sess.busy)return;const v=btn.dataset.v;const ok=v===sess.answer;lockOpts();
 if(ok){optMark(btn,true);result(true,`${sess.answer} cantos!`,sess.answer==="0"?"Isso! O círculo não tem nenhum canto, é todo redondo.":`Isso! ${sess.answer} cantos.`)}
 else{optMark(btn,false);const r=$(`.opt[data-v="${sess.answer}"]`);if(r)optMark(r,true);result(false,`São ${sess.answer} cantos`,sess.answer==="0"?"O círculo não tem cantos. Ele é todo redondo!":`Vamos contar de novo: são ${sess.answer} cantos.`)}
}

/* 3 · ROLA OU EMPILHA */
GEN.rola=function(){
 const prop=rand(["rola","empilha"]);const pool=solidsFor();const yes=pool.filter(s=>SOLIDS[s][prop]),no=pool.filter(s=>!SOLIDS[s][prop]);
 const target=rand(yes);const opts=shuffle([target,...shuffle(no).slice(0,2)]);sess.answer=target;sess.prop=prop;
 setPrompt(prop==="rola"?`Qual desses <em>rola</em>?`:`Qual desses dá para <em>empilhar</em>?`,prop==="rola"?"Qual desses rola? Toque para testar.":"Qual desses dá para empilhar um em cima do outro? Toque para testar.");
 board(`<div class="rampWrap"><div class="opts n3">${opts.map(id=>`<button class="opt" data-action="ans-rola" data-id="${id}"><div class="solidBox" style="position:relative">${solidSVG(id,'style="width:150px"')}</div><div class="cap">${nomeForma(id)}</div></button>`).join("")}</div></div>`);
};
function ansRola(btn){
 if(sess.busy)return;sess.busy=true;const id=btn.dataset.id;const s=SOLIDS[id];const prop=sess.prop;const ok=s[prop];lockOpts();
 const box=btn.querySelector(".solidBox");const svg=box.querySelector("svg");
 if(prop==="rola"){if(ok){svg.classList.add("rolling");SFX.roll()}else{svg.classList.add("wobble");SFX.bad()}}
 else{if(ok){const c=svg.cloneNode(true);c.style.position="absolute";c.style.left="0";c.style.top="-40px";c.style.opacity="0";box.appendChild(c);requestAnimationFrame(()=>{c.style.transition="all .6s";c.style.opacity="1";c.style.top="-78px"});SFX.pop()}else{svg.classList.add("wobble");SFX.bad()}}
 setTimeout(()=>{sess.busy=false;const nome=nomeForma(id);const art=artForma(id);
  if(ok){optMark(btn,true);result(true,prop==="rola"?`${art.toUpperCase()} ${nome} rola!`:`${art.toUpperCase()} ${nome} empilha!`,prop==="rola"?`Isso! ${art} ${nome} rola porque é redond${art==="a"?"a":"o"}.`:`Isso! ${art} ${nome} empilha porque tem faces planas.`)}
  else{optMark(btn,false);const r=$(`.opt[data-id="${sess.answer}"]`);if(r)optMark(r,true);result(false,prop==="rola"?`${art.toUpperCase()} ${nome} não rola`:`${art.toUpperCase()} ${nome} não empilha`,prop==="rola"?`${art} ${nome} não rola: ${id==="piramide"||id==="cubo"||id==="bloco"?"tem faces planas e cantos":"tem uma ponta"}. Quem rola é ${artForma(sess.answer)} ${nomeForma(sess.answer)}.`:`${art} ${nome} não fica em pé em cima de outro: é redond${art==="a"?"a":"o"} ou tem ponta. Quem empilha é ${artForma(sess.answer)} ${nomeForma(sess.answer)}.`)}
 },1100);
}

/* 4 · SALA DAS SOMBRAS */
GEN.sombras=function(){
 const pool=solidsFor();const av=shapesFor();const solid=rand(pool);const faces=SOLIDS[solid].faces.filter(f=>av.includes(f));const correct=rand(faces);
 const others=shuffle(av.filter(f=>!SOLIDS[solid].faces.includes(f))).slice(0,2);const opts=shuffle([correct,...others]);sess.answer=correct;sess.solid=solid;
 const art=artForma(solid),nome=nomeForma(solid);
 setPrompt(`${art.toUpperCase()} <em>${nome}</em> carimba qual forma?`,`Se ${art} ${nome} carimbar o papel, qual forma vai aparecer?`,solidSVG(solid));
 board(`<div class="opts n3">${opts.map(f=>`<button class="opt" data-action="ans-sombra" data-id="${f}">${shapeSVG(f,"#455A64",0,'style="width:75%"')}<div class="cap">${nomeForma(f)}</div></button>`).join("")}</div>`);
};
function ansSombra(btn){
 if(sess.busy)return;const f=btn.dataset.id;const ok=f===sess.answer;lockOpts();const s=SOLIDS[sess.solid];
 if(ok){optMark(btn,true);result(true,`${artForma(f).toUpperCase()} ${nomeForma(f)}!`,`Isso! ${artForma(sess.solid)} ${s.nome} tem ${s.faces.length>1?"faces":"uma face"} em forma de ${nomeForma(f)}.`)}
 else{optMark(btn,false);const r=$(`.opt[data-id="${sess.answer}"]`);if(r)optMark(r,true);result(false,`É ${artForma(sess.answer)} ${nomeForma(sess.answer)}`,`${artForma(sess.solid)} ${s.nome} carimba ${artForma(sess.answer)} ${nomeForma(sess.answer)}. Olhe a face que encosta no papel.`)}
}

const PUZZLES=[
 {slots:[{s:"retangulo",x:30,y:56,w:40,h:34,rot:0},{s:"quadrado",x:12,y:56,w:16,h:34,rot:0},{s:"quadrado",x:72,y:56,w:16,h:34,rot:0},{s:"triangulo",x:12,y:36,w:16,h:20,rot:0},{s:"triangulo",x:72,y:36,w:16,h:20,rot:0}],extra:["circulo"]},

 {slots:[{s:"retangulo",x:22,y:62,w:56,h:28,rot:0},{s:"quadrado",x:40,y:40,w:20,h:22,rot:0},{s:"triangulo",x:40,y:22,w:20,h:18,rot:0},{s:"retangulo",x:8,y:50,w:12,h:40,rot:90},{s:"retangulo",x:80,y:50,w:12,h:40,rot:90},{s:"hexagono",x:46,y:66,w:10,h:10,rot:0},{s:"triangulo",x:8,y:32,w:12,h:18,rot:0},{s:"triangulo",x:80,y:32,w:12,h:18,rot:0}],extra:["pentagono","circulo"]}

const PCOL={retangulo:COLORS.vermelho,quadrado:COLORS.azul,triangulo:COLORS.amarelo,circulo:COLORS.verde,losango:COLORS.roxo,hexagono:COLORS.ciano,pentagono:COLORS.laranja};
const build={puzzle:null,filled:0,sel:null,drag:null,free:false,pieces:[]};
function pieceSVG(shape,rot=0,w=1,h=1){const c=PCOL[shape];const s=SHAPES[shape];const body=s.pts?`<polygon points="${s.pts.map(p=>p.join(",")).join(" ")}" fill="${c}" stroke="${shade(c,-.3)}" stroke-width="3" stroke-linejoin="round"/>`:`<circle cx="50" cy="50" r="44" fill="${c}" stroke="${shade(c,-.3)}" stroke-width="3"/>`;return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><g transform="rotate(${rot} 50 50)">${body}</g></svg>`}
function ghostSVG(shape,rot){const s=SHAPES[shape];const body=s.pts?`<polygon class="ghost" points="${s.pts.map(p=>p.join(",")).join(" ")}" stroke-linejoin="round"/>`:`<circle class="ghost" cx="50" cy="50" r="44"/>`;return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><g transform="rotate(${rot} 50 50)">${body}</g></svg>`}
GEN.construcao=function(){
 const idx=st.level?Math.min(sess.i+1,PUZZLES.length-1):sess.i;const pz=PUZZLES[Math.min(idx,PUZZLES.length-1)];build.puzzle=pz;build.filled=0;build.sel=null;build.free=false;
 setPrompt(`Arraste cada peça para o <em>lugar</em> dela`,"Arraste cada peça para o lugar dela no castelo. Se preferir, toque na peça e depois toque no lugar.");
 const tray=shuffle([...pz.slots.map((s,i)=>({s:s.s,i})),...pz.extra.map(s=>({s,i:-1}))]);
 board(`<div class="buildWrap"><div class="buildCol" id="buildCol"><div class="buildArea" id="buildArea">${pz.slots.map((s,i)=>`<div class="slot" data-action="slot" data-i="${i}" data-s="${s.s}" style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%">${ghostSVG(s.s,s.rot)}</div>`).join("")}</div></div><div class="tray" id="tray"><div class="trayNote">Peças</div>${tray.map((t,k)=>`<div class="trayPiece" data-action="tray" data-s="${t.s}" data-k="${k}">${pieceSVG(t.s,0)}</div>`).join("")}</div></div>`);fitBuild();
};
function fitBuild(){const col=$("#buildCol"),area=$("#buildArea");if(!col||!area)return;const W=col.clientWidth,H=col.clientHeight;let w=W,h=w*10/16;if(h>H){h=H;w=h*16/10}area.style.width=w+"px";area.style.height=h+"px"}
window.addEventListener("resize",fitBuild);
function trayPick(el){if(build.free){freeAdd(el.dataset.s);return}if(el.classList.contains("used"))return;$$(".trayPiece").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");build.sel=el;SFX.tap();speak(`${artForma(el.dataset.s)} ${nomeForma(el.dataset.s)}. Agora toque no lugar dele.`)}
function slotTap(slot){if(!build.sel)return;tryPlace(build.sel,slot)}
function tryPlace(trayEl,slot){
 const pz=build.puzzle;const i=Number(slot.dataset.i);const s=pz.slots[i];
 if(slot.classList.contains("filled"))return false;
 if(trayEl.dataset.s!==s.s){slot.classList.add("target");setTimeout(()=>slot.classList.remove("target"),600);trayEl.classList.add("wrong");setTimeout(()=>trayEl.classList.remove("wrong"),500);SFX.bad();sess.mist++;speak(`Aqui cabe ${artForma(s.s)} ${nomeForma(s.s)}.`);return false}
 const area=$("#buildArea");const p=document.createElement("div");p.className="piece placed";p.style.cssText=`left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%`;p.innerHTML=pieceSVG(s.s,s.rot);area.appendChild(p);
 slot.classList.add("filled");trayEl.classList.add("used");trayEl.classList.remove("sel");build.sel=null;build.filled++;SFX.pop();
 if(build.filled>=pz.slots.length){setTimeout(()=>{SFX.tada();area.insertAdjacentHTML("beforeend",`<div style="position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:56px;animation:pop .5s">🚩</div>`);result(true,"Castelo montado!","O castelo ficou pronto! Muito bem.",1800)},250)}
 else speak(rand(["Isso!","Encaixou!","Muito bem!"]));
 return true;
}
/* arrastar (pointer events) */
function dragStart(e){
 const el=e.target.closest(".trayPiece");if(!el||el.classList.contains("used"))return;if(build.free){freeAdd(el.dataset.s,e);return}
 const area=$("#buildArea");const ar=area.getBoundingClientRect();const w=ar.width*.16,h=w;
 const p=document.createElement("div");p.className="piece dragging";p.style.cssText=`left:${e.clientX-ar.left-w/2}px;top:${e.clientY-ar.top-h/2}px;width:${w}px;height:${h}px`;p.innerHTML=pieceSVG(el.dataset.s,0);area.appendChild(p);
 build.drag={p,el,w,h,ar};trayPick(el);
 const move=ev=>{p.style.left=(ev.clientX-ar.left-w/2)+"px";p.style.top=(ev.clientY-ar.top-h/2)+"px"};
 const up=ev=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);const cx=ev.clientX,cy=ev.clientY;p.remove();build.drag=null;
  const cands=$$(".slot").filter(sl=>{const r=sl.getBoundingClientRect();return cx>=r.left-10&&cx<=r.right+10&&cy>=r.top-10&&cy<=r.bottom+10&&!sl.classList.contains("filled")}).sort((a,b)=>{const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();return ra.width*ra.height-rb.width*rb.height});
  const slot=cands.find(sl=>sl.dataset.s===el.dataset.s)||cands[0];
  if(slot){tryPlace(el,slot)}};
 document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);e.preventDefault();
}
/* construção livre (após os quebra-cabeças) */
function freeBuild(){
 build.free=true;build.pieces=[];
 setPrompt(`Agora construa o <em>seu</em> castelo!`,"Agora é você que constrói! Arraste as peças que quiser. Toque em uma peça para tirar. Quando terminar, toque em Pronto.");
 const shapes=shapesFor();
 board(`<div class="buildWrap"><div class="buildCol" id="buildCol"><div class="buildArea" id="buildArea"></div></div><div class="tray" id="tray"><div class="trayNote">Peças</div>${shapes.map(s=>`<div class="trayPiece" data-action="tray" data-s="${s}">${pieceSVG(s,0)}</div>`).join("")}<div class="freeTools"><button class="btn g sm" data-action="free-done">✓ Pronto</button><button class="btn w sm" data-action="free-clear">Limpar</button></div></div></div>`);fitBuild();
}
function freeAdd(shape,e){
 const area=$("#buildArea");const ar=area.getBoundingClientRect();const w=ar.width*.16,h=w;
 const p=document.createElement("div");p.className="piece";p.dataset.action="free-piece";
 let x=e?e.clientX-ar.left-w/2:ar.width*.4+Math.random()*ar.width*.2,y=e?e.clientY-ar.top-h/2:ar.height*.3;
 p.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;p.innerHTML=pieceSVG(shape,0);area.appendChild(p);SFX.tap();
 let moved=false;
 const start=ev=>{ev.preventDefault();moved=false;p.classList.add("dragging");const ox=ev.clientX-p.offsetLeft,oy=ev.clientY-p.offsetTop;
  const mv=e2=>{moved=true;p.style.left=(e2.clientX-ox)+"px";p.style.top=(e2.clientY-oy)+"px"};
  const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);p.classList.remove("dragging");if(!moved){p.remove();SFX.tap()}else SFX.pop()};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)};
 p.addEventListener("pointerdown",start);
 if(e){start(e)}
}

/* 7 · FORMAS NO MUNDO */
GEN.mundo=function(){
 const forms=[...shapesFor(),...solidsFor()].filter(f=>OBJETOS.some(o=>o.forma===f));const mode=rand(["f2o","o2f"]);
 const target=rand(forms);const obj=rand(OBJETOS.filter(o=>o.forma===target));
 if(mode==="f2o"){const others=shuffle(forms.filter(f=>f!==target)).slice(0,2).map(f=>rand(OBJETOS.filter(o=>o.forma===f)));const opts=shuffle([obj,...others]);sess.answer=target;sess.mode=mode;
  setPrompt(`Qual objeto parece ${artForma(target)==="a"?"uma":"um"} <em>${nomeForma(target)}</em>?`,`Qual objeto parece ${artForma(target)==="a"?"uma":"um"} ${nomeForma(target)}?`,picForma(target));
  board(`<div class="opts n3">${opts.map(o=>`<button class="opt" data-action="ans-mundo" data-id="${o.forma}"><div class="emo">${o.emo}</div><div class="cap">${o.nome}</div></button>`).join("")}</div>`)}
 else{const others=shuffle(forms.filter(f=>f!==target)).slice(0,2);const opts=shuffle([target,...others]);sess.answer=target;sess.mode=mode;
  setPrompt(`${obj.nome.charAt(0).toUpperCase()+obj.nome.slice(1)} parece qual <em>forma</em>?`,`${obj.nome} parece qual forma?`,`<div style="font-size:52px;line-height:1">${obj.emo}</div>`);
  board(`<div class="opts n3">${opts.map(f=>`<button class="opt" data-action="ans-mundo" data-id="${f}">${SHAPES[f]?shapeSVG(f,rand(COLORLIST),0,'style="width:70%"'):solidSVG(f,'style="width:75%"')}<div class="cap">${nomeForma(f)}</div></button>`).join("")}</div>`)}
};
function ansMundo(btn){
 if(sess.busy)return;const id=btn.dataset.id;const ok=id===sess.answer;lockOpts();
 if(ok){optMark(btn,true);result(true,"Isso!",`Muito bem! Parece ${artForma(id)==="a"?"uma":"um"} ${nomeForma(id)}. Os objetos de verdade só lembram a forma, não são iguaizinhos.`)}
 else{optMark(btn,false);const r=$(`.opt[data-id="${sess.answer}"]`);if(r)optMark(r,true);result(false,`É ${artForma(sess.answer)} ${nomeForma(sess.answer)}`,`Olhe de novo: parece ${artForma(sess.answer)==="a"?"uma":"um"} ${nomeForma(sess.answer)}, o que está em verde.`)}
}
</script>
<script>
"use strict";
/* =========================== PAINEL DO PROFESSOR =========================== */
function openModal(html){$("#modalBox").innerHTML=`<button class="close" data-action="modal-close">✕</button>`+html;$("#modalBack").classList.add("show")}
function closeModal(){$("#modalBack").classList.remove("show");$("#modalBox").innerHTML=""}
function teacherPanel(){
 const rows=ROOMS.map(r=>{const d=st.rooms[r.id];return `<div class="repCard"><b>${r.icon} ${r.nome}</b><span class="st">${starsHTML(d?d.stars:0)}</span><small>${d?`${d.hits} acertos em ${d.total} · ${new Date(d.data).toLocaleDateString("pt-BR")}`:"ainda não jogou"}</small><small>BNCC: ${r.bncc}</small></div>`}).join("");
 openModal(`<h2>Painel do professor</h2><p>A criança não precisa ler nada: toda instrução é falada. Use este painel para ajustar a faixa e acompanhar.</p>
  <h3>Faixa etária</h3><div class="segs">${LEVELS.map(l=>`<button class="seg ${st.level===l.id?"on":""}" data-action="set-level" data-v="${l.id}">${l.label}</button>`).join("")}</div>
  <p style="margin-top:6px">Educação Infantil: círculo, quadrado, triângulo e retângulo; esfera, cubo, cilindro e cone; em cima, embaixo, dentro e fora; 3 opções. 1º e 2º ano: acrescenta losango, pentágono e hexágono; pirâmide e bloco retangular; esquerda e direita; formas giradas; 4 opções.</p>
  <h3>Rodadas por sala</h3><div class="segs">${[3,5,7].map(n=>`<button class="seg ${st.rounds===n?"on":""}" data-action="set-rounds" data-v="${n}">${n}</button>`).join("")}</div>
  <h3>Narrador</h3><div class="segs"><button class="seg ${st.voice?"on":""}" data-action="set-voice" data-v="1">Voz ligada</button><button class="seg ${!st.voice?"on":""}" data-action="set-voice" data-v="0">Voz desligada</button></div>
  <div class="field"><label>NOME DA CRIANÇA (PARA O DIPLOMA)</label><input type="text" maxlength="40" value="${esc(st.name)}" data-input="name" placeholder="Ex.: Maria Clara"></div>
  <h3>Progresso · ${piecesEarned()} de 7 peças</h3><div class="repGrid">${rows}</div>
  <h3>Como usar na alfabetização</h3><table><tr><th>MOMENTO</th><th>O QUE FAZER</th></tr><tr><td>Antes</td><td>Mostre blocos reais (ou objetos da sala) e deixe a criança tocar. A tela vem depois do concreto.</td></tr><tr><td>Durante</td><td>Peça para a criança falar a palavra junto com o narrador (triângulo, canto, em cima). Erro não elimina: a rodada volta no fim da sala.</td></tr><tr><td>Depois</td><td>Na Sala das Sombras, carimbe sólidos de verdade em tinta ou massinha. Na Torre da Construção, repita com blocos de madeira. Registre no diário o que a criança conseguiu explicar.</td></tr></table>
  <p style="margin-top:8px">Referências BNCC por correspondência temática (conferir com o currículo local): EI03ET01, EF01MA11, EF01MA13, EF01MA14, EF02MA12, EF02MA14, EF02MA15.</p>
  <div class="modalBtns"><button class="btn y sm" data-action="diploma">📜 Imprimir diploma</button><button class="btn b sm" data-action="copy-report">📋 Copiar relatório</button><button class="btn w sm" data-action="reset-progress">Zerar progresso</button><button class="btn g sm" data-action="modal-close">Fechar</button></div>`);
}
function reportText(){return ["CASTELO DAS FORMAS · RELATÓRIO",st.name?"Criança: "+st.name:"",LEVELS[st.level].label,new Date().toLocaleDateString("pt-BR"),"",...ROOMS.map(r=>{const d=st.rooms[r.id];return `${r.nome}: ${d?`${"★".repeat(d.stars)} (${d.hits}/${d.total})`:"não jogou"} · ${r.bncc}`})].filter(x=>x!==null).join("\n")}
function diploma(){
 const n=piecesEarned();
 $("#printArea").innerHTML=`<div style="border:14px double #F2C94C;border-radius:24px;padding:36px;text-align:center;font-family:Nunito,Arial,sans-serif;color:#0F2C4A;max-width:900px;margin:0 auto"><div style="font-size:14px;letter-spacing:.2em;font-weight:900">PORTAL DO EDUCADOR · CASTELO DAS FORMAS</div><h1 style="font-size:44px;margin:12px 0 4px">Diploma de Construtor</h1><p style="font-size:20px;margin:0">${n>=7?"O castelo inteiro foi construído por":"Este castelo está sendo construído por"}</p><div style="font-size:40px;font-weight:900;margin:12px 0;border-bottom:3px solid #0F2C4A;display:inline-block;padding:0 30px;min-width:360px">${esc(st.name||"_______________________")}</div><div style="max-width:520px;margin:10px auto">${castleSVG(n)}</div><p style="font-size:18px">${ROOMS.map(r=>{const d=st.rooms[r.id];return `${r.icon} ${r.nome}: ${d?"★".repeat(d.stars):"–"}`}).join(" · ")}</p><p style="font-size:16px;margin-top:18px">${new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})} · Professor(a): ______________________</p></div>`;
 window.print();
}

/* =========================== AÇÕES (Regra 9) =========================== */
const ACTIONS={
 home:()=>renderHome(),map:()=>renderMap(),"play-first":()=>{const id=nextRoomId()||ROOMS[0].id;startRoom(id)},room:(b)=>startRoom(b.dataset.id),
 say:()=>{if(sess.speech)speak(sess.speech)},
 voice:()=>{st.voice=!st.voice;store.set("pde_castelo_voz",st.voice);$("#voiceBtn").classList.toggle("off",!st.voice);if(!st.voice&&"speechSynthesis"in window)speechSynthesis.cancel();else speak("Voz ligada!")},
 full:()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})},
 teacher:()=>teacherPanel(),"modal-close":()=>closeModal(),"modal-back":(b,e)=>{if(e.target===b)closeModal()},
 "set-level":(b)=>{st.level=Number(b.dataset.v);store.set("pde_castelo_nivel",st.level);teacherPanel()},
 "set-rounds":(b)=>{st.rounds=Number(b.dataset.v);store.set("pde_castelo_rodadas",st.rounds);teacherPanel()},
 "set-voice":(b)=>{st.voice=b.dataset.v==="1";store.set("pde_castelo_voz",st.voice);$("#voiceBtn").classList.toggle("off",!st.voice);teacherPanel()},
 "reset-progress":()=>{st.rooms={};saveProgress();teacherPanel();if(st.screen==="map")renderMap()},
 diploma:()=>diploma(),"copy-report":async()=>{try{await navigator.clipboard.writeText(reportText());$("#modalBox h2").textContent="Painel do professor · relatório copiado"}catch(e){prompt("Copie o relatório:",reportText())}},
 finale:()=>finale(),
 "ans-forma":(b)=>ansForma(b),"ans-num":(b)=>ansNum(b),hot:(g)=>hot(g),"ans-rola":(b)=>ansRola(b),"ans-sombra":(b)=>ansSombra(b),zone:(g)=>zone(g),"ans-mundo":(b)=>ansMundo(b),
 tray:(el)=>{if(!build.free)trayPick(el)},slot:(el)=>slotTap(el),"free-done":()=>{if(!$$("#buildArea .piece").length){speak("Coloque pelo menos uma peça!");return}SFX.tada();confetti(1500);speak("Que castelo bonito!");setTimeout(endRoom,1200)},"free-clear":()=>{$$("#buildArea .piece").forEach(p=>p.remove())},"free-piece":()=>{}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const fn=ACTIONS[b.dataset.action];if(fn){audio();fn(b,e)}});
document.addEventListener("pointerdown",e=>{if(e.target.closest(".trayPiece")&&e.isPrimary){audio();dragStart(e)}},{passive:false});
document.addEventListener("input",e=>{const el=e.target.closest("[data-input]");if(!el)return;if(el.dataset.input==="name"){st.name=el.value;store.set("pde_castelo_nome",st.name)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
if(!/[?&]fs=0/.test(location.search))document.addEventListener("pointerdown",()=>{audio();if(!document.fullscreenElement&&innerWidth>900)document.documentElement.requestFullscreen?.().catch(()=>{})},{once:true});
window.addEventListener("resize",()=>{const cv=$("#confetti");cv.width=innerWidth;cv.height=innerHeight});
/* construção: rodada extra de construção livre antes de fechar a sala */
const _nextRound=nextRound;
nextRound=function(){if(sess.room==="construcao"&&sess.i>=sess.total&&!build.freeDone){build.freeDone=true;sess.busy=false;hideFb();renderDots();freeBuild();return}_nextRound()};
const _startRoom=startRoom;
startRoom=function(id){build.freeDone=false;_startRoom(id)};
$("#voiceBtn").classList.toggle("off",!st.voice);
renderHome();
</script>
</body>
