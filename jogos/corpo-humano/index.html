<script>
// Corpo Humano (reformulado em nov/2026 no Motor de Jogos). Jogo de conteúdo: banco fixo de perguntas escritas e revisadas,
// sem IA. Níveis 1 a 3: anos iniciais (EF01CI02, EF01CI03). Níveis 4 a 6: 5º ano (EF05CI06 a EF05CI08).
// Cada item: [pergunta, resposta certa, [3 alternativas erradas], dica, explicação, emoji de apoio].
(function(){
  const NIVEIS = [
    { nome:"Partes do corpo", sub:"o que é e para que serve", hab:"EF01CI02", itens:[
      ["Qual parte do corpo usamos para pensar e comandar o corpo todo?", "Cérebro", ["Coração", "Estômago", "Pulmão"], "Fica dentro da cabeça, bem protegido.", "O cérebro fica dentro da cabeça e comanda tudo: pensar, lembrar, sentir e mexer o corpo.", "🧠"],
      ["O que sustenta o corpo por dentro, como uma armação?", "Os ossos", ["Os cabelos", "As unhas", "Os dentes"], "Juntos eles formam o esqueleto.", "Os ossos formam o esqueleto, que sustenta o corpo e protege órgãos como o cérebro e o coração.", "🦴"],
      ["Que parte do corpo dobra o braço ao meio?", "Cotovelo", ["Joelho", "Tornozelo", "Pescoço"], "Dobre o seu braço e veja onde ele dobra.", "O cotovelo é a articulação que fica no meio do braço.", "💪"],
      ["Que parte do corpo dobra a perna ao meio?", "Joelho", ["Cotovelo", "Punho", "Ombro"], "Você dobra essa parte para se agachar.", "O joelho é a articulação que fica no meio da perna.", "🦵"],
      ["O que cobre e protege todo o corpo por fora?", "A pele", ["Os ossos", "O sangue", "Os músculos"], "É com ela que você sente o calor e o frio.", "A pele cobre o corpo todo e protege o que está por dentro.", "🖐️"],
      ["O que puxa os ossos e faz o corpo se mexer?", "Os músculos", ["Os cabelos", "Os dentes", "As unhas"], "Eles ficam mais firmes quando você faz força.", "Os músculos estão presos aos ossos. Quando se contraem, puxam os ossos e o corpo se move.", "💪"],
      ["Que parte liga a cabeça ao resto do corpo?", "Pescoço", ["Tornozelo", "Cintura", "Punho"], "É ela que deixa você virar a cabeça para os lados.", "O pescoço liga a cabeça ao tronco e permite virar a cabeça.", "🧍"],
      ["Para que servem os dentes?", "Mastigar os alimentos", ["Respirar", "Ouvir os sons", "Enxergar"], "Pense no que acontece quando você come uma maçã.", "Os dentes cortam e trituram os alimentos para a gente conseguir engolir.", "🦷"],
      ["Em que parte do corpo ficam os dedos que seguram o lápis?", "Na mão", ["No pé", "No joelho", "No ombro"], "Olhe como você segura o lápis agora.", "A mão tem cinco dedos, que usamos para segurar, escrever e pegar objetos.", "✋"]
    ] },
    { nome:"Os cinco sentidos", sub:"ver, ouvir, cheirar, provar e tocar", hab:"EF01CI02", itens:[
      ["Qual parte do corpo usamos para enxergar?", "Olhos", ["Orelhas", "Nariz", "Língua"], "Feche essa parte e tudo fica escuro.", "Os olhos são os órgãos da visão.", "👀"],
      ["Qual sentido usa as orelhas?", "Audição", ["Visão", "Olfato", "Paladar"], "É o sentido que percebe os sons.", "Com as orelhas nós ouvimos: é o sentido da audição.", "👂"],
      ["Qual sentido usa o nariz para perceber os cheiros?", "Olfato", ["Tato", "Paladar", "Visão"], "Não é o sentido do gosto, é o do cheiro.", "O nariz percebe os cheiros: é o sentido do olfato.", "👃"],
      ["Qual sentido usa a língua para perceber os sabores?", "Paladar", ["Olfato", "Audição", "Tato"], "É o sentido que diz se algo é doce ou salgado.", "A língua percebe os sabores: é o sentido do paladar.", "👅"],
      ["Qual sentido usa a pele para perceber quente, frio, liso e áspero?", "Tato", ["Visão", "Paladar", "Audição"], "É o sentido de tocar nas coisas.", "A pele percebe o toque, o calor e o frio: é o sentido do tato.", "🖐️"],
      ["Você sente o cheiro do bolo saindo do forno. Que sentido é esse?", "Olfato", ["Paladar", "Tato", "Audição"], "Você ainda não provou o bolo, só sentiu o cheiro.", "Cheiro é com o nariz: sentido do olfato.", "🎂"],
      ["Você ouve o sinal do recreio. Que sentido é esse?", "Audição", ["Visão", "Olfato", "Tato"], "O sinal faz um som.", "Sons são percebidos pelas orelhas: sentido da audição.", "🔔"],
      ["Você passa a mão no gato e sente o pelo macio. Que sentido é esse?", "Tato", ["Paladar", "Audição", "Olfato"], "Você percebeu isso com a pele da mão.", "Macio, áspero, quente e frio são percebidos pela pele: sentido do tato.", "🐱"],
      ["Você prova o suco e percebe que está azedo. Que sentido é esse?", "Paladar", ["Tato", "Audição", "Visão"], "Azedo, doce e salgado são sabores.", "Os sabores são percebidos pela língua: sentido do paladar.", "🍋"]
    ] },
    { nome:"Higiene e saúde", sub:"cuidar do corpo todos os dias", hab:"EF01CI03", itens:[
      ["Quando devemos lavar as mãos?", "Antes de comer e depois de usar o banheiro", ["Só quando estão com lama", "Só na hora do banho", "Uma vez por semana"], "As mãos podem estar sujas mesmo quando parecem limpas.", "As mãos carregam micróbios que não conseguimos ver. Lavar antes de comer e depois do banheiro evita doenças.", "🧼"],
      ["Por que lavamos as mãos com água e sabão?", "Para tirar sujeira e micróbios", ["Para as mãos crescerem", "Para as unhas ficarem duras", "Para esfriar o corpo"], "Tem coisas na mão que são pequenas demais para ver.", "O sabão ajuda a soltar a sujeira e os micróbios, e a água leva tudo embora.", "🫧"],
      ["Quando devemos escovar os dentes?", "Depois das refeições e antes de dormir", ["Só de manhã", "Só quando doem", "Uma vez por semana"], "Restos de comida ficam nos dentes sempre que comemos.", "Escovar depois de comer e antes de dormir tira os restos de comida e protege os dentes.", "🪥"],
      ["O que pode acontecer com os dentes de quem não escova?", "Ter cárie", ["Ficar mais brancos", "Crescer mais rápido", "Ficar mais fortes"], "É um buraquinho no dente que pode doer.", "Os restos de comida alimentam micróbios que estragam o dente e causam a cárie.", "🦷"],
      ["O que devemos fazer ao tossir ou espirrar?", "Cobrir a boca e o nariz com o braço", ["Cobrir os olhos", "Tossir perto do colega", "Prender a respiração"], "A ideia é não espalhar gotinhas no ar.", "Cobrir a boca e o nariz com o braço evita espalhar micróbios para outras pessoas.", "🤧"],
      ["Por que tomamos banho todos os dias?", "Para limpar a pele do suor e da sujeira", ["Para crescer mais rápido", "Para não sentir sono", "Para ficar com fome"], "Pense em como fica a pele depois de brincar.", "O banho tira o suor, a sujeira e os micróbios da pele.", "🚿"],
      ["Como devemos manter as unhas?", "Cortadas e limpas", ["Bem compridas", "Roídas", "Sujas de terra"], "A sujeira gosta de se esconder embaixo delas.", "Embaixo das unhas compridas se juntam sujeira e micróbios. Por isso, unhas cortadas e limpas.", "✂️"],
      ["O que ajuda o corpo a descansar e crescer bem?", "Dormir bem à noite", ["Ficar acordado até tarde", "Pular refeições", "Beber pouca água"], "Acontece na cama, todos os dias.", "Durante o sono o corpo descansa e se recupera. Criança precisa dormir bem para crescer com saúde.", "😴"],
      ["Antes de comer uma fruta com casca, como a maçã, o que devemos fazer?", "Lavar a fruta", ["Guardar no bolso", "Passar na roupa", "Assoprar"], "Passar na roupa não tira os micróbios.", "A casca pode ter sujeira e micróbios. Lavar em água corrente deixa a fruta pronta para comer.", "🍎"]
    ] },
    { nome:"Digestão e respiração", sub:"de onde vêm os nutrientes e o oxigênio", hab:"EF05CI06", itens:[
      ["Onde começa a digestão dos alimentos?", "Na boca", ["No estômago", "No intestino", "No esôfago"], "Pense no primeiro lugar por onde o alimento passa.", "A digestão começa na boca: os dentes trituram e a saliva começa a transformar o alimento.", "👄"],
      ["Por onde o alimento passa da boca até o estômago?", "Esôfago", ["Traqueia", "Intestino grosso", "Veia"], "É um tubo. A traqueia é o tubo do ar, não o da comida.", "O esôfago é o tubo que leva o alimento engolido até o estômago.", "🍽️"],
      ["Onde a maior parte dos nutrientes passa para o sangue?", "Intestino delgado", ["Estômago", "Esôfago", "Boca"], "É o órgão mais comprido do sistema digestório.", "No intestino delgado os nutrientes já digeridos atravessam a parede do intestino e entram no sangue.", "🩸"],
      ["Qual órgão absorve água e forma as fezes?", "Intestino grosso", ["Estômago", "Pulmão", "Esôfago"], "É a última parte do caminho do alimento.", "No intestino grosso a água é absorvida e o que o corpo não aproveita forma as fezes.", "💧"],
      ["Quais órgãos fazem a troca de gases na respiração?", "Pulmões", ["Rins", "Estômago", "Intestinos"], "Eles se enchem de ar quando você inspira.", "Nos pulmões o oxigênio do ar passa para o sangue e o gás carbônico sai do sangue.", "🫁"],
      ["Que gás do ar o corpo aproveita quando respiramos?", "Oxigênio", ["Gás carbônico", "Nitrogênio", "Hélio"], "Sem ele as células não conseguem obter energia.", "O corpo aproveita o oxigênio do ar, que é levado pelo sangue a todas as células.", "🌬️"],
      ["Que gás, produzido pelo corpo, sai quando soltamos o ar?", "Gás carbônico", ["Oxigênio", "Hélio", "Hidrogênio"], "É o resíduo que as células produzem.", "As células produzem gás carbônico, que o sangue leva até os pulmões para sair na expiração.", "😮‍💨"],
      ["Que músculo, abaixo dos pulmões, ajuda o ar a entrar e a sair?", "Diafragma", ["Coração", "Bíceps", "Língua"], "Quando ele treme sem parar, temos soluço.", "O diafragma desce para o ar entrar nos pulmões e sobe para o ar sair.", "🫁"],
      ["Por que digestão e respiração trabalham juntas na nutrição do corpo?", "Uma fornece nutrientes e a outra, oxigênio", ["As duas produzem sangue", "As duas filtram a urina", "As duas movem os ossos"], "As células precisam de duas coisas para obter energia.", "As células usam os nutrientes (da digestão) e o oxigênio (da respiração) para obter energia. Um não funciona sem o outro.", "⚡"]
    ] },
    { nome:"Circulação", sub:"o sangue leva e traz", hab:"EF05CI07", itens:[
      ["Qual órgão bombeia o sangue para o corpo todo?", "Coração", ["Pulmão", "Fígado", "Rim"], "Você sente as batidas dele no peito.", "O coração é um músculo que bombeia o sangue sem parar.", "🫀"],
      ["O que o sangue leva para todas as partes do corpo?", "Nutrientes e oxigênio", ["Ossos e músculos", "Ar e poeira", "Saliva e suor"], "Um vem da digestão e o outro, da respiração.", "O sangue distribui os nutrientes e o oxigênio para todas as células do corpo.", "🩸"],
      ["Como se chamam os vasos que levam o sangue do coração para o corpo?", "Artérias", ["Veias", "Nervos", "Tendões"], "As veias fazem o caminho contrário.", "As artérias levam o sangue do coração para o corpo. As veias trazem de volta.", "❤️"],
      ["Como se chamam os vasos que trazem o sangue de volta ao coração?", "Veias", ["Artérias", "Nervos", "Ossos"], "As artérias saem do coração. E quem volta?", "As veias trazem o sangue do corpo de volta ao coração.", "💙"],
      ["Quais órgãos filtram o sangue e formam a urina?", "Rins", ["Pulmões", "Intestinos", "Estômago"], "São dois e têm formato de grão de feijão.", "Os rins filtram o sangue, retiram os resíduos e formam a urina.", "🫘"],
      ["Em que órgãos o sangue recebe oxigênio?", "Pulmões", ["Estômago", "Rins", "Fígado"], "É onde o ar chega quando respiramos.", "Nos pulmões o sangue recebe o oxigênio do ar e entrega o gás carbônico.", "🫁"],
      ["Depois de correr, o coração bate mais rápido. Por quê?", "Os músculos precisam de mais oxigênio", ["O sangue está acabando", "O coração ficou menor", "Os pulmões pararam"], "Correr gasta mais energia.", "No exercício os músculos gastam mais energia. O coração acelera para levar mais oxigênio e nutrientes.", "🏃"],
      ["O que sentimos ao colocar os dedos no pulso?", "As batidas do coração", ["O ar dos pulmões", "O alimento passando", "Os ossos crescendo"], "Elas ficam mais rápidas depois de correr.", "A cada batida, o coração empurra o sangue pelas artérias. No pulso dá para sentir esse ritmo.", "⌚"],
      ["Por onde sai do corpo o gás carbônico que o sangue recolhe?", "Pelos pulmões", ["Pelos rins", "Pelo estômago", "Pelos ossos"], "Ele sai quando soltamos o ar.", "O sangue leva o gás carbônico até os pulmões, e ele sai na expiração.", "😮‍💨"]
    ] },
    { nome:"Alimentação", sub:"montar um prato equilibrado", hab:"EF05CI08", itens:[
      ["Arroz, pão e mandioca são ricos em quê?", "Carboidratos", ["Proteínas", "Gorduras", "Sal"], "É o nutriente que mais dá energia para o dia a dia.", "Arroz, pão, mandioca e macarrão são ricos em carboidratos, a principal fonte de energia do corpo.", "🍚"],
      ["Qual nutriente, abundante em carne, ovo e feijão, ajuda a construir os músculos?", "Proteínas", ["Açúcares", "Sal", "Água"], "É o nutriente construtor do corpo.", "As proteínas constroem e reparam o corpo. Estão em carnes, ovos, leite e feijão.", "🥚"],
      ["Frutas, verduras e legumes são boas fontes de quê?", "Vitaminas, sais minerais e fibras", ["Gordura e sal", "Corantes e conservantes", "Cafeína"], "São nutrientes que protegem o corpo e ajudam o intestino.", "Frutas, verduras e legumes têm vitaminas, sais minerais e fibras, que regulam e protegem o organismo.", "🥗"],
      ["Qual é a melhor bebida para matar a sede no dia a dia?", "Água", ["Refrigerante", "Suco de caixinha", "Energético"], "Não tem açúcar nem corante.", "A água hidrata sem açúcar e sem aditivos. Refrigerantes e sucos de caixinha têm muito açúcar.", "💧"],
      ["Quais alimentos devemos comer só de vez em quando?", "Salgadinhos e doces de pacote", ["Frutas", "Arroz e feijão", "Legumes"], "Pense nos que têm muito sal, açúcar e gordura.", "Os ultraprocessados, como salgadinhos e doces de pacote, têm muito sal, açúcar e gordura e poucos nutrientes.", "🍬"],
      ["Qual destes pratos é o mais equilibrado?", "Arroz, feijão, frango e salada", ["Macarrão com batata frita", "Só bife", "Bolo com refrigerante"], "Procure o prato que mistura grupos diferentes de alimentos.", "Esse prato tem carboidrato (arroz), proteína (feijão e frango), vitaminas e fibras (salada).", "🍽️"],
      ["Leite, queijo e iogurte são ricos em cálcio. O cálcio é importante para quê?", "Ossos e dentes", ["Cabelos", "Visão", "Audição"], "São as partes mais duras do corpo.", "O cálcio fortalece os ossos e os dentes, principalmente na fase de crescimento.", "🥛"],
      ["Uma criança que pratica muito esporte precisa de quê?", "Mais energia e mais água", ["Menos comida e menos água", "Só doces", "Dormir menos"], "O corpo em movimento gasta mais e sua mais.", "Quem se movimenta muito gasta mais energia e perde água no suor. Por isso o cardápio depende da atividade de cada um.", "⚽"],
      ["Que dupla do prato brasileiro junta carboidrato e proteína?", "Arroz com feijão", ["Pão com geleia", "Batata com macarrão", "Bala com refrigerante"], "É a dupla mais famosa do almoço.", "O arroz traz carboidrato e o feijão traz proteína, ferro e fibras. Juntos, se completam.", "🍛"]
    ] }
  ];
  PDEJogo.criar({
    id:"corpo-humano", titulo:"Corpo Humano", emoji:"🫀", tema:["#C2255C", "#F06595"], rodada:8,
    selo:"Ciências · 1º ao 5º ano",
    descricao:"Das partes do corpo e dos cinco sentidos até a digestão, a respiração e a circulação. Errou? O jogo dá uma dica e depois explica.",
    habilidades:{"EF01CI02": "Partes do corpo humano e suas funções", "EF01CI03": "Hábitos de higiene e manutenção da saúde", "EF05CI06": "Sistemas digestório e respiratório na nutrição do organismo", "EF05CI07": "Sistema circulatório: distribuição de nutrientes e eliminação de resíduos", "EF05CI08": "Cardápio equilibrado e grupos alimentares"},
    niveis:NIVEIS.map(n => ({ nome:n.nome, sub:n.sub, hab:n.hab })),
    ajuda:["Leia a pergunta (ou toque no alto-falante para ouvir) e escolha a resposta.", "Os três primeiros níveis são para o 1º e o 2º ano. Os três últimos, para o 4º e o 5º ano.", "Na lousa, use o modo Turma: a turma discute e responde junta."],
    gerar:PDEJogo.banco(NIVEIS)
  });
})();
</script>
