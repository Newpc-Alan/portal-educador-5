function view(id){["home","setup","game"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id))}
function openSetup(m){state.mode=m;view("setup")}
function ensureAudio(){
  if(!state.sound)return null;
  if(!state.audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)state.audioCtx=new AC();
  }
  if(state.audioCtx?.state==="suspended")state.audioCtx.resume();
  return state.audioCtx;
}
function tone(freq=440,dur=.12,type="sine",gain=.045,delay=0){
  const ac=ensureAudio(); if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,ac.currentTime+delay);
  g.gain.linearRampToValueAtTime(gain,ac.currentTime+delay+.012);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+dur);
  o.connect(g).connect(ac.destination);
  o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+.03);
}
function sfx(kind){
  if(!state.sound)return;
  if(kind==="tap"){tone(520,.07,"sine",.028)}
  if(kind==="correct"){tone(523,.12,"sine",.045);tone(659,.12,"sine",.045,.10);tone(784,.2,"sine",.05,.20)}
  if(kind==="wrong"){tone(220,.16,"triangle",.035);tone(165,.22,"triangle",.03,.13)}
  if(kind==="hint"){tone(660,.09,"sine",.035);tone(880,.18,"sine",.03,.08)}

}
function speak(text){
  if(!state.sound||!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="pt-BR";u.rate=.9;u.pitch=1.02;u.volume=.92;
  const voices=speechSynthesis.getVoices();
  const br=voices.find(v=>/pt-BR/i.test(v.lang))||voices.find(v=>/^pt/i.test(v.lang));
  if(br)u.voice=br;
  speechSynthesis.speak(u);
}
function startAmbient(){
  stopAmbient();
  const ac=ensureAudio(); if(!ac)return;
  // camada ambiental muito leve: ruído filtrado + pulsos suaves, sem competir com a fala
  const seconds=2, buffer=ac.createBuffer(1,ac.sampleRate*seconds,ac.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.12;
  const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=buffer;src.loop=true;filter.type="lowpass";filter.frequency.value=700;g.gain.value=.012;
  src.connect(filter).connect(g).connect(ac.destination);src.start();

}
function stopAmbient(){

function candidates(biome){return DATA.organismos.filter(o=>o.bioma===biome)}
function buildChains(biome,len){let starts=candidates(biome).filter(o=>o.nivel==="Produtor"),all=[];for(let s of starts){let walk=(id,path)=>{if(path.length>=len){all.push(path);return}for(let n of (next[id]||[]))if(byId[n]?.bioma===biome&&!path.includes(n))walk(n,[...path,n])};walk(s.id,[s.id])}return all}
function newRound(){let biome=$("#biome").value,len=$("#year").value==="12"?3:$("#year").value==="35"?4:5,chains=buildChains(biome,len).filter(c=>!state.used.has(c.join(">")));if(!chains.length){state.used.clear();chains=buildChains(biome,len)}if(!chains.length){len=Math.max(3,len-1);chains=buildChains(biome,len)}state.chain=chains[Math.floor(Math.random()*chains.length)]||[];
state.used.add(state.chain.join(">"));state.choice=[];render();
sfx("next");
if(state.chain.length){
  const primeiro=byId[state.chain[0]];
  speak(`Rodada ${state.round}. Comece pelo produtor. Observe os seres vivos e organize o fluxo de energia.`);
}}
function render(){view("game");$("#title").textContent=state.mode==="montar"?"🧩 Monte a Cadeia":state.mode==="quem"?"🍽️ Quem come quem?":state.mode==="faltando"?"❓ Quem está faltando?":state.mode==="nivel"?"🌱 Níveis Tróficos":"⚖️ Equilíbrio do Ecossistema";$("#biomeChip").textContent=$("#biome").value;$("#round").textContent=state.round;$("#score").textContent=state.score;$("#slots").innerHTML=state.chain.map((_,i)=>`<div class="slot" data-i="${i}"><small>${i===0?"INÍCIO":"NÍVEL "+(i+1)}</small></div>${i<state.chain.length-1?'<div class="arrow">→</div>':''}`).join("");let ids=[...state.chain];let pool=candidates($("#biome").value).filter(o=>!ids.includes(o.id));while(ids.length<state.chain.length+2&&pool.length){let j=Math.floor(Math.random()*pool.length);ids.push(pool.splice(j,1)[0].id)}ids.sort(()=>Math.random()-.5);$("#bank").innerHTML=ids.map(id=>{let o=byId[id];return `<button class="card" data-id="${id}"><div class="emoji">${o.icone}</div><b>${o.nome}</b><small>${o.nivel}</small></button>`}).join("");$$(".card").forEach(b=>b.onclick=()=>choose(b.dataset.id));$("#msg").className="msg";$("#msg").textContent="Toque nos seres vivos na ordem correta."}
function choose(id){
if(state.choice.includes(id)||state.choice.length>=state.chain.length)return;
sfx("tap");
const escolhido=byId[id];
if(escolhido)speak(`${escolhido.nome}. ${escolhido.nivel}.`);state.choice.push(id);let i=state.choice.length-1,o=byId[id],slot=$(`.slot[data-i="${i}"]`);slot.classList.add("filled");slot.innerHTML=`<div><div class="emoji">${o.icone}</div><b>${o.nome}</b><small>${o.nivel}</small></div>`}
function check(){let ok=state.choice.length===state.chain.length&&state.choice.every((x,i)=>x===state.chain[i]);$("#msg").className="msg "+(ok?"good":"bad");if(ok){
  state.score+=100;
  $("#msg").textContent="✅ Cadeia correta! A energia flui do alimento para o consumidor.";
  sfx("correct");
  const nomes=state.chain.map(id=>byId[id].nome).join(", depois ");
  speak(`Muito bem. Cadeia correta: ${nomes}. A energia passa do alimento para o consumidor.`);
  setTimeout(()=>{state.round++;newRound()},2200);
}else{
  $("#msg").textContent="❌ Ainda não. Observe quem serve de alimento para quem.";
  sfx("wrong");
  speak("Ainda não. Observe quem serve de alimento para quem e tente novamente.");
}}
$("#go").onclick=()=>{ensureAudio();startAmbient();state.round=1;state.score=0;state.used.clear();newRound()};$("#check").onclick=check;$("#reset").onclick=()=>{sfx("tap");state.choice=[];render();speak("Vamos tentar novamente.");};$("#hint").onclick=()=>{
  let i=state.choice.length;
  if(i<state.chain.length){
    let o=byId[state.chain[i]];
    $("#msg").textContent=`💡 Próximo: ${o.nivel}. Procure ${o.icone} ${o.nome}.`;
    sfx("hint");
    speak(`Dica. O próximo organismo é ${o.nome}. Ele é ${o.nivel}.`);
  }
};$("#homeBtn").onclick=()=>{stopAmbient();speechSynthesis?.cancel?.();view("home")};$("#sound").onclick=()=>setSound(!state.sound);$("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$("#help").onclick=()=>{
  const txt="Monte a cadeia começando pelo produtor. A seta representa o fluxo de energia, do organismo que serve de alimento para o consumidor.";
  speak(txt);alert(txt);
};
$("#sound").classList.add("audio-on");
</script></body></html>
