.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 66%,rgba(5,22,33,.50) 100%)}
.badge{position:absolute;z-index:2;left:20px;bottom:16px;padding:7px 11px;border-radius:99px;background:#08394DCC;border:1px solid #ffffff2b;font-size:11px;font-weight:1000;letter-spacing:.06em}
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mode{min-height:112px;border:2px solid #ffffff33;border-radius:20px;color:#fff;padding:13px;display:grid;grid-template-columns:44px minmax(0,1fr) 28px;gap:10px;align-items:center;text-align:left;box-shadow:0 12px 26px #0003;transition:.16s}
.mode .ic{width:44px;height:44px;border-radius:13px;background:#ffffff22;display:grid;place-items:center;font-size:24px}
.mode b{display:block;font-size:16px;line-height:1.1}.mode small{display:block;margin-top:5px;font-size:11px;line-height:1.25;color:#ffffffde}.arr{font-size:26px}
.m1{background:linear-gradient(145deg,#20C979,#099555)}.m2{background:linear-gradient(145deg,#2BA9FF,#1472E3)}.m3{background:linear-gradient(145deg,#A35EFF,#7433DA)}.m4{background:linear-gradient(145deg,#FFA12C,#E4650E)}.m5{background:linear-gradient(145deg,#FF6073,#DD2E47)}.mode.sel{border-color:#fff;transform:translateY(-2px)}
.start{border:0;border-radius:18px;background:linear-gradient(135deg,#20C977,#0FA65E);color:#fff;display:grid;grid-template-columns:44px minmax(0,1fr) 32px;align-items:center;gap:11px;padding:0 20px;text-align:left;box-shadow:0 13px 28px #0fa65e44}
.start .play{width:40px;height:40px;border-radius:50%;background:#fff;color:#16A765;display:grid;place-items:center}.start b{font-size:18px}.start small{display:block;color:#ffffffcf;font-size:11px;margin-top:2px}
/* setup */
.setup{height:100%;max-width:1050px;margin:auto;background:linear-gradient(160deg,#0B3042,#0B2432);border:1px solid var(--line);border-radius:22px;padding:17px;display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:#0C3549;color:#fff}.setup h2{margin:0;font-size:30px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;color:#9EDAF0}.field select{height:46px;border:1px solid var(--line);border-radius:11px;background:#0A2C3F;color:#fff;padding:0 10px}
.go{margin-top:auto;height:56px;border:0;border-radius:15px;background:linear-gradient(135deg,#18B46D,#34D28B);color:#fff;font-weight:1000;font-size:18px}
/* game */
.game{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) auto;gap:8px}.hud{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0B3145;border:1px solid var(--line);border-radius:17px}.hud h2{margin:0}.chip{padding:8px 10px;border-radius:10px;background:#0D3B50;font-weight:900;font-size:12px}
.arena{border-radius:22px;background:radial-gradient(circle at 50% 10%,rgba(55,177,218,.11),transparent 35%),linear-gradient(180deg,#0B3040,#0A2332);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.scene{width:min(900px,100%);min-height:115px;border-radius:20px;background:linear-gradient(145deg,#123C4D,#0D2B39);border:1px solid #2A6A81;display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;text-align:center}
.scene .big{font-size:64px}.scene .prompt{font-size:clamp(20px,2vw,30px);font-weight:1000;line-height:1.2}
.slots{width:min(1100px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px;min-height:72px}.slot{min-width:110px;min-height:58px;border:2px dashed #4A8BA1;border-radius:13px;background:#0D3446;display:grid;place-items:center;padding:8px;text-align:center;font-weight:900}.slot.fill{border-style:solid;border-color:#5EDFA4;background:#154A3A}
.bank{width:min(1100px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.word{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #2B687A;background:#12394A;color:#fff;font-weight:900;box-shadow:0 6px 14px #0002}
.options{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{min-height:72px;border-radius:14px;border:2px solid #2B687A;background:#12394A;color:#fff;font-weight:900;padding:10px}
.creative{width:min(900px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.creative select{height:52px;border-radius:12px;background:#12394A;color:#fff;border:1px solid #2B687A;padding:0 10px}
.msg{min-height:34px;text-align:center;font-weight:900;color:#CFE8F2}.good{color:#71F2AD}.bad{color:#FF92A0}
.actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.actions button{height:44px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:#0B3448;color:#fff;font-weight:900}.actions .ok{background:#17B16A}
@media(hover:hover) and (pointer:fine){button:hover{filter:brightness(1.09);transform:translateY(-2px)}}
@media(max-width:1100px){html,body{overflow:auto}.app{height:auto;min-height:100dvh}main{overflow:visible}.home{height:auto;grid-template-rows:360px auto 58px}.modes{grid-template-columns:repeat(2,1fr)}.mode:last-child{grid-column:span 2}.game{height:auto;min-height:calc(100dvh - 80px)}}
@media(max-width:700px){.home{grid-template-rows:250px auto auto}.modes{grid-template-columns:1fr}.mode:last-child{grid-column:auto}.row{grid-template-columns:1fr}.creative{grid-template-columns:1fr}.options{grid-template-columns:1fr}.hud{flex-wrap:wrap}.scene{min-height:100px}.scene .big{font-size:50px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}}

/* ===== V2 · motor pedagógico ===== */
.journey{
 width:min(980px,100%);display:flex;align-items:center;justify-content:center;gap:6px;
 padding:7px;border-radius:15px;background:rgba(5,26,38,.55);border:1px solid rgba(91,205,244,.13)
}
.journey-step{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:10px;color:#8FB3C2;font-size:11px}
.journey-step span{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#173D4D;font-weight:1000}
.journey-step.active{background:#15533D;color:#fff}.journey-step.active span{background:#31CE84;color:#063522}
.journey-step.done{color:#70E3A8}.journey i{color:#547B8B;font-style:normal}
.sentence-map{
 width:min(980px,100%);display:grid;grid-template-columns:1fr 30px 1fr 30px 1.35fr;align-items:center;gap:6px
}
.map-part{min-height:64px;border-radius:13px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center;border:2px solid}
.map-part small{font-size:9px;letter-spacing:.08em;font-weight:1000;opacity:.82}.map-part b{font-size:14px;margin-top:4px}
.map-part.who{background:#113D62;border-color:#2C91E7}.map-part.action{background:#154A38;border-color:#36C67E}.map-part.detail{background:#543317;border-color:#E58B28}
.feedback-box{width:min(900px,100%);padding:11px 14px;border-radius:14px;text-align:left;line-height:1.35;font-size:13px}
.feedback-box.good{background:#123E30;border:1px solid #43D58C;color:#CFFFF0}.feedback-box.bad{background:#4B2430;border:1px solid #EF6579;color:#FFE0E5}
.expand-zone{width:min(900px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.expand-chip{min-height:42px;padding:0 12px;border-radius:11px;border:1px solid #47758A;background:#12394A;color:#fff;font-weight:900}
.expand-chip.on{background:#65401B;border-color:#F1A13C}
@media(max-width:700px){
 .journey{overflow-x:auto;justify-content:flex-start}.journey i{display:none}.journey-step b{display:none}
 .sentence-map{grid-template-columns:1fr}.sentence-map>span{transform:rotate(90deg);text-align:center}
}



/* ===== PDE-LOUSA-JOGO v1 · Modo Lousa: palco inteiro, sem colunas, sem rolagem ===== */

body.lousa header{height:58px;padding:5px 12px}body.lousa header img{width:40px;height:40px}body.lousa header h1{font-size:19px}body.lousa header small{display:none}
body.lousa header .pdeNada{position:static;display:flex;flex:1;gap:6px;flex-wrap:nowrap;overflow:hidden;margin-left:10px;top:auto;left:auto;right:auto}body.lousa header .pdeNada .pill{padding:5px 10px;white-space:nowrap;flex:none}body.lousa header .pdeNada .pill small{font-size:8px}body.lousa header .pdeNada .pill b{font-size:13px}body.lousa header .pdeNada .pill[style*="margin-left"]{display:none}

body.lousa .pdeLousaTab{display:grid;place-items:center;position:absolute;z-index:41;right:0;top:50%;width:34px;height:110px;border:1px solid #3A6D84;border-right:0;border-radius:14px 0 0 14px;background:#123D53;color:#fff;font-size:11px;font-weight:900;font-family:inherit;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);cursor:pointer}

body.lousa .pdeNada{gap:6px;padding:6px;max-width:calc(100% - 20px);flex-wrap:nowrap}body.lousa .pdeNada button{min-width:90px;font-size:13px}body.lousa .pdeNada #primaryAction,body.lousa .pdeNada #secondaryAction{width:auto;min-width:170px;margin:0;height:50px;font-size:15px}body.lousa .pdeNada #primaryAction{background:linear-gradient(135deg,#22C55E,#15803D);border:0}body.lousa .pdeNada [data-action="hear"]{display:none}
body.lousa #game .arena{position:relative;padding:12px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
body.lousa #game .arena>*{max-width:100%}
body.lousa .childFlow{gap:10px;width:min(1120px,100%)}
body.lousa .mascot{padding:6px 12px}body.lousa .mascot .rosto{font-size:40px}body.lousa .mascot .bubble,body.lousa .bubble{font-size:19px;padding:8px 12px}body.lousa .sayBtn{width:42px;height:42px;font-size:19px}
body.lousa #game .arena .feedback{position:absolute;left:14px;right:14px;top:10px;z-index:6;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 14px 34px #0f2c4a55;animation:pdeFbIn .25s ease-out;margin:0}@keyframes pdeFbIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:900px){body.lousa .game,body.lousa .work.guided .game{position:absolute;padding:10px 7px 74px}body.lousa #game .arena{min-height:0}}
body.lousa .app{height:100dvh!important;min-height:0!important}body.lousa main{overflow:hidden!important}body.lousa #game{height:100%!important}body.lousa .game{height:100%!important;min-height:0!important;padding:0!important;gap:8px!important}body.lousa .arena{padding:10px 14px;gap:8px;overflow:visible}body.lousa .journey{padding:4px 6px}body.lousa .journey-step{padding:4px 8px;font-size:12px}body.lousa .map-part{min-height:52px;padding:6px 10px}body.lousa .map-part b{font-size:15px}body.lousa .scene{min-height:88px;padding:10px 16px}body.lousa .scene .big{font-size:48px}body.lousa .scene .prompt{font-size:clamp(20px,2.4vw,30px)}body.lousa .slots{min-height:0;gap:6px}body.lousa .slot{min-height:46px}body.lousa .bank{gap:6px}body.lousa .word{min-height:44px}body.lousa .msg{min-height:26px}body.lousa .options{gap:7px}body.lousa .option{min-height:50px}body.lousa .hud{padding:6px 12px}body.lousa .hud h2{font-size:20px;margin:0}</style></head>
