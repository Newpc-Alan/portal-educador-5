<script src="/assets/jogos/pde-jogo.js?v=7"></script>
<script>
// Cálculo por Ano (nov/2026, Motor de Jogos). Nasceu como tentativa de refazer a Batalha Matemática, mas a Batalha original
// (duelo de dois alunos na lousa, com duas calculadoras) é outro jogo e foi mantida. Este ficou como treino individual de cálculo. Um nível para cada ano, do 1º ao 9º, cada um com o cálculo
// que a BNCC pede naquele ano. Lógica pedagógica: a dica ensina uma ESTRATÉGIA de cálculo (completar 10, decompor, operação
// inversa), não entrega a conta; a explicação mostra o caminho passo a passo. Sem relógio: pressa atrapalha quem está aprendendo.
// Para disputar, use o modo Dupla (dois jogadores se alternam, com placar) ou Turma (na lousa).
(function(){
  const { sorteia } = PDEJogo;
  const ent = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const dec = (a, b) => { let v; do{ v = ent(a, b); }while(v % 10 === 0); return v / 10; };   // décimos que não viram número inteiro (2,0)
  const br = n => String(Math.round(n * 100) / 100).replace(".", ",");
  const neg = n => n < 0 ? "(" + String(n).replace("-", "−") + ")" : String(n), sinal = n => String(n).replace("-", "−");
  // alternativas sem repetição; se as candidatas coincidirem, completa com vizinhos da resposta (+2, +3...)
  const num = t => Number(String(t).replace("−", "-").replace(",", "."));
  const alts = (certa, outras) => { const s = new Set([certa]); outras.forEach(o => { if(s.size < 4) s.add(o); });
    for(let k = 2; s.size < 4 && k < 12; k++){ const v = num(certa) + k; s.add(String(certa).includes(",") || !Number.isInteger(v) ? br(v) : sinal(v)); } return [...s].slice(0, 4); };
  const conta = (o, extra) => Object.assign({ tipo:"teclado" }, o, extra || {});
  const G = [
    // 1º ano · EF01MA06: fatos básicos da adição (e a subtração como caminho de volta)
    () => { if(Math.random() < .65){ const a = ent(2, 9), b = ent(1, 9), M = Math.max(a, b), m = Math.min(a, b);
        return conta({ chave:"1a" + a + "+" + b, hab:"EF01MA06", rotulo:a + " + " + b, pergunta:a + " + " + b, fala:a + " mais " + b, resposta:a + b,
          dica:"Comece no número maior (" + M + ") e conte mais " + m + " nos dedos.", explicacao:() => M + " e mais " + m + ": " + Array.from({ length:m }, (_, i) => M + i + 1).join(", ") + ". Então " + a + " + " + b + " = <b>" + (a + b) + "</b>.", fechamento:a + " + " + b + " = " + (a + b) + "." }); }
      const b = ent(1, 6), r = ent(1, 9), a = b + r;
      return conta({ chave:"1s" + a + "-" + b, hab:"EF01MA06", rotulo:a + " − " + b, pergunta:a + " − " + b, fala:a + " menos " + b, resposta:r,
        dica:"Pense ao contrário: " + b + " mais quanto dá " + a + "?", explicacao:() => b + " + " + r + " = " + a + ". Então " + a + " − " + b + " = <b>" + r + "</b>.", fechamento:a + " − " + b + " = " + r + "." }); },
    // 2º ano · EF02MA05: adição e subtração no cálculo mental (dezenas e unidades)
    () => { if(Math.random() < .55){ const a = ent(12, 58), b = ent(11, 39), da = Math.floor(a / 10) * 10, db = Math.floor(b / 10) * 10;
        return conta({ chave:"2a" + a + "+" + b, hab:"EF02MA05", rotulo:a + " + " + b, pergunta:a + " + " + b, fala:a + " mais " + b, resposta:a + b,
          dica:"Some primeiro as dezenas (" + da + " + " + db + ") e depois as unidades (" + (a - da) + " + " + (b - db) + ").", explicacao:() => da + " + " + db + " = " + (da + db) + " e " + (a - da) + " + " + (b - db) + " = " + (a - da + b - db) + ". Juntando: " + (da + db) + " + " + (a - da + b - db) + " = <b>" + (a + b) + "</b>.", fechamento:a + " + " + b + " = " + (a + b) + "." }); }
      const b = ent(11, 38), r = ent(11, 45), a = b + r, db = Math.floor(b / 10) * 10;
      return conta({ chave:"2s" + a + "-" + b, hab:"EF02MA05", rotulo:a + " − " + b, pergunta:a + " − " + b, fala:a + " menos " + b, resposta:r,
        dica:"Tire primeiro as dezenas (" + db + ") e depois as unidades (" + (b - db) + ").", explicacao:() => a + " − " + db + " = " + (a - db) + ". Depois " + (a - db) + " − " + (b - db) + " = <b>" + r + "</b>.", fechamento:a + " − " + b + " = " + r + "." }); },
    // 3º ano · EF03MA05: adição e subtração com centenas
    () => { if(Math.random() < .55){ const a = ent(120, 480), b = ent(105, 390), ca = Math.floor(a / 100) * 100, cb = Math.floor(b / 100) * 100;
        return conta({ chave:"3a" + a + "+" + b, hab:"EF03MA05", rotulo:a + " + " + b, pergunta:a + " + " + b, fala:a + " mais " + b, resposta:a + b,
          dica:"Decomponha: some as centenas (" + ca + " + " + cb + ") e depois o que sobrou (" + (a - ca) + " + " + (b - cb) + ").", explicacao:() => ca + " + " + cb + " = " + (ca + cb) + " e " + (a - ca) + " + " + (b - cb) + " = " + (a - ca + b - cb) + ". Juntando: <b>" + (a + b) + "</b>.", fechamento:a + " + " + b + " = " + (a + b) + "." }); }
      const b = ent(105, 380), r = ent(110, 450), a = b + r, cb = Math.floor(b / 100) * 100;
      return conta({ chave:"3s" + a + "-" + b, hab:"EF03MA05", rotulo:a + " − " + b, pergunta:a + " − " + b, fala:a + " menos " + b, resposta:r,
        dica:"Tire em partes: primeiro " + cb + ", depois " + (b - cb) + ".", explicacao:() => a + " − " + cb + " = " + (a - cb) + ". Depois " + (a - cb) + " − " + (b - cb) + " = <b>" + r + "</b>.", fechamento:a + " − " + b + " = " + r + "." }); },
    // 4º ano · EF04MA06 (multiplicação) e EF04MA07 (divisão exata)
    () => { if(Math.random() < .55){ const a = ent(12, 48), b = ent(3, 9), d = Math.floor(a / 10) * 10, u = a - d;
        return conta({ chave:"4m" + a + "x" + b, hab:"EF04MA06", rotulo:a + " × " + b, pergunta:a + " × " + b, fala:a + " vezes " + b, resposta:a * b,
          dica:"Separe o " + a + " em " + d + " + " + u + " e multiplique cada parte por " + b + ".", explicacao:() => d + " × " + b + " = " + d * b + " e " + u + " × " + b + " = " + u * b + ". Somando: " + d * b + " + " + u * b + " = <b>" + a * b + "</b>.", fechamento:a + " × " + b + " = " + a * b + "." }); }
      const b = ent(3, 9), q = ent(11, 24), a = b * q;
      return conta({ chave:"4d" + a + ":" + b, hab:"EF04MA07", rotulo:a + " ÷ " + b, pergunta:a + " ÷ " + b, fala:a + " dividido por " + b, resposta:q,
        dica:"Pense na multiplicação: " + b + " × 10 = " + b * 10 + ". Quanto falta para chegar em " + a + "?", explicacao:() => b + " × 10 = " + b * 10 + ". Faltam " + (a - b * 10) + ", que é " + b + " × " + (q - 10) + ". Então 10 + " + (q - 10) + " = <b>" + q + "</b>.", fechamento:a + " ÷ " + b + " = " + q + "." }); },
    // 5º ano · EF05MA07 e EF05MA08: números decimais (resposta por alternativas, por causa da vírgula)
    () => { if(Math.random() < .55){ const a = dec(12, 68), b = dec(11, 39), soma = Math.random() < .6, M = Math.max(a, b), m = Math.min(a, b), r = soma ? a + b : M - m, p = soma ? br(a) + " + " + br(b) : br(M) + " − " + br(m);
        return { chave:"5d" + p, hab:"EF05MA07", rotulo:p, pergunta:p, fala:p.replace("+", "mais").replace("−", "menos"), tipo:"escolha", resposta:br(r), alternativas:alts(br(r), [br(r + 1), br(r - 1 > 0 ? r - 1 : r + 2), br(r + .1), br(r * 10), br(r - .1 > 0 ? r - .1 : r + .2)]),
          dica:"Alinhe as vírgulas: some (ou subtraia) os inteiros e os décimos separados.", explicacao:() => "Vírgula embaixo de vírgula: " + p + " = <b>" + br(r) + "</b>. Os décimos se juntam com os décimos e os inteiros com os inteiros.", fechamento:p + " = " + br(r) + "." }; }
      const a = dec(12, 95), b = ent(2, 6), r = a * b, p = br(a) + " × " + b;
      return { chave:"5m" + p, hab:"EF05MA08", rotulo:p, pergunta:p, fala:br(a) + " vezes " + b, tipo:"escolha", resposta:br(r), alternativas:alts(br(r), [br(r * 10), br(r / 10), br(r + b), br(r - 1 > 0 ? r - 1 : r + 1), br(r + 1)]),
        dica:"Faça a conta sem a vírgula (" + Math.round(a * 10) + " × " + b + ") e depois volte uma casa decimal.", explicacao:() => Math.round(a * 10) + " × " + b + " = " + Math.round(a * 10) * b + ". Como " + br(a) + " tem uma casa depois da vírgula, o resultado também tem: <b>" + br(r) + "</b>.", fechamento:p + " = " + br(r) + "." }; },
    // 6º ano · EF06MA03 (potências e expressões com naturais) e EF06MA13 (porcentagem)
    () => { const t = ent(0, 2);
      if(t === 0){ const b = ent(2, 9), e = b <= 3 ? ent(2, 4) : b <= 5 ? ent(2, 3) : 2, r = b ** e;
        return conta({ chave:"6p" + b + "^" + e, hab:"EF06MA03", rotulo:b + " elevado a " + e, perguntaHtml:b + "<sup>" + e + "</sup>", fala:b + " elevado a " + e, resposta:r,
          dica:"Potência é multiplicação repetida: o " + b + " aparece " + e + " vezes. Não é " + b + " × " + e + ".", explicacao:() => Array(e).fill(b).join(" × ") + " = <b>" + r + "</b>.", fechamento:b + " elevado a " + e + " é " + r + "." }); }
      if(t === 1){ const a = ent(3, 12), b = ent(2, 6), c = ent(2, 7), r = a + b * c;
        return conta({ chave:"6e" + a + b + c, hab:"EF06MA03", rotulo:a + " + " + b + " × " + c, pergunta:a + " + " + b + " × " + c, fala:a + " mais " + b + " vezes " + c, resposta:r,
          dica:"Atenção à ordem: a multiplicação vem antes da adição.", explicacao:() => "Primeiro " + b + " × " + c + " = " + b * c + ". Depois " + a + " + " + b * c + " = <b>" + r + "</b>.", fechamento:a + " + " + b + " × " + c + " = " + r + "." }); }
      const pc = sorteia([10, 20, 25, 50, 75]), base = sorteia(pc === 25 || pc === 75 ? [40, 80, 120, 200, 360] : [30, 60, 80, 150, 240, 500]), r = base * pc / 100;
      return conta({ chave:"6%" + pc + "de" + base, hab:"EF06MA13", rotulo:pc + "% de " + base, pergunta:pc + "% de " + base, fala:pc + " por cento de " + base, resposta:r,
        dica:{ 10:"10% é a décima parte: divida por 10.", 20:"Ache 10% (divida por 10) e dobre.", 25:"25% é a quarta parte: divida por 4.", 50:"50% é a metade.", 75:"75% são três quartos: divida por 4 e multiplique por 3." }[pc],
        explicacao:() => ({ 10:base + " ÷ 10", 20:base + " ÷ 10 = " + base / 10 + ", e " + base / 10 + " × 2", 25:base + " ÷ 4", 50:base + " ÷ 2", 75:base + " ÷ 4 = " + base / 4 + ", e " + base / 4 + " × 3" }[pc]) + " = <b>" + r + "</b>.", fechamento:pc + "% de " + base + " = " + r + "." }); },
    // 7º ano · EF07MA04 (operações com inteiros, por alternativas por causa do sinal) e EF07MA18 (equação do 1º grau)
    () => { if(Math.random() < .6){ const t = ent(0, 2), a = ent(2, 12) * (Math.random() < .6 ? -1 : 1), b = ent(2, 12) * (a > 0 || Math.random() < .5 ? -1 : 1);
        const r = t === 0 ? a + b : t === 1 ? a - b : a * b, p = t === 0 ? neg(a) + " + " + neg(b) : t === 1 ? neg(a) + " − " + neg(b) : neg(a) + " × " + neg(b);
        return { chave:"7i" + p, hab:"EF07MA04", rotulo:p, pergunta:p, fala:"Operação com números inteiros", tipo:"escolha", resposta:sinal(r), alternativas:alts(sinal(r), [sinal(-r), sinal(t === 0 ? a - b : a + b), sinal(Math.abs(a) + Math.abs(b)), sinal(-(Math.abs(a) + Math.abs(b))), sinal(r + 1)]),
          dica:t === 2 ? "Na multiplicação, sinais iguais dão resultado positivo e sinais diferentes dão negativo." : t === 1 ? "Subtrair é somar o oposto: troque o sinal do segundo número e some." : "Sinais diferentes: subtraia os valores e fique com o sinal do maior. Sinais iguais: some e mantenha o sinal.",
          explicacao:() => (t === 1 ? neg(a) + " − " + neg(b) + " é o mesmo que " + neg(a) + " + " + neg(-b) + ". " : "") + p + " = <b>" + sinal(r) + "</b>.", fechamento:p + " = " + sinal(r) + "." }; }
      const x = ent(2, 12), a = ent(2, 6), b = ent(1, 15), c = a * x + b;
      return conta({ chave:"7q" + a + "x+" + b + "=" + c, hab:"EF07MA18", rotulo:a + "x + " + b + " = " + c, perguntaHtml:a + "x + " + b + " = " + c + '<br><span style="font-size:.5em;font-weight:600">Quanto vale x?</span>', fala:a + " x mais " + b + " igual a " + c + ". Quanto vale x?", resposta:x,
        dica:"Desfaça na ordem inversa: primeiro tire " + b + " dos dois lados, depois divida por " + a + ".", explicacao:() => c + " − " + b + " = " + (c - b) + ", então " + a + "x = " + (c - b) + ". Dividindo por " + a + ": x = <b>" + x + "</b>.", fechamento:"x = " + x + "." }); },
    // 8º ano · EF08MA06 (valor numérico de expressão algébrica) e EF08MA02 (potenciação e radiciação)
    () => { if(Math.random() < .55){ const x = ent(2, 6), a = ent(2, 4), b = ent(1, 9), r = a * x * x + b;
        return conta({ chave:"8v" + a + "x2+" + b + "@" + x, hab:"EF08MA06", rotulo:"Para x = " + x + ", " + a + "x² + " + b, perguntaHtml:"x = " + x + " &nbsp;→&nbsp; " + a + "x<sup>2</sup> + " + b, fala:"Para x igual a " + x + ", quanto vale " + a + " x ao quadrado mais " + b + "?", resposta:r,
          dica:"Troque o x por " + x + ". Primeiro a potência, depois a multiplicação, por último a soma.", explicacao:() => x + "² = " + x * x + ". Depois " + a + " × " + x * x + " = " + a * x * x + ". Por fim " + a * x * x + " + " + b + " = <b>" + r + "</b>.", fechamento:"O valor é " + r + "." }); }
      const n = ent(4, 15), q = n * n;
      return conta({ chave:"8r" + q, hab:"EF08MA02", rotulo:"Raiz quadrada de " + q, perguntaHtml:"√" + q, fala:"Raiz quadrada de " + q, resposta:n,
        dica:"A raiz quadrada desfaz o quadrado: que número vezes ele mesmo dá " + q + "?", explicacao:() => n + " × " + n + " = " + q + ", então √" + q + " = <b>" + n + "</b>.", fechamento:"√" + q + " = " + n + "." }); },
    // 9º ano · EF09MA03: potências com expoente fracionário
    () => { const c = sorteia([[4, 1, 2, 2], [9, 1, 2, 3], [16, 1, 2, 4], [25, 1, 2, 5], [36, 1, 2, 6], [49, 1, 2, 7], [64, 1, 2, 8], [81, 1, 2, 9], [100, 1, 2, 10], [8, 1, 3, 2], [27, 1, 3, 3], [64, 1, 3, 4], [125, 1, 3, 5], [16, 1, 4, 2], [81, 1, 4, 3],
        [8, 2, 3, 2], [27, 2, 3, 3], [4, 3, 2, 2], [9, 3, 2, 3], [16, 3, 2, 4], [16, 3, 4, 2], [64, 2, 3, 4]]), [b, p, q, raiz] = c, r = raiz ** p, nr = q === 2 ? "raiz quadrada" : q === 3 ? "raiz cúbica" : "raiz quarta";
      return conta({ chave:"9f" + b + "^" + p + "/" + q, hab:"EF09MA03", rotulo:b + " elevado a " + p + "/" + q, perguntaHtml:b + "<sup>" + p + "/" + q + "</sup>", fala:b + " elevado a " + p + " sobre " + q, resposta:r,
        dica:"O número de baixo do expoente é a raiz e o de cima é a potência. Comece pela " + nr + " de " + b + ".", explicacao:() => "A " + nr + " de " + b + " é " + raiz + (p > 1 ? ". Depois " + raiz + " elevado a " + p + " = <b>" + r + "</b>." : ". Então o resultado é <b>" + r + "</b>."), fechamento:b + " elevado a " + p + "/" + q + " = " + r + "." }); }
  ];
  PDEJogo.criar({
    id:"calculo-por-ano", titulo:"Cálculo por Ano", emoji:"🧮", tema:["#C2410C", "#F59E0B"], rodada:10,
    selo:"Matemática · 1º ao 9º ano",
    descricao:"Um nível para cada ano, do 1º ao 9º. Escolha o ano da turma e treine o cálculo: a dica ensina a estratégia e, se precisar, o jogo mostra o passo a passo.",
    habilidades:{
      EF01MA06:"1º ano: fatos básicos da adição", EF02MA05:"2º ano: adição e subtração no cálculo mental", EF03MA05:"3º ano: adição e subtração com centenas",
      EF04MA06:"4º ano: multiplicação", EF04MA07:"4º ano: divisão exata", EF05MA07:"5º ano: adição e subtração com decimais", EF05MA08:"5º ano: multiplicação com decimais",
      EF06MA03:"6º ano: potências e expressões numéricas", EF06MA13:"6º ano: porcentagem", EF07MA04:"7º ano: operações com números inteiros", EF07MA18:"7º ano: equação do 1º grau",
      EF08MA06:"8º ano: valor numérico de expressão algébrica", EF08MA02:"8º ano: potenciação e radiciação", EF09MA03:"9º ano: potências com expoente fracionário"
    },
    niveis:[
      { nome:"1º ano", sub:"somar e tirar até 18", hab:"EF01MA06" }, { nome:"2º ano", sub:"contas até 100", hab:"EF02MA05" }, { nome:"3º ano", sub:"contas com centenas", hab:"EF03MA05" },
      { nome:"4º ano", sub:"multiplicar e dividir", hab:"EF04MA06" }, { nome:"5º ano", sub:"números com vírgula", hab:"EF05MA07" }, { nome:"6º ano", sub:"potência, expressão e %", hab:"EF06MA03" },
      { nome:"7º ano", sub:"negativos e equação", hab:"EF07MA04" }, { nome:"8º ano", sub:"expressão algébrica e raiz", hab:"EF08MA06" }, { nome:"9º ano", sub:"expoente fracionário", hab:"EF09MA03" }
    ],
    ajuda:[
      "Escolha o ano da turma em \"Por onde começar\". Na Trilha, o jogo começa no 1º ano e sobe sozinho quando você acerta 4 seguidas.",
      "Para jogar com um colega, escolha o modo Dupla: os dois se alternam e o placar aparece na tela. Para o duelo de dois alunos na lousa, use a Batalha Matemática.",
      "Não tem relógio de propósito: o objetivo é aprender a estratégia de cálculo, não chutar rápido."
    ],
    gerar(c){ return G[Math.min(c.nivel, G.length - 1)](); }
  });
})();
</script>
