<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/js/ambiente.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fração Mágica · Portal do Educador</title>
<meta name="theme-color" content="#071a2c">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/jogos/pde-jogo.css">
<style>
.fr{ display:flex; flex-direction:column; align-items:center; gap:.5rem; width:100%; }
.fr svg{ display:block; max-width:100%; }
.fr small{ font-size:.95rem; font-weight:600; color:var(--suave); text-align:center; }
.fr .par{ padding-right:2.6rem; display:flex; flex-direction:column; gap:.45rem; align-items:stretch; width:min(100%, 34rem); }
.fr .lin{ display:flex; align-items:center; gap:.6rem; }
.fr .lin span{ flex:0 0 3.2rem; font-size:1.5rem; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.fr .lin svg{ flex:1 1 auto; height:auto; }
/* fração empilhada (numerador sobre denominador) dentro da pergunta */
.fz{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1; margin:0 .12em; font-variant-numeric:tabular-nums; }
.fz i{ font-style:normal; padding:0 .12em; }
.fz i + i{ border-top:.07em solid currentColor; margin-top:.06em; padding-top:.06em; }
</style>
</head>
<body>
<script src="/assets/jogos/pde-jogo.js"></script>
<script>
// Fração Mágica (reformulado em nov/2026 no Motor de Jogos). Lógica pedagógica, do concreto ao abstrato:
//   1) fração unitária e 2) parte de um todo, sempre com desenho (barra ou pizza); as alternativas erradas trazem o engano
//      clássico de contar "pintadas sobre não pintadas" e o de inverter numerador e denominador;
//   3) a fração como número: um ponto na reta numérica; 4) equivalência vista em duas barras do mesmo tamanho;
//   5) comparação sem desenho (mesmo denominador, mesmo numerador ou igualando os denominadores); 6) fração de uma quantidade (dividir pelo de baixo, multiplicar pelo de cima).
(function(){
  const { sorteia } = PDEJogo;
  const COR = "#7B3FE4", COR2 = "#F59F00", VAZ = "#EEF2F7", TR = "#0f2c4a";
  const fz = (a, b) => '<span class="fz"><i>' + a + "</i><i>" + b + "</i></span>", tx = (a, b) => a + "/" + b;
  const mdc = (a, b) => b ? mdc(b, a % b) : a;
  function barra(k, n, cor, larg){
    const W = larg || 360, H = 56, w = W / n; let s = "";
    for(let i = 0; i < n; i++) s += '<rect x="' + (i * w + 1.5).toFixed(1) + '" y="1.5" width="' + (w - 3).toFixed(1) + '" height="' + (H - 3) + '" rx="5" fill="' + (i < k ? (cor || COR) : VAZ) + '" stroke="' + TR + '" stroke-width="2"/>';
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W * 1.6 + '" height="' + H * 1.6 + '" role="img" aria-label="Barra dividida em ' + n + " partes iguais, " + k + ' pintadas">' + s + "</svg>";
  }
  function pizza(k, n){
    let s = ""; const R = 92;
    for(let i = 0; i < n; i++){ const a0 = i / n * 2 * Math.PI, a1 = (i + 1) / n * 2 * Math.PI, p = a => (100 + Math.sin(a) * R).toFixed(1) + " " + (100 - Math.cos(a) * R).toFixed(1);
      s += '<path d="M100 100 L' + p(a0) + " A" + R + " " + R + " 0 " + (1 / n > .5 ? 1 : 0) + " 1 " + p(a1) + ' Z" fill="' + (i < k ? COR2 : VAZ) + '" stroke="' + TR + '" stroke-width="2.5" stroke-linejoin="round"/>'; }
    return '<svg viewBox="0 0 200 200" width="320" height="320" role="img" aria-label="Pizza dividida em ' + n + " fatias iguais, " + k + ' pintadas">' + s + "</svg>";
  }
  function reta(k, n, ate){
    const W = 420, x0 = 24, x1 = W - 24, u = (x1 - x0) / ate; let s = '<line x1="' + x0 + '" y1="40" x2="' + x1 + '" y2="40" stroke="' + TR + '" stroke-width="3"/>';
    for(let i = 0; i <= n * ate; i++){ const x = x0 + i * u / n, g = i % n === 0;
      s += '<line x1="' + x.toFixed(1) + '" y1="' + (g ? 26 : 32) + '" x2="' + x.toFixed(1) + '" y2="' + (g ? 54 : 48) + '" stroke="' + TR + '" stroke-width="' + (g ? 3 : 2) + '"/>';
      if(g) s += '<text x="' + x.toFixed(1) + '" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="' + TR + '" font-family="Fredoka, sans-serif">' + i / n + "</text>"; }
    const xp = x0 + k * u / n;
    s += '<circle cx="' + xp.toFixed(1) + '" cy="40" r="9" fill="' + COR + '" stroke="#fff" stroke-width="2.5"/><path d="M' + xp.toFixed(1) + " 22 l-7 -12 h14 z" + '" fill="' + COR + '"/>';
    return '<svg viewBox="0 0 ' + W + ' 86" width="' + W * 1.7 + '" height="' + 86 * 1.7 + '" role="img" aria-label="Reta numérica de 0 a ' + ate + " com cada unidade dividida em " + n + ' partes e um ponto marcado">' + s + "</svg>";
  }
  const duas = (a, b, c, d) => '<div class="par"><div class="lin"><span>' + tx(a, b) + "</span>" + barra(a, b, COR) + '</div><div class="lin"><span>' + (c ? c : "?") + "/" + d + "</span>" + barra(c, d, COR2) + "</div></div>";
  const alts = (certa, outras) => { const s = new Set([certa]); outras.forEach(o => { if(s.size < 4) s.add(o); }); return [...s]; };
  PDEJogo.criar({
    id:"fracao-magica", titulo:"Fração Mágica", emoji:"🍕", tema:["#7B3FE4", "#B197FC"], rodada:10,
    selo:"Matemática · 4º ao 6º ano",
    descricao:"Veja a fração no desenho, encontre seu lugar na reta numérica, descubra frações equivalentes e compare. Do desenho ao número, um passo de cada vez.",
    habilidades:{
      EF04MA09:"Frações unitárias mais usuais (1/2, 1/3, 1/4, 1/5, 1/10)",
      EF05MA03:"Fração como parte de um todo e como ponto na reta numérica",
      EF05MA04:"Frações equivalentes",
      EF05MA05:"Comparar frações",
      EF06MA09:"Fração de uma quantidade"
    },
    niveis:[
      { nome:"Uma parte", sub:"1/2, 1/3, 1/4...", hab:"EF04MA09" },
      { nome:"Parte do todo", sub:"quantas partes pintadas?", hab:"EF05MA03" },
      { nome:"Na reta numérica", sub:"onde está o ponto?", hab:"EF05MA03" },
      { nome:"Equivalentes", sub:"1/2 = ?/6", hab:"EF05MA04" },
      { nome:"Qual é maior?", sub:"comparar duas frações", hab:"EF05MA05" },
      { nome:"Fração de quantidade", sub:"3/4 de 20", hab:"EF06MA09" }
    ],
    ajuda:[
      "O número de baixo (denominador) diz em quantas partes iguais o inteiro foi dividido. O de cima (numerador) diz quantas partes foram pintadas.",
      "Na reta numérica, conte em quantos pedaços iguais o espaço entre 0 e 1 foi dividido: esse é o número de baixo.",
      "Frações equivalentes têm escritas diferentes, mas pintam o mesmo tanto da barra."
    ],
    gerar(c){
      const n = c.nivel;
      if(n === 0){
        const d = sorteia([2, 3, 4, 5, 10, 2, 3, 4]), pz = d <= 5 && Math.random() < .5;
        return { chave:"u" + d + pz, hab:"EF04MA09", rotulo:"Fração unitária " + tx(1, d), pergunta:"Que fração está pintada?", texto:true, fala:"Que fração está pintada?", tipo:"escolha", resposta:tx(1, d),
          alternativas:alts(tx(1, d), [tx(d, 1), tx(1, d - 1 || 3), tx(1, d + 1), tx(2, d)]),
          apoio:el => { el.innerHTML = '<div class="fr">' + (pz ? pizza(1, d) : barra(1, d)) + "</div>"; },
          dica:"Conte todas as partes iguais, pintadas ou não: esse é o número de baixo.",
          explicacao:() => "O inteiro foi dividido em " + d + " partes iguais e 1 está pintada: <b>" + tx(1, d) + "</b>.", fechamento:"1 parte de " + d + "." };
      }
      if(n === 1){
        const d = sorteia([3, 4, 5, 6, 8, 10]), k = sorteia(Array.from({ length:d - 2 }, (_, i) => i + 2)), pz = d <= 8 && Math.random() < .5;
        return { chave:"p" + k + "/" + d + pz, hab:"EF05MA03", rotulo:"Parte do todo " + tx(k, d), pergunta:"Que fração está pintada?", texto:true, fala:"Que fração está pintada?", tipo:"escolha", resposta:tx(k, d),
          alternativas:alts(tx(k, d), [tx(k, d - k), tx(d, k), tx(d - k, d), tx(k + 1, d), tx(k, d + 1)].filter(x => x !== tx(k, d))),
          apoio:el => { el.innerHTML = '<div class="fr">' + (pz ? pizza(k, d) : barra(k, d)) + "</div>"; },
          dica:"O número de baixo é o total de partes iguais (pintadas e não pintadas). O de cima é só o que está pintado.",
          explicacao:() => "São " + d + " partes iguais no total e " + k + " pintadas: <b>" + tx(k, d) + "</b>. As " + (d - k) + " em branco não entram no número de baixo sozinhas.", fechamento:k + " partes de " + d + "." };
      }
      if(n === 2){
        const d = sorteia([2, 3, 4, 5]), maior = Math.random() < .35, k = maior ? d + sorteia(Array.from({ length:d - 1 }, (_, i) => i + 1)) : sorteia(Array.from({ length:d - 1 }, (_, i) => i + 1)), ate = maior ? 2 : 1;
        return { chave:"r" + k + "/" + d, hab:"EF05MA03", rotulo:"Reta numérica " + tx(k, d), pergunta:"Que fração o ponto mostra?", texto:true, fala:"Que fração o ponto mostra?", tipo:"escolha", resposta:tx(k, d),
          alternativas:alts(tx(k, d), [tx(d, k), tx(k, d + 1), tx(k + 1, d), tx(k, d * ate + 1), tx(k - 1 || k + 2, d)].filter(x => x !== tx(k, d))),
          apoio:el => { el.innerHTML = '<div class="fr">' + reta(k, d, ate) + "</div>"; },
          dica:"Veja em quantos pedaços iguais o espaço entre 0 e 1 foi dividido. Depois conte os pedaços do 0 até o ponto.",
          explicacao:() => "Entre 0 e 1 há " + d + " pedaços iguais (número de baixo). Do 0 até o ponto são " + k + " pedaços (número de cima): <b>" + tx(k, d) + "</b>." + (k > d ? " Passou do 1, então a fração é maior que um inteiro." : ""), fechamento:k + " pedaços de 1/" + d + "." };
      }
      if(n === 3){
        const base = sorteia([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5]]), f = sorteia(base[1] <= 3 ? [2, 3, 4] : [2, 3]), a = base[0], b = base[1], d2 = b * f, r = a * f;
        return { chave:"e" + a + "/" + b + "x" + f, hab:"EF05MA04", rotulo:tx(a, b) + " = ?/" + d2, perguntaHtml:fz(a, b) + " = " + fz('<span class="vago">?</span>', d2), fala:"Qual número completa a fração equivalente?", tipo:"teclado", resposta:r,
          apoio:el => { el.innerHTML = '<div class="fr">' + duas(a, b, 0, d2) + "<small>As duas barras têm o mesmo tamanho. Quantas partes da segunda pintam o mesmo tanto?</small></div>"; },
          dica:"O número de baixo foi multiplicado por " + f + " (" + b + " × " + f + " = " + d2 + "). Faça o mesmo com o de cima.",
          explicacao:() => "Cada parte foi cortada em " + f + ": " + a + " × " + f + " = <b>" + r + "</b>. Então " + tx(a, b) + " = <b>" + tx(r, d2) + "</b>.", fechamento:tx(a, b) + " = " + tx(r, d2) + "." };
      }
      if(n === 4){
        let a, b, cc, d, g = 0;
        do{ b = sorteia([2, 3, 4, 5, 6, 8]); d = sorteia([2, 3, 4, 5, 6, 8]); a = sorteia(Array.from({ length:b - 1 }, (_, i) => i + 1)); cc = sorteia(Array.from({ length:d - 1 }, (_, i) => i + 1)); }
        while(g++ < 30 && (b === d && a === cc || (a * d === cc * b && Math.random() < .7)));
        const v1 = a * d, v2 = cc * b, r = v1 === v2 ? "São iguais" : v1 > v2 ? tx(a, b) : tx(cc, d);
        const comum = b * d, igualar = tx(a, b) + " = " + tx(v1, comum) + " e " + tx(cc, d) + " = " + tx(v2, comum) + ".";
        const motivo = b === d ? "Mesmo número de baixo: as partes têm o mesmo tamanho. Ganha quem tem mais partes." : a === cc ? "Mesmo número de cima: ganha quem tem as partes maiores, ou seja, o número de baixo menor." : v1 === v2 ? "Com o mesmo número de baixo: " + igualar + " São frações equivalentes." : "Com o mesmo número de baixo: " + igualar + " " + Math.max(v1, v2) + " partes é mais que " + Math.min(v1, v2) + ".";
        return { chave:"c" + a + "/" + b + "v" + cc + "/" + d, hab:"EF05MA05", rotulo:"Comparar " + tx(a, b) + " e " + tx(cc, d), perguntaHtml:"Qual é maior: " + fz(a, b) + " ou " + fz(cc, d) + "?", texto:true, fala:"Qual fração é maior?", tipo:"escolha", resposta:r,
          alternativas:tx(a, b) === tx(cc, d) ? [tx(a, b), "São iguais"] : [tx(a, b), tx(cc, d), "São iguais"],
          dica:b === d ? "O número de baixo é igual: as partes têm o mesmo tamanho. Compare os números de cima." : a === cc ? "O número de cima é igual. Pense: dividir em mais partes deixa cada parte maior ou menor?" : "Escreva as duas com o mesmo número de baixo (" + comum + "): multiplique em cima e embaixo pelo mesmo número.",
          explicacao:() => motivo + " Resposta: <b>" + r + "</b>.", fechamento:motivo };
      }
      const d = sorteia([2, 3, 4, 5, 10]), k = d === 2 ? 1 : sorteia(Array.from({ length:d - 1 }, (_, i) => i + 1)), parte = sorteia([2, 3, 4, 5, 6, 8, 10]), total = d * parte, r = k * parte;
      const coisa = sorteia(["figurinhas", "balas", "lápis", "bolinhas de gude", "páginas", "alunos"]);
      return { chave:"q" + k + "/" + d + "de" + total, hab:"EF06MA09", rotulo:tx(k, d) + " de " + total, perguntaHtml:"Quanto é " + fz(k, d) + " de " + total + " " + coisa + "?", texto:true, fala:"Quanto é a fração de " + total + " " + coisa + "?", tipo:"teclado", resposta:r,
        dica:"Primeiro divida " + total + " pelo número de baixo (" + d + ") para achar uma parte." + (k > 1 ? " Depois multiplique pelo número de cima (" + k + ")." : ""),
        explicacao:() => total + " ÷ " + d + " = " + parte + " (uma parte)." + (k > 1 ? " " + parte + " × " + k + " = <b>" + r + "</b>." : " Resposta: <b>" + r + "</b>."), fechamento:tx(k, d) + " de " + total + " = " + r + "." };
    }
  });
})();
</script>
</body>
</html>
