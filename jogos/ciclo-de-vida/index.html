n><button class="ib" id="help">?</button></header><main><section id="home"><div class="home"><div class="hero"></div><div class="modes">
<button class="mode m1 sel" data-mode="montar"><span class="ic">🧩</span><span><b>Monte o Ciclo</b><small>Organize as fases na ordem correta.</small></span><span>›</span></button>
<button class="mode m2" data-mode="proxima"><span class="ic">❓</span><span><b>Próxima Fase</b><small>Descubra o que acontece depois.</small></span><span>›</span></button>
<button class="mode m3" data-mode="faltando"><span class="ic">🔎</span><span><b>Quem Está Faltando?</b><small>Complete o ciclo.</small></span><span>›</span></button>
<button class="mode m4" data-mode="comparar"><span class="ic">🔄</span><span><b>Compare os Ciclos</b><small>Encontre semelhanças e diferenças.</small></span><span>›</span></button>
<button class="mode m5" data-mode="movimento"><span class="ic">▶️</span><span><b>Ciclo em Movimento</b><small>Acompanhe as transformações.</small></span><span>›</span></button></div><button class="start" id="start">▶ COMEÇAR EXPLORAÇÃO · <span id="modeLabel">Monte o Ciclo</span></button></div></section>
<section id="setup" class="hide"><div class="setup"><button class="back" id="back">← Voltar</button><h2>Escolha o ciclo</h2><div class="species" id="species"></div><button class="go" id="go">🚀 INICIAR ATIVIDADE</button></div></section>
<section id="game" class="hide"><div class="game"><div class="hud"><b id="gameTitle">Monte o Ciclo</b><div class="sp"></div><span id="cycleName"></span><span>⭐ <b id="score">0</b></span></div><div class="arena"><div class="slots" id="slots"></div><div class="bank" id="bank"></div><div id="msg">Toque nas fases na ordem correta.</div></div><div class="actions"><button id="hint">💡 Dica</button><button id="reset">↻ Limpar</button><button class="ok" id="check">✓ Conferir</button><button id="homeBtn">🏠 Menu</button></div></div></section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const CYCLES = {
    "Borboleta":[["Ovo","🥚"],["Lagarta","🐛"],["Crisálida","🟢"],["Borboleta adulta","🦋"]],
    "Sapo":[["Ovos","🫧"],["Girino","🐟"],["Girino com patas","🐸"],["Sapo adulto","🐸"]],
    "Galinha":[["Ovo","🥚"],["Pintinho","🐥"],["Jovem","🐤"],["Galinha adulta","🐔"]],
    "Tartaruga":[["Ovo","🥚"],["Filhote","🐢"],["Jovem","🐢"],["Adulta","🐢"]],
    "Mosquito":[["Ovo","🥚"],["Larva","🪱"],["Pupa","🟤"],["Adulto","🦟"]],
    "Joaninha":[["Ovo","🥚"],["Larva","🐛"],["Pupa","🟠"],["Adulta","🐞"]],
    "Abelha":[["Ovo","🥚"],["Larva","🐛"],["Pupa","🟡"],["Adulta","🐝"]],
    "Feijão":[["Semente","🫘"],["Germinação","🌱"],["Plântula","🌿"],["Planta adulta","🪴"]],
    "Girassol":[["Semente","🌻"],["Broto","🌱"],["Planta jovem","🌿"],["Girassol adulto","🌻"]],
    "Ser humano":[["Bebê","👶"],["Criança","🧒"],["Adolescente","🧑"],["Adulto","🧑‍🦱"],["Idoso","👴"]]
  };

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  let mode = "montar";
  let cycle = "Borboleta";
  let choice = [];
  let score = 0;
  let sound = true;
  let animationTimer = null;

  const modeNames = {
    montar:"Monte o Ciclo",
    proxima:"Qual é a Próxima Fase?",
    faltando:"Quem Está Faltando?",
    comparar:"Compare os Ciclos",
    movimento:"Ciclo em Movimento"
  };

  function view(id){
    ["home","setup","game"].forEach(x => {
      const el = document.getElementById(x);
      if(el) el.classList.toggle("hide", x !== id);
    });
  }

  function speak(text){
    if(!sound || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR";
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function selectMode(m){
    mode = m;
    $$(".mode").forEach(btn => btn.classList.toggle("sel", btn.dataset.mode === m));
    const label = $("#modeLabel");
    if(label) label.textContent = modeNames[m];
  }

  function openSetup(m){
    selectMode(m);
    renderSpecies();
    view("setup");
    const title = $("#setup h2");
    if(title) title.textContent = modeNames[m];
    speak(`${modeNames[m]}. Escolha um ciclo para começar.`);
  }

  function renderSpecies(){
    const box = $("#species");
    box.innerHTML = Object.keys(CYCLES).map(name =>
      `<button type="button" class="${name === cycle ? "on" : ""}" data-cycle="${name}">${name}</button>`
    ).join("");

    box.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        cycle = btn.dataset.cycle;
        renderSpecies();
        speak(cycle);
      });
    });
  }

  function renderBaseGame(){
    choice = [];
    view("game");
    $("#gameTitle").textContent = modeNames[mode];
    $("#cycleName").textContent = cycle;
    $("#score").textContent = score;
    $("#msg").textContent = "Observe as fases e siga a instrução.";
  }

  function buildSlots(stages){
    $("#slots").innerHTML = stages.map((x,i) =>
      `<div class="slot" data-i="${i}">FASE ${i+1}</div>${i < stages.length-1 ? '<span class="arrow">→</span>' : ''}`
    ).join("");
  }

  function buildBank(stages){
    const shuffled = [...stages].sort(() => Math.random() - 0.5);
    $("#bank").innerHTML = shuffled.map(x =>
      `<button type="button" class="card" data-name="${x[0]}"><div class="emo">${x[1]}</div><b>${x[0]}</b></button>`
    ).join("");
    $$(".card").forEach(btn => btn.addEventListener("click", () => choose(btn.dataset.name)));
  }

  function newRound(){
    clearInterval(animationTimer);
    renderBaseGame();
    const stages = CYCLES[cycle];

    if(mode === "montar"){
      buildSlots(stages);
      buildBank(stages);
      $("#msg").textContent = "Toque nas fases na ordem correta.";
    }

    if(mode === "proxima"){
      const idx = Math.floor(Math.random() * (stages.length - 1));
      const current = stages[idx];
      const correct = stages[idx+1];
      $("#slots").innerHTML = `<div class="slot fill"><div><div class="emo">${current[1]}</div><b>${current[0]}</b></div></div><span class="arrow">→</span><div class="slot">?</div>`;
      const opts = [correct, ...stages.filter((_,i)=>i!==idx+1).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
      $("#bank").innerHTML = opts.map(x => `<button type="button" class="card" data-answer="${x[0]}"><div class="emo">${x[1]}</div><b>${x[0]}</b></button>`).join("");
      $$(".card").forEach(btn => btn.addEventListener("click", () => {
        if(btn.dataset.answer === correct[0]){
          score += 100;
          $("#score").textContent = score;
          $("#msg").textContent = `✅ Correto! Depois de ${current[0]} vem ${correct[0]}.`;
          speak("Muito bem. Resposta correta.");
          setTimeout(newRound, 1200);
        } else {
          $("#msg").textContent = "❌ Tente novamente.";
          speak("Tente novamente.");
        }
      }));
      $("#msg").textContent = `Qual fase vem depois de ${current[0]}?`;
    }

    if(mode === "faltando"){
      const missing = Math.floor(Math.random() * stages.length);
      $("#slots").innerHTML = stages.map((x,i) =>
        `<div class="slot ${i===missing?"":"fill"}" data-i="${i}">${i===missing?"?":`<div><div class="emo">${x[1]}</div><b>${x[0]}</b></div>`}</div>${i<stages.length-1?'<span class="arrow">→</span>':''}`
      ).join("");
      const correct = stages[missing];
      const opts = [correct, ...stages.filter((_,i)=>i!==missing).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
      $("#bank").innerHTML = opts.map(x=>`<button type="button" class="card" data-answer="${x[0]}"><div class="emo">${x[1]}</div><b>${x[0]}</b></button>`).join("");
      $$(".card").forEach(btn => btn.addEventListener("click", () => {
        if(btn.dataset.answer === correct[0]){
          score += 100;
          $("#score").textContent = score;
          $("#msg").textContent = `✅ A fase que faltava era ${correct[0]}.`;
          speak("Muito bem.");
          setTimeout(newRound,1200);
        } else {
          $("#msg").textContent = "❌ Essa não é a fase que falta.";
          speak("Tente novamente.");
        }
      }));
      $("#msg").textContent = "Qual fase está faltando no ciclo?";
    }

    if(mode === "comparar"){
      const names = Object.keys(CYCLES).filter(n => n !== cycle);
      const otherName = names[Math.floor(Math.random()*names.length)];
      const other = CYCLES[otherName];
      $("#slots").innerHTML = `
        <div class="slot fill"><div><b>${cycle}</b><div class="emo">${stages[stages.length-1][1]}</div><small>${stages.length} fases</small></div></div>
        <span class="arrow">↔</span>
        <div class="slot fill"><div><b>${otherName}</b><div class="emo">${other[other.length-1][1]}</div><small>${other.length} fases</small></div></div>`;
      $("#bank").innerHTML = `
        <button type="button" class="card" data-comp="metamorfose"><div class="emo">🔄</div><b>Transformação</b></button>
        <button type="button" class="card" data-comp="fases"><div class="emo">🔢</div><b>Número de fases</b></button>
        <button type="button" class="card" data-comp="inicio"><div class="emo">🌱</div><b>Como começa</b></button>`;
      $$(".card").forEach(btn=>btn.addEventListener("click",()=>{
        $("#msg").textContent = `🔎 Compare ${cycle} e ${otherName}: observe ${btn.textContent.trim().toLowerCase()}.`;
        speak($("#msg").textContent);
      }));
      $("#msg").textContent = `Compare o ciclo de ${cycle} com o de ${otherName}.`;
    }

    if(mode === "movimento"){
      buildSlots(stages);
      $("#bank").innerHTML = "";
      $("#msg").textContent = "Acompanhe a transformação fase por fase.";
      let i = 0;
      animationTimer = setInterval(() => {
        if(i >= stages.length){ clearInterval(animationTimer); return; }
        const x = stages[i];
        const slot = $(`.slot[data-i="${i}"]`);
        slot.classList.add("fill");
        slot.innerHTML = `<div><div class="emo">${x[1]}</div><b>${x[0]}</b></div>`;
        speak(x[0]);
        i++;
      }, 1400);
    }
  }

  function choose(name){
    if(choice.includes(name)) return;
    const stages = CYCLES[cycle];
    choice.push(name);
    const stage = stages.find(x => x[0] === name);
    const i = choice.length - 1;
    const slot = $(`.slot[data-i="${i}"]`);
    if(slot){
      slot.classList.add("fill");
      slot.innerHTML = `<div><div class="emo">${stage[1]}</div><b>${stage[0]}</b></div>`;
    }
    speak(stage[0]);
  }

  // Todos os cards agora abrem imediatamente a configuração.
  $$(".mode").forEach(btn => {
    btn.addEventListener("click", () => openSetup(btn.dataset.mode));
  });

  // CTA principal também funciona.
  $("#start").addEventListener("click", () => openSetup(mode));
  $("#back").addEventListener("click", () => view("home"));
  $("#go").addEventListener("click", () => { score = 0; newRound(); });

  $("#check").addEventListener("click", () => {
    if(mode !== "montar"){
      $("#msg").textContent = "Neste modo, responda usando os cards da atividade.";
      return;
    }
    const stages = CYCLES[cycle];
    const ok = choice.length === stages.length && choice.every((n,i)=>n===stages[i][0]);
    if(ok){
      score += 100;
      $("#score").textContent = score;
      $("#msg").textContent = "✅ Ciclo correto!";
      speak("Muito bem. Ciclo correto.");
      setTimeout(newRound,1200);
    } else {
      $("#msg").textContent = "❌ Observe a sequência e tente novamente.";
      speak("Observe a sequência e tente novamente.");
    }
  });

  $("#hint").addEventListener("click", () => {
    const stages = CYCLES[cycle];
    const i = Math.min(choice.length, stages.length-1);
    $("#msg").textContent = `💡 Observe a fase: ${stages[i][0]}.`;
    speak(`Dica. Observe ${stages[i][0]}.`);
  });

  $("#reset").addEventListener("click", newRound);
  $("#homeBtn").addEventListener("click", () => { clearInterval(animationTimer); view("home"); });

  $("#sound").addEventListener("click", () => {
    sound = !sound;
    $("#sound").textContent = sound ? "🔊" : "🔇";
    if(!sound && "speechSynthesis" in window) window.speechSynthesis.cancel();
  });

  $("#full").addEventListener("click", async () => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  });

  $("#help").addEventListener("click", () => {
    const t = "Escolha um modo, selecione um ciclo de vida e siga a atividade exibida na tela.";
    speak(t);
    alert(t);
  });

  selectMode("montar");
});
</script>
</main></div></body></html>
