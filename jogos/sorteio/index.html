<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/js/ambiente.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorteio e Desafios · Portal do Educador</title>
<meta name="theme-color" content="#071a2c">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --fundo:#071a2c; --fundo2:#0f2c4a; --carta:#fff; --tinta:#0f2c4a; --suave:#5b6b7c; --linha:#dbe4ee; --verde:#1a6b2a; --lima:#8fd14f; --tema:#E8590C; --perigo:#c92a2a; }
*{ box-sizing:border-box; margin:0; }
html{ font-size:clamp(14px, min(1.55vw, 2.75vh), 36px); height:100%; }
body{ height:100%; font-family:Fredoka, "Segoe UI", system-ui, sans-serif; color:#fff; background:radial-gradient(120% 90% at 50% 0%, #4a2a16 0%, var(--fundo) 70%); overflow:hidden; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; }
:focus-visible{ outline:.2rem solid #ffd43b; outline-offset:.12rem; }
.app{ height:100%; display:flex; flex-direction:column; gap:.6rem; padding:.6rem max(.6rem, env(safe-area-inset-right)) max(.6rem, env(safe-area-inset-bottom)) max(.6rem, env(safe-area-inset-left)); }
.topo{ display:flex; align-items:center; gap:.5rem; flex:none; }
.topo h1{ font-size:1.15rem; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ic{ width:2.7rem; height:2.7rem; border-radius:.8rem; background:rgba(255,255,255,.14); font-size:1.15rem; flex:none; }
.abas{ display:flex; gap:.4rem; flex:none; overflow-x:auto; scrollbar-width:none; }
.abas button{ flex:1 0 auto; padding:.6rem 1rem; border-radius:.9rem; background:rgba(255,255,255,.12); font-weight:600; font-size:1rem; white-space:nowrap; min-height:2.9rem; }
.abas button[aria-selected="true"]{ background:#fff; color:var(--tinta); }
.corpo{ flex:1; min-height:0; display:grid; grid-template-columns:1.15fr .85fr; gap:.6rem; }
.palco, .lado{ background:var(--carta); color:var(--tinta); border-radius:1.4rem; min-height:0; }
.palco{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; padding:1.2rem; text-align:center; position:relative; overflow:hidden; }
.rot{ font-size:.82rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
.saida{ font-weight:700; line-height:1.08; font-size:4.6rem; overflow-wrap:anywhere; max-width:100%; }
.saida.longa{ font-size:2.6rem; } .saida.texto{ font-size:2rem; line-height:1.2; } .saida.vazia{ font-size:1.5rem; font-weight:500; color:var(--suave); }
.saida.gira{ color:var(--suave); } .saida.pronto{ animation:pulo .45s; color:var(--tema); }
@keyframes pulo{ 0%{ transform:scale(.7); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
.bt{ border-radius:1rem; padding:.8rem 1.4rem; font-weight:700; font-size:1.25rem; background:var(--lima); color:#12330a; box-shadow:0 .3rem 0 #5d9a2b; min-height:3.2rem; }
.bt:active{ transform:translateY(.15rem); box-shadow:0 .15rem 0 #5d9a2b; }
.bt.sec{ background:#eef2f7; color:var(--tinta); box-shadow:0 .2rem 0 #c5d0dc; font-size:1rem; padding:.55rem .9rem; min-height:2.7rem; }
.bt.per{ background:#ffe3e3; color:var(--perigo); box-shadow:0 .2rem 0 #f3b1b1; font-size:1rem; padding:.55rem .9rem; min-height:2.7rem; }
.bt:disabled{ opacity:.5; cursor:default; }
.linha{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; justify-content:center; }
.conta{ font-size:.95rem; font-weight:600; color:var(--suave); }
.lado{ display:flex; flex-direction:column; gap:.6rem; padding:1rem; overflow:auto; }
.campo{ border:.13rem solid var(--linha); border-radius:.8rem; padding:.55rem .7rem; background:#fff; width:100%; min-height:2.7rem; font-size:1rem; }
textarea.campo{ min-height:5.2rem; resize:vertical; }
.num{ width:6.5rem; text-align:center; font-size:1.6rem; font-weight:700; }
.lista{ display:flex; flex-wrap:wrap; gap:.35rem; }
.lista span{ display:inline-flex; align-items:center; gap:.3rem; background:#eef2f7; border-radius:2rem; padding:.3rem .35rem .3rem .75rem; font-size:.95rem; font-weight:500; }
.lista span.foi{ opacity:.45; text-decoration:line-through; }
.lista button{ width:1.7rem; height:1.7rem; border-radius:50%; background:#dbe4ee; font-weight:700; line-height:1; }
.nota{ font-size:.82rem; color:var(--suave); line-height:1.3; }
.chave{ display:flex; align-items:center; gap:.5rem; font-weight:600; font-size:.95rem; cursor:pointer; }
.chave input{ width:1.3rem; height:1.3rem; accent-color:var(--verde); }
.grupos{ display:grid; grid-template-columns:repeat(auto-fit, minmax(11rem, 1fr)); gap:.5rem; width:100%; max-height:100%; overflow:auto; text-align:left; }
.grupos div{ border:.13rem solid var(--linha); border-radius:1rem; padding:.6rem .8rem; }
.grupos b{ display:block; color:var(--tema); margin-bottom:.2rem; }
.grupos li{ list-style:none; font-size:1.05rem; font-weight:500; }
.aviso{ font-size:.95rem; font-weight:600; color:var(--perigo); min-height:1.2em; }
[hidden]{ display:none !important; }
@media (orientation:portrait), (max-width:760px){ .corpo{ grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); } .saida{ font-size:3.2rem; } .saida.longa{ font-size:2rem; } .saida.texto{ font-size:1.5rem; } html{ font-size:clamp(14px, 4.2vw, 22px); } }
@media (prefers-reduced-motion:reduce){ .saida.pronto{ animation:none; } }
html.sem-anim .saida.pronto{ animation:none; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <button type="button" class="ic" data-a="voltar" aria-label="Voltar" title="Voltar">←</button>
    <h1><span aria-hidden="true">🎲</span> Sorteio e Desafios</h1>
    <button type="button" class="ic" data-a="som" aria-label="Som" title="Som" id="btSom">🔊</button>
    <button type="button" class="ic" data-a="cheia" aria-label="Tela cheia" title="Tela cheia">⛶</button>
  </header>
  <nav class="abas" role="tablist" aria-label="O que sortear">
    <button type="button" role="tab" data-aba="alunos" aria-selected="true">🙋 Aluno</button>
    <button type="button" role="tab" data-aba="grupos" aria-selected="false">👥 Grupos</button>
    <button type="button" role="tab" data-aba="numeros" aria-selected="false">🔢 Número</button>
    <button type="button" role="tab" data-aba="desafios" aria-selected="false">🎯 Desafio</button>
  </nav>
  <main class="corpo">
    <section class="palco" aria-live="polite">
      <div class="rot" id="rotulo">Quem vai ser?</div>
      <div class="saida vazia" id="saida">Toque em Sortear</div>
      <div class="grupos" id="grupos" hidden></div>
      <div class="linha"><button type="button" class="bt" data-a="sortear" id="btSortear">🎲 Sortear</button></div>
      <div class="conta" id="conta"></div>
    </section>
    <aside class="lado" id="lado"></aside>
  </main>
</div>
<script>
// Sorteio e Desafios (refeito em nov/2026). Ferramenta do professor, não é jogo avaliado: não registra resultado por habilidade.
// Sorteia aluno, divide a turma em grupos, sorteia número e sorteia desafio. Os nomes ficam só neste aparelho (localStorage),
// na mesma chave da versão anterior (pde_sorteio_dados), para quem já tinha turmas cadastradas não perder nada.
(function(){
  const $ = (s, r) => (r || document).querySelector(s), esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const EXEMPLOS = ["Conte algo que você aprendeu nesta semana", "Diga 3 palavras que começam com a letra A", "Faça 5 polichinelos", "Conte uma curiosidade sobre o Brasil", "Imite seu animal favorito", "Recite um trecho de poesia ou de música",
    "Conte qual livro você mais gosta e por quê", "Explique para a turma a última coisa que estudamos", "Faça uma pergunta sobre a aula para um colega", "Diga o nome de 3 estados do Brasil", "Conte de 2 em 2 até 20", "Dê um exemplo de atitude de respeito na escola"];
  const S = { aba:"alunos", turmas:[], turmaAtiva:null, desafios:[], semRepeticaoAluno:true, semRepeticaoDesafio:true, min:1, max:30, semRepNum:true, numFeitos:[], nGrupos:4, girando:false, som:true, confirma:false };
  try{ const d = JSON.parse(localStorage.getItem("pde_sorteio_dados") || "null");
    if(d){ S.turmas = Array.isArray(d.turmas) ? d.turmas : []; S.turmaAtiva = d.turmaAtiva || null; S.desafios = Array.isArray(d.desafios) ? d.desafios : [];
      if(typeof d.semRepeticaoAluno === "boolean") S.semRepeticaoAluno = d.semRepeticaoAluno; if(typeof d.semRepeticaoDesafio === "boolean") S.semRepeticaoDesafio = d.semRepeticaoDesafio; }
    S.som = localStorage.getItem("pde_jogo_som") !== "0"; if(localStorage.getItem("pde_a11y_animacoes") === "1") document.documentElement.classList.add("sem-anim");
  }catch(e){}
  const salvar = () => { try{ localStorage.setItem("pde_sorteio_dados", JSON.stringify({ turmas:S.turmas, turmaAtiva:S.turmaAtiva, desafios:S.desafios, semRepeticaoAluno:S.semRepeticaoAluno, semRepeticaoDesafio:S.semRepeticaoDesafio })); }catch(e){} };
  const turma = () => S.turmas.find(t => t.id === S.turmaAtiva) || S.turmas[0] || null;
  const sorteia = a => a[Math.floor(Math.random() * a.length)];
  const embaralha = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let actx = null;
  function bip(f, d){ if(!S.som) return; try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = f; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02); }catch(e){} }
  const ROT = { alunos:"Quem vai ser?", grupos:"Grupos da turma", numeros:"Número sorteado", desafios:"O desafio é..." };

  function lado(){
    const t = turma(), L = $("#lado"); let h = "";
    if(S.aba === "alunos" || S.aba === "grupos"){
      h += '<div class="rot">Turma</div><div class="linha" style="justify-content:flex-start">' +
        (S.turmas.length ? '<select class="campo" id="selTurma" style="flex:1 1 9rem;width:auto" aria-label="Turma">' + S.turmas.map(x => '<option value="' + esc(x.id) + '"' + (t && x.id === t.id ? " selected" : "") + ">" + esc(x.nome) + " (" + x.alunos.length + ")</option>").join("") + "</select>" : "") +
        '<input class="campo" id="novaTurma" placeholder="Nome da nova turma" maxlength="40" style="flex:1 1 9rem;width:auto" aria-label="Nome da nova turma"><button type="button" class="bt sec" data-a="criarTurma">+ Criar</button></div>';
      if(t){
        h += '<div class="rot">Alunos de ' + esc(t.nome) + '</div><textarea class="campo" id="nomes" placeholder="Cole ou digite os nomes, um por linha" aria-label="Nomes dos alunos, um por linha"></textarea>' +
          '<div class="linha" style="justify-content:flex-start"><button type="button" class="bt sec" data-a="addNomes">+ Adicionar nomes</button>' +
          (S.aba === "alunos" ? '<button type="button" class="bt sec" data-a="reiniciar">↻ Reiniciar fila</button>' : "") +
          '<button type="button" class="bt per" data-a="excluirTurma">' + (S.confirma ? "Confirmar exclusão" : "Excluir turma") + "</button></div>" +
          '<div class="lista">' + t.alunos.map((a, i) => '<span class="' + (a.sorteado && S.aba === "alunos" ? "foi" : "") + '">' + esc(a.nome) + '<button type="button" data-rem="' + i + '" aria-label="Remover ' + esc(a.nome) + '">×</button></span>').join("") + "</div>";
        if(S.aba === "alunos") h += '<label class="chave"><input type="checkbox" id="semRep"' + (S.semRepeticaoAluno ? " checked" : "") + "> Não repetir até todos serem sorteados</label>";
        else h += '<div class="rot">Quantos grupos</div><div class="linha" style="justify-content:flex-start"><input class="campo num" id="nGrupos" type="number" min="2" max="15" value="' + S.nGrupos + '" aria-label="Quantidade de grupos"></div>';
      }else h += '<p class="nota">Crie uma turma para começar.</p>';
      h += '<p class="nota">🔒 Os nomes ficam salvos só neste aparelho. Nada é enviado para a internet.</p>';
    }else if(S.aba === "numeros"){
      h += '<div class="rot">Intervalo</div><div class="linha" style="justify-content:flex-start"><span>De</span><input class="campo num" id="nMin" type="number" value="' + S.min + '" aria-label="Número inicial"><span>até</span><input class="campo num" id="nMax" type="number" value="' + S.max + '" aria-label="Número final"></div>' +
        '<label class="chave"><input type="checkbox" id="semRep"' + (S.semRepNum ? " checked" : "") + '> Não repetir números</label><div class="linha" style="justify-content:flex-start"><button type="button" class="bt sec" data-a="reiniciar">↻ Reiniciar</button></div>' +
        (S.numFeitos.length ? '<div class="rot">Já saíram</div><div class="lista">' + S.numFeitos.map(n => "<span style=\"padding-right:.75rem\">" + n + "</span>").join("") + "</div>" : "") +
        '<p class="nota">Dica: use o número da chamada para sortear sem cadastrar nomes.</p>';
    }else{
      h += '<div class="rot">Desafios</div><textarea class="campo" id="nomes" placeholder="Escreva os desafios, um por linha" aria-label="Desafios, um por linha"></textarea>' +
        '<div class="linha" style="justify-content:flex-start"><button type="button" class="bt sec" data-a="addNomes">+ Adicionar</button><button type="button" class="bt sec" data-a="exemplos">📚 Usar exemplos</button><button type="button" class="bt sec" data-a="reiniciar">↻ Reiniciar fila</button></div>' +
        '<div class="lista">' + S.desafios.map((d, i) => '<span class="' + (d.sorteado ? "foi" : "") + '">' + esc(d.texto) + '<button type="button" data-rem="' + i + '" aria-label="Remover desafio">×</button></span>').join("") + "</div>" +
        '<label class="chave"><input type="checkbox" id="semRep"' + (S.semRepeticaoDesafio ? " checked" : "") + "> Não repetir até todos saírem</label>";
    }
    L.innerHTML = h + '<div class="aviso" id="aviso" role="status"></div>'; conta();
  }
  function conta(){
    const t = turma(), c = $("#conta"); let x = "";
    if(S.aba === "alunos" && t && t.alunos.length) x = t.alunos.filter(a => a.sorteado).length + " de " + t.alunos.length + " já sorteados";
    else if(S.aba === "desafios" && S.desafios.length) x = S.desafios.filter(d => d.sorteado).length + " de " + S.desafios.length + " já saíram";
    else if(S.aba === "numeros" && S.semRepNum) x = S.numFeitos.length + " de " + Math.max(0, S.max - S.min + 1) + " já saíram";
    c.textContent = x;
  }
  const aviso = m => { const a = $("#aviso"); if(a) a.textContent = m || ""; };
  function mostra(txt, classe){ const s = $("#saida"); s.hidden = false; $("#grupos").hidden = true; s.className = "saida " + (classe || ""); s.textContent = txt; }
  function limpaPalco(){ $("#rotulo").textContent = ROT[S.aba]; $("#btSortear").textContent = S.aba === "grupos" ? "👥 Formar grupos" : "🎲 Sortear"; mostra(S.aba === "grupos" ? "Toque em Formar grupos" : "Toque em Sortear", "vazia"); }
  const classe = t => String(t).length > 34 ? "texto" : String(t).length > 12 ? "longa" : "";
  // roleta: passa rápido por várias opções e para na sorteada
  function girar(opcoes, final, depois){
    S.girando = true; $("#btSortear").disabled = true; let n = 0; const total = document.documentElement.classList.contains("sem-anim") || matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : 14;
    (function passo(){ if(n++ < total){ const o = sorteia(opcoes); mostra(o, "gira " + classe(o)); bip(420 + n * 18, .05); setTimeout(passo, 55 + n * 9); }
      else{ mostra(final, "pronto " + classe(final)); bip(880, .25); S.girando = false; $("#btSortear").disabled = false; depois(); } })();
  }
  function sortear(){
    if(S.girando) return; aviso("");
    if(S.aba === "alunos"){
      const t = turma(); if(!t || !t.alunos.length) return aviso("Cadastre os alunos da turma primeiro.");
      let livres = S.semRepeticaoAluno ? t.alunos.filter(a => !a.sorteado) : t.alunos;
      if(!livres.length){ t.alunos.forEach(a => a.sorteado = false); livres = t.alunos; aviso("Todos já foram sorteados. A fila recomeçou."); }
      const e = sorteia(livres); girar(t.alunos.map(a => a.nome), e.nome, () => { e.sorteado = true; salvar(); lado(); });
    }else if(S.aba === "grupos"){
      const t = turma(); if(!t || t.alunos.length < 2) return aviso("Cadastre pelo menos 2 alunos na turma.");
      const n = Math.max(2, Math.min(S.nGrupos, t.alunos.length)), gs = Array.from({ length:n }, () => []); embaralha(t.alunos).forEach((a, i) => gs[i % n].push(a.nome));
      $("#saida").hidden = true; const g = $("#grupos"); g.hidden = false; g.innerHTML = gs.map((x, i) => "<div><b>Grupo " + (i + 1) + "</b>" + x.map(nm => "<li>" + esc(nm) + "</li>").join("") + "</div>").join(""); bip(880, .25);
    }else if(S.aba === "numeros"){
      const a = Math.min(S.min, S.max), b = Math.max(S.min, S.max); if(b - a > 9999) return aviso("Use um intervalo de até 10.000 números.");
      let op = []; for(let i = a; i <= b; i++) if(!S.semRepNum || !S.numFeitos.includes(i)) op.push(i);
      if(!op.length){ S.numFeitos = []; for(let i = a; i <= b; i++) op.push(i); aviso("Todos os números já saíram. Recomeçou."); }
      const e = sorteia(op); girar(op.length > 1 ? op : [e], e, () => { if(S.semRepNum) S.numFeitos.push(e); lado(); });
    }else{
      if(!S.desafios.length) return aviso("Cadastre desafios ou toque em Usar exemplos.");
      let livres = S.semRepeticaoDesafio ? S.desafios.filter(d => !d.sorteado) : S.desafios;
      if(!livres.length){ S.desafios.forEach(d => d.sorteado = false); livres = S.desafios; aviso("Todos já saíram. A fila recomeçou."); }
      const e = sorteia(livres); girar(S.desafios.map(d => d.texto), e.texto, () => { e.sorteado = true; salvar(); lado(); });
    }
  }
  const linhas = () => { const c = $("#nomes"); return c ? c.value.split(/\n|;/).map(x => x.replace(/\s+/g, " ").trim().slice(0, 120)).filter(Boolean) : []; };
  document.addEventListener("click", e => {
    const t = e.target, ab = t.closest("[data-aba]");
    if(ab){ if(S.girando) return; S.aba = ab.dataset.aba; S.confirma = false; document.querySelectorAll("[data-aba]").forEach(b => b.setAttribute("aria-selected", b === ab ? "true" : "false")); limpaPalco(); lado(); return; }
    const rm = t.closest("[data-rem]");
    if(rm){ const i = +rm.dataset.rem; if(S.aba === "desafios") S.desafios.splice(i, 1); else{ const tm = turma(); if(tm) tm.alunos.splice(i, 1); } salvar(); lado(); return; }
    const b = t.closest("[data-a]"); if(!b) return; const a = b.dataset.a;
    if(a !== "excluirTurma" && S.confirma){ S.confirma = false; }
    if(a === "sortear") sortear();
    else if(a === "criarTurma"){ const n = ($("#novaTurma").value || "").replace(/\s+/g, " ").trim(); if(!n) return aviso("Escreva o nome da turma.");
      const nova = { id:"t" + Date.now().toString(36), nome:n.slice(0, 40), alunos:[] }; S.turmas.push(nova); S.turmaAtiva = nova.id; salvar(); lado(); }
    else if(a === "addNomes"){ const ls = linhas(); if(!ls.length) return aviso("Escreva pelo menos uma linha.");
      if(S.aba === "desafios") ls.forEach(x => { if(!S.desafios.some(d => d.texto === x)) S.desafios.push({ texto:x, sorteado:false }); });
      else{ const tm = turma(); if(!tm) return; ls.forEach(x => tm.alunos.push({ nome:x.slice(0, 60), sorteado:false })); }
      salvar(); lado(); }
    else if(a === "exemplos"){ EXEMPLOS.forEach(x => { if(!S.desafios.some(d => d.texto === x)) S.desafios.push({ texto:x, sorteado:false }); }); salvar(); lado(); }
    else if(a === "reiniciar"){ if(S.aba === "numeros") S.numFeitos = []; else if(S.aba === "desafios") S.desafios.forEach(d => d.sorteado = false); else{ const tm = turma(); if(tm) tm.alunos.forEach(x => x.sorteado = false); } salvar(); limpaPalco(); lado(); }
    else if(a === "excluirTurma"){ const tm = turma(); if(!tm) return;
      if(!S.confirma){ S.confirma = true; lado(); aviso("Toque de novo para excluir a turma " + tm.nome + " e todos os nomes dela."); return; }
      S.confirma = false; S.turmas = S.turmas.filter(x => x !== tm); S.turmaAtiva = S.turmas[0] ? S.turmas[0].id : null; salvar(); limpaPalco(); lado(); }
    else if(a === "som"){ S.som = !S.som; try{ localStorage.setItem("pde_jogo_som", S.som ? "1" : "0"); }catch(e){} $("#btSom").textContent = S.som ? "🔊" : "🔇"; }
    else if(a === "cheia"){ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }
    else if(a === "voltar"){ if(window.self !== window.top) window.parent.postMessage({ tipo:"pde-jogo-fechar" }, location.origin); else if(history.length > 1) history.back(); else location.href = "/entrar/"; }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if(t.id === "selTurma"){ S.turmaAtiva = t.value; S.confirma = false; salvar(); limpaPalco(); lado(); }
    else if(t.id === "semRep"){ if(S.aba === "alunos") S.semRepeticaoAluno = t.checked; else if(S.aba === "desafios") S.semRepeticaoDesafio = t.checked; else S.semRepNum = t.checked; salvar(); conta(); }
    else if(t.id === "nMin" || t.id === "nMax"){ const v = Math.round(Number(t.value)); if(Number.isFinite(v)){ S[t.id === "nMin" ? "min" : "max"] = Math.max(-99999, Math.min(99999, v)); S.numFeitos = []; conta(); } }
    else if(t.id === "nGrupos"){ const v = Math.round(Number(t.value)); if(Number.isFinite(v)) S.nGrupos = Math.max(2, Math.min(15, v)); }
  });
  document.addEventListener("keydown", e => { if((e.key === " " || e.key === "Enter") && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){ e.preventDefault(); sortear(); } });
  $("#btSom").textContent = S.som ? "🔊" : "🔇"; limpaPalco(); lado();
})();
</script>
</body>
</html>
