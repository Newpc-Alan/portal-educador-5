<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="/assets/js/ambiente.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mouse e Teclado · Portal do Educador</title>
<meta name="theme-color" content="#071a2c">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/jogos/pde-jogo.css?v=4">
<style>
.mt-alvo{ position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; border-radius:50%; background:#fff; box-shadow:0 .25rem 0 rgba(0,0,0,.28); line-height:1; cursor:pointer; padding:0; border:0; }
.mt-alvo.errou{ animation:mtTreme .3s; background:#ffe3e3; }
.mt-alvo.meio{ box-shadow:0 0 0 .3rem #ffd43b; }
.mt-alvo.pega{ cursor:grab; z-index:3; touch-action:none; }
.mt-alvo.pega.indo{ cursor:grabbing; box-shadow:0 .7rem 1.2rem rgba(0,0,0,.4); }
@keyframes mtTreme{ 25%{ margin-left:-.4rem; } 75%{ margin-left:.4rem; } }
.mt-caixas{ position:absolute; left:0; right:0; bottom:0; height:42%; display:flex; gap:.5rem; padding:.5rem; }
.mt-caixa{ flex:1; border-radius:1rem; border:.2rem dashed rgba(255,255,255,.7); background:rgba(255,255,255,.14); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.2rem; color:#fff; font-weight:700; font-size:1.15rem; text-align:center; }
.mt-caixa span{ font-size:2.2rem; line-height:1; }
.mt-caixa.sobre{ background:rgba(255,255,255,.34); border-style:solid; }
.mt-tecla{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; padding:.8rem; color:#fff; text-align:center; }
.mt-cap{ min-width:6rem; padding:.9rem 1.4rem; border-radius:1rem; background:#fff; color:#0f2c4a; font-size:4rem; font-weight:700; line-height:1; box-shadow:0 .45rem 0 rgba(0,0,0,.3); }
.mt-pal{ display:flex; gap:.35rem; flex-wrap:wrap; justify-content:center; }
.mt-pal b{ width:3.4rem; height:4rem; display:flex; align-items:center; justify-content:center; border-radius:.7rem; background:rgba(255,255,255,.2); border:.13rem solid rgba(255,255,255,.5); font-size:2.3rem; }
.mt-pal b.ok{ background:#2f9e44; border-color:#2f9e44; }
.mt-pal b.vez{ background:#fff; color:#0f2c4a; }
.mt-tecla small{ font-size:1rem; font-weight:600; opacity:.9; }
.mt-tecla.errou .mt-cap, .mt-tecla.errou .mt-pal b.vez{ animation:mtTreme .3s; background:#ffe3e3; }
</style>
</head>
<body>
<script src="/assets/jogos/pde-jogo.js?v=4"></script>
<script>
// Mouse e Teclado (reformulado em nov/2026 no Motor de Jogos, modo de prática livre). Progressão motora:
//   1) clicar em alvos grandes; 2) clicar em alvos pequenos, com mais distrações; 3) clique duplo;
//   4) arrastar e soltar no lugar certo; 5) achar letras no teclado; 6) digitar palavras.
// Clicar no fundo vazio não conta como erro: só conta clicar no alvo errado ou apertar a tecla errada.
// Habilidades: rótulos descritivos. Os códigos da BNCC Computação entram depois da conferência com o documento oficial.
(function(){
  const { sorteia, embaralha } = PDEJogo;
  const COISAS = [["🍎", "a maçã"], ["⭐", "a estrela"], ["⚽", "a bola"], ["🐶", "o cachorro"], ["🚗", "o carro"], ["🌻", "a flor"], ["🐟", "o peixe"], ["🎈", "o balão"], ["🍌", "a banana"], ["🦋", "a borboleta"], ["🏠", "a casa"], ["🐱", "o gato"]];
  const GRUPOS = [
    { caixas:[["🧺", "Frutas"], ["🐾", "Animais"]], itens:[["🍎", 0], ["🍌", 0], ["🍇", 0], ["🍓", 0], ["🐶", 1], ["🐱", 1], ["🐟", 1], ["🐦", 1]] },
    { caixas:[["🚦", "Transportes"], ["🍽️", "Comidas"]], itens:[["🚗", 0], ["🚌", 0], ["🚲", 0], ["✈️", 0], ["🍞", 1], ["🧀", 1], ["🍚", 1], ["🥕", 1]] },
    { caixas:[["🌊", "Vive na água"], ["🌳", "Vive na terra"]], itens:[["🐟", 0], ["🐙", 0], ["🐬", 0], ["🦀", 0], ["🐘", 1], ["🐒", 1], ["🐄", 1], ["🐜", 1]] }
  ];
  const PALAVRAS = [["SOL", "☀️"], ["LUA", "🌙"], ["PATO", "🦆"], ["BOLA", "⚽"], ["GATO", "🐱"], ["CASA", "🏠"], ["DADO", "🎲"], ["FOCA", "🦭"], ["MALA", "🧳"], ["SAPO", "🐸"], ["LIVRO", "📖"], ["PEIXE", "🐟"], ["ESCOLA", "🏫"], ["AMIGO", "🤝"]];
  // posições em grade, com um pequeno desvio, para os alvos não se sobreporem
  function lugares(n, col, lin){
    const c = []; for(let i = 0; i < col * lin; i++) c.push(i);
    return embaralha(c).slice(0, n).map(i => ({ x:((i % col) + .5) / col * 100 + (Math.random() * 4 - 2), y:(Math.floor(i / col) + .5) / lin * 100 + (Math.random() * 4 - 2) }));
  }
  function alvo(emoji, p, tam){ const b = document.createElement("button"); b.type = "button"; b.className = "mt-alvo"; b.textContent = emoji; b.style.cssText = "left:" + p.x + "%;top:" + p.y + "%;width:" + tam + "rem;height:" + tam + "rem;font-size:" + tam * .58 + "rem"; return b; }
  const em = t => (t[0] === "a" ? "na" : "no") + t.slice(1);
  // o alvo nunca passa de 78% da casa da grade: em tela pequena ele encolhe em vez de encostar no vizinho
  const cabe = (area, tam, col, lin) => { const r = area.getBoundingClientRect(), rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; return Math.min(tam, r.width / col * .78 / rem, r.height / lin * .78 / rem); };
  const treme = el => { el.classList.remove("errou"); void el.offsetWidth; el.classList.add("errou"); };

  function clicar(nivel){
    const n = nivel === 0 ? 4 : 8, tam = nivel === 0 ? 5.2 : 3.2, esc = embaralha(COISAS).slice(0, n), certo = esc[0];
    return { chave:"c" + nivel + certo[0], hab:nivel === 0 ? "Mouse: apontar e clicar" : "Mouse: clique com precisão", rotulo:"Clicar " + em(certo[1]), pergunta:"Clique " + em(certo[1]) + ".", texto:true, fala:"Clique " + em(certo[1]), tipo:"livre", resposta:1,
      apoio:el => { el.innerHTML = '<div class="pj-emoji" aria-hidden="true">' + certo[0] + "</div>"; },
      montar(area, api){ const lin = nivel === 0 ? 2 : 3, ps = lugares(n, 4, lin), t = cabe(area, tam, 4, lin);
        embaralha(esc).forEach((c, i) => { const b = alvo(c[0], ps[i], t); b.setAttribute("aria-label", c[1]);
          b.addEventListener("click", () => { if(api.travado()) return; if(c === certo) api.certo(); else{ treme(b); api.errado(); } }); area.appendChild(b); }); },
      dica:"Leve a setinha do mouse até a figura igual à do quadro branco e aperte o botão esquerdo uma vez.",
      explicacao:() => "Procure com calma a figura " + certo[0] + ". Mova o mouse devagar até a setinha ficar em cima dela e só então clique.", fechamento:"Você clicou " + em(certo[1]) + "." };
  }
  function duplo(){
    const esc = embaralha(COISAS).slice(0, 4), certo = esc[0];
    return { chave:"d" + certo[0], hab:"Mouse: clique duplo", rotulo:"Clique duplo " + em(certo[1]), pergunta:"Dê dois cliques rápidos " + em(certo[1]) + ".", texto:true, fala:"Dê dois cliques rápidos " + em(certo[1]), tipo:"livre", resposta:1,
      apoio:el => { el.innerHTML = '<div class="pj-emoji" aria-hidden="true">' + certo[0] + "</div>"; },
      montar(area, api){ const ps = lugares(4, 4, 2), t = cabe(area, 4.6, 4, 2); let ultimo = 0, quem = null, tm = 0;
        embaralha(esc).forEach((c, i) => { const b = alvo(c[0], ps[i], t); b.setAttribute("aria-label", c[1]);
          b.addEventListener("click", () => { if(api.travado()) return; const agora = Date.now();
            if(c !== certo){ treme(b); api.errado(); return; }
            if(quem === b && agora - ultimo < 600){ clearTimeout(tm); b.classList.remove("meio"); api.certo(); return; }
            ultimo = agora; quem = b; b.classList.add("meio"); clearTimeout(tm);
            tm = setTimeout(() => { b.classList.remove("meio"); quem = null; if(!api.travado()){ treme(b); api.errado(); } }, 650); });
          area.appendChild(b); }); },
      dica:"Um clique só não abre. Aperte o botão duas vezes seguidas, bem rápido, sem mexer o mouse: clique, clique.",
      explicacao:() => "O clique duplo são dois toques rápidos no botão esquerdo, com o mouse parado. Se demorar entre um e outro, o computador entende como dois cliques separados.", fechamento:"Clique duplo feito." };
  }
  function arrastar(){
    const g = sorteia(GRUPOS), it = sorteia(g.itens), cx = g.caixas[it[1]];
    return { chave:"a" + it[0], hab:"Mouse: arrastar e soltar", rotulo:"Arrastar " + it[0] + " para " + cx[1], pergunta:"Arraste a figura até a caixa certa.", texto:true, fala:"Arraste a figura até a caixa certa", tipo:"livre", resposta:1,
      apoio:el => { el.innerHTML = '<div class="pj-emoji" aria-hidden="true">' + it[0] + "</div>"; },
      montar(area, api){
        const cs = document.createElement("div"); cs.className = "mt-caixas";
        cs.innerHTML = g.caixas.map((c, i) => '<div class="mt-caixa" data-c="' + i + '"><span aria-hidden="true">' + c[0] + "</span>" + c[1] + "</div>").join(""); area.appendChild(cs);
        const b = alvo(it[0], { x:50, y:27 }, 4.6); b.classList.add("pega"); b.setAttribute("aria-label", "Figura para arrastar"); area.appendChild(b);
        let ativo = false, dx = 0, dy = 0;
        const sobre = (x, y) => [...cs.children].find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
        const volta = () => { b.style.left = "50%"; b.style.top = "27%"; };
        b.addEventListener("pointerdown", e => { if(api.travado()) return; ativo = true; b.setPointerCapture(e.pointerId); b.classList.add("indo"); const r = b.getBoundingClientRect(); dx = e.clientX - (r.left + r.width / 2); dy = e.clientY - (r.top + r.height / 2); e.preventDefault(); });
        b.addEventListener("pointermove", e => { if(!ativo) return; const a = area.getBoundingClientRect(); b.style.left = Math.max(0, Math.min(a.width, e.clientX - dx - a.left)) + "px"; b.style.top = Math.max(0, Math.min(a.height, e.clientY - dy - a.top)) + "px";
          const s = sobre(e.clientX, e.clientY); [...cs.children].forEach(c => c.classList.toggle("sobre", c === s)); });
        const solta = e => { if(!ativo) return; ativo = false; b.classList.remove("indo"); const s = sobre(e.clientX, e.clientY); [...cs.children].forEach(c => c.classList.remove("sobre"));
          if(!s){ volta(); return; }                        // soltou fora das caixas: não conta como erro, só volta
          if(+s.dataset.c === it[1]){ b.style.pointerEvents = "none"; api.certo(); } else{ volta(); treme(b); api.errado(); } };
        b.addEventListener("pointerup", solta); b.addEventListener("pointercancel", () => { ativo = false; b.classList.remove("indo"); volta(); });
      },
      dica:"Aperte o botão do mouse em cima da figura e NÃO solte. Leve até a caixa e só então solte o botão.",
      explicacao:() => it[0] + " vai na caixa <b>" + cx[1] + "</b>. Para arrastar: aperte, segure, leve e solte.", fechamento:"Na caixa " + cx[1] + "." };
  }
  function letra(){
    const L = sorteia("ASDFJKLEIOUMNRTPBCG".split(""));
    return { chave:"l" + L, hab:"Teclado: localizar letras", rotulo:"Tecla " + L, pergunta:"Aperte no teclado a letra que aparece.", texto:true, fala:"Aperte a letra " + L, tipo:"livre", resposta:1,
      montar(area){ area.innerHTML = '<div class="mt-tecla"><div class="mt-cap">' + L + "</div><small>Este nível precisa de um teclado.</small></div>"; },
      tecla(e, api){ if(api.travado() || e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return; e.preventDefault();
        if(e.key.toUpperCase() === L) api.certo(); else{ const t = document.querySelector(".mt-tecla"); if(t) treme(t); api.errado(); } },
      dica:"Procure a letra " + L + " no teclado com os olhos primeiro. Depois aperte só essa tecla, uma vez.",
      explicacao:() => "A letra <b>" + L + "</b> fica " + ("QWERTYUIOP".includes(L) ? "na fileira de cima" : "ASDFGHJKL".includes(L) ? "na fileira do meio" : "na fileira de baixo") + " das letras do teclado.", fechamento:"Você achou a letra " + L + "." };
  }
  function palavra(){
    const p = sorteia(PALAVRAS), W = p[0]; let pos = 0;
    const pinta = () => { const t = document.querySelector(".mt-pal"); if(t) [...t.children].forEach((b, i) => { b.className = i < pos ? "ok" : i === pos ? "vez" : ""; }); };
    return { chave:"p" + W, hab:"Teclado: digitar palavras", rotulo:"Digitar " + W, pergunta:"Digite a palavra, uma letra de cada vez.", texto:true, fala:"Digite a palavra " + W.toLowerCase(), tipo:"livre", resposta:1,
      apoio:el => { el.innerHTML = '<div class="pj-emoji" aria-hidden="true">' + p[1] + "</div>"; },
      montar(area){ pos = 0; area.innerHTML = '<div class="mt-tecla"><div class="mt-pal">' + W.split("").map(c => "<b>" + c + "</b>").join("") + "</div><small>Este nível precisa de um teclado.</small></div>"; pinta(); },
      tecla(e, api){ if(api.travado() || e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return; e.preventDefault();
        if(e.key.toUpperCase() === W[pos]){ pos++; pinta(); if(pos >= W.length) api.certo(); else api.som.toque(); }
        else{ const t = document.querySelector(".mt-tecla"); if(t) treme(t); api.errado(); } },
      dica:() => "A próxima letra é " + W[pos] + ". Ache essa tecla com os olhos e aperte uma vez.",
      explicacao:() => "A palavra é <b>" + W + "</b>. Digite devagar, letra por letra: " + W.split("").join(", ") + ".", fechamento:"Você digitou " + W + "." };
  }
  PDEJogo.criar({
    id:"mouse-e-teclado", titulo:"Mouse e Teclado", emoji:"🖱️", tema:["#5F3DC4", "#9775FA"], rodada:8,
    selo:"Computação · 1º ao 5º ano",
    descricao:"Treine clicar, dar clique duplo, arrastar e digitar. Um passo de cada vez, sem relógio.",
    habilidades:{
      "Mouse: apontar e clicar":"levar o ponteiro até o alvo e clicar",
      "Mouse: clique com precisão":"alvos menores e mais distrações",
      "Mouse: clique duplo":"dois cliques rápidos com o mouse parado",
      "Mouse: arrastar e soltar":"apertar, segurar, levar e soltar",
      "Teclado: localizar letras":"encontrar a tecla de cada letra",
      "Teclado: digitar palavras":"digitar letra por letra, na ordem"
    },
    niveis:[
      { nome:"Clicar", sub:"alvos grandes", hab:"Mouse: apontar e clicar" },
      { nome:"Clique preciso", sub:"alvos pequenos", hab:"Mouse: clique com precisão" },
      { nome:"Clique duplo", sub:"dois cliques rápidos", hab:"Mouse: clique duplo" },
      { nome:"Arrastar", sub:"levar até a caixa certa", hab:"Mouse: arrastar e soltar" },
      { nome:"Letras", sub:"achar a tecla", hab:"Teclado: localizar letras" },
      { nome:"Palavras", sub:"digitar letra por letra", hab:"Teclado: digitar palavras" }
    ],
    ajuda:[
      "Níveis 1 a 4: use o mouse (ou o dedo, na tela de toque). Clicar no fundo vazio não conta como erro.",
      "Níveis 5 e 6: use o teclado. Em celular e tablet sem teclado, fique nos níveis 1 a 4.",
      "Para o professor: o resultado mostra em qual movimento o aluno tem mais dificuldade (clicar, clique duplo, arrastar ou digitar)."
    ],
    gerar(c){ return [() => clicar(0), () => clicar(1), duplo, arrastar, letra, palavra][c.nivel](); }
  });
})();
</script>
</body>
</html>
