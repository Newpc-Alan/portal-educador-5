<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca · Portal do Educador</title>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#071621; --escuro-2:#0c2338; --azul:#2671AB; --azul-2:#2E9BD6; --lima:#8DC63F; --verde:#5A9420;
  --bg:#f4f7fa; --ink:#0c2338; --ink-2:#2C3E55; --muted:#6b7c90; --line:#dce4ed; --surface:#fff;
  --red:#C2362C; --amber:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.app{max-width:1280px;margin:0 auto;padding:0 16px 60px}
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 16px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;
  background:radial-gradient(600px 200px at 0% 0%,rgba(46,155,214,.35),transparent 60%),linear-gradient(135deg,#071621,#123556);
  box-shadow:0 14px 30px -20px rgba(7,22,33,.8);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem;letter-spacing:-.01em}
.marca span{display:block;font-size:.76rem;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo-acoes{display:flex;gap:6px;flex-wrap:wrap}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.on{background:#fff;color:var(--escuro-2);border-color:#fff}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}
.tb .n{background:var(--amber);color:#fff;border-radius:99px;font-size:.66rem;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.86rem;white-space:nowrap;line-height:1.2;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--azul);color:#fff}.btn-pri:hover{background:#1f5f91}
.btn-ok{background:var(--verde);color:#fff}.btn-ok:hover{background:#4a7c19}
.btn-gh{background:#fff;color:var(--ink);border-color:var(--line)}.btn-gh:hover{border-color:#b8c6d6}
.btn-red{background:#fff;color:var(--red);border-color:#efc9c5}
.btn-sm{padding:7px 11px;font-size:.78rem;border-radius:8px}
.destaque{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:16px;margin-bottom:14px;color:#fff;
  background:radial-gradient(500px 180px at 0% 0%,rgba(141,198,63,.28),transparent 60%),linear-gradient(135deg,#0c2338,#1b4a74)}
.destaque-ico{font-size:34px}.destaque-txt{flex:1;min-width:220px}.destaque-txt b{font-size:1.08rem;display:block}.destaque-txt span{font-size:.86rem;color:rgba(255,255,255,.8)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--muted);font-size:.86rem}
.secoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.secao{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.secao .e{font-size:26px}.secao b{display:block;font-size:.9rem}.secao small{font-size:.74rem;color:var(--muted)}
.secao.on{border-color:var(--azul-2);background:#eef6fc;box-shadow:0 0 0 3px rgba(46,155,214,.15)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filtros input,.filtros select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:.86rem}
.filtros input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.contagem{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.livro{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;padding:0}
.livro:hover{transform:translateY(-2px);box-shadow:0 12px 24px -18px rgba(15,44,74,.6)}
.capa{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#0c2338,#2671AB);display:grid;place-items:center;color:#fff;font-size:42px}
.capa img{width:100%;height:100%;object-fit:cover}
.capa .tipo{position:absolute;left:8px;top:8px;font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(7,22,33,.78);color:#fff;border-radius:999px;padding:2px 8px}
.capa .prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.5)}.capa .prog i{display:block;height:100%;background:var(--lima)}
.fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:14px;line-height:1}
.livro-t{padding:9px 10px 11px}
.livro-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.84rem;line-height:1.3}
.livro-t small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mais-wrap{text-align:center;margin:18px 0}
.vazio{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem;grid-column:1/-1}
.carregando{padding:60px 10px;text-align:center;color:var(--muted)}
.giro{width:34px;height:34px;border:4px solid #dce4ed;border-top-color:var(--azul);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}

/* leitor */
.leitor{position:fixed;inset:0;z-index:80;background:#1b2632;display:flex;flex-direction:column}
.l-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;color:#fff;background:linear-gradient(135deg,#071621,#123556)}
.l-topo .tit{flex:1;min-width:120px;font-weight:800;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-topo .tit small{display:block;font-weight:600;font-size:.68rem;color:var(--lima);letter-spacing:.06em;text-transform:uppercase}
.l-area{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;touch-action:pan-y pinch-zoom}
.l-area canvas,.l-area img{max-height:100%;max-width:100%;background:#fff;box-shadow:0 14px 40px -18px rgba(0,0,0,.8);border-radius:3px}
.l-area.zoom canvas,.l-area.zoom img{max-height:none;max-width:none}
.l-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:22px;font-weight:800;z-index:3;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.l-nav.ant{left:12px}.l-nav.prox{right:12px}
.l-baixo{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0c2338;color:#fff;font-size:.8rem}
.l-baixo input[type=range]{flex:1;accent-color:var(--lima)}
.l-ocupado{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;background:rgba(27,38,50,.7);z-index:4}
/* audio */
.player{flex:1;display:grid;place-items:center;padding:20px;color:#fff}
.player-caixa{width:100%;max-width:520px;text-align:center}
.player-capa{width:220px;height:220px;margin:0 auto 18px;border-radius:22px;background:radial-gradient(240px 160px at 20% 10%,rgba(141,198,63,.35),transparent 60%),linear-gradient(135deg,#0c2338,#2671AB);display:grid;place-items:center;font-size:84px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.player-capa.tocando{animation:pulsa 2.4s ease-in-out infinite}@keyframes pulsa{50%{transform:scale(1.03)}}
.player h3{font-size:1.15rem;margin-bottom:4px}.player p{color:rgba(255,255,255,.7);font-size:.84rem;margin-bottom:18px}
.p-barra{display:flex;align-items:center;gap:10px;font-size:.76rem;color:rgba(255,255,255,.75)}
.p-barra input{flex:1;accent-color:var(--lima)}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.p-ctrl button{border:0;border-radius:50%;width:52px;height:52px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:.8rem}
.p-ctrl .play{width:72px;height:72px;background:var(--lima);color:var(--escuro);font-size:26px}
.p-vel{margin-top:14px;display:flex;gap:6px;justify-content:center}
.p-vel button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:700}
.p-vel button.on{background:#fff;color:var(--escuro)}

/* triagem */
.tri-resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-size:1.4rem}.kpi span{font-size:.76rem;color:var(--muted)}
.lista{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--verde)}
.item b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;font-size:.74rem;color:var(--muted)}
.item-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.st.comercial{background:#fdecea;color:#a3322d}.st.dominio-publico{background:#eef7e2;color:#3d6b0c}.st.revisar{background:#fff6df;color:#8a5d00}
.st.importado{background:#e6f1fb;color:#1f5f91}.st.recusado{background:#eef2f6;color:#5b6b7d}.st.erro{background:#fdecea;color:#a3322d}.st.importando{background:#e6f1fb;color:#1f5f91}
.aviso{font-size:.82rem;background:#fff8e6;border:1px solid #f3d48a;color:#7a5200;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.mb{position:fixed;inset:0;z-index:90;background:rgba(7,22,33,.55);display:none;align-items:center;justify-content:center;padding:16px}
.mb.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(7,22,33,.6)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.fechar{border:0;background:#f1f4f8;border-radius:8px;width:32px;height:32px;font-size:18px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:.72rem;font-weight:700;color:var(--muted)}
.campo input,.campo select,.campo textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:.88rem}
.campo textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--verde)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;background:var(--escuro-2);color:#fff;padding:11px 18px;border-radius:12px;font-size:.86rem;font-weight:600;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
@media (max-width:900px){ .secoes{grid-template-columns:1fr 1fr} .tri-resumo{grid-template-columns:1fr 1fr} }
@media (max-width:600px){
  .topo{padding:10px 14px;position:static}.marca span{display:none}
  .grade{grid-template-columns:repeat(2,1fr);gap:10px}
  .item{grid-template-columns:24px 1fr}.item-acoes{grid-column:1/-1;justify-content:flex-start}
  .l-nav{width:42px;height:42px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Portal do Educador</small><b>Biblioteca</b><span id="quem">Carregando...</span></div></div>
    <nav class="topo-acoes" aria-label="Seções">
      <button class="tb" data-action="ir" data-arg="acervo">📚 Acervo</button>
      <button class="tb" data-action="ir" data-arg="continuar">🔖 Continuar</button>
      <button class="tb" data-action="ir" data-arg="triagem" id="tbTri" hidden>🗂️ Triagem <span class="n" id="nTri" hidden></span></button>
      <a class="tb lima" href="/entrar/">← Portal</a>
    </nav>
  </header>
  <main id="tela"><div class="carregando"><div class="giro"></div>Carregando a Biblioteca...</div></main>
</div>

<section class="leitor" id="leitor" hidden aria-label="Leitor">
  <div class="l-topo">
    <button class="tb" data-action="fechar-leitor">← Biblioteca</button>
    <div class="tit"><small id="lSec">Livro</small><span id="lTit"></span></div>
    <button class="tb" data-action="duas" id="bDuas" title="Uma ou duas páginas">📖</button>
    <button class="tb" data-action="zoom-l" title="Ampliar">🔍</button>
    <button class="tb" data-action="tela-cheia" title="Tela cheia">⛶</button>
  </div>
  <div class="l-area" id="lArea"></div>
  <div class="l-baixo" id="lBaixo"><span id="lPag">1 / 1</span><input type="range" id="lSlide" min="1" max="1" value="1" aria-label="Página"></div>
</section>
<div class="mb" id="mb"><div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><b id="mTit"></b><button class="fechar" data-action="fechar-modal" aria-label="Fechar">×</button></div><div class="modal-b" id="mCorpo"></div><div class="modal-f" id="mPe"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, updateDoc, collection, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5", storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app, "southamerica-east1");
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const SECOES = { livros:{ e:"📕", nome:"Livros", d:"Leitura para a turma e para o professor" }, audiolivros:{ e:"🎧", nome:"Audiolivros", d:"Ouça na sala ou em casa" },
  aprender:{ e:"🧩", nome:"Aprender brincando", d:"Livros com atividades" }, gibiteca:{ e:"💬", nome:"Gibiteca", d:"Histórias em quadrinhos" } };
const TIPO_ROT = { pdf:"Livro", audio:"Áudio", cbz:"Gibi", imagens:"Gibi" };
const LIC = { "dominio-publico":"Domínio público", "licenca-aberta":"Licença aberta (Creative Commons ou similar)", "licenciada":"Licenciada (contrato ou autorização)", "propria":"Material próprio da NEWPC" };
const SUG = { comercial:"Comercial", "dominio-publico":"Domínio público provável", revisar:"Revisar" };
const LOTE = 48;
const E = { user:null, u:null, admin:false, livros:[], secao:"todas", busca:"", mostrar:LOTE, tela:"acervo", favs:new Set(), soFav:false,
  tri:null, triSec:"todas", triSug:"todas", triSt:"pendente", triBusca:"", triSel:new Set(), triMostrar:80 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const tam = b => b >= 1e9 ? (b / 1e9).toFixed(1).replace(".", ",") + " GB" : b >= 1e6 ? Math.round(b / 1e6) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const hms = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function toast(msg, erro){ const t = $("toast"); t.textContent = msg; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 3600); }
const progKey = () => "pde_bib_prog_" + E.user.uid;
function progresso(){ return ls.get(progKey(), {}); }
function salvarProg(id, dados){ const p = progresso(); p[id] = { ...(p[id] || {}), ...dados, em:Date.now() }; ls.set(progKey(), p); }

function ir(t){
  E.tela = t;
  document.querySelectorAll(".topo-acoes .tb[data-arg]").forEach(b => b.classList.toggle("on", b.dataset.arg === t));
  try{ history.replaceState(null, "", "#" + t); }catch(e){}
  if(t === "continuar") telaContinuar(); else if(t === "triagem" && E.admin) telaTriagem(); else telaAcervo();
  window.scrollTo({ top:0 });
}

/* ---------- acervo ---------- */
// aluno: só as estantes Aprender brincando e Gibiteca (as regras do banco também exigem isso)
const SECOES_ALUNO = ["aprender", "gibiteca"];
const secoesVis = () => Object.entries(SECOES).filter(([id]) => !E.aluno || SECOES_ALUNO.includes(id));
async function carregar(){
  const q = E.admin ? collection(db, "biblioteca")
    : E.aluno ? query(collection(db, "biblioteca"), where("publicado", "==", true), where("secao", "in", SECOES_ALUNO))
    : query(collection(db, "biblioteca"), where("publicado", "==", true));
  const s = await getDocs(q); E.livros = []; s.forEach(d => E.livros.push({ id:d.id, ...d.data() }));
  E.livros.sort((a, b) => (a.titulo || "").localeCompare(b.titulo || "", "pt-BR", { numeric:true }));
}
function filtrados(){
  const b = E.busca.trim().toLowerCase();
  return E.livros.filter(l => (E.secao === "todas" || l.secao === E.secao) && (!E.soFav || E.favs.has(l.id)) && (!b || [l.titulo, l.autor].join(" ").toLowerCase().includes(b)));
}
function telaAcervo(){
  const n = s => E.livros.filter(l => l.secao === s).length;
  $("tela").innerHTML =
    (E.aluno
      ? '<div class="destaque"><div class="destaque-ico">📚</div><div class="destaque-txt"><b>Ler e aprender brincando</b><span>Livros com atividades e gibis para ler no Chromebook ou no celular. A Biblioteca lembra onde você parou.</span></div></div>'

function desenharGrade(){

function cartao(l, p){

    (l.capa_url ? '<img src="' + esc(l.capa_url) + '" alt="" loading="lazy">' : SECOES[l.secao]?.e || "📘") +

    '<div class="livro-t"><b>' + esc(l.titulo) + '</b><small>' + esc(l.autor || SECOES[l.secao]?.nome || "") + '</small></div></button>';

/* ---------- leitor de páginas (PDF, CBZ e imagens) ---------- */
const L = { livro:null, total:0, pag:1, duas:false, zoom:false, render:null, pdf:null, imgs:null, urls:[] };
function abrir(id){
  const l = E.livros.find(x => x.id === id); if(!l) return;
  if(l.tipo === "audio") return abrirAudio(l);
  L.livro = l; L.pdf = null; L.imgs = null; L.urls.forEach(u => URL.revokeObjectURL(u)); L.urls = [];
  $("lTit").textContent = l.titulo; $("lSec").textContent = SECOES[l.secao]?.nome || "Livro";
  $("lBaixo").hidden = false; $("bDuas").hidden = false;
  $("leitor").hidden = false; document.body.style.overflow = "hidden";
  $("lArea").innerHTML = '<div class="l-ocupado"><div><div class="giro"></div>Abrindo...</div></div>';
  const p = progresso()[l.id];
  L.pag = p && p.pos ? p.pos : 1;
  const pronto = () => { L.pag = Math.min(Math.max(1, L.pag), L.total); $("lSlide").max = L.total; mostrar(); };
  if(l.tipo === "pdf"){
    if(!window.pdfjsLib){ toast("Leitor indisponível. Recarregue a página.", true); return; }
    pdfjsLib.getDocument({ url:l.url, disableRange:true, disableStream:true }).promise.then(doc => { L.pdf = doc; L.total = doc.numPages; pronto(); })
      .catch(() => { $("lArea").innerHTML = ""; toast("Não foi possível abrir este livro.", true); });
  } else if(l.tipo === "imagens"){
    L.imgs = l.paginas || []; L.total = L.imgs.length; pronto();
  } else if(l.tipo === "cbz"){
    fetch(l.url).then(r => r.arrayBuffer()).then(b => JSZip.loadAsync(b)).then(async z => {
      const nomes = Object.keys(z.files).filter(n => /\.(jpe?g|png|webp|gif)$/i.test(n) && !z.files[n].dir).sort((a, b) => a.localeCompare(b, "pt-BR", { numeric:true }));
      L.imgs = []; for(const n of nomes){ const u = URL.createObjectURL(await z.files[n].async("blob")); L.urls.push(u); L.imgs.push(u); }
      L.total = L.imgs.length; pronto();
    }).catch(() => { $("lArea").innerHTML = ""; toast("Não foi possível abrir este gibi.", true); });
  }
}
async function pagina(n){
  if(L.pdf){
    const pg = await L.pdf.getPage(n);
    const a = $("lArea"), v1 = pg.getViewport({ scale:1 });
    const alvoH = (a.clientHeight - 28) * (L.zoom ? 1.8 : 1), alvoW = (a.clientWidth - 28) / (L.duas ? 2 : 1) * (L.zoom ? 1.8 : 1);
    const esc2 = Math.min(alvoH / v1.height, alvoW / v1.width), dpr = Math.min(2, window.devicePixelRatio || 1);
    const vp = pg.getViewport({ scale:esc2 * dpr });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px";
    await pg.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
    return c;
  }
  const i = new Image(); i.src = L.imgs[n - 1]; i.alt = "Página " + n; i.decoding = "async"; return i;
}
async function mostrar(){
  const id = (L.render = Symbol());
  const pags = [L.pag]; if(L.duas && L.pag + 1 <= L.total) pags.push(L.pag + 1);
  const els = []; for(const n of pags) els.push(await pagina(n));
  if(id !== L.render) return;
  const a = $("lArea"); a.innerHTML = ""; a.classList.toggle("zoom", L.zoom);
  a.insertAdjacentHTML("beforeend", '<button class="l-nav ant" data-action="pag" data-arg="-1" aria-label="Anterior">‹</button><button class="l-nav prox" data-action="pag" data-arg="1" aria-label="Próxima">›</button>');
  els.forEach(e => a.appendChild(e));
  $("lPag").textContent = pags.join("-") + " / " + L.total; $("lSlide").value = L.pag;
  salvarProg(L.livro.id, { pos:L.pag, total:L.total });
}
function virar(d){ const passo = L.duas ? 2 : 1; const n = L.pag + d * passo; if(n < 1 || n > L.total) return; L.pag = n; mostrar(); }
function fecharLeitor(){
  if(A.el){ A.el.pause(); salvarAudio(); A.el = null; }
  $("leitor").hidden = true; document.body.style.overflow = "";
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  L.urls.forEach(u => URL.revokeObjectURL(u)); L.urls = [];
  if(E.tela === "continuar") telaContinuar(); else if(E.tela === "acervo") desenharGrade();
}

const A = { el:null, livro:null, salvarT:0 };
function abrirAudio(l){
  A.livro = l; $("lTit").textContent = l.titulo; $("lSec").textContent = "Audiolivro";
  $("lBaixo").hidden = true; $("bDuas").hidden = true;
  $("leitor").hidden = false; document.body.style.overflow = "hidden";
  const p = progresso()[l.id] || {}, vel = ls.get("pde_bib_vel", 1);
  $("lArea").innerHTML = '<div class="player"><div class="player-caixa"><div class="player-capa" id="pCapa">' + (l.capa_url ? '<img src="' + esc(l.capa_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:22px">' : "🎧") + '</div>' +
    '<h3>' + esc(l.titulo) + '</h3><p>' + esc(l.autor || "Audiolivro") + '</p>' +
    '<div class="p-barra"><span id="pAt">0:00</span><input type="range" id="pBar" min="0" max="100" step="0.1" value="0" aria-label="Posição"><span id="pTot">0:00</span></div>' +
    '<div class="p-ctrl"><button data-action="a-pular" data-arg="-15">−15s</button><button class="play" data-action="a-play" id="pPlay">▶</button><button data-action="a-pular" data-arg="30">+30s</button></div>' +
    '<div class="p-vel">' + [0.75, 1, 1.25, 1.5].map(v => '<button data-action="a-vel" data-arg="' + v + '"' + (v === vel ? ' class="on"' : "") + '>' + String(v).replace(".", ",") + 'x</button>').join("") + '</div></div></div>';
  const el = new Audio(); el.preload = "metadata"; el.src = l.url; el.playbackRate = vel; A.el = el;
  el.addEventListener("loadedmetadata", () => { $("pTot").textContent = hms(el.duration); if(p.pos && p.pos < el.duration - 5){ el.currentTime = p.pos; toast("Continuando de " + hms(p.pos) + "."); } });
  el.addEventListener("timeupdate", () => { if(!el.duration) return; $("pAt").textContent = hms(el.currentTime); $("pBar").value = 100 * el.currentTime / el.duration; if(Date.now() - A.salvarT > 5000){ A.salvarT = Date.now(); salvarAudio(); } });
  el.addEventListener("play", () => { $("pPlay").textContent = "❚❚"; $("pCapa").classList.add("tocando"); });
  el.addEventListener("pause", () => { $("pPlay").textContent = "▶"; $("pCapa").classList.remove("tocando"); salvarAudio(); });
  el.addEventListener("error", () => toast("Não foi possível carregar o áudio.", true));
  $("pBar").addEventListener("input", e => { if(el.duration) el.currentTime = el.duration * e.target.value / 100; });
}
function salvarAudio(){ if(A.el && A.livro && A.el.duration) salvarProg(A.livro.id, { pos:A.el.currentTime, total:A.el.duration }); }

async function confirmarAprovacao(ids){
  const lic = $("aLic").value, obs = $("aObs").value.trim();
  if(!$("aDecl").checked){ toast("Marque a declaração para continuar.", true); return; }
  if(!lic){ toast("Escolha o tipo de licença.", true); return; }
  if(obs.length < 10){ toast("Informe a comprovação: autor e ano de falecimento, link da licença, contrato ou autorização.", true); return; }
  const extra = ids.length === 1 ? { titulo:$("aTit").value.trim(), autor:$("aAut").value.trim() } : {};
  fecharModal();
  const fn = httpsCallable(fns, "importarBiblioteca", { timeout:560000 });
  let ok = 0, falha = 0;
  for(let i = 0; i < ids.length; i++){
    $("tProg") && ($("tProg").textContent = "Trazendo " + (i + 1) + " de " + ids.length + " (arquivos grandes demoram)...");
    const t = E.tri.find(x => x.id === ids[i]); if(t) t.status = "importando"; desenharTriagem();
    try{ await fn({ id:ids[i], licenca:lic, obs, ...extra }); ok++; if(t) t.status = "importado"; }
    catch(e){ falha++; if(t){ t.status = "erro"; t.erro = e.message; } }
    E.triSel.delete(ids[i]);
  }
  $("tProg") && ($("tProg").textContent = "");
  toast(ok + " título(s) no Portal" + (falha ? ", " + falha + " com erro" : "") + ".", !!falha);
  await carregar(); desenharTriagem();
}
async function mudarTriagem(ids, status){

  toast(status === "recusado" ? "Marcado como recusado." : "Voltou para pendente."); desenharTriagem();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  if(a === "fav"){ e.stopPropagation(); if(E.favs.has(arg)) E.favs.delete(arg); else E.favs.add(arg); ls.set("pde_bib_favs_" + E.user.uid, [...E.favs]); el.textContent = E.favs.has(arg) ? "⭐" : "☆"; return; }
  if(a === "ir") ir(arg);
  else if(a === "secao"){ E.secao = E.secao === arg ? "todas" : arg; E.mostrar = LOTE; telaAcervo(); }
  else if(a === "so-fav"){ E.soFav = !E.soFav; telaAcervo(); }
  else if(a === "mais"){ E.mostrar += LOTE * 2; desenharGrade(); }
  else if(a === "abrir") abrir(arg);
  else if(a === "fechar-leitor") fecharLeitor();
  else if(a === "pag") virar(+arg);
  else if(a === "duas"){ L.duas = !L.duas; if(L.duas && L.pag % 2 === 0) L.pag--; mostrar(); }
  else if(a === "zoom-l"){ L.zoom = !L.zoom; if(L.livro && !A.el) mostrar(); }
  else if(a === "tela-cheia"){ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await $("leitor").requestFullscreen(); setTimeout(() => { if(L.livro && !A.el) mostrar(); }, 250); }catch(err){ toast("Use a tecla F11 para tela cheia."); } }
  else if(a === "a-play"){ if(!A.el) return; A.el.paused ? A.el.play().catch(() => toast("Toque de novo para tocar.")) : A.el.pause(); }
  else if(a === "a-pular"){ if(A.el) A.el.currentTime = Math.max(0, A.el.currentTime + (+arg)); }
  else if(a === "a-vel"){ if(!A.el) return; A.el.playbackRate = +arg; ls.set("pde_bib_vel", +arg); document.querySelectorAll(".p-vel button").forEach(b => b.classList.toggle("on", b.dataset.arg === arg)); }
  else if(a === "fechar-modal") fecharModal();
  else if(a === "tri-mais"){ E.triMostrar += 200; desenharTriagem(); }
  else if(a === "tri-aprovar") modalAprovar([arg]);
  else if(a === "tri-aprovar-sel") modalAprovar([...E.triSel]);
  else if(a === "tri-confirmar") confirmarAprovacao(arg.split(","));
  else if(a === "tri-recusar") mudarTriagem([arg], "recusado");
  else if(a === "tri-recusar-sel") mudarTriagem([...E.triSel], "recusado");
  else if(a === "tri-voltar") mudarTriagem([arg], "pendente");
});
$("mb").addEventListener("click", e => { if(e.target === $("mb")) fecharModal(); });
$("lSlide").addEventListener("input", e => { L.pag = +e.target.value; clearTimeout(L._s); L._s = setTimeout(mostrar, 120); });
document.addEventListener("keydown", e => {
  if($("leitor").hidden) return;
  if(e.key === "ArrowRight" || e.key === "PageDown"){ if(!A.el) virar(1); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ if(!A.el) virar(-1); }
  else if(e.key === " " && A.el){ e.preventDefault(); A.el.paused ? A.el.play() : A.el.pause(); }
  else if(e.key === "Escape" && !document.fullscreenElement) fecharLeitor();
});
let toqueX = null;
$("lArea").addEventListener("touchstart", e => { if(e.touches.length === 1) toqueX = e.touches[0].clientX; }, { passive:true });
$("lArea").addEventListener("touchend", e => { if(toqueX == null || A.el || L.zoom) return; const dx = e.changedTouches[0].clientX - toqueX; toqueX = null; if(Math.abs(dx) > 60) virar(dx < 0 ? 1 : -1); });
window.addEventListener("resize", () => { if(!$("leitor").hidden && L.livro && !A.el){ clearTimeout(L._r); L._r = setTimeout(mostrar, 200); } });
window.addEventListener("beforeunload", salvarAudio);

/* ---------- entrada ---------- */
onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/"); return; }
  let u = null;
  try{ const s = await getDoc(doc(db, "usuarios", user.uid)); u = s.exists() ? s.data() : null; }catch(e){}
  if(!u || u.status !== "ativo"){ location.replace("/entrar/"); return; }
  E.user = user; E.u = u; E.admin = u.perfil === "admin"; E.aluno = u.perfil === "aluno";
  E.favs = new Set(ls.get("pde_bib_favs_" + user.uid, []));
  $("quem").textContent = u.nome || user.email;
  if(E.admin){ $("tbTri").hidden = false; carregarTriagem().catch(() => {}); }
  try{ await carregar(); }catch(e){ console.error(e); $("tela").innerHTML = '<div class="card vazio">Não foi possível carregar a Biblioteca agora.</div>'; return; }
  const h = (location.hash || "").slice(1);
  ir(["acervo","continuar","triagem"].includes(h) ? h : "acervo");
});
</script>
