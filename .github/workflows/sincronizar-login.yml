# Login com Google pelo domínio do Portal (nov/2026): os arquivos auxiliares do Firebase Auth ficam no próprio site
# (www.portaldoeducador.com.br/__/auth/...), assim a tela do Google mostra "Prosseguir para www.portaldoeducador.com.br".
# Esta rotina baixa os 5 arquivos do Firebase (handler, handler.js, experiments.js, iframe, iframe.js) e grava no ramo de trabalho.
# Roda toda segunda de madrugada e à mão em "Run workflow". Só grava se algo mudou.
name: Sincronizar arquivos do login

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      ramo:
        description: "Ramo onde gravar"
        default: vitrine-ia

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramo || 'vitrine-ia' }}
      - name: Baixar do Firebase
        run: |
          set -e
          B=https://portal-educador-5.firebaseapp.com/__/auth
          # handler.html e iframe.html: o GitHub Pages serve /__/auth/handler sem barra no final e sem redirecionar
          # (com pasta + index.html ele redireciona para /handler/ e o Google recusa: redirect_uri_mismatch)
          rm -rf __/auth/handler __/auth/iframe
          mkdir -p __/auth
          curl -fsSL "$B/handler" -o __/auth/handler.html
          curl -fsSL "$B/iframe" -o __/auth/iframe.html
          for f in handler.js experiments.js iframe.js; do curl -fsSL "$B/$f" -o "__/auth/$f"; done
          ls -la __/auth
          grep -o 'src="[^"]*"' __/auth/handler.html __/auth/iframe.html || true
      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A __/auth
          if git diff --cached --quiet; then echo "::notice::Nada mudou nos arquivos do login."; exit 0; fi
          git commit -m "Login: arquivos auxiliares do Firebase Auth atualizados"
          git push
          echo "::notice::Arquivos do login atualizados no ramo ${{ inputs.ramo || 'vitrine-ia' }}."
