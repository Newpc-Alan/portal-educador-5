# Consultas no banco (relatórios para decisão). Roda só quando alguém clica em "Run workflow".
# uso-ia: só leitura. creditos-implantacao: GRAVA (carga única de créditos de cortesia). portal-ia: teste real do Portal IA (grava 3 materiais e 1 imagem).
name: Consulta (só leitura)

on:
  workflow_dispatch:
    inputs:
      consulta:
        description: "Qual consulta"
        type: choice
        options: [uso-ia, portal-ia, logs-portal-ia, portal-ia-provas, portal-ia-rede, portal-ia-planos, creditos-implantacao, portal-ia-questoes, acervo, regiao, arquivos-levantar, arquivos-preparar, arquivos-links, videos-posicao3, jogos, jogos-posicao1, capas-jogos, links-antigos, lousa-ia, nc-mapa, nc-teste, logs-nc]
        default: uso-ia

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.consulta, 'arquivos-') && 55 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: cd functions && npm ci
      - name: Credencial
        env:
          CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/conta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta.json" >> "$GITHUB_ENV"
      - name: Consultar
        if: ${{ !startsWith(inputs.consulta, 'arquivos-') }}
        run: cd functions && node "../scripts/${{ inputs.consulta == 'portal-ia' && 'teste-portal-ia' || format('consulta-{0}', inputs.consulta) }}.mjs"
      - name: Migrar arquivos para Sao Paulo
        if: ${{ startsWith(inputs.consulta, 'arquivos-') }}
        env:
          ETAPA: ${{ inputs.consulta }}
        run: cd functions && node ../scripts/migrar-arquivos-sp.mjs "${ETAPA#arquivos-}"
      - name: Apagar a credencial do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/conta.json"
