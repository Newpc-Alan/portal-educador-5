# Robô do WhatsApp do Portal do Educador (nov/2026).
# acao:
#   segredos      copia WHATSAPP_TOKEN, WHATSAPP_APP_SECRET e WHATSAPP_VERIFY (segredos do GitHub) para o cofre do Google
#                 (Secret Manager), onde a função do robô lê. Nada é impresso no log.
#   configurar    grava wa_config/geral: phone_number_id (copiado do painel da Meta) e ligado (liga/desliga o robô)
#   conhecimento  recarrega a base de dúvidas a partir do Manual do Usuário (ramo manuais, pasta fontes)
#   situacao      mostra a configuração e quantas conversas/chamados existem (sem nome nem número de ninguém)
name: Robô do WhatsApp

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [situacao, segredos, configurar, conhecimento]
        default: situacao
      ambiente:
        description: "Ambiente"
        type: choice
        options: [oficial, teste]
        default: oficial
      phone_number_id:
        description: "Identificação do número de telefone (painel da Meta). Só em configurar"
        default: ""
      ligado:
        description: "Robô ligado? Só em configurar"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJETO: ${{ inputs.ambiente == 'oficial' && 'portal-educador-5' || 'portal-educador-5-teste' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.acao == 'conhecimento'
        with:
          ref: manuais
          path: manuais
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: |
          cd functions && npm ci --silent
          if [ "${{ inputs.acao }}" = "segredos" ]; then npm i -g firebase-tools@13 --silent; fi
      - name: Credencial
        env:
          CHAVE: ${{ inputs.ambiente == 'oficial' && secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_TESTE }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta a conta de serviço do ambiente ${{ inputs.ambiente }}."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/conta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta.json" >> "$GITHUB_ENV"

      - name: Segredos para o cofre do Google
        if: inputs.acao == 'segredos'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY: ${{ secrets.WHATSAPP_VERIFY }}
        run: |
          umask 077
          for nome in WHATSAPP_TOKEN WHATSAPP_APP_SECRET WHATSAPP_VERIFY; do
            valor="${!nome}"
            if [ -z "$valor" ]; then echo "::warning::$nome não está nos segredos do GitHub: pulado"; continue; fi
            printf '%s' "$valor" > "$RUNNER_TEMP/s"
            firebase functions:secrets:set "$nome" --data-file "$RUNNER_TEMP/s" --project "$PROJETO" --non-interactive --force > /dev/null 2>&1 \
              && echo "::notice::$nome gravado no cofre" || { echo "::error::não consegui gravar $nome (a conta de serviço precisa do papel Administrador do Secret Manager)"; rm -f "$RUNNER_TEMP/s"; exit 1; }
            rm -f "$RUNNER_TEMP/s"
          done
          echo "::notice::Depois de trocar um segredo, publique de novo as funções whatsappWebhook e whatsappResponder."

      - name: Configurar
        if: inputs.acao == 'configurar'
        env:
          PNID: ${{ inputs.phone_number_id }}
          LIGADO: ${{ inputs.ligado }}
        run: node scripts/robo-whatsapp.mjs configurar | sed 's/^/::notice::/'

      - name: Base de conhecimento
        if: inputs.acao == 'conhecimento'
        run: node scripts/carregar-conhecimento.mjs --origem manual-usuario manuais/fontes/parte0u.md manuais/fontes/parte1.md --gravar

      - name: Situação
        if: inputs.acao == 'situacao'
        run: node scripts/robo-whatsapp.mjs situacao | sed 's/^/::notice::/'
