# Escola de laboratório NEWPC (contas de teste). Roda só quando alguém clica em "Run workflow".
# "diagnostico" só lê o banco. "criar", "historico" e "apagar" gravam no município lab-muni e só rodam com o ok do Alan.
name: Escola de laboratório

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde: teste (homologação, recomendado) ou oficial"
        type: choice
        options: [teste, oficial]
        default: teste
      modo:
        description: "O que fazer"
        type: choice
        options: [diagnostico, criar, historico, turmas-extra, apagar]
        default: diagnostico

permissions:
  contents: read

concurrency:
  group: escola-laboratorio
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: cd functions && npm ci
      - name: Credencial
        env:
          CHAVE: ${{ inputs.ambiente == 'oficial' && secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_TESTE }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta o segredo da conta de serviço do ambiente ${{ inputs.ambiente }}."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/conta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta.json" >> "$GITHUB_ENV"
      - name: Rodar
        env:
          PROJETO: ${{ inputs.ambiente == 'oficial' && 'portal-educador-5' || 'portal-educador-5-teste' }}
        run: cd functions && node ../scripts/lab-escola.mjs "--${{ inputs.modo }}"
      - name: Apagar a credencial do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/conta.json"
