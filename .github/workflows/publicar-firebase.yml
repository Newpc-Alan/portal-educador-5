# Publica regras, funções e (só no teste) o site no Firebase, sem depender do Cloud Shell.
# Ambiente: "teste" (portal-educador-5-teste, homologação) ou "oficial" (portal-educador-5). Sempre o teste primeiro.
# Roda só quando alguém clica em "Run workflow" na aba Actions do GitHub (nunca sozinho a cada commit).
#
# Configuração única (feita pelo Alan, a chave nunca passa pelo chat):
#   Settings > Secrets and variables > Actions > New repository secret
#   Nome: FIREBASE_SERVICE_ACCOUNT   Valor: o conteúdo inteiro do arquivo .json da conta de serviço (oficial)
#   Nome: FIREBASE_SERVICE_ACCOUNT_TESTE   Valor: o mesmo, da conta de serviço do projeto de teste
name: Publicar no Firebase

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde publicar: teste (homologação) ou oficial"
        type: choice
        options: [teste, oficial]
        default: teste
      alvo:
        description: "O que publicar (formato do --only do Firebase; \"hosting\" = o site, só no teste)"
        required: true
        default: "firestore:rules,functions:publicarProvaOnline,functions:entregarProvaOnline,functions:acaoProvaOnline,functions:fecharProvasOnline,functions:corrigirProvaOnline,functions:iniciarAula,functions:sortearProva,functions:emitirCertificado,functions:vincularContaFormacao"
      testar_regras:
        description: "Rodar os testes das regras antes (recomendado quando publicar regras)"
        type: boolean
        default: true
      apagar_funcoes:
        description: "Funções para APAGAR do Firebase, separadas por vírgula (deixe vazio para não apagar nada)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publicar-firebase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJETO: ${{ inputs.ambiente == 'oficial' && 'portal-educador-5' || 'portal-educador-5-teste' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: ${{ inputs.testar_regras }}
        with:
          distribution: temurin
          java-version: 21

      - name: Ferramentas
        run: |
          npm i -g firebase-tools@13
          cd functions && npm ci

      - name: Conferir sintaxe das funções
        run: for f in functions/*.js; do node --check "$f"; done

      - name: Testar regras (emulador, não toca no banco real)
        if: ${{ inputs.testar_regras }}
        run: |
          mkdir -p /tmp/rt && cp scripts/teste-regras-*.mjs firestore.rules storage.rules /tmp/rt/
          cd /tmp/rt && npm init -y >/dev/null && npm i --silent @firebase/rules-unit-testing@3 firebase@10
          echo '{"firestore":{"rules":"firestore.rules"},"storage":{"rules":"storage.rules"}}' > firebase.json
          for t in teste-regras-*.mjs; do
            echo "== $t"
            firebase emulators:exec --only firestore,storage --project demo-pe5 "node $t $( case "$t" in *fotos*|*storage*) echo storage.rules;; *) echo firestore.rules;; esac )"
          done

      - name: Conferir o alvo
        run: |
          echo "Ambiente: ${{ inputs.ambiente }} (projeto $PROJETO) · alvo: ${{ inputs.alvo }}" >> "$GITHUB_STEP_SUMMARY"
          # o site oficial é o GitHub Pages (ramo main); hosting do Firebase só existe no teste
          if [ "${{ inputs.ambiente }}" = "oficial" ] && echo "${{ inputs.alvo }}" | grep -q "hosting"; then
            echo "::error::O site oficial sai pelo GitHub Pages (ramo main). hosting só no ambiente de teste."; exit 1; fi

      - name: Credencial
        env:
          CHAVE: ${{ inputs.ambiente == 'oficial' && secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_TESTE }}
        run: |
          if [ -z "$CHAVE" ]; then echo "::error::Falta o segredo da conta de serviço do ambiente ${{ inputs.ambiente }} (FIREBASE_SERVICE_ACCOUNT ou FIREBASE_SERVICE_ACCOUNT_TESTE)."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/conta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta.json" >> "$GITHUB_ENV"

      - name: Publicar
        if: inputs.alvo != 'nada'
        run: |
          set -o pipefail
          # em caso de erro, as últimas linhas viram aviso no resumo da execução (dá para ler sem abrir o log)
          if ! firebase deploy --only "${{ inputs.alvo }}" --project "$PROJETO" --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            grep -iE "error|erro|denied|permission|failed|secret" "$RUNNER_TEMP/deploy.log" | tail -8 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Apagar funções retiradas
        if: inputs.apagar_funcoes != ''
        env:
          LISTA: ${{ inputs.apagar_funcoes }}
        run: |
          IFS=',' read -ra FS <<< "$LISTA"
          for f in "${FS[@]}"; do
            f="$(echo "$f" | tr -d ' ')"
            # nome ou nome@regiao (padrão: southamerica-east1)
            if ! [[ "$f" =~ ^[A-Za-z][A-Za-z0-9]*(@[a-z0-9-]+)?$ ]]; then echo "::error::nome inválido: $f"; exit 1; fi
            reg="southamerica-east1"; if [[ "$f" == *@* ]]; then reg="${f#*@}"; f="${f%@*}"; fi
            firebase functions:delete "$f" --region "$reg" --project "$PROJETO" --force
          done

      - name: Apagar a credencial do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/conta.json"
