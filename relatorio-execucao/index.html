<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="/assets/js/ambiente.js"></script>
<script src="/assets/js/erros.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Relatório de execução contratual · Portal do Educador</title>
<link rel="icon" type="image/png" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#0f2c4a; --verde:#1a6b2a; --lima:#8DC63F; --cinza:#5b6b7b; --linha:#dfe6ee; --fundo:#eef2f6; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Inter, system-ui, sans-serif; color:var(--azul); background:var(--fundo); }
  .barra{ position:sticky; top:0; z-index:5; background:var(--azul); color:#fff; padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .barra b{ font-size:1.05rem; margin-right:auto; }
  .barra select, .barra input{ font:inherit; border-radius:8px; border:0; padding:9px 10px; min-height:40px; }
  .bt{ font:inherit; font-weight:800; border:0; border-radius:10px; padding:10px 14px; min-height:40px; cursor:pointer; background:#fff; color:var(--azul); }
  .bt.verde{ background:var(--lima); color:#10240a; } .bt:disabled{ opacity:.55; cursor:wait; }
  .aviso{ max-width:210mm; margin:12px auto 0; background:#fff7e6; border:1px solid #f0c36d; color:#6b4a00; border-radius:10px; padding:10px 14px; font-size:.92rem; }
  .folha{ background:#fff; width:210mm; min-height:297mm; margin:16px auto 40px; padding:16mm 16mm 14mm; box-shadow:0 10px 30px -12px rgba(0,0,0,.25); font-size:10.5pt; line-height:1.45; }
  .vazio{ text-align:center; color:var(--cinza); padding:60px 0; }
  .cab{ display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--verde); padding-bottom:8px; margin-bottom:10px; }
  .cab img.newpc{ height:30px; } .cab .pde{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:9.5pt; } .cab .pde img{ height:30px; border-radius:50%; }
  h1{ font-size:16pt; margin:6px 0 2px; } .sub{ color:var(--cinza); margin:0 0 10px; }
  h2{ font-size:11.5pt; margin:14px 0 6px; color:var(--verde); text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--linha); padding-bottom:3px; }
  table{ width:100%; border-collapse:collapse; } td, th{ border:1px solid var(--linha); padding:5px 7px; text-align:left; vertical-align:top; }
  th{ background:#f3f7fb; font-weight:700; width:32%; }
  .kpis{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .kpi{ border:1px solid var(--linha); border-radius:8px; padding:7px 8px; } .kpi b{ display:block; font-size:15pt; line-height:1.1; } .kpi span{ font-size:8.5pt; color:var(--cinza); }
  .lista td:last-child{ text-align:right; width:22%; font-variant-numeric:tabular-nums; }
  .nota{ font-size:8.5pt; color:var(--cinza); margin:4px 0 0; }
  .parecer{ border:1px dashed #b9c6d3; border-radius:8px; padding:8px 10px; min-height:90px; white-space:pre-wrap; outline:none; }
  .parecer:focus{ border-color:var(--verde); background:#fbfffa; }
  .parecer:empty::before{ content:"Escreva o parecer ou toque em \"Escrever parecer com IA\" na barra de cima. O texto pode ser editado antes de imprimir."; color:#9aa8b6; }
  .assin{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:34px; text-align:center; font-size:9.5pt; }
  .assin div{ border-top:1px solid var(--azul); padding-top:4px; }
  .rodape{ margin-top:16px; font-size:8pt; color:var(--cinza); border-top:1px solid var(--linha); padding-top:5px; }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--azul); color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:.25s; pointer-events:none; }
  .toast.on{ opacity:1; } .toast.err{ background:#b3261e; }
  @media (max-width:820px){ .folha{ width:auto; margin:10px; padding:16px; } .kpis{ grid-template-columns:repeat(2, 1fr); } }
  @media print{
    @page{ size:A4; margin:0; }
    body{ background:#fff; } .barra, .aviso, .toast{ display:none !important; }
    .folha{ margin:0; box-shadow:none; width:auto; min-height:0; }
    .parecer{ border:0; padding:0; } .parecer:empty{ display:none; }
    h2{ break-after:avoid; } table, .kpis{ break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="barra">
  <b>📑 Relatório de execução contratual</b>
  <select id="rede" aria-label="Rede"><option value="">Carregando redes...</option></select>
  <input type="month" id="mes" aria-label="Mês de referência">
  <button class="bt" data-action="gerar">Gerar</button>
  <button class="bt" data-action="ia" id="btIA" disabled>✨ Escrever parecer com IA</button>
  <button class="bt" data-action="salvar" id="btSalvar" disabled>💾 Salvar versão</button>
  <button class="bt verde" data-action="imprimir" id="btPdf" disabled>🖨️ Imprimir / PDF</button>
</div>
<p class="aviso">Os números saem do próprio Portal (sem digitação). O parecer pode ser escrito pela IA e <b>deve ser revisado</b> antes de assinar. Ao salvar, a versão fica guardada para auditoria com data e quem emitiu.</p>
<div class="folha" id="folha"><div class="vazio">Escolha a rede e o mês e toque em <b>Gerar</b>.</div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const app = initializeApp(window.PDE_AMBIENTE.fb);
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app, "southamerica-east1");
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("pt-BR");
const dataBR = t => t ? new Date(t).toLocaleDateString("pt-BR") : "–";
const diaBR = s => s ? s.split("-").reverse().join("/") : "–";
function toast(t, err){ const el = $("toast"); el.textContent = t; el.className = "toast on" + (err ? " err" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => el.className = "toast", 3200); }
const chamar = (dados) => httpsCallable(fns, "relatorioExecucao", { timeout:300000 })(dados).then(r => r.data);
const R = { dados:null, salvo:null };

// mês padrão: o anterior (medição fechada); a rede pode vir no link (?rede=ID)
const hoje = new Date(), ant = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
$("mes").value = ant.getFullYear() + "-" + String(ant.getMonth() + 1).padStart(2, "0");
$("mes").max = hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, "0");

onAuthStateChanged(auth, async user => {
  if(!user){ location.replace("/entrar/?volta=" + encodeURIComponent(location.pathname + location.search)); return; }
  const u = (await getDoc(doc(db, "usuarios", user.uid)).catch(() => null));
  if(!u || !u.exists() || u.data().perfil !== "admin" || u.data().status !== "ativo"){ $("folha").innerHTML = '<div class="vazio">Só o administrador NEWPC emite o relatório de execução.</div>'; return; }
  const sn = await getDocs(query(collection(db, "municipios"), where("status", "in", ["ativo", "piloto"])));
  const l = []; sn.forEach(d => { if(d.id !== "lab-muni" && d.id !== "demo-rede") l.push({ id:d.id, nome:d.data().nome || d.id, uf:d.data().uf || "" }); });
  l.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const pedida = new URLSearchParams(location.search).get("rede") || "";
  $("rede").innerHTML = '<option value="">Escolha a rede...</option>' + l.map(m => '<option value="' + esc(m.id) + '"' + (m.id === pedida ? " selected" : "") + '>' + esc(m.nome) + (m.uf ? " · " + esc(m.uf) : "") + '</option>').join("");
  if(pedida) gerar();
});

async function gerar(){
  const mun = $("rede").value, mes = $("mes").value;
  if(!mun || !mes){ toast("Escolha a rede e o mês.", true); return; }
  ["btIA", "btSalvar", "btPdf"].forEach(i => $(i).disabled = true);
  $("folha").innerHTML = '<div class="vazio">Juntando os dados do Portal...</div>';
  try{ const r = await chamar({ municipio_id:mun, mes }); R.dados = r.dados; R.salvo = r.salvo; desenhar(r.salvo ? r.salvo.parecer : ""); ["btIA", "btSalvar", "btPdf"].forEach(i => $(i).disabled = false); }
  catch(e){ $("folha").innerHTML = '<div class="vazio">Não consegui gerar: ' + esc(e.message || "erro") + '</div>'; }
}
async function escreverIA(){
  const b = $("btIA"); b.disabled = true; b.textContent = "✨ Escrevendo...";
  try{ const r = await chamar({ municipio_id:R.dados.rede.id, mes:R.dados.periodo.mes, parecer_ia:true }); if(r.parecer){ $("parecer").textContent = r.parecer; toast("Parecer escrito. Revise antes de imprimir."); } else toast("A IA não respondeu agora. Tente de novo.", true); }
  catch(e){ toast(e.message || "Não foi possível.", true); }
  b.disabled = false; b.textContent = "✨ Escrever parecer com IA";
}
async function salvar(){
  const b = $("btSalvar"); b.disabled = true;
  try{ await chamar({ acao:"salvar", municipio_id:R.dados.rede.id, mes:R.dados.periodo.mes, parecer:$("parecer").textContent.trim() }); R.salvo = { versoes:(R.salvo ? R.salvo.versoes : 0) + 1, emitido_em:Date.now() }; atualizarRodape(); toast("Versão salva no histórico."); }
  catch(e){ toast(e.message || "Não foi possível salvar.", true); }
  b.disabled = false;
}
function kpi(v, t){ return '<div class="kpi"><b>' + v + '</b><span>' + esc(t) + '</span></div>'; }
function lista(l, vazio){ return l && l.length ? '<table class="lista">' + l.map(x => '<tr><td>' + esc(x.nome) + '</td><td>' + fmt(x.n) + '</td></tr>').join("") + '</table>' : '<p class="nota">' + esc(vazio) + '</p>'; }
function desenhar(parecer){
  const d = R.dados, r = d.rede, p = d.periodo, c = d.cadastro, a = d.acesso, u = d.uso, f = d.formacao, e = d.equipamentos, dp = d.disponibilidade, pv = d.provas;
  const adesao = c.professores ? Math.round(100 * a.professores / c.professores) : null;
  $("folha").innerHTML =
    '<div class="cab"><img class="newpc" src="/assets/newpc-logo.png" alt="NEWPC Tecnologia"><span class="pde"><img src="/assets/pde-logo-128.png" alt="">Portal do Educador</span></div>' +
    '<h1>Relatório de Execução Contratual</h1><p class="sub">Período de referência: <b>' + esc(p.nome) + '</b> (' + diaBR(p.inicio) + ' a ' + diaBR(p.fim) + ')' + (p.parcial ? ' · <b>mês em andamento, dados parciais</b>' : '') + '</p>' +
    '<h2>1. Identificação</h2><table>' +
      '<tr><th>Contratante</th><td>' + esc(r.tipo === "municipal" ? "Prefeitura Municipal de " + r.nome : r.nome) + (r.uf ? " · " + esc(r.uf) : "") + '</td></tr>' +
      '<tr><th>Contratada</th><td>NEWPC Tecnologia · CNPJ 20.892.343/0001-15 · Campo Grande/MS</td></tr>' +
      '<tr><th>Contrato</th><td>' + (r.contrato ? esc(r.contrato) : '<i>número não cadastrado</i>') + (r.vigencia_fim ? ' · vigência até ' + dataBR(r.vigencia_fim) : '') + '</td></tr>' +
      '<tr><th>Objeto</th><td>Plataforma educacional Portal do Educador (licenças de uso para professores e gestão)' + (r.modulos && r.modulos.length ? ', com os módulos: ' + esc(r.modulos.join(", ")) : '') + ', suporte técnico e Formação Continuada.</td></tr>' +
      '<tr><th>Base legal</th><td>Lei nº 14.133/2021, art. 117 (acompanhamento e fiscalização da execução contratual)</td></tr></table>' +
    '<h2>2. Disponibilidade e acesso</h2><div class="kpis">' +
      kpi(dp.pct == null ? "–" : String(dp.pct).replace(".", ",") + "%", "plataforma disponível no mês" + (dp.verificacoes ? " (" + fmt(dp.verificacoes) + " verificações)" : "")) +
      kpi(fmt(c.professores), "professores com licença ativa") + kpi(fmt(a.professores) + (adesao != null ? ' <small style="font-size:9pt">(' + adesao + '%)</small>' : ''), "professores que acessaram no mês") +
      kpi(fmt(a.acessos), "acessos de professores · " + fmt(a.dias_com_uso) + " dias com uso") + '</div>' +
      '<p class="nota">' + fmt(c.escolas) + ' escolas cadastradas' + (r.escolas_rede ? ' de ' + fmt(r.escolas_rede) + ' da rede (Censo Escolar)' : '') + ' · ' + fmt(c.gestao) + ' perfis de gestão (Secretaria e escolas). A disponibilidade é medida por verificação automática do site, das funções e do banco de dados.</p>' +
    '<h2>3. Uso pedagógico comprovado</h2><table class="lista"><tr><td>Professores com uso real na semana de maior movimento</td><td>' + fmt(u.pico_semanal) + '</td></tr>' +
      '<tr><td>Provas aplicadas online nas escolas da rede</td><td>' + fmt(pv.aplicadas) + '</td></tr></table>' +
      '<p class="nota" style="margin-top:8px"><b>Ações de valor registradas</b> (' + fmt(u.semanas) + ' semana(s) do mês):</p>' + lista(u.acoes, "Sem ações registradas nas semanas do período.") +
      '<p class="nota" style="margin-top:8px"><b>Recursos mais acessados</b>:</p>' + lista(a.recursos, "Sem registro de acesso no período.") +
    '<h2>4. Formação Continuada</h2><div class="kpis">' + kpi(fmt(f.certificados_mes), "certificados emitidos no mês") + kpi(fmt(f.horas_mes) + " h", "carga horária certificada no mês") +
      kpi(fmt(f.certificados_ano), "certificados no ano") + kpi(fmt(f.horas_ano) + " h", "carga horária certificada no ano") + '</div>' +
      '<p class="nota">' + fmt(f.cursistas) + ' educadores da rede com cadastro na Formação Continuada · ' + fmt(f.concluintes_mes) + ' concluíram curso no mês.</p>' +
    '<h2>5. Equipamentos e suporte técnico</h2><div class="kpis">' + kpi(fmt(e.itens), "equipamentos com patrimônio cadastrado") + kpi(fmt(e.chamados_abertos), "chamados abertos no mês") +
      kpi(fmt(e.chamados_resolvidos), "chamados resolvidos no mês") + kpi(e.horas_media == null ? "–" : fmt(e.horas_media) + " h", "tempo médio de solução") + '</div>' +
      (e.tipos.length ? '<p class="nota">Inventário: ' + e.tipos.map(t => fmt(t.n) + " " + esc(t.nome)).join(" · ") + '. Chamados em aberto no fim do período: ' + fmt(e.em_aberto_fim) + '.</p>' : '<p class="nota">Sem equipamentos cadastrados no inventário do Portal para esta rede.</p>') +
    '<h2>6. Parecer técnico da contratada</h2><div class="parecer" id="parecer" contenteditable="true" spellcheck="true">' + esc(parecer || "") + '</div>' +
    '<div class="assin"><div>Alan Valerio Pires Ramos<br>NEWPC Tecnologia · Contratada</div><div>Fiscal do contrato<br>Nome, matrícula e data</div></div>' +
    '<p class="rodape" id="rodape"></p>';
  atualizarRodape();
}
function atualizarRodape(){
  const el = $("rodape"); if(!el || !R.dados) return; const s = R.salvo;
  el.textContent = "Dados extraídos automaticamente do Portal do Educador em " + new Date(R.dados.gerado_em).toLocaleString("pt-BR") + ". Registro de auditoria: " + R.dados.rede.id + "_" + R.dados.periodo.mes +
    (s && s.versoes ? " · versão " + s.versoes + (s.emitido_em ? " salva em " + new Date(s.emitido_em).toLocaleString("pt-BR") : "") : " · versão ainda não salva") + ". Nenhum dado pessoal de aluno consta deste relatório.";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if(!b) return; const a = b.dataset.action;
  if(a === "gerar") gerar(); else if(a === "ia") escreverIA(); else if(a === "salvar") salvar(); else if(a === "imprimir") window.print();
});
</script>
</body>
</html>
