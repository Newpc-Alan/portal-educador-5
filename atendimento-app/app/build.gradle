// App "Atendimento PDE" (equipe de atendimento do WhatsApp). É um TWA: abre /atendimento/ no motor do Chrome,
// em tela cheia, para o login Google e as notificações funcionarem (o Google bloqueia login dentro de WebView).
// Gerado pelo GitHub Actions (.github/workflows/atendimento-apk.yml), assinado com a mesma chave do app do Maestro.
plugins { id 'com.android.application' }
android {
    namespace "br.com.portaldoeducador.atendimento"
    compileSdk 35
    defaultConfig {
        applicationId "br.com.portaldoeducador.atendimento"
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("APP_CODIGO") ?: "1")
        versionName System.getenv("APP_VERSAO") ?: "0.0.0"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("MAESTRO_KEYSTORE") ?: "nao-configurado.keystore")
            storePassword System.getenv("MAESTRO_SENHA")
            keyAlias "maestro"
            keyPassword System.getenv("MAESTRO_SENHA")
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
