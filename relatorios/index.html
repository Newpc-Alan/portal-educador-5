<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Relatórios · Portal do Educador</title>
<meta name="theme-color" content="#071621">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#071621; --escuro-2:#0c2338; --azul:#2671AB; --azul-2:#2E9BD6; --lima:#8DC63F; --verde:#5A9420;
  --bg:#f4f7fa; --ink:#0c2338; --ink-2:#2C3E55; --muted:#6b7c90; --line:#dce4ed; --surface:#fff;
  --red:#C2362C; --amber:#B7791F; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.app{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* topo */
.topo{position:sticky;top:0;z-index:40;margin:0 -16px 16px;padding:12px 20px;border-radius:0 0 18px 18px;color:#fff;
  background:radial-gradient(600px 200px at 0% 0%,rgba(46,155,214,.35),transparent 60%),linear-gradient(135deg,#071621,#123556);
  box-shadow:0 14px 30px -20px rgba(7,22,33,.8);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.marca img{width:44px;height:44px;flex:none}
.marca small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lima)}
.marca b{display:block;font-size:1.08rem;letter-spacing:-.01em}
.marca span{display:block;font-size:.76rem;color:rgba(255,255,255,.7)}
.topo-acoes{display:flex;gap:6px;flex-wrap:wrap}
.tb{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.lima{background:var(--lima);border-color:var(--lima);color:var(--escuro)}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.86rem;white-space:nowrap;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--azul);color:#fff}.btn-pri:hover{background:#1f5f91}
.btn-ok{background:var(--verde);color:#fff}.btn-ok:hover{background:#4a7c19}
.btn-gh{background:#fff;color:var(--ink);border-color:var(--line)}.btn-gh:hover{border-color:#b8c6d6}
.btn-red{background:#fff;color:var(--red);border-color:#efc9c5}.btn-red:hover{background:#fbedeb}
.btn-sm{padding:7px 11px;font-size:.78rem;border-radius:8px}

/* cartoes e titulos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,44,74,.05)}
.h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--muted);font-size:.86rem}
.faixa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:4px solid var(--lima);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.faixa-ico{width:46px;height:46px;border-radius:12px;background:#eef5fb;display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.faixa-ico img{width:100%;height:100%;object-fit:contain;background:#fff}
.faixa-txt{flex:1;min-width:200px}
.faixa-txt b{display:block;font-size:.92rem}
.faixa-txt span{font-size:.78rem;color:var(--muted)}

/* abas de perfil */
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.aba{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:700;color:var(--ink-2)}
.aba.on{background:var(--escuro-2);border-color:var(--escuro-2);color:#fff}

/* grade de modelos */
.destaque{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:16px;margin-bottom:16px;color:#fff;
  background:radial-gradient(500px 180px at 0% 0%,rgba(141,198,63,.28),transparent 60%),linear-gradient(135deg,#0c2338,#1b4a74)}
.destaque-ico{font-size:34px}
.destaque-txt{flex:1;min-width:220px}
.destaque-txt b{font-size:1.05rem;display:block}
.destaque-txt span{font-size:.86rem;color:rgba(255,255,255,.78)}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:6px}
.modelo{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;transition:transform .12s,box-shadow .12s}
.modelo:hover{transform:translateY(-2px);box-shadow:0 10px 22px -16px rgba(15,44,74,.5);border-color:#c5d6e6}
.modelo-ico{width:40px;height:40px;border-radius:10px;background:#E8F3FB;display:grid;place-items:center;font-size:20px;flex:none}
.modelo b{display:block;font-size:.92rem;line-height:1.25}
.modelo small{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}
.modelo em{display:inline-block;font-style:normal;font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--azul);margin-top:6px}
.grupo-t{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* lista de relatorios */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.filtros input,.filtros select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:.86rem}
.filtros input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip b{margin-left:4px;opacity:.75}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item-ico{width:42px;height:42px;border-radius:10px;background:#E8F3FB;display:grid;place-items:center;font-size:20px}
.item b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;font-size:.76rem;color:var(--muted)}
.item-acoes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.st.rascunho{background:#eef2f6;color:#5b6b7d}.st.enviado{background:#e6f1fb;color:#1f5f91}
.st.aprovado{background:#eef7e2;color:#3d6b0c}.st.devolvido{background:#fdf0e1;color:#9a5b00}
.vazio{text-align:center;color:var(--muted);padding:34px 10px;font-size:.9rem}

/* editor */
.ed-barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ed-barra .h2{flex:1;min-width:200px;margin:0}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.ed-form{display:flex;flex-direction:column;gap:12px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec-t{font-size:.82rem;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-t i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:.7rem}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo.l2{grid-column:1/-1}
.campo label{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;font-size:.9rem}
.campo textarea{min-height:84px;resize:vertical;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul-2);box-shadow:0 0 0 3px rgba(46,155,214,.18);background:#fff}
.campo .dica{font-size:.72rem;color:var(--muted)}
.aviso{font-size:.8rem;background:#fff8e6;border:1px solid #f3d48a;color:#7a5200;border-radius:10px;padding:9px 12px}
.aviso.azul{background:#eef6fc;border-color:#cfe4f4;color:#1f5f91}
.devolucao{background:#fdf0e1;border:1px solid #f3c98a;color:#7a4a00;border-radius:12px;padding:10px 14px;font-size:.86rem}
.prev-wrap{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;border-radius:14px;background:#dfe6ee;padding:14px;border:1px solid var(--line)}
.prev-t{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.folha{background:#fff;box-shadow:0 6px 18px rgba(15,44,74,.15);padding:28px 30px;min-height:600px;font-size:11px}

/* lote */
.lote-cfg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.eixos-ajuda{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:8px 0 0}
.eixos-ajuda span{display:inline-flex;align-items:center;gap:5px}
.nv{display:inline-block;width:10px;height:10px;border-radius:50%}
.nv.c{background:#5A9420}.nv.d{background:#E0A11B}.nv.a{background:#D9534F}.nv.n{background:#cfd8e3}
.tab-lote{width:100%;border-collapse:separate;border-spacing:0 6px}
.tab-lote th{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px}
.tab-lote td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.tab-lote td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;padding-left:12px}
.tab-lote td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.aluno-n{font-weight:700;font-size:.88rem;min-width:140px}
.aluno-n small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.nivel{width:34px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#f6f8fb;font-size:.72rem;font-weight:800;color:#8494a7}
.nivel.c{background:#eef7e2;border-color:#9cc66a;color:#3d6b0c}
.nivel.d{background:#fff6df;border-color:#e8c26a;color:#8a5d00}
.nivel.a{background:#fdecea;border-color:#e3a19e;color:#a3322d}
.obs-l{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:.8rem;background:#fbfcfe}
.par-l{width:100%;min-height:62px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:.8rem;background:#fbfcfe;resize:vertical;line-height:1.45}
.lote-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lote-wrap{overflow-x:auto}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:1.6rem;letter-spacing:-.02em}
.kpi span{font-size:.78rem;color:var(--muted)}
.tabela{width:100%;border-collapse:collapse;font-size:.84rem}
.tabela th{text-align:left;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.tabela td{padding:9px 8px;border-bottom:1px solid #eef2f6}
.barra{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden;min-width:90px}
.barra span{display:block;height:100%;background:var(--verde)}

/* modais */
.mb{position:fixed;inset:0;z-index:90;background:rgba(7,22,33,.55);display:none;align-items:center;justify-content:center;padding:16px}
.mb.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(7,22,33,.6)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h b{font-size:1rem}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.x{border:0;background:#f1f4f8;border-radius:8px;width:32px;height:32px;font-size:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:99;background:var(--escuro-2);color:#fff;padding:11px 18px;border-radius:12px;font-size:.86rem;font-weight:600;transition:.2s;pointer-events:none;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}
.carregando{padding:60px 10px;text-align:center;color:var(--muted)}

@media (max-width:980px){ .ed{grid-template-columns:1fr} .prev-wrap{position:static;max-height:none} .lote-cfg{grid-template-columns:1fr 1fr} .kpis{grid-template-columns:1fr 1fr} }
@media (max-width:600px){ .campos{grid-template-columns:1fr} .item{grid-template-columns:36px 1fr} .item-acoes{grid-column:1/-1;justify-content:flex-start} .lote-cfg{grid-template-columns:1fr} .topo{padding:10px 14px;position:static} .marca span{display:none} .tb{padding:7px 10px;font-size:.78rem} }
@media print{ body *{visibility:hidden} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <div class="marca"><img src="/assets/pde-logo-128.png" alt=""><div><small>Portal do Educador</small><b>Central de Relatórios</b><span id="quem">Carregando...</span></div></div>
    <div class="topo-acoes">
      <button class="tb" data-action="ir" data-arg="inicio">🗂️ Modelos</button>
      <button class="tb" data-action="ir" data-arg="meus">📁 Meus relatórios</button>
      <button class="tb" data-action="ir" data-arg="painel" id="tb-painel" hidden>📊 Painel</button>
      <a class="tb lima" href="/entrar/">← Voltar ao Portal</a>
    </div>
  </header>
  <div class="faixa" id="faixa" hidden>
    <div class="faixa-ico" id="faixa-logo">🏫</div>
    <div class="faixa-txt"><b id="faixa-t"></b><span id="faixa-s"></span></div>
    <select id="faixa-muni" hidden aria-label="Ver os documentos como a rede de" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;max-width:240px"></select>
    <select id="faixa-escola" hidden aria-label="Escola" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;max-width:260px"></select>
  </div>
  <main id="tela"><div class="carregando">Carregando a Central...</div></main>
</div>

<div class="mb" id="mb" data-fundo="1"><div class="modal" role="dialog" aria-modal="true">
  <div class="modal-h"><b id="mb-t"></b><button class="x" data-action="fecharModal" aria-label="Fechar">×</button></div>
  <div class="modal-b" id="mb-b"></div>
  <div class="modal-f" id="mb-f"></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   CENTRAL DE RELATÓRIOS · Portal do Educador 5.0
   Modelos revalidados, preenchimento automático (escola, brasão,
   turma, aluno), nuvem, fluxo de entrega e parecer em lote.
   Regra 9: sem onclick inline, tudo por data-action.
═══════════════════════════════════════════════════════════════ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain: "portal-educador-5.firebaseapp.com", projectId: "portal-educador-5",
  storageBucket: "portal-educador-5.firebasestorage.app", messagingSenderId: "725103866385", appId: "1:725103866385:web:f38b8f3cf0a912ed3bf7b0"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAc = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const msDe = (v) => v && v.toMillis ? v.toMillis() : (v && v.seconds ? v.seconds * 1000 : 0);
const hojeISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dataBR = (v) => { if(!v) return ""; const p = String(v).split("-"); return p.length === 3 ? p[2]+"/"+p[1]+"/"+p[0] : v; };
function toast(m, erro){ const t = $("toast"); t.textContent = m; t.className = "toast show" + (erro ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", 3200); }

/* ═══════════ MODELOS (revalidados) ═══════════
   alvo: aluno | turma | escola     grupo: prof | aee | gestao
   campo: [chave, rótulo, tipo, opções/dica, largura]  tipo: t texto, a texto longo, s seleção, d data, n número  */
const DISC = ["Língua Portuguesa","Matemática","Ciências","História","Geografia","Arte","Educação Física","Língua Inglesa","Ensino Religioso","Computação","Educação Infantil (campos de experiência)","Interdisciplinar"];
const PERIODOS = ["1º bimestre","2º bimestre","3º bimestre","4º bimestre","1º trimestre","2º trimestre","3º trimestre","1º semestre","2º semestre","Anual"];
const MODELOS = [
  /* ---------- PROFESSOR ---------- */
  { id:"PA", ico:"🗓️", grupo:"prof", alvo:"turma", nome:"Plano de Aula", desc:"Objetivos, BNCC, passo a passo da aula, avaliação e adaptações.",
    secoes:[
      ["Identificação da aula", [["tema","Tema da aula","t","Ex.: Frações equivalentes",2],["componente","Componente curricular","s",DISC],["data","Data","d"],["duracao","Duração","t","Ex.: 2 aulas de 50 min"]]],
      ["Objetivos e BNCC", [["objetivos","Objetivos de aprendizagem","a","Ao final da aula, os estudantes serão capazes de..."],["bncc","Habilidades da BNCC","t","Ex.: EF05MA03",2]]],
      ["Desenvolvimento", [["conteudos","Objetos de conhecimento / conteúdos","a"],["metodologia","Passo a passo (início, desenvolvimento e fechamento)","a"],["recursos","Recursos","a","Ex.: lousa digital, Chromebooks, material concreto"]]],
      ["Avaliação e inclusão", [["avaliacao","Como vou avaliar","a"],["adaptacoes","Adaptações para estudantes com deficiência, TEA ou dificuldades","a","Lei Brasileira de Inclusão (Lei 13.146/2015)"]]]
    ]},
  { id:"DC", ico:"📒", grupo:"prof", alvo:"turma", nome:"Diário de Classe (registro da aula)", desc:"Registro do dia: conteúdo, atividades, ausências e ocorrências.",
    secoes:[
      ["Registro da aula", [["data","Data","d"],["aulas","Nº de aulas","n"],["componente","Componente curricular","s",DISC,2],["conteudo","Conteúdo trabalhado","a"],["atividades","Atividades realizadas","a"]]],
      ["Frequência e observações", [["ausentes","Estudantes ausentes","a","Um nome por linha"],["obs","Observações do dia","a","Intercorrências, adaptações feitas, estudantes que precisam de atenção"]]]
    ]},
  { id:"RBA", ico:"📝", grupo:"prof", alvo:"aluno", periodo:true, nome:"Parecer / Relatório Bimestral", desc:"Parecer descritivo do período, por componente e geral. Também em lote.",
    secoes:[
      ["Aprendizagem por componente", [["lp","Língua Portuguesa","a"],["mat","Matemática","a"],["cie","Ciências","a"],["hum","História e Geografia","a"],["outros","Arte, Educação Física e outros","a"]]],

/* ═══════════ INÍCIO ═══════════ */
onAuthStateChanged(auth, async (user) => {
  if(!user){ location.replace("/entrar/"); return; }
  const u = await ler("usuarios", user.uid);
  if(!u || u.status !== "ativo"){ location.replace("/entrar/"); return; }
  S.uid = user.uid; S.u = u; S.perfil = u.perfil || "professor";
  $("quem").textContent = (u.nome || user.email) + " · " + ({ admin:"Administrador", gestor:"Gestão da escola", secretaria:"Secretaria Municipal", professor:"Professor(a)" }[S.perfil] || "");
  if(u.municipio_id) S.muni = await ler("municipios", u.municipio_id);
  const ids = (u.escolas_ids && u.escolas_ids.length ? u.escolas_ids : [u.escola_id]).filter(Boolean).slice(0, 10);
  S.escolas = (await Promise.all(ids.map(i => ler("escolas", i)))).filter(Boolean);
  if(S.perfil === "secretaria" && u.municipio_id){
    try{ const se = await getDocs(query(collection(db, "escolas"), where("municipio_id", "==", u.municipio_id))); S.escolas = []; se.forEach(d => S.escolas.push({ id:d.id, ...d.data() })); }catch(e){ console.warn(e.code); }
  }
  if(S.perfil === "professor" && ids.length){
    try{
      const st = await getDocs(query(collection(db, "turmas"), where("escola_id", "in", ids)));
      const minhas = new Set(u.turmas_ids || []), todas = [];
      st.forEach(d => { const t = d.data(); if(t.status !== "inativa") todas.push({ id:d.id, ...t, minha:minhas.has(d.id) }); });
      S.turmas = (todas.some(t => t.minha) ? todas.filter(t => t.minha) : todas).sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    }catch(e){ console.warn("turmas:", e.code); }
  }
  if(S.perfil === "admin" && !u.municipio_id) await prepararAdmin();
  if(ehGestor() || ehSecretaria()) $("tb-painel").hidden = false;
  S.grupo = S.perfil === "gestor" ? "aee" : "prof";
  desenharFaixa();
  await carregarRelatorios();
  ir(S.perfil === "secretaria" ? "painel" : "inicio");
});
// administrador nao tem municipio: escolhe a rede para ver os documentos como ela
async function prepararAdmin(){
  try{
    const sm = await getDocs(collection(db, "municipios")); const munis = []; sm.forEach(d => munis.push({ id:d.id, ...d.data() }));
    munis.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    if(!munis.length) return;
    S.munis = munis;
    const sel = $("faixa-muni");
    sel.innerHTML = munis.map(m => '<option value="'+m.id+'">'+esc(m.nome)+(m.uf ? "/" + esc(m.uf) : "")+'</option>').join("");
    sel.hidden = false;
    await trocarMuni(munis[0].id);
  }catch(e){ console.warn("municipios:", e.code); }
}
async function trocarMuni(id){
  S.muni = (S.munis || []).find(m => m.id === id) || null;
  S.escolas = [];
  if(S.muni){ try{ const se = await getDocs(query(collection(db, "escolas"), where("municipio_id", "==", S.muni.id))); se.forEach(d => S.escolas.push({ id:d.id, ...d.data() })); }catch(e){ console.warn(e.code); } }
  S.escolas.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
  const se = $("faixa-escola");
  se.innerHTML = S.escolas.map(e => '<option value="'+e.id+'">'+esc(e.nome)+'</option>').join(""); se.hidden = S.escolas.length < 2;
}
function logoRede(escolaId){ const e = S.escolas.find(x => x.id === escolaId) || S.escolas[0]; return (e && e.logo_url) || (S.muni && S.muni.logo_url) || ""; }
function desenharFaixa(){
  const e = S.escolas[0], logo = logoRede(e && e.id);
  $("faixa-logo").innerHTML = logo ? '<img alt="" src="'+esc(logo)+'">' : "🏫";
  if(S.perfil === "admin" && S.muni) $("faixa-t").textContent = "Prévia do administrador · " + (e ? e.nome : "sem escolas cadastradas");
  else $("faixa-t").textContent = S.perfil === "secretaria" ? "Secretaria Municipal de Educação" + (S.muni ? " · " + S.muni.nome : "") : (e ? e.nome : (S.u.escola_texto || "Seu cadastro"));
  $("faixa-s").textContent = S.muni ? "Secretaria Municipal de Educação de " + S.muni.nome + (S.muni.uf ? "/" + S.muni.uf : "") + " · os documentos saem com o brasão e os dados da escola" : "Os documentos saem com os dados do seu cadastro";
  $("faixa").hidden = false;
}

/* ═══════════ DADOS NA NUVEM ═══════════
   relatorios/{id}: modelo, titulo, autor, escola, municipio, turma, aluno, periodo, status, dados{} */
async function carregarRelatorios(){
  const lista = [], vistos = new Set();
  const juntar = (snap) => snap.forEach(d => { if(!vistos.has(d.id)){ vistos.add(d.id); lista.push({ id:d.id, ...d.data() }); } });
  try{
    juntar(await getDocs(query(collection(db, "relatorios"), where("autor_uid", "==", S.uid))));
    if(S.perfil === "gestor") for(const e of S.escolas) juntar(await getDocs(query(collection(db, "relatorios"), where("escola_id", "==", e.id))));
    if(S.perfil === "secretaria" && S.u.municipio_id) juntar(await getDocs(query(collection(db, "relatorios"), where("municipio_id", "==", S.u.municipio_id))));
    if(S.perfil === "admin") juntar(await getDocs(collection(db, "relatorios")));
  }catch(e){ console.warn("relatorios:", e.code); toast("Não foi possível carregar os relatórios (" + (e.code || "erro") + ").", true); }
  S.relatorios = lista.sort((a, b) => msDe(b.atualizado_em) - msDe(a.atualizado_em));
}
async function alunosDaTurma(turmaId){
  if(!turmaId) return [];
  if(S.alunos[turmaId]) return S.alunos[turmaId];
  try{
    const sn = await getDocs(query(collection(db, "alunos"), where("turma_id", "==", turmaId)));
    const l = []; sn.forEach(d => { const a = d.data(); if(a.status !== "inativo") l.push({ id:d.id, ...a }); });
    S.alunos[turmaId] = l.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
  }catch(e){ console.warn("alunos:", e.code); S.alunos[turmaId] = []; }
  return S.alunos[turmaId];
}

  S.tela = t;
  if(t === "inicio") telaInicio();
  else if(t === "meus") telaMeus();
  else if(t === "painel") telaPainel();
  window.scrollTo({ top:0 });
}

  const pend = S.relatorios.filter(r => r.autor_uid === S.uid && r.status === "devolvido").length;
  $("tela").innerHTML =
    (pend ? '<div class="devolucao" style="margin-bottom:14px">↩️ Você tem <b>'+pend+'</b> relatório(s) devolvido(s) pela coordenação para ajuste. <button class="btn btn-sm btn-gh" data-action="verDevolvidos">Ver agora</button></div>' : '') +
    (S.turmas.length ? '<div class="destaque"><div class="destaque-ico">⚡</div><div class="destaque-txt"><b>Parecer da turma inteira numa tela</b><span>Escolha a turma, marque como cada estudante está em cada eixo e o Portal escreve o parecer. Você revisa, ajusta e salva os 30 de uma vez.</span></div><button class="btn btn-ok" data-action="abrirLote">Fazer parecer em lote</button></div>' : '') +

function desenharLista(){

function codigo(r){

}

/* salvar / enviar / revisar */
function dadosParaGravar(r){
  const m = modeloDe(r.modelo), e = S.escolas.find(x => x.id === r.escola_id);
  return { modelo:r.modelo, titulo:m.nome + (r.aluno_nome ? " · " + r.aluno_nome : r.turma_nome ? " · " + r.turma_nome : ""),
    escola_id:r.escola_id || "", escola_nome:e ? e.nome : (S.u.escola_texto || ""), municipio_id:(e && e.municipio_id) || S.u.municipio_id || "",
    turma_id:r.turma_id || "", turma_nome:r.turma_nome || "", aluno_id:r.aluno_id || "", aluno_nome:r.aluno_nome || "", periodo:r.periodo || "",
    dados:r.dados, atualizado_em:serverTimestamp() };
}
function validar(r){
  const m = modeloDe(r.modelo);
  if(m.alvo === "aluno" && !r.aluno_nome){ toast("Escolha o estudante.", true); return false; }
  if(m.periodo && !r.periodo){ toast("Escolha o período.", true); return false; }
  if(!Object.values(r.dados).some(v => String(v || "").trim())){ toast("Preencha ao menos um campo.", true); return false; }
  return true;
}
async function salvar(novoStatus){
  lerEditor(); const r = S.ed;
  if(!validar(r)) return false;
  const d = dadosParaGravar(r);
  if(novoStatus) d.status = novoStatus;
  try{
    if(r.id){ await updateDoc(doc(db, "relatorios", r.id), d); }
    else{
      d.status = novoStatus || "rascunho"; d.autor_uid = S.uid; d.autor_nome = S.u.nome || ""; d.criado_em = serverTimestamp(); d.comentario = "";
      const ref = await addDoc(collection(db, "relatorios"), d); r.id = ref.id;
    }
    Object.assign(r, d, { atualizado_em:{ toMillis:() => Date.now() } });
    const i = S.relatorios.findIndex(x => x.id === r.id);
    const copia = { ...r, dados:{ ...r.dados } };
    if(i >= 0) S.relatorios[i] = copia; else S.relatorios.unshift(copia);
    return true;
  }catch(e){ console.warn(e); toast("Não foi possível salvar (" + (e.code || "erro") + ").", true); return false; }
}
async function revisar(aprovado, comentario){
  const r = S.ed;
  const d = { status:aprovado ? "aprovado" : "devolvido", comentario:comentario || "", revisado_por:S.uid, revisado_nome:S.u.nome || "", revisado_em:serverTimestamp() };
  try{
    await updateDoc(doc(db, "relatorios", r.id), d);
    Object.assign(r, d); const i = S.relatorios.findIndex(x => x.id === r.id); if(i >= 0) Object.assign(S.relatorios[i], d);
    toast(aprovado ? "Relatório aprovado." : "Relatório devolvido ao professor."); telaEditor();
  }catch(e){ console.warn(e); toast("Não foi possível registrar (" + (e.code || "erro") + ").", true); }
}

function primeiroNome(n){ return String(n || "").trim().split(/\s+/)[0] || "O(A) estudante"; }
function escreverParecer(aluno, niveis, obs, periodo, idx){
  const nome = primeiroNome(aluno.nome);
  const partes = { c:[], d:[], a:[] };
  EIXOS.forEach(e => { const nv = niveis[e.k]; if(nv && FRASES[e.k][nv]) partes[nv].push(FRASES[e.k][nv][(idx + e.k.length) % 2]); });
  const lista = (arr) => arr.length <= 1 ? arr.join("") : arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1];
  const per = periodo ? "Neste " + periodo.replace(/^\d{4} · /, "") : "Neste período";
  let t = "";
  if(partes.c.length){
    const p1 = partes.c.slice(0, 3), p2 = partes.c.slice(3);
    t += per + ", " + nome + " " + lista(p1) + ". ";
    if(p2.length) t += "Além disso, " + lista(p2) + ". ";
  }
  if(partes.d.length) t += (t ? "Também " : per + ", " + nome + " ") + lista(partes.d) + ". ";
  if(partes.a.length) t += (t ? "Como próximo passo, " + nome + " " : per + ", " + nome + " ") + lista(partes.a) + ". ";
  if(obs) t += obs.trim().replace(/([^.!?])$/, "$1.") + " ";
  if(!t) return "";
  t += partes.a.length ? "Seguiremos acompanhando de perto, e o apoio da família em casa faz diferença." : "Parabéns pelo empenho! Seguiremos incentivando os avanços.";
  return t.trim();
}

function lerRespostaIA(txt){
  const L = S.lote, alunos = S.alunos[L.turma_id] || [];
  const blocos = String(txt || "").replace(/\r/g, "").replace(/\*\*/g, "").split(/^\s*#{1,4}\s*/m).map(b => b.trim()).filter(Boolean);
  let n = 0;
  blocos.forEach(b => {
    const [cab, ...resto] = b.split("\n"); const texto = resto.join(" ").replace(/\s+/g, " ").trim(); if(!texto) return;
    const alvo = semAc(cab).replace(/[^a-z ]/g, "").trim();
    const a = alunos.find(x => semAc(x.nome) === alvo) || alunos.find(x => alvo && semAc(x.nome).startsWith(alvo)) || alunos.find(x => alvo && alvo.startsWith(semAc(primeiroNome(x.nome))));
    if(a){ L.linhas[a.id].parecer = texto; L.linhas[a.id].editado = true; n++; }
  });
  return n;
}

  else if(t.dataset && t.dataset.campo !== undefined) previa();
  else if(t.id === "ed-turma-txt" || t.id === "ed-aluno-txt") previa();
  else if(t.dataset && t.dataset.obs){ const ln = S.lote.linhas[t.dataset.obs]; ln.obs = t.value; ln.editado = false; atualizarParecer(t.dataset.obs); }
  else if(t.dataset && t.dataset.par){ const ln = S.lote.linhas[t.dataset.par]; ln.parecer = t.value; ln.editado = true; }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if(t.id === "f-turma"){ S.filtroTurma = t.value; desenharLista(); }
  else if(t.id === "faixa-muni"){ await trocarMuni(t.value); desenharFaixa(); ir(S.tela === "painel" ? "painel" : "inicio"); }
  else if(t.id === "faixa-escola"){ const i = S.escolas.findIndex(e => e.id === t.value); if(i > 0) S.escolas.unshift(S.escolas.splice(i, 1)[0]); desenharFaixa(); if(S.ed){ S.ed.escola_id = S.escolas[0].id; previa(); } }
  else if(t.id === "ed-escola"){ lerEditor(); S.ed.turma_id = ""; S.ed.aluno_id = ""; telaEditor(); }
  else if(t.id === "ed-turma"){ lerEditor(); S.ed.aluno_id = ""; S.ed.aluno_nome = ""; await preencherAlunos(); previa(); }
  else if(t.id === "ed-aluno" || t.id === "ed-periodo" || (t.dataset && t.dataset.campo !== undefined)) previa();
  else if(t.id === "lote-turma"){ S.lote.turma_id = t.value; S.lote.linhas = {}; telaLote(); }
  else if(t.id === "lote-periodo"){ S.lote.periodo = t.value; S.lote.linhas = {}; telaLote(); }
});
window.PDERelatorios = { S, MODELOS, escreverParecer, lerRespostaIA, docHTML };
</script>
