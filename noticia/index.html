<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notícia · Portal do Educador</title>
<meta name="description" content="Notícias e novidades do Portal do Educador, a plataforma de apoio ao professor.">
<meta property="og:title" content="Portal do Educador · Notícia">
<meta property="og:description" content="Notícias e novidades para professores e escolas.">
<meta property="og:image" content="https://app.portaldoeducador.com.br/assets/pde-logo-256.png">
<link rel="icon" href="/assets/pde-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#0f2c4a; --verde:#1a6b2a; --ink:#0c2338; --muted:#5b6b7b; --line:#dce4ed }
  *{ box-sizing:border-box } body{ margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#eef2f6;color:var(--ink) }
  header{ background:var(--azul);color:#fff;border-bottom:4px solid #8DC63F } .topo{ max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px }
  .topo img{ width:42px;height:42px;border-radius:50% } .topo b{ font-size:17px } .topo small{ display:block;color:#b8d98f;font-size:12px } .topo a{ margin-left:auto;color:#fff;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:8px 12px;font-size:14px }
  main{ max-width:860px;margin:18px auto;padding:0 16px } article{ background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 34px -26px rgba(7,22,33,.6) }
  .img{ width:100%;max-height:420px;object-fit:cover;display:block;background:#0c2338 } .c{ padding:20px 22px 24px }
  .selo{ font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2671AB } h1{ font-size:26px;line-height:1.25;margin:6px 0 4px } .data{ color:var(--muted);font-size:13px;margin-bottom:14px }
  .corpo p{ font-size:16.5px;line-height:1.65;margin:0 0 14px } .corpo a{ color:#2671AB }
  .midia{ margin:0 0 16px;border-radius:12px;overflow:hidden;background:#000 } .midia.yt{ aspect-ratio:16/9 } .midia.sp{ height:152px;background:none } .midia iframe{ width:100%;height:100%;border:0 }
  .cta{ margin-top:18px;background:linear-gradient(135deg,#0f2c4a,#1a6b2a);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap }
  .cta b{ font-size:17px } .cta p{ margin:2px 0 0;color:#d9f2bf;font-size:14px } .cta a{ margin-left:auto;background:#8DC63F;color:#0f2c4a;font-weight:800;text-decoration:none;border-radius:12px;padding:11px 16px }
  .vazio{ text-align:center;color:var(--muted);padding:60px 20px } footer{ text-align:center;color:var(--muted);font-size:12.5px;padding:20px 16px 30px }
  @media (max-width:560px){ h1{ font-size:22px } .c{ padding:16px } }
</style>
</head>
<body>
<header><div class="topo"><img src="/assets/pde-logo-64.png" alt=""><div><b>Portal do Educador</b><small>Plataforma de apoio ao professor</small></div><a href="/entrar/">Entrar</a></div></header>
<main id="conteudo"><div class="vazio">Carregando a notícia...</div></main>
<footer>Portal do Educador · NEWPC Tecnologia</footer>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const app = initializeApp({ apiKey:"AIzaSyCKk_t9bvP9kDhI5aUpSxNV3icR6j70tk0", authDomain:"portal-educador-5.firebaseapp.com", projectId:"portal-educador-5",
    storageBucket:"portal-educador-5.firebasestorage.app", messagingSenderId:"725103866385", appId:"1:725103866385:web:f38b8f3cf0a912ed3bf7b0" });
  const db = getFirestore(app), $ = id => document.getElementById(id);
  const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const TIPOS = { noticia:"📰 Notícia", podcast:"🎙️ Podcast", acao:"📣 Ação", novidade:"🆕 Novidade no Portal", pesquisa:"📊 Pesquisa" };
  const cta = '<div class="cta"><div><b>Conheça o Portal do Educador</b><p>Aulas com IA, Lousa interativa, provas online e muito mais para o professor.</p></div><a href="https://www.portaldoeducador.com.br/">Saiba mais</a></div>';
  const corpo = t => String(t || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => "<p>" + esc(p).replace(/\n/g, "<br>").replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>') + "</p>").join("");
  function midia(u){
    u = String(u || "").trim(); if(!u) return "";
    const yt = (u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/) || [])[1];
    if(yt) return '<div class="midia yt"><iframe src="https://www.youtube-nocookie.com/embed/' + yt + '?rel=0" title="Vídeo" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
    const sp = /open\.spotify\.com\/(episode|show|track|playlist)\/([A-Za-z0-9]+)/.exec(u);
    if(sp) return '<div class="midia sp"><iframe src="https://open.spotify.com/embed/' + sp[1] + "/" + sp[2] + '" title="Podcast" allow="encrypted-media" loading="lazy"></iframe></div>';
    return /^https:\/\//.test(u) ? '<p><a href="' + esc(u) + '" target="_blank" rel="noopener">Abrir o conteúdo ↗</a></p>' : "";
  }
  const dataDe = n => { const t = n.inicio || n.criado_em; const d = t && t.toDate ? t.toDate() : null; return d ? d.toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" }) : ""; };
  (async () => {
    const id = new URLSearchParams(location.search).get("id") || "";
    let n = null;
    if(/^[\w-]{4,64}$/.test(id)){ try{ const s = await getDoc(doc(db, "noticias_publicas", id)); if(s.exists()) n = s.data(); }catch(e){ console.warn(e.code); } }
    if(!n){ $("conteudo").innerHTML = '<article><div class="vazio">Esta notícia não está disponível para o público.<br>Se você é professor da rede, <a href="/entrar/#noticia=' + esc(id) + '">entre no Portal</a> para ler.</div></article>' + cta; return; }
    document.title = (n.titulo || "Notícia") + " · Portal do Educador";
    $("conteudo").innerHTML = '<article>' + (/^https:\/\//.test(n.imagem_url || "") ? '<img class="img" src="' + esc(n.imagem_url) + '" alt="">' : "") +
      '<div class="c"><span class="selo">' + esc(TIPOS[n.tipo] || TIPOS.noticia) + '</span><h1>' + esc(n.titulo || "") + '</h1><div class="data">' + esc(dataDe(n)) + '</div>' +
      midia(n.midia_url) + '<div class="corpo">' + corpo(n.tipo === "pesquisa" ? n.corpo : (n.corpo || n.resumo)) + '</div></div></article>' + cta;
  })();
</script>
</body>
</html>
