<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestrantes · SENACOP 2026</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0f2c4a;--navy2:#0a1f35;--verde:#1a6b2a;--lima:#8BC53F;--ouro:#f4c981;--txt:#eaf1f8;--mut:#9fb3c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy2);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
.palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.tela{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 10%,#16406a 0%,var(--navy) 45%,var(--navy2) 100%)}
.tela::after{content:"";position:absolute;right:-8%;bottom:-30%;width:55%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(139,197,63,.12);pointer-events:none}
.topo{position:absolute;left:4.5%;right:4.5%;top:4.5%;display:flex;align-items:center;gap:1.4vmin;font-size:2.1vmin;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lima)}
.topo i{flex:1;height:2px;background:linear-gradient(90deg,rgba(139,197,63,.6),transparent)}
.topo span:last-child{color:var(--mut);letter-spacing:.06em}
.slide{position:absolute;inset:13% 4.5% 13% 4.5%;display:flex;align-items:center;gap:5%;opacity:0;transform:translateY(2vmin);transition:opacity .8s,transform .8s}
.slide.on{opacity:1;transform:none}
.ini{flex:none;width:24vmin;height:24vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9vmin;font-weight:900;color:#fff;
  background:linear-gradient(145deg,var(--verde),#0f4d1d);box-shadow:0 0 0 1vmin rgba(139,197,63,.18),0 2vmin 6vmin rgba(0,0,0,.35)}
.info{flex:1;min-width:0}
.olho{font-size:2.2vmin;font-weight:800;color:var(--ouro);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.2vmin}
.nome{font-size:7.4vmin;font-weight:900;line-height:1.02;letter-spacing:-.02em}
.cv{margin-top:2vmin;font-size:3.1vmin;line-height:1.38;color:#d6e2ee;max-width:62ch}
.ses{margin-top:3.2vmin;display:flex;flex-direction:column;gap:1.4vmin}
.s{display:flex;gap:1.8vmin;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-left:.6vmin solid var(--lima);border-radius:1.4vmin;padding:1.5vmin 2vmin}
.s b{flex:none;font-size:2.3vmin;color:var(--lima);font-weight:800;min-width:17vmin;line-height:1.5}
.s span{font-size:2.6vmin;line-height:1.4}
.s small{display:block;color:var(--mut);font-size:2vmin;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.capa{flex-direction:column;align-items:flex-start;justify-content:center;gap:2.4vmin}
.capa h1{font-size:10vmin;font-weight:900;line-height:.98;letter-spacing:-.03em}
.capa h1 em{font-style:normal;color:var(--lima)}
.capa p{font-size:3.4vmin;color:#d6e2ee;max-width:60ch;line-height:1.4}
.pe{position:absolute;left:4.5%;right:4.5%;bottom:4.5%;display:flex;align-items:center;gap:2vmin;font-size:2vmin;color:var(--mut)}
.pe .barra{flex:1;height:.5vmin;background:rgba(255,255,255,.12);border-radius:1vmin;overflow:hidden}
.pe .barra i{display:block;height:100%;width:0;background:var(--lima)}
.pe b{color:#fff}
.marca{font-weight:900;color:#fff;letter-spacing:.02em}.marca em{font-style:normal;color:var(--lima)}
</style>
</head>
<body>
<div class="palco"><div class="tela" id="tela">
  <div class="topo"><span>SENACOP 2026</span><i></i><span>Campo Grande/MS · 11 a 13 de novembro</span></div>
  <div id="slides"></div>
  <div class="pe"><span class="marca">NEW<em>PC</em> Tecnologia</span><div class="barra"><i id="prog"></i></div><span id="cont"></span></div>
</div></div>
<script>
// Palestrantes do SENACOP 2026 para as TVs do estande NEWPC (tela horizontal 16:9).
// Fonte: programação oficial publicada em senacop.com.br (sujeita a alterações).
// Minicurrículo só onde o texto da programação é claro; quando há dúvida sobre qual biografia é de quem, mostramos só nome e atividades.
// Parâmetros: ?dia=12 mostra só quem fala nesse dia · ?t=14 segundos por slide (padrão 12).
var P = [
  { n:"Benjamin Zymler", cv:"Ministro do Tribunal de Contas da União (TCU), com atuação na fiscalização de licitações e contratos.",
    s:[[13,"Sex 13/11 · 17h20","Palestra de encerramento","Depois da Lei nº 14.133: que contratação pública queremos construir?"]] },
  { n:"Victor Amorim", cv:"Professor do IDP, doutor pela UnB e membro do Comitê Gestor do PNCP.",
    s:[[12,"Abertura","Palestra de abertura","5 anos da Lei nº 14.133/2021"],[12,"Qui 12/11","Palestra","Do portal ao marketplace: PNCP, SICX e a transformação das compras públicas"]] },
  { n:"Ronaldo Corrêa", s:[[11,"Qua 11/11 · 18h30","Workshop 1","SRP na prática: planejamento, execução, riscos e controvérsias"]] },
  { n:"Anderson Pedra", s:[[11,"Qua 11/11 · 20h","Workshop 2","ETP e TR na prática: quando elaborar, como construir e o que realmente precisa constar"],
    [13,"Sex 13/11 · 10h20","Workshop 5","Contratação direta e a devida instrução processual"],[13,"Sex 13/11 · 16h20","Palestra","O que a jurisprudência dos Tribunais de Contas tem para nos auxiliar?"]] },
  { n:"Jamil Manasfi", s:[[12,"Qui 12/11 · 10h","Workshop 3","SICX e as novas formas de contratação direta"]] },
  { n:"Gustavo Tato", s:[[12,"Qui 12/11 · 10h","Workshop 4","Como contratar tecnologia na era da IA"],[12,"Qui 12/11 · 18h20","Pergunte ao Expert","Tire suas dúvidas com os especialistas"]] },
  { n:"Ricardo Brito", cv:"CEO da Inex Treinamentos, conselheiro federal do CFA e mestrando em Gestão Pública, com MBAs em Licitações e Contratos.",
    s:[[12,"Qui 12/11 · 16h20","Palestra","Reforma tributária na prática: o que muda nos contratos administrativos?"],[13,"Sex 13/11 · 10h20","Workshop 6","Segurança jurídica na aplicação de sanções em licitações e contratos"]] },
  { n:"Vanessa de Mesquita", cv:"Procuradora do Estado de Mato Grosso do Sul, com atuação em licitações e contratos.",
    s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eliton Ramos e Eduardo Dionizio"]] },
  { n:"Eliton Ramos", s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eduardo Dionizio e Vanessa de Mesquita"]] },
  { n:"Eduardo Dionizio", s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eliton Ramos e Vanessa de Mesquita"]] },
  { n:"Fábio Ianni Goldfinger", s:[[13,"Sex 13/11 · 8h","Palestra","Ministério Público e a integração dos órgãos de controle"]] },
  { n:"Guilherme Carvalho", s:[[13,"Sex 13/11 · 9h","Palestra","Quem decide pode errar? Segurança jurídica, responsabilidade e os novos limites da atuação do agente público"]] },
  { n:"Mayara Gomes", cv:"Secretária Administrativa da Assembleia Legislativa de Rondônia, com mais de 17 anos em planejamento, licitações e contratos.",
    s:[[13,"Sex 13/11 · 10h20","Workshop 7","Gestão e fiscalização contratual baseada em relatórios, indicadores de desempenho, riscos e resultados"],[12,"Qui e sex","Mesa temática","Educação"]] },
  { n:"Saulo David", cv:"Gestor público na Ebserh, com mais de 20 anos como pregoeiro, presidente de comissões e fiscal de contratos.",
    s:[[13,"Sex 13/11 · 16h20","Palestra","Licitações eletrônicas nas estatais"]] }
];
var q = new URLSearchParams(location.search), DIA = parseInt(q.get("dia"), 10) || 0, SEG = Math.max(6, Math.min(60, parseInt(q.get("t"), 10) || 12));
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); };
var ini = function(n){ var p = n.split(" ").filter(function(x){ return x.length > 2 || x === n.split(" ")[0]; }); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
var lista = P.map(function(p){ return { n:p.n, cv:p.cv, s:DIA ? p.s.filter(function(x){ return x[0] === DIA; }) : p.s }; }).filter(function(p){ return p.s.length; });
var html = '<div class="slide capa"><div class="olho">' + (DIA ? "Programação de " + ({ 11:"quarta, 11/11", 12:"quinta, 12/11", 13:"sexta, 13/11" }[DIA] || DIA + "/11") : "Quem fala no SENACOP") + '</div><h1>Palestrantes do<br><em>SENACOP 2026</em></h1>' +
  '<p>O maior encontro de compras públicas do país, sobre a Lei nº 14.133/2021. Programação sujeita a alterações: confira em senacop.com.br.</p></div>';
lista.forEach(function(p){
  html += '<div class="slide"><div class="ini">' + esc(ini(p.n)) + '</div><div class="info"><div class="olho">Palestrante</div><div class="nome">' + esc(p.n) + '</div>' +
    (p.cv ? '<div class="cv">' + esc(p.cv) + '</div>' : "") +
    '<div class="ses">' + p.s.slice(0, 3).map(function(x){ return '<div class="s"><b>' + esc(x[1]) + '</b><span><small>' + esc(x[2]) + '</small>' + esc(x[3]) + '</span></div>'; }).join("") + '</div></div></div>';
});
html += '<div class="slide capa"><div class="olho">Estande NEWPC</div><h1>Tecnologia que<br><em>chega na sala de aula</em></h1><p>Lousa interativa, tablets, Chromebooks, óculos VR, impressão 3D e o Portal do Educador. Venha conhecer.</p></div>';
document.getElementById("slides").innerHTML = html;
var sl = document.querySelectorAll(".slide"), i = -1, prog = document.getElementById("prog"), cont = document.getElementById("cont");
function vai(){
  if(i >= 0) sl[i].classList.remove("on");
  i = (i + 1) % sl.length; sl[i].classList.add("on");
  cont.innerHTML = "<b>" + (i + 1) + "</b> / " + sl.length;
  prog.style.transition = "none"; prog.style.width = "0"; void prog.offsetWidth;
  prog.style.transition = "width " + SEG + "s linear"; prog.style.width = "100%";
}
vai(); setInterval(vai, SEG * 1000);
document.addEventListener("keydown", function(e){ if(e.key === "ArrowRight" || e.key === " "){ vai(); } });
</script>
</body>
</html>
