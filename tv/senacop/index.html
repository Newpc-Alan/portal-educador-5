<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestrantes · SENACOP 2026</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* paleta do SENACOP 2026 (senacop.com.br): preto azulado + dourado, Montserrat */
:root{--bg:#0b1019;--bg2:#111722;--card:#151c27;--gold:#c8b75f;--gold-l:#e4d985;--gold-d:#9c8b3f;--txt:#f7f6ef;--mut:#aeb5c0;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Montserrat,"Segoe UI",Arial,sans-serif;overflow:hidden}
.palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.tela{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;position:relative;overflow:hidden;
  background:radial-gradient(90% 80% at 18% 50%,rgba(200,183,95,.10) 0%,transparent 60%),linear-gradient(160deg,var(--bg2) 0%,var(--bg) 70%)}
.tela::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 6vmin,rgba(200,183,95,.025) 6vmin 6.2vmin);pointer-events:none}
.topo{position:absolute;left:4.5%;right:4.5%;top:4%;display:flex;align-items:center;gap:2vmin;z-index:2}
.topo img{height:6.4vmin;width:auto}
.topo i{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-d),transparent)}
.topo span{font-size:1.9vmin;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.slide{position:absolute;inset:14% 4.5% 12% 4.5%;display:flex;align-items:center;gap:5.5%;opacity:0;transform:translateX(3vmin);transition:opacity .9s,transform .9s}
.slide.on{opacity:1;transform:none}
.foto{flex:none;width:52vmin;height:52vmin;position:relative}
.foto::before{content:"";position:absolute;inset:-1.6vmin;border:2px solid var(--gold);border-radius:2vmin;transform:translate(1.6vmin,1.6vmin);opacity:.7}
.foto img,.foto .ini{position:relative;width:100%;height:100%;object-fit:cover;border-radius:1.6vmin;box-shadow:0 3vmin 8vmin rgba(0,0,0,.55);background:var(--card)}
.foto .ini{display:flex;align-items:center;justify-content:center;font-size:16vmin;font-weight:900;color:var(--gold)}
.info{flex:1;min-width:0}
.olho{font-size:2.2vmin;font-weight:800;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin-bottom:1.4vmin}
.nome{font-size:6.6vmin;font-weight:900;line-height:1.04;letter-spacing:-.01em;color:var(--txt)}
.cv{margin-top:2.2vmin;font-size:2.75vmin;line-height:1.45;font-weight:500;color:#d9dbd2;max-width:58ch}
.ses{margin-top:3vmin;display:flex;flex-direction:column;gap:1.3vmin}
.s{display:flex;gap:2vmin;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:.6vmin solid var(--gold);border-radius:1vmin;padding:1.4vmin 2vmin}
.s b{flex:none;font-size:2.2vmin;color:var(--gold-l);font-weight:800;min-width:17vmin;line-height:1.55}
.s span{font-size:2.45vmin;line-height:1.4;font-weight:600}
.s small{display:block;color:var(--mut);font-size:1.8vmin;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.capa{flex-direction:column;align-items:flex-start;justify-content:center;gap:2.6vmin}
.capa h1{font-size:9.5vmin;font-weight:900;line-height:1;letter-spacing:-.02em}
.capa h1 em{font-style:normal;color:var(--gold)}
.capa p{font-size:3.1vmin;color:#d9dbd2;max-width:62ch;line-height:1.45;font-weight:500}
.capa .grade{display:flex;gap:1.4vmin;margin-top:1vmin}
.capa .grade img{width:11vmin;height:11vmin;border-radius:1vmin;object-fit:cover;border:1px solid rgba(200,183,95,.5)}
.pe{position:absolute;left:4.5%;right:4.5%;bottom:4%;display:flex;align-items:center;gap:2vmin;font-size:1.9vmin;color:var(--mut);z-index:2}
.pe .barra{flex:1;height:.4vmin;background:rgba(255,255,255,.1);border-radius:1vmin;overflow:hidden}
.pe .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l))}
.pe b{color:var(--txt)}
.marca{font-weight:800;color:var(--txt);letter-spacing:.02em}.marca em{font-style:normal;color:var(--gold)}
</style>
</head>
<body>
<div class="palco"><div class="tela" id="tela">
  <div class="topo"><img src="https://senacop.com.br/assets/images/senacop-logo-920.png" alt="SENACOP 2026"><i></i><span>Campo Grande/MS · 11 a 13 de novembro</span></div>
  <div id="slides"></div>
  <div class="pe"><span>Estande <span class="marca">NEW<em>PC</em> Tecnologia</span></span><div class="barra"><i id="prog"></i></div><span id="cont"></span></div>
</div></div>
<script>
// Palestrantes do SENACOP 2026 para as TVs do estande NEWPC (tela horizontal 16:9), na identidade visual do evento.
// Fotos e currículos: site oficial senacop.com.br (as fotos são carregadas de lá). Programação: PDF oficial (sujeita a alterações).
// Currículos resumidos a partir do texto oficial. Ricardo Brito e Eduardo Dionizio ficam sem currículo: o site e o PDF trazem textos trocados entre os dois.
// Parâmetros: ?dia=12 mostra só quem fala nesse dia · ?t=14 segundos por slide (padrão 12).
var F = "https://senacop.com.br/assets/images/";
var P = [
  { n:"Benjamin Zymler", o:"Ministro do TCU", f:"Ministro%20Benjamin%20Zymler.png", cv:"Ministro do Tribunal de Contas da União, com atuação na fiscalização de licitações e contratos públicos, em jurisprudência, controle externo e governança das contratações.",
    s:[[13,"Sex 13/11 · 17h20","Palestra de encerramento","Depois da Lei nº 14.133: que contratação pública queremos construir?"]] },
  { n:"Victor Amorim", f:"VICTOR.png", cv:"Doutor em Direito do Estado pela UnB e mestre em Direito Constitucional pelo IDP. Professor titular do mestrado e doutorado em Administração Pública do IDP e membro do Comitê Gestor da Rede Nacional de Contratações Públicas.",
    s:[[12,"Abertura","Palestra de abertura","5 anos da Lei nº 14.133/2021"],[12,"Qui 12/11","Palestra","Do portal ao marketplace: PNCP, SICX e a transformação das compras públicas"]] },
  { n:"Ronaldo Corrêa", f:"speaker-ronaldo-correa.png", cv:"Servidor público federal, há mais de 15 anos em licitações e contratos, com funções técnicas e gerenciais na Polícia Federal, na CGU e no Ministério da Justiça e Segurança Pública.",
    s:[[11,"Qua 11/11 · 18h30","Workshop 1","SRP na prática: planejamento, execução, riscos e controvérsias"]] },
  { n:"Anderson Pedra", f:"speaker-anderson-pedra.png", cv:"Procurador do Estado do Espírito Santo e advogado em Direito Público. Pós-doutor em Direito pela Universidade de Coimbra e doutor em Direito do Estado pela PUC-SP.",
    s:[[11,"Qua 11/11 · 20h","Workshop 2","ETP e TR na prática: quando elaborar, como construir e o que realmente precisa constar"],
    [13,"Sex 13/11 · 10h20","Workshop 5","Contratação direta e a devida instrução processual"],[13,"Sex 13/11 · 16h20","Palestra","O que a jurisprudência dos Tribunais de Contas tem para nos auxiliar?"]] },
  { n:"Jamil Manasfi", f:"speaker-jamil-manasfi.png", cv:"Mestrando em Gestão Pública e Liderança, bacharel em Direito e em Administração Pública, com MBAs em Licitações e Contratos e em Gestão Pública. Professor de MBAs em Licitações e Contratos.",
    s:[[12,"Qui 12/11 · 10h","Workshop 3","SICX e as novas formas de contratação direta"]] },
  { n:"Gustavo Tato", f:"speaker-gustavo-tato.png", cv:"Servidor federal do Instituto de Pesquisas Jardim Botânico do Rio de Janeiro. Pregoeiro, agente de contratação e presidente da Comissão Permanente de Licitação, há mais de 13 anos em licitações e contratos.",
    s:[[12,"Qui 12/11 · 10h","Workshop 4","Como contratar tecnologia na era da IA"],[12,"Qui 12/11 · 18h20","Pergunte ao Expert","Tire suas dúvidas com os especialistas"]] },
  { n:"Matheus Medeiros", f:"Matheus%20Medeiros.png", cv:"CEO e cofundador da iGov, criadora do ChatGov, plataforma de inteligência artificial para o setor público presente em 8 estados. Formado em Direito, cursa MBA em Inteligência Artificial e Data Science pela PUC-RS.",
    s:[[12,"Qui e sex","LAB IA","Imersão prática em IA nas compras públicas: ETP, TR e outros documentos da contratação"]] },
  { n:"Ricardo Brito", f:"speaker-ricardo-brito.png",
    s:[[12,"Qui 12/11 · 16h20","Palestra","Reforma tributária na prática: o que muda nos contratos administrativos?"],[13,"Sex 13/11 · 10h20","Workshop 6","Segurança jurídica na aplicação de sanções em licitações e contratos"]] },
  { n:"Vanessa de Mesquita e Sá", f:"VANESSA%20DE%20MESQUITA.png", cv:"Procuradora do Estado de Mato Grosso do Sul, nas áreas de Direito Administrativo, licitações e contratos. Já chefiou a Procuradoria de Compras e Contratos da PGE/MS e integra grupos de trabalho de implementação da Lei nº 14.133.",
    s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eliton Ramos e Eduardo Dionizio"]] },
  { n:"Eliton Ramos", f:"speaker-eliton-ramos.png", cv:"Advogado e especialista em Direito Público. Foi presidente da Comissão dos Advogados Publicistas da OAB-MS e membro da Comissão Especial de Licitação da seccional.",
    s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eduardo Dionizio e Vanessa de Mesquita e Sá"]] },
  { n:"Eduardo dos Santos Dionizio", f:"speaker-eduardo-dionizio.png",
    s:[[12,"Qui 12/11 · 17h20","Painel","Contratações públicas sob três perspectivas, com Eliton Ramos e Vanessa de Mesquita e Sá"]] },
  { n:"Fábio Ianni Goldfinger", f:"speaker-fabio-goldfinger.png", cv:"Promotor de Justiça, titular da 30ª Promotoria de Justiça do Patrimônio Público de Campo Grande/MS, e diretor da Escola Nacional do Ministério Público (ENAMP).",
    s:[[13,"Sex 13/11 · 8h","Palestra","Ministério Público e a integração dos órgãos de controle"]] },
  { n:"Guilherme Carvalho", f:"Guilherme%20Carvalho.png", cv:"Doutor em Direito Administrativo e mestre em Direito em Políticas Públicas. Ex-procurador de Estado, advogado, autor de livros jurídicos e colunista do ConJur.",
    s:[[13,"Sex 13/11 · 9h","Palestra","Quem decide pode errar? Segurança jurídica, responsabilidade e os novos limites da atuação do agente público"]] },
  { n:"Mayara Gomes", f:"speaker-mayara-gomes.png", cv:"Secretária Administrativa da Assembleia Legislativa de Rondônia, com mais de 17 anos em planejamento, licitações e contratos. Foi pregoeira e superintendente de Compras e Licitações.",
    s:[[13,"Sex 13/11 · 10h20","Workshop 7","Gestão e fiscalização contratual baseada em relatórios, indicadores de desempenho, riscos e resultados"],[12,"Qui e sex","Mesa temática","Educação"]] },
  { n:"Hermes Lima", f:"Hermes%20Lima.png", cv:"Especialista em licitações e contratos. Servidor do Ministério Público de Mato Grosso do Sul desde 2014, como pregoeiro, membro de comissão de licitação e responsável pela gestão estratégica das contratações do MPMS.",
    s:[[12,"Qui e sex","Mesa temática","Obras"]] },
  { n:"Saulo David", f:"Saulo%20David.png", cv:"Há 20 anos em licitações e contratos, pregoeiro oficial desde 2005. Atuou como gestor de contratações em estatal federal e é consultor empresarial em licitações.",
    s:[[13,"Sex 13/11 · 16h20","Palestra","Licitações eletrônicas nas estatais"]] }
];
var q = new URLSearchParams(location.search), DIA = parseInt(q.get("dia"), 10) || 0, SEG = Math.max(6, Math.min(60, parseInt(q.get("t"), 10) || 12));
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); };
var ini = function(n){ var p = n.split(" ").filter(function(x){ return x.length > 2; }); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
var lista = P.map(function(p){ return { n:p.n, f:p.f, cv:p.cv, s:DIA ? p.s.filter(function(x){ return x[0] === DIA; }) : p.s }; }).filter(function(p){ return p.s.length; });
var NOME_DIA = { 11:"quarta, 11/11", 12:"quinta, 12/11", 13:"sexta, 13/11" };
var html = '<div class="slide capa"><div class="olho">' + (DIA ? "Programação de " + (NOME_DIA[DIA] || DIA + "/11") : "Aprenda com os maiores nomes do Brasil") + '</div><h1>Palestrantes do<br><em>SENACOP 2026</em></h1>' +
  '<p>O maior evento de compras públicas do Brasil, sobre a Nova Lei de Licitações. Programação sujeita a alterações: confira em senacop.com.br.</p>' +
  '<div class="grade">' + lista.slice(0, 8).map(function(p){ return '<img src="' + F + p.f + '" alt="">'; }).join("") + '</div></div>';
lista.forEach(function(p){
  html += '<div class="slide"><div class="foto"><img src="' + F + p.f + '" alt="' + esc(p.n) + '" data-ini="' + esc(ini(p.n)) + '"></div><div class="info"><div class="olho">Palestrante</div><div class="nome">' + esc(p.n) + '</div>' +
    (p.cv ? '<div class="cv">' + esc(p.cv) + '</div>' : "") +
    '<div class="ses">' + p.s.slice(0, 3).map(function(x){ return '<div class="s"><b>' + esc(x[1]) + '</b><span><small>' + esc(x[2]) + '</small>' + esc(x[3]) + '</span></div>'; }).join("") + '</div></div></div>';
});
html += '<div class="slide capa"><div class="olho">Visite o estande NEWPC</div><h1>Tecnologia que<br><em>chega na sala de aula</em></h1><p>Lousa interativa, tablets, Chromebooks, óculos VR, impressão 3D e o Portal do Educador, com o planejamento da contratação pela Lei nº 14.133.</p></div>';
var box = document.getElementById("slides"); box.innerHTML = html;
// foto que não carregar (sem internet) vira as iniciais
box.querySelectorAll(".foto img").forEach(function(im){ im.addEventListener("error", function(){ var d = document.createElement("div"); d.className = "ini"; d.textContent = im.dataset.ini; im.replaceWith(d); }); });
box.querySelectorAll(".grade img").forEach(function(im){ im.addEventListener("error", function(){ im.remove(); }); });
var sl = box.querySelectorAll(".slide"), i = -1, prog = document.getElementById("prog"), cont = document.getElementById("cont");
function vai(){
  if(i >= 0) sl[i].classList.remove("on");
  i = (i + 1) % sl.length; sl[i].classList.add("on");
  cont.innerHTML = "<b>" + (i + 1) + "</b> / " + sl.length;
  prog.style.transition = "none"; prog.style.width = "0"; void prog.offsetWidth;
  prog.style.transition = "width " + SEG + "s linear"; prog.style.width = "100%";
}
vai(); var tm = setInterval(vai, SEG * 1000);
document.addEventListener("keydown", function(e){ if(e.key === "ArrowRight" || e.key === " "){ clearInterval(tm); vai(); tm = setInterval(vai, SEG * 1000); } });
</script>
</body>
</html>
